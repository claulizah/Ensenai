<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EnseñAI — Liga de grupo</title>
<link rel="icon" type="image/png" href="assets/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grandstander:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --profundo: #1E3A8A; --profundo-oscuro: #16296B; --cielo: #60A5FA;
    --menta: #34D399; --aqua: #7DD3FC; --bosque: #065F46;
    --hielo: #F0FDF4; --tinta: #1E3A8A; --linea: #DCEEFC;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: 'Nunito', sans-serif;
    background:
      radial-gradient(circle at 12% 8%, rgba(96,165,250,0.35) 0, transparent 30%),
      radial-gradient(circle at 90% 20%, rgba(125,211,252,0.32) 0, transparent 32%),
      var(--hielo);
    color: var(--tinta); min-height: 100vh;
  }
  header { background: var(--profundo); color: #fff; padding: 18px 24px; display: flex; align-items: center; gap: 10px; }
  header a { color: inherit; text-decoration: none; display: flex; align-items: center; gap: 10px; }
  header .marca { font-family: 'Grandstander', sans-serif; font-weight: 700; font-size: 1.4rem; }
  header .marca .ai {
    display: inline-block; color: var(--aqua); background: rgba(255,255,255,0.14);
    padding: 1px 10px; border-radius: 999px; font-size: 0.75em; vertical-align: middle;
  }
  main { max-width: 640px; margin: 0 auto; padding: 32px 20px 80px; }
  .tarjeta { background: #fff; border: 2px solid var(--linea); border-radius: 18px; padding: 22px; margin-bottom: 18px; box-shadow: 0 3px 0 var(--linea); }
  h1 { font-family: 'Grandstander', sans-serif; font-size: 1.5rem; margin: 0 0 6px; }
  h2 { font-family: 'Grandstander', sans-serif; font-size: 1.15rem; margin: 0 0 8px; color: var(--profundo); }
  h3 { font-family: 'Grandstander', sans-serif; color: var(--bosque); font-size: 0.98rem; margin: 16px 0 8px; }
  p.ayuda { color: #4A6A85; margin: 0; }
  label { display: block; font-weight: 700; font-size: 0.9rem; margin: 14px 0 6px; }
  input { width: 100%; padding: 12px 14px; border: 2px solid var(--linea); border-radius: 12px; font-family: inherit; font-size: 1rem; }
  button.primario {
    width: 100%; background: var(--profundo); color: #fff; border: none; padding: 14px; border-radius: 999px;
    font-family: 'Grandstander', sans-serif; font-weight: 600; font-size: 1rem; cursor: pointer; margin-top: 16px;
    box-shadow: 0 4px 0 var(--profundo-oscuro);
  }
  button.secundario { background: none; border: 2px solid var(--linea); color: var(--profundo); padding: 8px 14px; border-radius: 999px; font-weight: 700; font-size: 0.85rem; cursor: pointer; margin-top: 10px; }
  .error { background: #FFF0EC; border: 2px solid #FFC4B5; color: #B94A2E; padding: 12px 14px; border-radius: 12px; margin-top: 12px; font-size: 0.9rem; }
  .cargando { text-align: center; padding: 60px 20px; color: #4A6A85; }
  .tema-card { border: 2px solid var(--linea); border-radius: 14px; padding: 16px 18px; margin-bottom: 14px; cursor: pointer; }
  .tema-card .titulo { font-family: 'Grandstander', sans-serif; font-weight: 700; font-size: 1.05rem; color: var(--profundo); }
  .tema-card .resumen-corto { color: #4A6A85; font-size: 0.9rem; margin-top: 4px; }
  .actividad-box { background: var(--hielo); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; }
  .actividad-box .inteligencia { display: inline-block; background: var(--menta); color: #fff; font-size: 0.72rem; font-weight: 700; padding: 2px 10px; border-radius: 999px; margin-bottom: 6px; text-transform: uppercase; }
  .trivia-item { border: 2px solid var(--linea); border-radius: 14px; padding: 16px; margin-bottom: 12px; background: #fff; }
  .trivia-item:last-child { margin-bottom: 0; }
  .trivia-pregunta { display: flex; align-items: flex-start; gap: 10px; font-weight: 700; margin-bottom: 12px; line-height: 1.4; }
  .trivia-num {
    flex-shrink: 0; width: 24px; height: 24px; border-radius: 50%; background: var(--profundo); color: #fff;
    font-size: 0.78rem; font-family: 'Grandstander', sans-serif; display: flex; align-items: center; justify-content: center;
  }
  .opciones { display: grid; gap: 8px; }
  .opcion-btn {
    text-align: left; background: #fff; border: 2px solid var(--linea); border-radius: 10px; padding: 10px 14px;
    font-family: inherit; font-size: 0.94rem; color: var(--tinta); cursor: pointer; transition: border-color .15s, background .15s;
  }
  .opcion-btn:hover:not(:disabled) { border-color: var(--cielo); background: var(--hielo); }
  .opcion-btn.seleccionada { border-color: var(--profundo); background: #EAF1FE; font-weight: 700; }
  .opcion-btn.correcta { border-color: var(--menta); background: #E7FBF3; font-weight: 700; color: var(--bosque); }
  .opcion-btn.incorrecta { border-color: #E4796B; background: #FFF0EC; color: #B94A2E; }
  .opcion-btn:disabled { cursor: default; }
  .trivia-feedback { margin-top: 10px; font-size: 0.86rem; color: var(--bosque); background: var(--hielo); border-radius: 8px; padding: 8px 12px; }
  #trivia-resumen { text-align: center; font-weight: 700; color: var(--bosque); margin: 4px 0 12px; font-family: 'Grandstander', sans-serif; }
  .material-extra-box { background: #fff; border: 2px dashed var(--aqua); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; }
  .respuestas-toggle { text-align: center; }
  .respuestas-box { background: var(--hielo); border-radius: 12px; padding: 14px 16px; margin-top: 12px; display: none; }
  .respuestas-box.abierto { display: block; }
  .volver { color: var(--profundo); font-weight: 700; text-decoration: none; display: inline-block; margin-bottom: 14px; }
</style>
</head>
<body>

<header>
  <a href="index.html"><span class="marca">Enseñ<span class="ai">AI</span></span></a>
</header>

<main id="contenido">
  <div class="cargando">Cargando…</div>
</main>

<script>
  const API_BASE = "https://ensenai-backend.onrender.com";
  const params = new URLSearchParams(window.location.search);
  const slug = params.get("slug");

  let grupoActual = null;
  let temasActuales = [];

  const ETIQUETAS_INTELIGENCIA = {
    linguistica: "Lingüística", logico_matematica: "Lógico-matemática", espacial: "Espacial",
    musical: "Musical", kinestesica: "Corporal-kinestésica", interpersonal: "Interpersonal",
    intrapersonal: "Intrapersonal", naturalista: "Naturalista",
  };

  function escapeHtml(str) {
    const d = document.createElement("div");
    d.textContent = str || "";
    return d.innerHTML;
  }

  function nombreGuardado(grupoSlug) {
    try {
      return localStorage.getItem(`ensenai_nombre_${grupoSlug}`);
    } catch (e) {
      return null;
    }
  }

  function guardarNombre(grupoSlug, nombre) {
    try {
      localStorage.setItem(`ensenai_nombre_${grupoSlug}`, nombre);
    } catch (e) {
      // si el navegador bloquea localStorage, seguimos sin guardar —
      // simplemente se le pedirá el nombre otra vez la próxima vez
    }
  }

  async function init() {
    const cont = document.getElementById("contenido");
    if (!slug) {
      cont.innerHTML = `<div class="tarjeta"><div class="error">Falta la liga (URL incompleta).</div></div>`;
      return;
    }

    try {
      const res = await fetch(`${API_BASE}/api/grupos/publico/${encodeURIComponent(slug)}`);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Liga no encontrada.");

      grupoActual = data.grupo;
      temasActuales = data.temas || [];

      const nombreYaGuardado = nombreGuardado(slug);
      if (grupoActual.mostrar_nombres && !nombreYaGuardado) {
        mostrarPideNombre();
      } else {
        if (nombreYaGuardado === null) registrarAcceso(null);
        mostrarListaTemas();
      }
    } catch (err) {
      cont.innerHTML = `<div class="tarjeta"><div class="error">${escapeHtml(err.message)}</div></div>`;
    }
  }

  function mostrarPideNombre() {
    document.getElementById("contenido").innerHTML = `
      <div class="tarjeta">
        <h1>👋 Bienvenido/a a "${escapeHtml(grupoActual.nombre)}"</h1>
        <p class="ayuda">Antes de entrar, dinos tu nombre o apodo (solo la primera vez).</p>
        <label>Tu nombre o apodo</label>
        <input type="text" id="input-nombre" placeholder="Ej. Ana, Grupo 3B - Juan…">
        <button class="primario" id="btn-continuar">Continuar</button>
      </div>
    `;
    document.getElementById("btn-continuar").addEventListener("click", () => {
      const nombre = document.getElementById("input-nombre").value.trim();
      guardarNombre(slug, nombre || "");
      registrarAcceso(nombre || null);
      mostrarListaTemas();
    });
  }

  async function registrarAcceso(nombre) {
    try {
      await fetch(`${API_BASE}/api/grupos/publico/${encodeURIComponent(slug)}/acceso`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ nombre }),
      });
    } catch (err) {
      // no bloquea la experiencia si falla el registro de acceso
    }
  }

  function mostrarListaTemas() {
    const cont = document.getElementById("contenido");

    if (temasActuales.length === 0) {
      cont.innerHTML = `
        <div class="tarjeta">
          <h1>🏫 ${escapeHtml(grupoActual.nombre)}</h1>
          <p class="ayuda">Tu profesor(a) todavía no ha compartido ningún tema aquí. Vuelve a revisar más tarde.</p>
        </div>
      `;
      return;
    }

    cont.innerHTML = `
      <div class="tarjeta">
        <h1>🏫 ${escapeHtml(grupoActual.nombre)}</h1>
        <p class="ayuda">${temasActuales.length} tema${temasActuales.length === 1 ? "" : "s"} disponible${temasActuales.length === 1 ? "" : "s"}. Toca uno para ver la explicación, la actividad y la trivia.</p>
      </div>
      ${temasActuales
        .map(
          (t, i) => `
        <div class="tema-card" data-idx="${i}">
          <div class="titulo">📘 ${escapeHtml(t.titulo)}</div>
          <div class="resumen-corto">${escapeHtml((t.contenido?.resumen || "").slice(0, 110))}${(t.contenido?.resumen || "").length > 110 ? "…" : ""}</div>
        </div>
      `
        )
        .join("")}
    `;

    cont.querySelectorAll(".tema-card").forEach((el) => {
      el.addEventListener("click", () => mostrarTema(parseInt(el.dataset.idx, 10)));
    });
  }

  function normalizarTexto(s) {
    return (s || "").trim().toLowerCase();
  }

  function revisarTrivia() {
    let total = 0;
    let correctas = 0;
    document.querySelectorAll(".trivia-item").forEach((item) => {
      item.classList.add("revisado");
      const correcta = item.dataset.correcta || "";
      const opciones = item.querySelectorAll(".opcion-btn");
      const feedback = item.querySelector(".trivia-feedback");
      if (opciones.length) {
        total++;
        const seleccionado = item.querySelector(".opcion-btn.seleccionada");
        opciones.forEach((btn) => {
          btn.disabled = true;
          if (normalizarTexto(btn.dataset.valor) === normalizarTexto(correcta)) {
            btn.classList.add("correcta");
          } else if (btn === seleccionado) {
            btn.classList.add("incorrecta");
          }
        });
        if (seleccionado && normalizarTexto(seleccionado.dataset.valor) === normalizarTexto(correcta)) {
          correctas++;
        } else if (!seleccionado) {
          feedback.style.display = "block";
          feedback.textContent = "No elegiste una respuesta.";
        }
      } else if (correcta) {
        feedback.style.display = "block";
        feedback.innerHTML = `<strong>Respuesta sugerida:</strong> ${escapeHtml(correcta)}`;
      }
    });

    const resumen = document.getElementById("trivia-resumen");
    if (resumen && total > 0) {
      resumen.style.display = "block";
      resumen.textContent = `Obtuviste ${correctas} de ${total} correctas.`;
    }
    const btnRevisar = document.getElementById("btn-revisar-trivia");
    if (btnRevisar) btnRevisar.style.display = "none";
  }

  function mostrarTema(idx) {
    const tema = temasActuales[idx];
    const c = tema.contenido || {};
    const cont = document.getElementById("contenido");

    const actividadesHtml = c.actividades
      ? c.actividades
          .map(
            (a) => `
        <div class="actividad-box">
          <span class="inteligencia">${escapeHtml(ETIQUETAS_INTELIGENCIA[a.inteligencia] || a.inteligencia)}</span>
          <div style="font-weight:700; margin-bottom:4px;">${escapeHtml(a.titulo || "")}</div>
          <div style="font-size:0.92rem; line-height:1.5;">${escapeHtml(a.instrucciones || "")}</div>
        </div>
      `
          )
          .join("")
      : c.actividad
      ? `
        <div class="actividad-box">
          <div style="font-weight:700; margin-bottom:4px;">${escapeHtml(c.actividad.titulo || "")}</div>
          <div style="font-size:0.92rem; line-height:1.5;">${escapeHtml(c.actividad.instrucciones || "")}</div>
        </div>
      `
      : "";

    const triviaHtml = (c.trivia || [])
      .map(
        (p, i) => `
      <div class="trivia-item" data-correcta="${escapeHtml(p.respuesta_correcta || "")}">
        <div class="trivia-pregunta"><span class="trivia-num">${i + 1}</span> ${escapeHtml(p.pregunta || "")}</div>
        ${
          p.opciones?.length
            ? `<div class="opciones">${p.opciones.map((o) => `<button type="button" class="opcion-btn" data-valor="${escapeHtml(o)}">${escapeHtml(o)}</button>`).join("")}</div>`
            : ""
        }
        <div class="trivia-feedback" style="display:none;"></div>
      </div>
    `
      )
      .join("");

    const materialExtraHtml = (c.material_extra || [])
      .map(
        (m) => `
      <div class="material-extra-box">
        <div style="font-weight:700; text-transform:capitalize; margin-bottom:4px;">${escapeHtml(m.tipo || "")}</div>
        <div style="font-size:0.92rem; line-height:1.5; white-space:pre-line;">${escapeHtml(m.contenido || "")}</div>
      </div>
    `
      )
      .join("");

    const r = c.respuestas || {};
    const respuestasHtml = `
      ${
        r.trivia_resuelta?.length
          ? `<h3 style="margin-top:0;">Respuestas de la trivia</h3>` +
            r.trivia_resuelta.map((rt) => `<p style="margin:4px 0;"><strong>${escapeHtml(rt.pregunta)}</strong> — ${escapeHtml(rt.respuesta)}</p>`).join("")
          : ""
      }
      ${r.solucion_actividad ? `<h3>Solución de la actividad</h3><p style="margin:0;">${escapeHtml(r.solucion_actividad)}</p>` : ""}
      ${
        r.conceptos_clave?.length
          ? `<h3>Conceptos clave</h3><ul>${r.conceptos_clave.map((k) => `<li>${escapeHtml(k)}</li>`).join("")}</ul>`
          : ""
      }
      ${r.autoevaluacion ? `<h3>Autoevaluación</h3><p style="margin:0;">${escapeHtml(r.autoevaluacion)}</p>` : ""}
    `;

    cont.innerHTML = `
      <a class="volver" href="javascript:void(0)" id="btn-volver">← Volver a la liga</a>
      <div class="tarjeta">
        <h1>📘 ${escapeHtml(c.tema || tema.titulo)}</h1>
        ${c.resumen ? `<p class="ayuda" style="line-height:1.6;">${escapeHtml(c.resumen)}</p>` : ""}
        ${c.esquema_visual ? `<h3>Esquema visual</h3><p style="white-space:pre-line; line-height:1.6; margin:0;">${escapeHtml(c.esquema_visual)}</p>` : ""}
        ${tema.pdf_url ? `<a href="${escapeHtml(tema.pdf_url)}" target="_blank"><button class="secundario" style="margin-top:14px;">📄 Descargar imprimible (PDF)</button></a>` : ""}
      </div>

      ${actividadesHtml ? `<div class="tarjeta"><h2>✏️ Actividad${c.actividades ? "es (elige la de tu tipo de inteligencia)" : ""}</h2>${actividadesHtml}</div>` : ""}

      ${
        triviaHtml
          ? `<div class="tarjeta">
              <h2>🧠 Trivia</h2>
              <p class="ayuda" style="margin:0 0 12px;">Elige tu respuesta en cada pregunta y luego dale a "Revisar mis respuestas".</p>
              ${triviaHtml}
              <div id="trivia-resumen" style="display:none;"></div>
              <button class="primario" id="btn-revisar-trivia">Revisar mis respuestas</button>
            </div>`
          : ""
      }

      ${materialExtraHtml ? `<div class="tarjeta"><h2>📎 Material extra</h2>${materialExtraHtml}</div>` : ""}

      <div class="tarjeta">
        <div class="respuestas-toggle"><button class="secundario" id="btn-respuestas">Ver respuestas</button></div>
        <div class="respuestas-box" id="caja-respuestas">${respuestasHtml}</div>
      </div>
    `;

    document.getElementById("btn-volver").addEventListener("click", mostrarListaTemas);
    document.getElementById("btn-respuestas").addEventListener("click", () => {
      const caja = document.getElementById("caja-respuestas");
      caja.classList.toggle("abierto");
    });

    document.querySelectorAll(".opcion-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        const item = btn.closest(".trivia-item");
        if (item.classList.contains("revisado")) return;
        item.querySelectorAll(".opcion-btn").forEach((b) => b.classList.remove("seleccionada"));
        btn.classList.add("seleccionada");
      });
    });
    const btnRevisarTrivia = document.getElementById("btn-revisar-trivia");
    if (btnRevisarTrivia) btnRevisarTrivia.addEventListener("click", revisarTrivia);
  }

  init();
</script>
</body>
</html>
