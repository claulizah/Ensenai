<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EnseñAI — Liga de grupo</title>
<link rel="icon" type="image/png" href="assets/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grandstander:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --profundo: #1E3A8A; --profundo-oscuro: #16296B; --cielo: #60A5FA;
    --menta: #34D399; --aqua: #7DD3FC; --bosque: #065F46;
    --hielo: #F0FDF4; --tinta: #1E3A8A; --linea: #DCEEFC;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: 'Nunito', sans-serif;
    background:
      radial-gradient(circle at 12% 8%, rgba(96,165,250,0.35) 0, transparent 30%),
      radial-gradient(circle at 90% 20%, rgba(125,211,252,0.32) 0, transparent 32%),
      var(--hielo);
    color: var(--tinta); min-height: 100vh;
  }
  header { background: var(--profundo); color: #fff; padding: 18px 24px; display: flex; align-items: center; gap: 10px; }
  header a { color: inherit; text-decoration: none; display: flex; align-items: center; gap: 10px; }
  header .marca { font-family: 'Grandstander', sans-serif; font-weight: 700; font-size: 1.4rem; }
  header .marca .ai {
    display: inline-block; color: var(--aqua); background: rgba(255,255,255,0.14);
    padding: 1px 10px; border-radius: 999px; font-size: 0.75em; vertical-align: middle;
  }
  main { max-width: 640px; margin: 0 auto; padding: 32px 20px 80px; }
  .tarjeta { background: #fff; border: 2px solid var(--linea); border-radius: 18px; padding: 22px; margin-bottom: 18px; box-shadow: 0 3px 0 var(--linea); }
  h1 { font-family: 'Grandstander', sans-serif; font-size: 1.5rem; margin: 0 0 6px; }
  h2 { font-family: 'Grandstander', sans-serif; font-size: 1.15rem; margin: 0 0 8px; color: var(--profundo); }
  h3 { font-family: 'Grandstander', sans-serif; color: var(--bosque); font-size: 0.98rem; margin: 16px 0 8px; }
  p.ayuda { color: #4A6A85; margin: 0; }
  label { display: block; font-weight: 700; font-size: 0.9rem; margin: 14px 0 6px; }
  input { width: 100%; padding: 12px 14px; border: 2px solid var(--linea); border-radius: 12px; font-family: inherit; font-size: 1rem; }
  button.primario {
    width: 100%; background: var(--profundo); color: #fff; border: none; padding: 14px; border-radius: 999px;
    font-family: 'Grandstander', sans-serif; font-weight: 600; font-size: 1rem; cursor: pointer; margin-top: 16px;
    box-shadow: 0 4px 0 var(--profundo-oscuro);
  }
  button.secundario { background: none; border: 2px solid var(--linea); color: var(--profundo); padding: 8px 14px; border-radius: 999px; font-weight: 700; font-size: 0.85rem; cursor: pointer; margin-top: 10px; }
  .error { background: #FFF0EC; border: 2px solid #FFC4B5; color: #B94A2E; padding: 12px 14px; border-radius: 12px; margin-top: 12px; font-size: 0.9rem; }
  .cargando { text-align: center; padding: 60px 20px; color: #4A6A85; }
  .tema-card { border: 2px solid var(--linea); border-radius: 14px; padding: 16px 18px; margin-bottom: 14px; cursor: pointer; }
  .tema-card .titulo { font-family: 'Grandstander', sans-serif; font-weight: 700; font-size: 1.05rem; color: var(--profundo); }
  .tema-card .resumen-corto { color: #4A6A85; font-size: 0.9rem; margin-top: 4px; }
  .actividad-box { background: var(--hielo); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; }
  .actividad-box .inteligencia { display: inline-block; background: var(--menta); color: #fff; font-size: 0.72rem; font-weight: 700; padding: 2px 10px; border-radius: 999px; margin-bottom: 6px; text-transform: uppercase; }
  .trivia-item { border: 2px solid var(--linea); border-radius: 14px; padding: 16px; margin-bottom: 12px; background: #fff; }
  .trivia-item:last-child { margin-bottom: 0; }
  .trivia-pregunta { display: flex; align-items: flex-start; gap: 10px; font-weight: 700; margin-bottom: 12px; line-height: 1.4; }
  .trivia-num {
    flex-shrink: 0; width: 24px; height: 24px; border-radius: 50%; background: var(--profundo); color: #fff;
    font-size: 0.78rem; font-family: 'Grandstander', sans-serif; display: flex; align-items: center; justify-content: center;
  }
  .opciones { display: grid; gap: 8px; }
  .opcion-btn {
    text-align: left; background: #fff; border: 2px solid var(--linea); border-radius: 10px; padding: 10px 14px;
    font-family: inherit; font-size: 0.94rem; color: var(--tinta); cursor: pointer; transition: border-color .15s, background .15s;
  }
  .opcion-btn:hover:not(:disabled) { border-color: var(--cielo); background: var(--hielo); }
  .opcion-btn.seleccionada { border-color: var(--profundo); background: #EAF1FE; font-weight: 700; }
  .opcion-btn.correcta { border-color: var(--menta); background: #E7FBF3; font-weight: 700; color: var(--bosque); }
  .opcion-btn.incorrecta { border-color: #E4796B; background: #FFF0EC; color: #B94A2E; }
  .opcion-btn:disabled { cursor: default; }
  .trivia-feedback { margin-top: 10px; font-size: 0.86rem; color: #4A6A85; background: #F4F8FC; border-radius: 8px; padding: 8px 12px; }
  .trivia-feedback.bien { color: var(--bosque); background: #E7FBF3; }
  .trivia-feedback.mal { color: #B94A2E; background: #FFF0EC; }
  .etiqueta-op {
    float: right; font-size: 0.68rem; font-weight: 800; text-transform: uppercase;
    letter-spacing: 0.02em; padding: 2px 8px; border-radius: 999px; margin-left: 8px;
    background: rgba(0,0,0,0.07);
  }
  .opcion-btn.correcta .etiqueta-op { background: var(--menta); color: #fff; }
  .opcion-btn.incorrecta .etiqueta-op { background: #E4796B; color: #fff; }
  .respuesta-abierta {
    width: 100%; border: 2px solid var(--linea); border-radius: 10px; padding: 10px 12px;
    font-family: inherit; font-size: 0.94rem; resize: vertical;
  }
  .respuesta-abierta:disabled { background: #F7FAFD; color: #4A6A85; }
  #trivia-resumen { text-align: center; font-weight: 700; color: var(--bosque); margin: 4px 0 12px; font-family: 'Grandstander', sans-serif; }
  /* ── Pestañas del material ── */
  .pestanas { display: flex; gap: 4px; background: var(--hielo); border-radius: 999px; padding: 4px; margin: 14px 0 20px; }
  .pestana {
    flex: 1; border: none; background: none; padding: 10px 6px; border-radius: 999px; cursor: pointer;
    font-family: 'Grandstander', sans-serif; font-weight: 600; font-size: 0.86rem; color: #5b7d99;
    transition: background .15s, color .15s;
  }
  .pestana.activa { background: #fff; color: var(--profundo); box-shadow: 0 2px 6px rgba(30,58,138,0.12); }
  .pestana-num { display: inline-block; background: var(--menta); color: #fff; border-radius: 999px; padding: 0 6px; font-size: 0.72rem; }

  /* ── Bloques de la pestaña Estudiar ── */
  .bloque-est { border-left: 4px solid var(--linea); padding: 2px 0 2px 14px; margin-bottom: 18px; }
  .bloque-est p { margin: 0; line-height: 1.65; font-size: 0.95rem; }
  .bloque-est.destacado { border-left-color: var(--menta); background: var(--hielo); border-radius: 0 12px 12px 0; padding: 14px 16px; }
  .bloque-est.destacado p { font-size: 1rem; color: var(--bosque); font-weight: 600; }
  .bloque-titulo { font-family: 'Grandstander', sans-serif; color: var(--profundo); font-size: 0.98rem; margin: 0 0 6px; }
  .lista-pasos { margin: 0; padding-left: 20px; }
  .lista-pasos li { margin-bottom: 7px; line-height: 1.55; font-size: 0.94rem; }
  .lista-ideas { margin: 0; padding-left: 18px; list-style: none; }
  .lista-ideas li { margin-bottom: 7px; line-height: 1.5; font-size: 0.94rem; position: relative; }
  .lista-ideas li::before { content: "▪"; color: var(--menta); position: absolute; left: -14px; font-size: 1.1rem; }
  .caja-ojo, .caja-truco { border-radius: 12px; padding: 13px 16px; margin-bottom: 16px; }
  .caja-ojo { background: #FFF7E6; border: 2px solid #FFDFA0; }
  .caja-truco { background: #F3F0FF; border: 2px solid #D9D2FF; }
  .caja-ojo strong, .caja-truco strong { display: block; font-size: 0.88rem; margin-bottom: 4px; }
  .caja-ojo strong { color: #8A6100; } .caja-truco strong { color: #4B3BA8; }
  .caja-ojo p, .caja-truco p { margin: 0; font-size: 0.93rem; line-height: 1.55; }
  .bloque-est.plegable { border-left-color: var(--cielo); }
  .bloque-est.plegable summary { cursor: pointer; font-weight: 700; font-size: 0.9rem; color: #5b7d99; }

  .diagrama-caja { border: 2px solid var(--linea); border-radius: 16px; padding: 16px; margin-bottom: 18px; background: #fff; }
  .diagrama-scroll { overflow-x: auto; }
  .diagrama-scroll svg { min-width: 460px; display: block; }

  /* ── Ejercicios ── */
  .ejercicio { border: 2px solid var(--linea); border-radius: 14px; padding: 15px; margin-bottom: 12px; }
  .ejercicio-cabeza { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 10px; }
  .ejercicio-num {
    flex-shrink: 0; width: 26px; height: 26px; border-radius: 50%; background: var(--profundo); color: #fff;
    font-family: 'Grandstander', sans-serif; font-size: 0.8rem;
    display: flex; align-items: center; justify-content: center;
  }
  .ejercicio-enunciado { margin: 0; font-weight: 700; line-height: 1.5; font-size: 0.95rem; }
  .btn-pista, .btn-solucion {
    border: 2px solid var(--linea); background: #fff; border-radius: 999px; padding: 7px 16px;
    font-family: inherit; font-weight: 700; font-size: 0.82rem; cursor: pointer; color: #5b7d99; margin-right: 6px;
  }
  .btn-solucion { border-color: var(--menta); color: var(--bosque); }
  .btn-solucion.abierta { background: var(--hielo); }
  .pista-caja { background: #FFF7E6; border-radius: 10px; padding: 10px 13px; margin-top: 9px; font-size: 0.9rem; color: #8A6100; }
  .solucion-caja { background: var(--hielo); border-radius: 10px; padding: 13px 15px; margin-top: 10px; }
  .ejercicio-respuesta {
    background: var(--menta); color: #fff; border-radius: 8px; padding: 8px 13px; margin-top: 10px;
    font-weight: 700; font-size: 0.93rem;
  }
  .ejercicio-marcar {
    display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 0.85rem; font-weight: 700;
    color: var(--bosque); cursor: pointer;
  }
  .ejercicio-marcar input { width: 17px; height: 17px; accent-color: var(--menta); cursor: pointer; }
  .btn-guardar-progreso { width: 100%; margin-top: 4px; }
  .progreso-aviso { text-align: center; font-size: 0.85rem; font-weight: 700; color: var(--bosque); margin-top: 8px; }

  .material-extra-box { background: #fff; border: 2px dashed var(--aqua); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; }
  .respuestas-toggle { text-align: center; }
  .respuestas-box { background: var(--hielo); border-radius: 12px; padding: 14px 16px; margin-top: 12px; display: none; }
  .respuestas-box.abierto { display: block; }
  .volver { color: var(--profundo); font-weight: 700; text-decoration: none; display: inline-block; margin-bottom: 14px; }
  footer.pie {
    max-width: 620px; margin: 24px auto 32px; padding: 0 16px;
    text-align: center; font-size: 0.78rem; color: #6B87A0;
  }
  footer.pie a { color: inherit; text-decoration: underline; }
</style>
</head>
<body>

<header>
  <a href="index.html"><span class="marca">Enseñ<span class="ai">AI</span></span></a>
</header>

<main id="contenido">
  <div class="cargando">Cargando…</div>
</main>

<footer class="pie">
  Tu docente o profesional te compartió esta liga. Guardamos tus respuestas para que pueda ver el avance del grupo —
  consulta el <a href="privacidad.html">aviso de privacidad</a> para más detalle.
</footer>

<script>
  const API_BASE = "https://ensenai-backend.onrender.com";
  const params = new URLSearchParams(window.location.search);
  const slug = params.get("slug");

  let grupoActual = null;
  let temasActuales = [];

  const ETIQUETAS_INTELIGENCIA = {
    linguistica: "Lingüística", logico_matematica: "Lógico-matemática", espacial: "Espacial",
    musical: "Musical", kinestesica: "Corporal-kinestésica", interpersonal: "Interpersonal",
    intrapersonal: "Intrapersonal", naturalista: "Naturalista",
  };

  function escapeHtml(str) {
    const d = document.createElement("div");
    d.textContent = str || "";
    return d.innerHTML;
  }

  /**
   * El modelo escribe en markdown aunque se le pida texto plano — sale
   * "**1. Género Narrativo**" con los asteriscos a la vista. Esto convierte
   * lo mínimo (negritas, cursivas, código y saltos) a HTML de verdad.
   * Siempre escapa primero: las únicas etiquetas que llegan al DOM son las
   * que se generan aquí.
   */
  function formatearTexto(str) {
    let t = escapeHtml(str || "");
    t = t.replace(/\*\*\*([^*]+)\*\*\*/g, "<strong><em>$1</em></strong>");
    t = t.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    t = t.replace(/(^|[\s([{])\*([^*\s][^*]*?)\*/g, "$1<em>$2</em>");
    t = t.replace(/__([^_]+)__/g, "<strong>$1</strong>");
    t = t.replace(/`([^`]+)`/g, "<code>$1</code>");
    return t.replace(/\n/g, "<br>");
  }

  function nombreGuardado(grupoSlug) {
    try {
      return localStorage.getItem(`ensenai_nombre_${grupoSlug}`);
    } catch (e) {
      return null;
    }
  }

  function guardarNombre(grupoSlug, nombre) {
    try {
      localStorage.setItem(`ensenai_nombre_${grupoSlug}`, nombre);
    } catch (e) {
      // si el navegador bloquea localStorage, seguimos sin guardar —
      // simplemente se le pedirá el nombre otra vez la próxima vez
    }
  }

  // Sentinel para "ya se le preguntó y prefirió no dar nombre" (grupos
  // anónimos) — distinto de "todavía no se le ha preguntado", que es lo que
  // representa que nombreGuardado() regrese null.
  const SIN_NOMBRE = "__sin_nombre__";

  function nombreParaEnviar(grupoSlug) {
    const n = nombreGuardado(grupoSlug);
    return !n || n === SIN_NOMBRE ? null : n;
  }

  async function init() {
    const cont = document.getElementById("contenido");
    if (!slug) {
      cont.innerHTML = `<div class="tarjeta"><div class="error">Falta la liga (URL incompleta).</div></div>`;
      return;
    }

    try {
      const res = await fetch(`${API_BASE}/api/grupos/publico/${encodeURIComponent(slug)}`);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Liga no encontrada.");

      grupoActual = data.grupo;
      temasActuales = data.temas || [];

      const nombreYaGuardado = nombreGuardado(slug);
      if (!nombreYaGuardado) {
        mostrarPideNombre();
      } else {
        mostrarListaTemas();
      }
    } catch (err) {
      // Un fetch que nunca llegó al servidor (sin internet, backend caído,
      // CORS) lanza un TypeError genérico ("Failed to fetch") — no tiene
      // sentido mostrárselo tal cual a un alumno. Un error de negocio real
      // (ej. "Liga no encontrada.") sí lo lanzamos nosotros más arriba con
      // Error(...), así que ese mensaje sí es legible y se muestra tal cual.
      const mensaje =
        err instanceof TypeError
          ? "No pudimos conectar con EnseñAI. Revisa tu internet e intenta de nuevo."
          : err.message;
      cont.innerHTML = `
        <div class="tarjeta">
          <div class="error">${escapeHtml(mensaje)}</div>
          <button class="secundario" id="btn-reintentar" style="margin-top:12px;">Reintentar</button>
        </div>`;
      const btn = document.getElementById("btn-reintentar");
      if (btn) btn.addEventListener("click", () => { cont.innerHTML = `<div class="cargando">Cargando…</div>`; init(); });
    }
  }

  function mostrarPideNombre() {
    // En grupos anónimos (mostrar_nombres = false, pensado para psicólogos
    // con pacientes) igual pedimos un primer nombre o apodo — sirve para
    // que el profesional distinga las respuestas de cada quien sin saber
    // quién es en realidad — pero aquí es OPCIONAL: quien prefiera no darlo
    // puede continuar sin escribir nada.
    const anonimo = !grupoActual.mostrar_nombres;

    document.getElementById("contenido").innerHTML = `
      <div class="tarjeta">
        <h1>👋 Bienvenido/a a "${escapeHtml(grupoActual.nombre)}"</h1>
        <p class="ayuda">${
          anonimo
            ? "Antes de entrar, si quieres, dinos tu primer nombre o un apodo (sin apellido) — es opcional, y solo sirve para distinguir tus respuestas de las de los demás."
            : "Antes de entrar, dinos tu nombre o apodo (solo la primera vez)."
        }</p>
        <label>${anonimo ? "Tu primer nombre o apodo (opcional)" : "Tu nombre o apodo"}</label>
        <input type="text" id="input-nombre" placeholder="${anonimo ? "Ej. Ale, Paciente 3…" : "Ej. Ana, Grupo 3B - Juan…"}" autofocus>
        ${anonimo ? "" : `<div class="error" id="error-nombre" style="display:none;">Escribe tu nombre o apodo para continuar.</div>`}
        <button class="primario" id="btn-continuar">Continuar</button>
        ${anonimo ? `<button class="secundario" id="btn-omitir" style="margin-top:8px;">Prefiero no darlo</button>` : ""}
      </div>
    `;
    const input = document.getElementById("input-nombre");
    const error = document.getElementById("error-nombre");

    const continuarSinNombre = () => {
      guardarNombre(slug, SIN_NOMBRE);
      registrarAcceso(null);
      mostrarListaTemas();
    };

    const intentarContinuar = () => {
      const nombre = input.value.trim();
      if (!nombre) {
        if (anonimo) {
          continuarSinNombre();
          return;
        }
        error.style.display = "block";
        input.focus();
        return;
      }
      guardarNombre(slug, nombre);
      registrarAcceso(nombre);
      mostrarListaTemas();
    };

    document.getElementById("btn-continuar").addEventListener("click", intentarContinuar);
    input.addEventListener("keydown", (ev) => {
      if (ev.key === "Enter") intentarContinuar();
    });
    if (error) {
      input.addEventListener("input", () => {
        if (error.style.display !== "none") error.style.display = "none";
      });
    }
    const btnOmitir = document.getElementById("btn-omitir");
    if (btnOmitir) btnOmitir.addEventListener("click", continuarSinNombre);
    input.focus();
  }

  async function registrarAcceso(nombre) {
    try {
      await fetch(`${API_BASE}/api/grupos/publico/${encodeURIComponent(slug)}/acceso`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ nombre }),
      });
    } catch (err) {
      // no bloquea la experiencia si falla el registro de acceso
    }
  }

  /**
   * Manda el detalle de cómo se contestó la trivia de un tema, para que el
   * profesional vea qué está fallando (no solo un puntaje). Se llama después
   * de que "Revisar mis respuestas" ya calificó y mostró todo en pantalla,
   * así que si esto falla el alumno no se entera ni pierde nada — solo el
   * profesor se queda sin ese envío en su reporte.
   *
   * En grupos anónimos, dar el nombre fue opcional — si la persona lo
   * omitió, nombreParaEnviar(slug) regresa null (nunca el sentinel interno
   * SIN_NOMBRE) y el profesor la verá como "Alumno N (anónimo)".
   *
   * "indice" identifica la pregunta dentro del arreglo trivia del tema —
   * el backend lo usa para releer la pregunta real y recalcular "acerto"
   * él mismo (nunca confía en lo que mandamos aquí); "pregunta",
   * "respuesta_correcta" y "acerto" solo viajan como respaldo por si el
   * backend no pudiera encontrar la pregunta original.
   */
  async function enviarRespuestas(temaId, respuestas) {
    try {
      await fetch(`${API_BASE}/api/grupos/publico/${encodeURIComponent(slug)}/temas/${encodeURIComponent(temaId)}/respuestas`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ nombre: nombreParaEnviar(slug), respuestas }),
      });
    } catch (err) {
      // no bloquea la experiencia del alumno si falla
    }
  }

  /**
   * "Checkbox ligero" de progreso (31-ago-2026): manda qué ejercicios de la
   * pestaña "Practicar" quedaron marcados como resueltos, para que el
   * profesional vea algo de avance sin necesitar fotos. Se puede guardar
   * más de una vez conforme se van resolviendo más ejercicios — cada click
   * en "Guardar mi progreso" manda el estado completo de los checkboxes en
   * ese momento (ver POST .../ejercicios-marcados en routes/grupos.js).
   */
  async function guardarEjerciciosMarcados() {
    const tema = temasActuales[temaAbiertoIdx];
    const aviso = document.getElementById("progreso-aviso");
    if (!tema) return;

    const totalCheckboxes = document.querySelectorAll(".chk-ejercicio-resuelto").length;
    const indices = Array.from(document.querySelectorAll(".chk-ejercicio-resuelto:checked")).map((chk) =>
      parseInt(chk.dataset.ej, 10)
    );

    try {
      const res = await fetch(
        `${API_BASE}/api/grupos/publico/${encodeURIComponent(slug)}/temas/${encodeURIComponent(tema.id)}/ejercicios-marcados`,
        {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ nombre: nombreParaEnviar(slug), indices }),
        }
      );
      if (!res.ok) throw new Error();
      if (aviso) {
        aviso.style.display = "block";
        aviso.textContent = indices.length
          ? `✓ Guardado — ${indices.length} de ${totalCheckboxes} marcados.`
          : "Guardado — todavía no marcaste ninguno.";
      }
    } catch (err) {
      if (aviso) {
        aviso.style.display = "block";
        aviso.textContent = "No se pudo guardar tu progreso — intenta de nuevo en un momento.";
      }
    }
  }

  function mostrarListaTemas() {
    const cont = document.getElementById("contenido");

    if (temasActuales.length === 0) {
      cont.innerHTML = `
        <div class="tarjeta">
          <h1>🏫 ${escapeHtml(grupoActual.nombre)}</h1>
          <p class="ayuda">Tu profesor(a) todavía no ha compartido ningún tema aquí. Vuelve a revisar más tarde.</p>
        </div>
      `;
      return;
    }

    cont.innerHTML = `
      <div class="tarjeta">
        <h1>🏫 ${escapeHtml(grupoActual.nombre)}</h1>
        <p class="ayuda">${temasActuales.length} tema${temasActuales.length === 1 ? "" : "s"} disponible${temasActuales.length === 1 ? "" : "s"}. Toca uno para ver la explicación, la actividad y la trivia.</p>
      </div>
      ${temasActuales
        .map(
          (t, i) => `
        <div class="tema-card" data-idx="${i}">
          <div class="titulo">📘 ${escapeHtml(t.titulo)}</div>
          <div class="resumen-corto">${escapeHtml(textoResumenCorto(t.contenido?.resumen))}</div>
        </div>
      `
        )
        .join("")}
    `;

    cont.querySelectorAll(".tema-card").forEach((el) => {
      el.addEventListener("click", () => mostrarTema(parseInt(el.dataset.idx, 10)));
    });
  }

  function normalizarTexto(s) {
    return (s || "").trim().toLowerCase();
  }

  /**
   * Antes, al revisar, la opción correcta se pintaba de verde — pero si tú
   * también la habías elegido, se veía idéntica: no había forma de saber
   * cuál habías escogido tú. Y si fallabas, no se decía con palabras cuál
   * era la buena. Ahora cada opción se etiqueta ("Tu respuesta" / "Correcta")
   * y debajo de cada pregunta sale una línea que explica qué pasó.
   */
  function revisarTrivia() {
    let total = 0;
    let correctas = 0;
    const detalle = [];

    Array.from(document.querySelectorAll(".trivia-item")).forEach((item, indice) => {
      item.classList.add("revisado");
      const correcta = item.dataset.correcta || "";
      const pregunta = item.dataset.pregunta || "";
      const opciones = item.querySelectorAll(".opcion-btn");
      const feedback = item.querySelector(".trivia-feedback");
      const abierta = item.querySelector(".respuesta-abierta");

      if (opciones.length) {
        total++;
        const seleccionado = item.querySelector(".opcion-btn.seleccionada");
        const acerto = seleccionado && normalizarTexto(seleccionado.dataset.valor) === normalizarTexto(correcta);

        opciones.forEach((btn) => {
          btn.disabled = true;
          const esCorrecta = normalizarTexto(btn.dataset.valor) === normalizarTexto(correcta);
          const esTuya = btn === seleccionado;
          if (esCorrecta) btn.classList.add("correcta");
          else if (esTuya) btn.classList.add("incorrecta");

          let etiqueta = "";
          if (esTuya && esCorrecta) etiqueta = "Tu respuesta · correcta";
          else if (esTuya) etiqueta = "Tu respuesta";
          else if (esCorrecta) etiqueta = "Correcta";
          if (etiqueta) btn.insertAdjacentHTML("beforeend", `<span class="etiqueta-op">${etiqueta}</span>`);
        });

        feedback.style.display = "block";
        if (acerto) {
          correctas++;
          feedback.className = "trivia-feedback bien";
          feedback.textContent = "✅ ¡Correcto!";
        } else if (seleccionado) {
          feedback.className = "trivia-feedback mal";
          feedback.innerHTML = `❌ La respuesta correcta era: <strong>${escapeHtml(correcta)}</strong>`;
        } else {
          feedback.className = "trivia-feedback";
          feedback.innerHTML = `No elegiste respuesta. La correcta era: <strong>${escapeHtml(correcta)}</strong>`;
        }

        detalle.push({
          indice,
          pregunta,
          respuesta: seleccionado ? seleccionado.dataset.valor : null,
          respuesta_correcta: correcta,
          acerto: !!acerto,
        });
      } else {
        if (abierta) abierta.disabled = true;
        const escribio = abierta && abierta.value.trim();
        feedback.style.display = "block";
        feedback.className = "trivia-feedback";
        feedback.innerHTML =
          (escribio ? "" : "<em>No escribiste nada.</em> ") +
          `<strong>Respuesta sugerida:</strong> ${escapeHtml(correcta)}`;

        // respuesta abierta: no se autocalifica, así que acerto queda en
        // null — el profesor la lee y juzga él mismo.
        detalle.push({
          indice,
          pregunta,
          respuesta: escribio || null,
          respuesta_correcta: correcta,
          acerto: null,
        });
      }
    });

    if (detalle.length && temasActuales[temaAbiertoIdx]) {
      enviarRespuestas(temasActuales[temaAbiertoIdx].id, detalle);
    }

    const resumen = document.getElementById("trivia-resumen");
    if (resumen && total > 0) {
      resumen.style.display = "block";
      const pct = correctas / total;
      const mensaje =
        pct === 1 ? "¡Todas correctas! 🎉" : pct >= 0.6 ? "¡Vas bien!" : "Vale la pena repasar y volver a intentar.";
      resumen.textContent = `${mensaje} Acertaste ${correctas} de ${total}.`;
    }

    const btnRevisar = document.getElementById("btn-revisar-trivia");
    if (btnRevisar) {
      // Clon para soltar el listener anterior (si no, "Intentar de nuevo"
      // volvería a ejecutar la revisión también).
      const nuevo = btnRevisar.cloneNode(false);
      nuevo.textContent = "Intentar de nuevo";
      btnRevisar.replaceWith(nuevo);
      nuevo.addEventListener("click", () => mostrarTema(temaAbiertoIdx));
    }
  }

  // ── Diagramas dibujados (SVG) ───────────────────────────────────────────
  // El generador ya no entrega el esquema como arte ASCII con guiones: manda
  // datos estructurados (ver `diagrama` en agents/generateTema.js) y aquí se
  // dibujan como gráficos de verdad. Todo es SVG inline, sin librerías: se
  // ve nítido en cualquier pantalla, se puede imprimir, y no agrega peso.
  const DIAG = {
    ancho: 600,
    colores: ["#1E3A8A", "#34D399", "#F97066", "#7C6FE0", "#F5A524", "#60A5FA"],
  };

  /** Corta un texto en varias líneas de ~`max` caracteres, sin partir palabras. */
  function partirLineas(texto, max) {
    const palabras = String(texto || "").split(/\s+/).filter(Boolean);
    const lineas = [];
    let actual = "";
    for (const p of palabras) {
      if ((actual + " " + p).trim().length > max && actual) {
        lineas.push(actual);
        actual = p;
      } else {
        actual = (actual + " " + p).trim();
      }
    }
    if (actual) lineas.push(actual);
    return lineas;
  }

  function svgTexto(texto, x, y, opts = {}) {
    const { max = 22, tam = 12, color = "#1F2937", peso = "600", alto = 15, ancla = "middle" } = opts;
    const lineas = partirLineas(texto, max);
    const inicio = y - ((lineas.length - 1) * alto) / 2;
    return lineas
      .map(
        (l, i) =>
          `<text x="${x}" y="${inicio + i * alto}" text-anchor="${ancla}" font-family="Nunito, sans-serif" font-size="${tam}" font-weight="${peso}" fill="${color}" dominant-baseline="middle">${escapeHtml(l)}</text>`
      )
      .join("");
  }

  function dibujarMapaMental(d) {
    const ramas = (d.ramas || []).slice(0, 5);
    if (!ramas.length) return "";
    const filaAlto = 74;
    const alto = 90 + ramas.length * filaAlto;
    const cx = 118;
    const cyCentro = alto / 2;

    let s = `<rect x="20" y="${cyCentro - 34}" width="196" height="68" rx="16" fill="#1E3A8A"/>`;
    s += svgTexto(d.centro || "", 118, cyCentro, { max: 18, tam: 14, color: "#fff", peso: "700" });

    ramas.forEach((r, i) => {
      const color = DIAG.colores[(i + 1) % DIAG.colores.length];
      const y = 60 + i * filaAlto + 26;
      // Curva del centro a la rama
      s += `<path d="M216 ${cyCentro} C 268 ${cyCentro}, 268 ${y}, 300 ${y}" stroke="${color}" stroke-width="2.5" fill="none"/>`;
      s += `<rect x="300" y="${y - 22}" width="180" height="44" rx="12" fill="${color}"/>`;
      s += svgTexto(r.titulo || "", 390, y, { max: 20, tam: 12, color: "#fff", peso: "700" });

      (r.hijos || []).slice(0, 3).forEach((h, j) => {
        const hy = y - 14 + j * 17;
        s += `<circle cx="496" cy="${hy}" r="3" fill="${color}"/>`;
        s += `<text x="506" y="${hy}" font-family="Nunito, sans-serif" font-size="10.5" fill="#4A6A85" dominant-baseline="middle">${escapeHtml(String(h).slice(0, 26))}</text>`;
      });
    });
    return `<svg viewBox="0 0 600 ${alto}" width="100%" role="img">${s}</svg>`;
  }

  function dibujarLineaTiempo(d) {
    const hitos = (d.hitos || []).slice(0, 7);
    if (!hitos.length) return "";
    const filaAlto = 78;
    const alto = 40 + hitos.length * filaAlto;
    const x = 92;

    let s = `<line x1="${x}" y1="30" x2="${x}" y2="${alto - 30}" stroke="#DCEEFC" stroke-width="4" stroke-linecap="round"/>`;
    hitos.forEach((h, i) => {
      const color = DIAG.colores[i % DIAG.colores.length];
      const y = 40 + i * filaAlto + 20;
      s += `<circle cx="${x}" cy="${y}" r="11" fill="${color}"/>`;
      s += `<text x="${x - 24}" y="${y}" text-anchor="end" font-family="Grandstander, sans-serif" font-size="13" font-weight="700" fill="${color}" dominant-baseline="middle">${escapeHtml(String(h.fecha || "").slice(0, 12))}</text>`;
      s += svgTexto(h.titulo || "", 120, y - (h.detalle ? 10 : 0), { max: 44, tam: 12.5, color: "#1F2937", peso: "700", ancla: "start", alto: 15 });
      if (h.detalle) {
        s += svgTexto(h.detalle, 120, y + 14, { max: 52, tam: 10.5, color: "#5b7d99", peso: "400", ancla: "start", alto: 13 });
      }
    });
    return `<svg viewBox="0 0 600 ${alto}" width="100%" role="img">${s}</svg>`;
  }

  function dibujarComparativo(d) {
    const cols = (d.columnas || []).slice(0, 3);
    const filas = (d.filas || []).slice(0, 6);
    if (!cols.length || !filas.length) return "";

    const anchoCriterio = 150;
    const anchoCol = (600 - anchoCriterio - 20) / cols.length;
    const filaAlto = 54;
    const alto = 54 + filas.length * filaAlto + 10;

    let s = "";
    // Encabezados
    cols.forEach((c, i) => {
      const cx = anchoCriterio + 10 + i * anchoCol + anchoCol / 2;
      const color = DIAG.colores[i % DIAG.colores.length];
      s += `<rect x="${anchoCriterio + 10 + i * anchoCol + 3}" y="8" width="${anchoCol - 6}" height="36" rx="10" fill="${color}"/>`;
      s += svgTexto(c, cx, 26, { max: 18, tam: 12, color: "#fff", peso: "700", alto: 13 });
    });

    filas.forEach((f, i) => {
      const y = 54 + i * filaAlto;
      if (i % 2 === 0) s += `<rect x="6" y="${y}" width="588" height="${filaAlto - 4}" rx="8" fill="#F7FAFD"/>`;
      s += svgTexto(f.criterio || "", 16, y + (filaAlto - 4) / 2, { max: 24, tam: 11.5, color: "#1E3A8A", peso: "700", ancla: "start", alto: 14 });
      (f.valores || []).slice(0, cols.length).forEach((v, j) => {
        const cx = anchoCriterio + 10 + j * anchoCol + anchoCol / 2;
        s += svgTexto(v, cx, y + (filaAlto - 4) / 2, { max: 26, tam: 11, color: "#2E4A63", peso: "400", alto: 13 });
      });
    });
    return `<svg viewBox="0 0 600 ${alto}" width="100%" role="img">${s}</svg>`;
  }

  function dibujarProceso(d) {
    const pasos = (d.pasos || []).slice(0, 6);
    if (!pasos.length) return "";
    const filaAlto = 76;
    const alto = 20 + pasos.length * filaAlto;

    let s = "";
    pasos.forEach((p, i) => {
      const color = DIAG.colores[i % DIAG.colores.length];
      const y = 16 + i * filaAlto;
      s += `<rect x="8" y="${y}" width="584" height="60" rx="14" fill="#fff" stroke="${color}" stroke-width="2"/>`;
      s += `<circle cx="44" cy="${y + 30}" r="17" fill="${color}"/>`;
      s += `<text x="44" y="${y + 30}" text-anchor="middle" font-family="Grandstander, sans-serif" font-size="15" font-weight="700" fill="#fff" dominant-baseline="middle">${i + 1}</text>`;
      s += svgTexto(p.titulo || "", 76, y + (p.detalle ? 21 : 30), { max: 52, tam: 12.5, peso: "700", ancla: "start", alto: 15 });
      if (p.detalle) s += svgTexto(p.detalle, 76, y + 42, { max: 62, tam: 10.5, color: "#5b7d99", peso: "400", ancla: "start", alto: 13 });
      // Flecha al siguiente
      if (i < pasos.length - 1) {
        s += `<path d="M300 ${y + 60} l0 10 m-5 -5 l5 5 l5 -5" stroke="#B9CFE4" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
      }
    });
    return `<svg viewBox="0 0 600 ${alto}" width="100%" role="img">${s}</svg>`;
  }

  function dibujarCiclo(d) {
    const etapas = (d.etapas || []).slice(0, 6);
    if (etapas.length < 2) return "";
    const size = 420;
    const cx = 300, cy = size / 2, r = 130;

    let s = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#DCEEFC" stroke-width="3" stroke-dasharray="7 7"/>`;
    etapas.forEach((e, i) => {
      const ang = (i / etapas.length) * 2 * Math.PI - Math.PI / 2;
      const x = cx + r * Math.cos(ang);
      const y = cy + r * Math.sin(ang);
      const color = DIAG.colores[i % DIAG.colores.length];
      s += `<circle cx="${x}" cy="${y}" r="46" fill="${color}"/>`;
      s += svgTexto(e.titulo || "", x, y, { max: 12, tam: 10.5, color: "#fff", peso: "700", alto: 12 });
      // Flecha hacia la siguiente etapa
      const angF = ((i + 0.5) / etapas.length) * 2 * Math.PI - Math.PI / 2;
      const fx = cx + (r + 2) * Math.cos(angF);
      const fy = cy + (r + 2) * Math.sin(angF);
      s += `<circle cx="${fx}" cy="${fy}" r="7" fill="#B9CFE4"/>`;
      s += `<text x="${fx}" y="${fy}" text-anchor="middle" font-size="9" fill="#fff" font-weight="700" dominant-baseline="middle">›</text>`;
    });
    return `<svg viewBox="0 0 600 ${size}" width="100%" role="img">${s}</svg>`;
  }

  function dibujarJerarquia(d) {
    const niveles = (d.niveles || []).slice(0, 4);
    if (!niveles.length) return "";
    const anchoCaja = Math.min(170, (600 - 40) / niveles.length - 12);
    const paso = (600 - 40) / niveles.length;
    let maxHijos = 0;
    niveles.forEach((n) => (maxHijos = Math.max(maxHijos, (n.hijos || []).length)));
    const alto = 150 + maxHijos * 26;

    let s = `<rect x="${300 - 110}" y="14" width="220" height="52" rx="14" fill="#1E3A8A"/>`;
    s += svgTexto(d.raiz || "", 300, 40, { max: 22, tam: 13.5, color: "#fff", peso: "700" });

    niveles.forEach((n, i) => {
      const color = DIAG.colores[(i + 1) % DIAG.colores.length];
      const cx = 20 + i * paso + paso / 2;
      s += `<path d="M300 66 C 300 92, ${cx} 92, ${cx} 110" stroke="${color}" stroke-width="2.5" fill="none"/>`;
      s += `<rect x="${cx - anchoCaja / 2}" y="110" width="${anchoCaja}" height="42" rx="11" fill="${color}"/>`;
      s += svgTexto(n.titulo || "", cx, 131, { max: 16, tam: 11, color: "#fff", peso: "700", alto: 12 });
      (n.hijos || []).slice(0, 4).forEach((h, j) => {
        s += `<text x="${cx}" y="${168 + j * 22}" text-anchor="middle" font-family="Nunito, sans-serif" font-size="10.5" fill="#4A6A85">${escapeHtml(String(h).slice(0, 22))}</text>`;
      });
    });
    return `<svg viewBox="0 0 600 ${alto}" width="100%" role="img">${s}</svg>`;
  }

  function dibujarPartes(d) {
    const partes = (d.partes || []).slice(0, 6);
    if (!partes.length) return "";
    const filaAlto = 50;
    const alto = 60 + partes.length * filaAlto;

    let s = `<rect x="8" y="8" width="584" height="42" rx="12" fill="#1E3A8A"/>`;
    s += svgTexto(d.todo || "", 300, 29, { max: 40, tam: 13.5, color: "#fff", peso: "700" });

    partes.forEach((p, i) => {
      const color = DIAG.colores[(i + 1) % DIAG.colores.length];
      const y = 62 + i * filaAlto;
      s += `<rect x="8" y="${y}" width="584" height="${filaAlto - 8}" rx="11" fill="#fff" stroke="#DCEEFC" stroke-width="1.5"/>`;
      s += `<rect x="8" y="${y}" width="6" height="${filaAlto - 8}" rx="3" fill="${color}"/>`;
      s += svgTexto(p.nombre || "", 24, y + (filaAlto - 8) / 2, { max: 20, tam: 12, color: color, peso: "700", ancla: "start", alto: 13 });
      s += svgTexto(p.funcion || "", 190, y + (filaAlto - 8) / 2, { max: 56, tam: 10.5, color: "#4A6A85", peso: "400", ancla: "start", alto: 13 });
    });
    return `<svg viewBox="0 0 600 ${alto}" width="100%" role="img">${s}</svg>`;
  }

  /**
   * Devuelve el HTML del diagrama, o "" si no hay uno válido.
   * Cada tipo de diagrama tiene su propio dibujante; si el generador manda
   * un tipo que no conocemos, simplemente no se dibuja nada.
   */
  function dibujarDiagrama(diagrama) {
    if (!diagrama || !diagrama.tipo) return "";
    const d = diagrama.datos || {};
    const dibujantes = {
      mapa_mental: dibujarMapaMental,
      linea_tiempo: dibujarLineaTiempo,
      comparativo: dibujarComparativo,
      proceso: dibujarProceso,
      ciclo: dibujarCiclo,
      jerarquia: dibujarJerarquia,
      partes: dibujarPartes,
    };
    const fn = dibujantes[diagrama.tipo];
    if (!fn) return "";

    let svg = "";
    try {
      svg = fn(d);
    } catch (err) {
      return ""; // un diagrama mal formado nunca debe tumbar la vista del tema
    }
    if (!svg) return "";

    return `
      <div class="diagrama-caja">
        ${diagrama.titulo ? `<h3 class="bloque-titulo" style="margin-bottom:10px;">${escapeHtml(diagrama.titulo)}</h3>` : ""}
        <div class="diagrama-scroll">${svg}</div>
      </div>`;
  }

  /**
   * Los temas creados ANTES del rediseño tienen `resumen` como un string de
   * texto corrido; los nuevos lo traen partido en secciones. Estas dos
   * funciones dejan todo en la forma nueva, para que un alumno que abra un
   * tema viejo de la liga lo siga viendo bien.
   */
  function normalizarResumen(resumen) {
    const vacio = { que_es: "", secciones: [], pasos: [], ideas_clave: [], ojo_aqui: "", truco: "" };
    if (!resumen) return vacio;
    if (typeof resumen === "string") return { ...vacio, que_es: resumen };
    return {
      que_es: resumen.que_es || "",
      secciones: Array.isArray(resumen.secciones) ? resumen.secciones.filter((s) => s && (s.titulo || s.texto)) : [],
      pasos: Array.isArray(resumen.pasos) ? resumen.pasos.filter(Boolean) : [],
      ideas_clave: Array.isArray(resumen.ideas_clave) ? resumen.ideas_clave.filter(Boolean) : [],
      ojo_aqui: resumen.ojo_aqui || "",
      truco: resumen.truco || "",
    };
  }

  function textoResumenCorto(resumen) {
    const t = normalizarResumen(resumen).que_es || "";
    return t.length > 110 ? t.slice(0, 110) + "…" : t;
  }

  let temaAbiertoIdx = 0; // para poder re-renderizar el mismo tema al "Intentar de nuevo"

  function mostrarTema(idx) {
    temaAbiertoIdx = idx;
    const tema = temasActuales[idx];
    const c = tema.contenido || {};
    const cont = document.getElementById("contenido");

    const actividadesHtml = c.actividades
      ? c.actividades
          .map(
            (a) => `
        <div class="actividad-box">
          <span class="inteligencia">${escapeHtml(ETIQUETAS_INTELIGENCIA[a.inteligencia] || a.inteligencia)}</span>
          <div style="font-weight:700; margin-bottom:4px;">${formatearTexto(a.titulo || "")}</div>
          <div style="font-size:0.92rem; line-height:1.5;">${formatearTexto(a.instrucciones || "")}</div>
        </div>
      `
          )
          .join("")
      : c.actividad
      ? `
        <div class="actividad-box">
          <div style="font-weight:700; margin-bottom:4px;">${formatearTexto(c.actividad.titulo || "")}</div>
          <div style="font-size:0.92rem; line-height:1.5;">${formatearTexto(c.actividad.instrucciones || "")}</div>
        </div>
      `
      : "";

    const triviaHtml = (c.trivia || [])
      .map(
        (p, i) => `
      <div class="trivia-item" data-correcta="${escapeHtml(p.respuesta_correcta || "")}" data-pregunta="${escapeHtml(p.pregunta || "")}">
        <div class="trivia-pregunta"><span class="trivia-num">${i + 1}</span> ${formatearTexto(p.pregunta || "")}</div>
        ${
          p.opciones?.length
            ? `<div class="opciones">${p.opciones
                .map((o) => `<button type="button" class="opcion-btn" data-valor="${escapeHtml(o)}">${formatearTexto(o)}</button>`)
                .join("")}</div>`
            : `<textarea class="respuesta-abierta" rows="3" placeholder="Escribe tu respuesta aquí…"></textarea>`
        }
        <div class="trivia-feedback" style="display:none;"></div>
      </div>
    `
      )
      .join("");

    const materialExtraHtml = (c.material_extra || [])
      .map(
        (m) => `
      <div class="material-extra-box">
        <div style="font-weight:700; text-transform:capitalize; margin-bottom:4px;">${escapeHtml(m.tipo || "")}</div>
        <div style="font-size:0.92rem; line-height:1.5; white-space:pre-line;">${formatearTexto(m.contenido || "")}</div>
      </div>
    `
      )
      .join("");

    const r = c.respuestas || {};
    const respuestasHtml = `
      ${
        r.trivia_resuelta?.length
          ? `<h3 style="margin-top:0;">Respuestas de la trivia</h3>` +
            r.trivia_resuelta.map((rt) => `<p style="margin:4px 0;"><strong>${escapeHtml(rt.pregunta)}</strong> — ${escapeHtml(rt.respuesta)}</p>`).join("")
          : ""
      }
      ${r.solucion_actividad ? `<h3>Solución de la actividad</h3><p style="margin:0;">${escapeHtml(r.solucion_actividad)}</p>` : ""}
      ${
        r.conceptos_clave?.length
          ? `<h3>Conceptos clave</h3><ul>${r.conceptos_clave.map((k) => `<li>${escapeHtml(k)}</li>`).join("")}</ul>`
          : ""
      }
      ${r.autoevaluacion ? `<h3>Autoevaluación</h3><p style="margin:0;">${escapeHtml(r.autoevaluacion)}</p>` : ""}
    `;

    const res = normalizarResumen(c.resumen);
    const ejercicios = c.ejercicios || [];

    const estudiarHtml = `
      ${res.que_es ? `<div class="bloque-est destacado"><p>${formatearTexto(res.que_es)}</p></div>` : ""}
      ${dibujarDiagrama(c.diagrama)}
      ${res.secciones
        .map(
          (s) => `
        <div class="bloque-est">
          ${s.titulo ? `<h3 class="bloque-titulo">${formatearTexto(s.titulo)}</h3>` : ""}
          <p>${formatearTexto(s.texto || "")}</p>
        </div>`
        )
        .join("")}
      ${
        res.pasos.length
          ? `<div class="bloque-est"><h3 class="bloque-titulo">🧭 Paso a paso</h3>
             <ol class="lista-pasos">${res.pasos.map((p) => `<li>${formatearTexto(p)}</li>`).join("")}</ol></div>`
          : ""
      }
      ${
        res.ideas_clave.length
          ? `<div class="bloque-est"><h3 class="bloque-titulo">⭐ Lo que no se te puede olvidar</h3>
             <ul class="lista-ideas">${res.ideas_clave.map((k) => `<li>${formatearTexto(k)}</li>`).join("")}</ul></div>`
          : ""
      }
      ${res.ojo_aqui ? `<div class="caja-ojo"><strong>⚠️ Ojo aquí</strong><p>${formatearTexto(res.ojo_aqui)}</p></div>` : ""}
      ${res.truco ? `<div class="caja-truco"><strong>🎯 Truco para recordarlo</strong><p>${formatearTexto(res.truco)}</p></div>` : ""}
      ${
        c.esquema_visual
          ? `<details class="bloque-est plegable"><summary>Ver el esquema completo</summary>
             <p style="white-space:pre-line; margin-top:8px;">${formatearTexto(c.esquema_visual)}</p></details>`
          : ""
      }
    `;

    const ejerciciosHtml = ejercicios
      .map(
        (e, i) => `
      <div class="ejercicio">
        <div class="ejercicio-cabeza">
          <span class="ejercicio-num">${i + 1}</span>
          <p class="ejercicio-enunciado">${formatearTexto(e.enunciado || "")}</p>
        </div>
        ${
          e.pista
            ? `<button type="button" class="btn-pista" data-ej="${i}">💡 Ver pista</button>
               <div class="pista-caja" id="pista-${i}" style="display:none;">${formatearTexto(e.pista)}</div>`
            : ""
        }
        <button type="button" class="btn-solucion" data-ej="${i}">Ver solución</button>
        <div class="solucion-caja" id="solucion-${i}" style="display:none;">
          ${(e.pasos || []).length ? `<ol class="lista-pasos">${e.pasos.map((p) => `<li>${formatearTexto(p)}</li>`).join("")}</ol>` : ""}
          ${e.respuesta ? `<div class="ejercicio-respuesta">✅ ${formatearTexto(e.respuesta)}</div>` : ""}
        </div>
        <label class="ejercicio-marcar">
          <input type="checkbox" class="chk-ejercicio-resuelto" data-ej="${i}">
          ✓ Ya la resolví
        </label>
      </div>`
      )
      .join("");

    const practicarHtml = `
      ${
        ejerciciosHtml
          ? `<p class="ayuda" style="margin:0 0 14px;">Resuélvelos en tu cuaderno primero. La solución trae el procedimiento completo para que puedas ver <em>en qué paso</em> te trabaste.</p>${ejerciciosHtml}
             <button class="secundario btn-guardar-progreso" id="btn-guardar-progreso">💾 Guardar mi progreso</button>
             <div class="progreso-aviso" id="progreso-aviso" style="display:none;"></div>`
          : ""
      }
      ${
        actividadesHtml
          ? `<h2 style="margin-top:${ejerciciosHtml ? "22px" : "0"};">✏️ Actividad${c.actividades ? "es (elige la de tu tipo de inteligencia)" : ""}</h2>${actividadesHtml}`
          : ""
      }
      ${!ejerciciosHtml && !actividadesHtml ? `<p class="ayuda">Este tema no trae ejercicios.</p>` : ""}
    `;

    const repasarHtml = `
      ${
        triviaHtml
          ? `<h2 style="margin-top:0;">🧠 Trivia</h2>
             <p class="ayuda" style="margin:0 0 12px;">Elige tu respuesta en cada pregunta y luego dale a "Revisar mis respuestas".</p>
             ${triviaHtml}
             <div id="trivia-resumen" style="display:none;"></div>
             <button class="primario" id="btn-revisar-trivia">Revisar mis respuestas</button>`
          : ""
      }
      ${materialExtraHtml ? `<h2 style="margin-top:${triviaHtml ? "24px" : "0"};">📎 Material extra</h2>${materialExtraHtml}` : ""}
      <div class="respuestas-toggle" style="margin-top:20px;"><button class="secundario" id="btn-respuestas">Ver respuestas</button></div>
      <div class="respuestas-box" id="caja-respuestas">${respuestasHtml}</div>
    `;

    const nEj = ejercicios.length;

    // Modo Examen (simulador puro, 31-ago-2026, ver agents/combinarTemas.js)
    // deja el resumen vacío A PROPÓSITO — sin esto, "Estudiar" se abriría
    // por default mostrando un panel completamente en blanco. Si no hay
    // nada que exponer, ni siquiera se muestra esa pestaña, y se arranca
    // directo en Practicar (o Repasar si el simulador es solo trivia).
    const resumenVacio =
      !res.que_es && !res.secciones.length && !res.pasos.length && !res.ideas_clave.length &&
      !res.ojo_aqui && !res.truco && !c.diagrama && !c.esquema_visual;
    const tabInicial = resumenVacio ? (nEj ? "practicar" : "repasar") : "estudiar";

    cont.innerHTML = `
      <a class="volver" href="javascript:void(0)" id="btn-volver">← Volver a la liga</a>
      <div class="tarjeta">
        <h1>📘 ${escapeHtml(c.tema || tema.titulo)}</h1>
        <div class="pestanas">
          ${
            resumenVacio
              ? ""
              : `<button class="pestana${tabInicial === "estudiar" ? " activa" : ""}" data-panel="estudiar">📖 Estudiar</button>`
          }
          <button class="pestana${tabInicial === "practicar" ? " activa" : ""}" data-panel="practicar">✏️ Practicar${nEj ? ` <span class="pestana-num">${nEj}</span>` : ""}</button>
          <button class="pestana${tabInicial === "repasar" ? " activa" : ""}" data-panel="repasar">🔁 Repasar</button>
        </div>
        <div class="panel" id="panel-estudiar" style="${tabInicial === "estudiar" ? "" : "display:none;"}">${estudiarHtml}</div>
        <div class="panel" id="panel-practicar" style="${tabInicial === "practicar" ? "" : "display:none;"}">${practicarHtml}</div>
        <div class="panel" id="panel-repasar" style="${tabInicial === "repasar" ? "" : "display:none;"}">${repasarHtml}</div>
        ${tema.pdf_url ? `<a href="${escapeHtml(tema.pdf_url)}" target="_blank" style="text-decoration:none;"><button class="secundario" style="margin-top:18px; width:100%;">📄 Descargar imprimible (PDF)</button></a>` : ""}
      </div>
    `;

    document.querySelectorAll(".pestana").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".pestana").forEach((b) => b.classList.toggle("activa", b === btn));
        ["estudiar", "practicar", "repasar"].forEach((p) => {
          document.getElementById("panel-" + p).style.display = p === btn.dataset.panel ? "" : "none";
        });
      });
    });

    document.querySelectorAll(".btn-pista").forEach((btn) => {
      btn.addEventListener("click", () => {
        const caja = document.getElementById("pista-" + btn.dataset.ej);
        caja.style.display = caja.style.display === "none" ? "block" : "none";
        btn.textContent = caja.style.display === "none" ? "💡 Ver pista" : "💡 Ocultar pista";
      });
    });

    document.querySelectorAll(".btn-solucion").forEach((btn) => {
      btn.addEventListener("click", () => {
        const caja = document.getElementById("solucion-" + btn.dataset.ej);
        const abierta = caja.style.display !== "none";
        caja.style.display = abierta ? "none" : "block";
        btn.textContent = abierta ? "Ver solución" : "Ocultar solución";
        btn.classList.toggle("abierta", !abierta);
      });
    });

    document.getElementById("btn-volver").addEventListener("click", mostrarListaTemas);
    document.getElementById("btn-respuestas").addEventListener("click", () => {
      const caja = document.getElementById("caja-respuestas");
      caja.classList.toggle("abierto");
    });

    document.querySelectorAll(".opcion-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        const item = btn.closest(".trivia-item");
        if (item.classList.contains("revisado")) return;
        item.querySelectorAll(".opcion-btn").forEach((b) => b.classList.remove("seleccionada"));
        btn.classList.add("seleccionada");
      });
    });
    const btnRevisarTrivia = document.getElementById("btn-revisar-trivia");
    if (btnRevisarTrivia) btnRevisarTrivia.addEventListener("click", revisarTrivia);

    const btnGuardarProgreso = document.getElementById("btn-guardar-progreso");
    if (btnGuardarProgreso) btnGuardarProgreso.addEventListener("click", guardarEjerciciosMarcados);
  }

  init();
</script>
</body>
</html>
