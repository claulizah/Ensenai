      cargarPerfiles();
    } catch (err) {
      alert("Error: " + mensajeErrorAmigable(err));
    }
  }

  function parsearEtiquetas(texto) {
    return (texto || "")
      .split(",")
      .map((e) => e.trim())
      .filter(Boolean);
  }

  // ── Fotos de resumen/apuntes ────────────────────────────────────────────
  // Las fotos de celular son enormes (4-8 MB) y viajan como base64 dentro
  // del JSON, así que las reducimos en el navegador ANTES de subirlas: el
  // lado largo se limita a 1400px y se recomprimen como JPEG. Con eso una
  // foto de apuntes queda en ~200-400 KB y sigue siendo perfectamente
  // legible para el generador, sin que la subida tarde en datos móviles.
  const MAX_FOTOS = 3;
  const LADO_MAX = 1400;
  let fotosSeleccionadas = [];

  function comprimirImagen(file) {
    return new Promise((resolve, reject) => {
      const lector = new FileReader();
      lector.onerror = () => reject(new Error("No se pudo leer la imagen."));
      lector.onload = () => {
        const img = new Image();
        img.onerror = () => reject(new Error("Ese archivo no parece ser una imagen válida."));
        img.onload = () => {
          const escala = Math.min(1, LADO_MAX / Math.max(img.width, img.height));
          const canvas = document.createElement("canvas");
          canvas.width = Math.round(img.width * escala);
          canvas.height = Math.round(img.height * escala);
          canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL("image/jpeg", 0.82));
        };
        img.src = lector.result;
      };
      lector.readAsDataURL(file);
    });
  }

  function pintarMiniaturas() {
    const cont = document.getElementById("miniaturas-fotos");
    if (!cont) return;
    cont.innerHTML = fotosSeleccionadas
      .map(
        (src, i) => `
        <div class="miniatura">
          <img src="${src}" alt="Foto ${i + 1}">
          <button type="button" data-quitar-foto="${i}" title="Quitar">✕</button>
        </div>`
      )
      .join("");
    cont.querySelectorAll("[data-quitar-foto]").forEach((btn) => {
      btn.addEventListener("click", () => {
        fotosSeleccionadas.splice(Number(btn.dataset.quitarFoto), 1);
        pintarMiniaturas();
      });
    });
  }

  async function alElegirFotos(ev) {
    const resultado = document.getElementById("resultado-generar");
    const archivos = [...ev.target.files].filter((f) => f.type.startsWith("image/"));
    ev.target.value = ""; // permite volver a elegir el mismo archivo

    for (const archivo of archivos) {
      if (fotosSeleccionadas.length >= MAX_FOTOS) {
        if (resultado) resultado.innerHTML = `<div class="error">Puedes subir hasta ${MAX_FOTOS} fotos.</div>`;
        break;
      }
      try {
        fotosSeleccionadas.push(await comprimirImagen(archivo));
      } catch (err) {
        if (resultado) resultado.innerHTML = `<div class="error">${escapeHtml(mensajeErrorAmigable(err))}</div>`;
      }
    }
    pintarMiniaturas();
  }

  // ── Revisar un ejercicio resuelto ────────────────────────────────────────
  // Distinto de las fotos de arriba: aquellas son contexto para GENERAR
  // material nuevo (apuntes, resumen); estas son de un ejercicio que la
  // persona ya resolvió, para que le digamos en qué paso se equivocó.
  // Mismo compresor de imágenes, límite y mecánica de miniaturas.
  const MAX_FOTOS_REVISION = 3;
  let fotosRevision = [];

  function pintarMiniaturasRevision() {
    const cont = document.getElementById("miniaturas-fotos-revision");
    if (!cont) return;
    cont.innerHTML = fotosRevision
      .map(
        (src, i) => `
        <div class="miniatura">
          <img src="${src}" alt="Foto ${i + 1}">
          <button type="button" data-quitar-foto-revision="${i}" title="Quitar">✕</button>
        </div>`
      )
      .join("");
    cont.querySelectorAll("[data-quitar-foto-revision]").forEach((btn) => {
      btn.addEventListener("click", () => {
        fotosRevision.splice(Number(btn.dataset.quitarFotoRevision), 1);
        pintarMiniaturasRevision();
      });
    });
  }

  async function alElegirFotosRevision(ev) {
    const resultado = document.getElementById("resultado-revision");
    const archivos = [...ev.target.files].filter((f) => f.type.startsWith("image/"));
    ev.target.value = "";

    for (const archivo of archivos) {
      if (fotosRevision.length >= MAX_FOTOS_REVISION) {
        if (resultado) resultado.innerHTML = `<div class="error">Puedes subir hasta ${MAX_FOTOS_REVISION} fotos.</div>`;
        break;
      }
      try {
        fotosRevision.push(await comprimirImagen(archivo));
      } catch (err) {
        if (resultado) resultado.innerHTML = `<div class="error">${escapeHtml(mensajeErrorAmigable(err))}</div>`;
      }
    }
    pintarMiniaturasRevision();
  }

  /** Manda las fotos del ejercicio ya resuelto a revisión. Necesita que el
   * backend tenga POST /api/temas/revisar — mientras no exista, el 404 se
   * muestra como error amigable en vez de trabarse en silencio. Respuesta
   * esperada: { veredicto, pasos: [{ numero, correcto, comentario }] }. */
  async function revisarEjercicio() {
    const resultado = document.getElementById("resultado-revision");
    resultado.innerHTML = "";

    if (fotosRevision.length === 0) {
      resultado.innerHTML = `<div class="error">Sube al menos una foto del ejercicio resuelto.</div>`;
      return;
    }

    iniciarTips(resultado, "Revisando tu ejercicio paso por paso…");

    try {
      const res = await fetchConReintento(
        `${API_BASE}/api/temas/revisar`,
        {
          method: "POST",
          headers: { "Content-Type": "application/json", Authorization: `Bearer ${sesionActual.access_token}` },
          body: JSON.stringify({ imagenes: fotosRevision }),
        },
        null,
        null
      );
      const data = await res.json();
      detenerTips();

      if (res.status === 402) {
        resultado.innerHTML = `
          <div class="error">${escapeHtml(data.error)}</div>
          <a href="comprador.html?cuenta=1" style="display:block; text-decoration:none;"><button class="primario">Ver mi plan / mejorar plan</button></a>
        `;
        return;
      }
      if (!res.ok) throw new Error(data.error || "No se pudo revisar el ejercicio.");

      const pasos = data.pasos || [];
      resultado.innerHTML = `
        <div class="aviso">✓ Ejercicio revisado.</div>
        ${data.veredicto ? `<p style="font-weight:700;">${escapeHtml(data.veredicto)}</p>` : ""}
        ${pasos
          .map(
            (p) => `
          <div class="trivia-feedback ${p.correcto ? "bien" : "mal"}" style="margin-bottom:8px;">
            <strong>${p.correcto ? "✓" : "✗"} Paso ${escapeHtml(String(p.numero ?? ""))}:</strong> ${escapeHtml(p.comentario || "")}
          </div>`
          )
          .join("")}
      `;
      fotosRevision = [];
      pintarMiniaturasRevision();
    } catch (err) {
      detenerTips();
      resultado.innerHTML = `<div class="error">${escapeHtml(mensajeErrorAmigable(err))}</div>`;
    }
  }

  // ── Generación por trabajo en segundo plano ────────────────────────────
  // Antes, generar un tema era UN fetch que se quedaba abierto 40-90 s. En
  // celular eso se rompe solo: al bloquear la pantalla o cambiarse de app,
  // iOS/Android suspende la pestaña y mata la conexión — el material se
  // generaba y se guardaba del otro lado, pero aquí llegaba un error y la
  // persona creía haber perdido su tema del mes (reporte sep-2026).
  //
  // Ahora el POST solo ENCOLA y contesta en menos de un segundo; el
  // resultado se recoge preguntando cada pocos segundos. Perder la red un
  // rato ya no cancela nada: el sondeo simplemente reintenta al volver.
  const LS_TRABAJO = "ensenai:trabajo-tema";
  const MS_ENTRE_SONDEOS = 3000;
  const MS_MAX_ESPERA = 8 * 60 * 1000; // muy por encima del peor caso real
  const MS_VIDA_TRABAJO_RECORDADO = 30 * 60 * 1000;

  let sondeo = null; // { trabajoId, tema, minimizada, inicio, timer, activo }

  function nuevaClaveCliente() {
    try {
      if (crypto?.randomUUID) return crypto.randomUUID();
    } catch (err) {
      /* navegadores viejos o contextos sin crypto: el fallback alcanza */
    }
    return `c-${Date.now()}-${Math.random().toString(16).slice(2)}`;
  }

  // El id del trabajo se guarda en localStorage para sobrevivir a que la
  // pestaña se descarte por completo (iOS lo hace con poca memoria): al
  // volver a abrir, la app retoma el mismo trabajo en vez de perderlo.
  function recordarTrabajo(trabajoId, tema) {
    try {
      localStorage.setItem(LS_TRABAJO, JSON.stringify({ trabajoId, tema, ts: Date.now() }));
    } catch (err) {
      /* modo privado o storage lleno: se pierde la reanudación, nada más */
    }
  }

  function olvidarTrabajo() {
    try {
      localStorage.removeItem(LS_TRABAJO);
    } catch (err) {
      /* sin consecuencias */
    }
  }

  function trabajoRecordado() {
    try {
      const guardado = JSON.parse(localStorage.getItem(LS_TRABAJO) || "null");
      if (!guardado?.trabajoId) return null;
      if (Date.now() - (guardado.ts || 0) > MS_VIDA_TRABAJO_RECORDADO) {
        olvidarTrabajo();
        return null;
      }
      return guardado;
    } catch (err) {
      return null;
    }
  }

  function etapasDeEspera(conFotos) {
    // Estimadas (no vienen del backend en tiempo real). El backend hace, en
    // orden: generar el material completo y luego una revisión de calidad
    // que a veces vuelve a generar desde cero (ver utils/revisorCalidad.js)
    // — por eso la última etapa se queda fija mientras eso termina.
    return conFotos
      ? [
          { ms: 0, texto: "Leyendo tus fotos…" },
          { ms: 6000, texto: "Armando la explicación de tu tema…" },
          { ms: 14000, texto: "Armando los ejercicios y la trivia…" },
          { ms: 23000, texto: "Preparando el material extra (memorama, flashcards, tarjetas)…" },
          { ms: 33000, texto: "Haciendo una última revisión de calidad…" },
          { ms: 45000, texto: "Ya casi — puliendo los últimos detalles…" },
        ]
      : [
          { ms: 0, texto: "Leyendo tu tema y armando la explicación…" },
          { ms: 8000, texto: "Armando los ejercicios y la trivia…" },
          { ms: 17000, texto: "Preparando el material extra (memorama, flashcards, tarjetas)…" },
          { ms: 27000, texto: "Haciendo una última revisión de calidad…" },
          { ms: 39000, texto: "Ya casi — puliendo los últimos detalles…" },
        ];
  }

  function detenerSondeo() {
    if (sondeo?.timer) clearTimeout(sondeo.timer);
    sondeo = null;
  }

  /**
   * Empieza (o retoma) el seguimiento de un trabajo ya encolado.
   * `mostrarEspera` en false = se retomó en segundo plano (por ejemplo al
   * volver a abrir la app): no se le secuestra la pantalla, solo se le
   * avisa con el globito flotante.
   */
  function seguirTrabajo(trabajoId, tema, { minimizada = false, mostrarEspera = true, conFotos = false } = {}) {
    detenerSondeo();
    sondeo = { trabajoId, tema, minimizada, inicio: Date.now(), timer: null, activo: true };
    generacionEnCurso = { tema, trabajoId, minimizada };
    recordarTrabajo(trabajoId, tema);

    const zona = document.getElementById("resultado-generar");
    if (mostrarEspera && !minimizada && zona) {
      iniciarTips(zona, etapasDeEspera(conFotos), {
        texto: "Seguir navegando mientras se genera →",
        onClick: () => {
          if (!sondeo) return;
          sondeo.minimizada = true;
          if (generacionEnCurso) generacionEnCurso.minimizada = true;
          detenerTips();
          const z = document.getElementById("resultado-generar");
          if (z) z.innerHTML = "";
          mostrarAvisoGeneracion({ estado: "generando", texto: `⏳ Generando "${tema}"…` });
        },
      });
    } else {
      sondeo.minimizada = true;
      generacionEnCurso.minimizada = true;
      mostrarAvisoGeneracion({ estado: "generando", texto: `⏳ Generando "${tema}"…` });
    }

    sondearTrabajo();
  }

  async function sondearTrabajo() {
    if (!sondeo?.activo) return;
    const actual = sondeo;
    try {
      // fetch pelón a propósito: fetchConReintento está pensado para
      // peticiones que se contestan una vez, y aquí un error de red es lo
      // ESPERADO (pantalla bloqueada, elevador, cambio de wifi). No es un
      // fallo: se vuelve a preguntar en el siguiente ciclo.
      const res = await fetch(`${API_BASE}/api/temas/trabajos/${actual.trabajoId}`, {
        headers: { Authorization: `Bearer ${sesionActual.access_token}` },
      });
      if (res.status === 404) {
        return terminarTrabajoConFallo("No encontramos esa generación. Revisa tu historial antes de volver a intentar.");
      }
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "No pudimos consultar tu generación.");
      if (!sondeo || sondeo !== actual) return; // se canceló mientras respondía
      if (data.estado === "listo") return terminarTrabajoConExito(data.resultado);
      if (data.estado === "fallido") return terminarTrabajoConFallo(data.error || "No se pudo generar el material.");
    } catch (err) {
      /* sin red: se reintenta en el siguiente ciclo, sin molestar al usuario */
    }

    if (!sondeo || sondeo !== actual) return;
    if (Date.now() - actual.inicio > MS_MAX_ESPERA) {
      return terminarTrabajoConFallo(
        "Esto está tardando más de lo normal. Revisa tu historial en un momento — puede que el material ya esté ahí."
      );
    }
    actual.timer = setTimeout(sondearTrabajo, MS_ENTRE_SONDEOS);
  }

  function terminarTrabajoConExito(data) {
    const minimizada = sondeo?.minimizada;
    const tema = sondeo?.tema || "";
    detenerSondeo();
    olvidarTrabajo();
    generacionEnCurso = null;
    detenerTips();

    const zona = document.getElementById("resultado-generar");
    const inline = !minimizada && !!zona;
    if (inline) {
      quitarAvisoGeneracion();
      mostrarTemaGenerado(data.contenido, data.tema_id, null, data.gamificacion);
    } else {
      // Se quedó en segundo plano: no la sacamos de donde esté, solo le
      // avisamos. El historial se refresca para que ya aparezca ahí.
      mostrarAvisoGeneracion({
        estado: "listo",
        texto: `✨ "${data.contenido?.tema || tema}" ya está listo`,
        accionTexto: "Verlo",
        onAccion: () => mostrarTemaGenerado(data.contenido, data.tema_id, null, data.gamificacion),
      });
      if (document.getElementById("lista-historial")) cargarHistorial();
    }
  }

  function terminarTrabajoConFallo(msg) {
    const minimizada = sondeo?.minimizada;
    const tema = sondeo?.tema || "";
    detenerSondeo();
    olvidarTrabajo();
    generacionEnCurso = null;
    detenerTips();

    const zona = document.getElementById("resultado-generar");
    if (!minimizada && zona) {
      quitarAvisoGeneracion();
      zona.innerHTML = `<div class="error">${escapeHtml(msg)}</div>`;
    } else {
      mostrarAvisoGeneracion({ estado: "falla", texto: `"${tema}": ${msg}` });
    }
  }

  // Volver a primer plano (desbloquear el celular, regresar a la pestaña)
  // dispara una consulta inmediata: si el material se terminó mientras la
  // pantalla estaba apagada, aparece de inmediato en vez de esperar el
  // siguiente ciclo. Lo mismo al recuperar la red.
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState !== "visible" || !sondeo?.activo) return;
    clearTimeout(sondeo.timer);
    sondearTrabajo();
  });
  window.addEventListener("online", () => {
    if (!sondeo?.activo) return;
    clearTimeout(sondeo.timer);
    sondearTrabajo();
  });

  /**
   * Al abrir la app: si quedó un trabajo a medias (se bloqueó el celular,
   * se cerró la pestaña, se recargó), se retoma en silencio. Sin esto, el
   * material terminaba guardándose en el historial sin que nadie avisara.
   */
  async function reanudarTrabajoPendiente() {
    const recordado = trabajoRecordado();
    if (recordado) {
      seguirTrabajo(recordado.trabajoId, recordado.tema, { mostrarEspera: false });
      return;
    }
    // Red de seguridad para cuando ni el id se alcanzó a guardar: se le
    // pregunta al servidor si dejó algo corriendo.
    try {
      const res = await fetch(`${API_BASE}/api/temas/trabajos/ultimo`, {
        headers: { Authorization: `Bearer ${sesionActual.access_token}` },
      });
      if (!res.ok) return;
      const { trabajo } = await res.json();
      if (!trabajo || !["pendiente", "generando"].includes(trabajo.estado)) return;
      seguirTrabajo(trabajo.trabajo_id, trabajo.titulo, { mostrarEspera: false });
    } catch (err) {
      /* sin conexión al abrir: no pasa nada, se reintenta al recargar */
    }
  }

  async function generarTema() {
    // Una sola generación a la vez (si no, la segunda pisaría la pantalla
    // de espera de la primera y se gastaría cupo doble).
    if (generacionEnCurso) {
      mostrarAvisoGeneracion({
        estado: "generando",
        texto: `⏳ Espera — "${generacionEnCurso.tema}" todavía se está generando`,
      });
      return;
    }

    const campoTema = document.getElementById("tema-input");
    const tema = campoTema.value.trim();
    const nivel = document.getElementById("nivel-input").value;
    const perfilId = document.getElementById("perfil-input").value || null;
    const detalles = document.getElementById("detalles-input").value.trim();
    const etiquetas = parsearEtiquetas(document.getElementById("etiquetas-input").value);
    const enfoque = document.getElementById("enfoque-psico-input")?.checked ? "psicoeducativo" : "escolar";
    const resultado = document.getElementById("resultado-generar");
    resultado.innerHTML = "";

    // El mensaje solo vivía aquí abajo, a media pantalla de distancia del
    // campo vacío: en celular la persona leía "escribe un tema", no veía
    // cuál campo faltaba, y acababa escribiendo el tema en Etiquetas
    // (reporte sep-2026). Ahora el error señala al campo y lo enfoca.
    if (!tema) {
      marcarCampoFaltante(campoTema, "Escribe sobre qué tema quieres generar material.");
      return;
    }
    limpiarCampoFaltante(campoTema);

    const conFotos = fotosSeleccionadas.length > 0;
    const cuerpo = JSON.stringify({
      tema,
      nivel,
      modo: "individual",
      perfilId,
      etiquetas,
      detalles,
      imagenes: fotosSeleccionadas,
      enfoque,
      // Idempotencia: si esta petición se reintenta (red intermitente,
      // doble tap), el servidor reconoce el mismo intento y no encola —ni
      // cobra— una segunda generación.
      claveCliente: nuevaClaveCliente(),
    });
    fotosSeleccionadas = []; // ya viajan en el cuerpo; no arrastrarlas al siguiente
    pintarMiniaturas(); // si no, se quedan las miniaturas de fotos ya enviadas

    iniciarTips(resultado, etapasDeEspera(conFotos), null);
    // Candado inmediato: entre el POST y la respuesta hay una ventana en
    // la que un segundo toque pasaria la guarda de arriba. El servidor
    // tambien lo rechaza (409), pero mejor ni llegar ahi.
    generacionEnCurso = { tema, minimizada: false };

    try {
      const res = await fetch(`${API_BASE}/api/temas/generar-async`, {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: `Bearer ${sesionActual.access_token}` },
        body: cuerpo,
      });
      const data = await res.json().catch(() => ({}));

      if (res.status === 402) {
        generacionEnCurso = null;
        detenerTips();
        resultado.innerHTML = `
          <div class="error">${escapeHtml(data.error || "Llegaste al límite de tu plan.")}</div>
          <a href="comprador.html?cuenta=1" style="display:block; text-decoration:none;"><button class="primario">Ver mi plan / mejorar plan</button></a>
        `;
        return;
      }
      // 409 = ya hay una generación de este usuario corriendo (por ejemplo
      // encolada desde otro dispositivo). Se engancha a esa en vez de
      // pelearse con ella.
      if (res.status === 409 && data.trabajo_id) {
        seguirTrabajo(data.trabajo_id, tema, { conFotos });
        return;
      }
      if (!res.ok || !data.trabajo_id) throw new Error(data.error || "No se pudo generar el material.");

      seguirTrabajo(data.trabajo_id, tema, { conFotos });
    } catch (err) {
      generacionEnCurso = null;
      detenerTips();
      resultado.innerHTML = `<div class="error">${escapeHtml(mensajeErrorAmigable(err))}</div>`;
    }
  }

  async function cargarHistorial() {
    const cont = document.getElementById("lista-historial");
    try {
      const res = await fetchConReintento(`${API_BASE}/api/temas/mios`, {
        headers: { Authorization: `Bearer ${sesionActual.access_token}` },
      }, cont);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "No se pudo cargar tu historial.");

      historialCache = data.temas || [];
      pintarHeroPerfil(); // "temas completados" sale de este cache
      etiquetaActiva = "";
      temasSeleccionados.clear();
      modoExamenActivo = false;

      // Si la persona navegó a otra pantalla mientras cargaba, estos nodos
      // ya no existen: sin esta guarda tronaba y el historial no se
      // refrescaba al terminar una generación en segundo plano.
      const filtros = document.getElementById("filtros-historial");
      const hint = document.getElementById("hint-combinar");
      if (!filtros || !hint || !document.body.contains(cont)) return;

      if (historialCache.length === 0) {
        filtros.style.display = "none";
        hint.style.display = "none";
        cont.innerHTML = `<p class="ayuda" style="margin:0;">Todavía no has generado ningún tema.</p>`;
        return;
      }
      hint.style.display = historialCache.length >= 2 ? "block" : "none";

      // Solo mostramos los filtros si hay al menos una etiqueta usada en
      // todo el historial — si nadie ha etiquetado nada todavía, no tiene
      // caso mostrar chips vacíos.
      const hayEtiquetas = historialCache.some((t) => (t.etiquetas || []).length);
      filtros.style.display = historialCache.length > 3 || hayEtiquetas ? "block" : "none";

      document.getElementById("buscar-historial").oninput = renderHistorial;
      renderChipsEtiquetas();
      renderHistorial();
    } catch (err) {
      cont.innerHTML = `<div class="error">No se pudo cargar tu historial.</div>`;
    }
  }

  function renderChipsEtiquetas() {
    const cont = document.getElementById("chips-etiquetas");
    const todasEtiquetas = [...new Set(historialCache.flatMap((t) => t.etiquetas || []))].sort();
    if (!todasEtiquetas.length) {
      cont.innerHTML = "";
      document.getElementById("accion-etiqueta").innerHTML = "";
      return;
    }
    cont.innerHTML =
      `<button type="button" class="chip-etiqueta${etiquetaActiva === "" ? " activa" : ""}" data-etiqueta="">Todas</button>` +
      todasEtiquetas
        .map((e) => `<button type="button" class="chip-etiqueta${etiquetaActiva === e ? " activa" : ""}" data-etiqueta="${escapeHtml(e)}">${escapeHtml(e)}</button>`)
        .join("");
    cont.querySelectorAll(".chip-etiqueta").forEach((btn) => {
      btn.addEventListener("click", () => {
        etiquetaActiva = btn.dataset.etiqueta;
        renderChipsEtiquetas();
        renderHistorial();
      });
    });

    // Botón para marcar de un jalón todos los temas de la etiqueta activa
    // (ej. "todos los de Matemáticas, Primer Parcial") en vez de marcar uno
    // por uno — pensado sobre todo para armar un repaso o simulacro grande.
    const accion = document.getElementById("accion-etiqueta");
    if (!etiquetaActiva) {
      accion.innerHTML = "";
      return;
    }
    const idsDeEtiqueta = historialCache.filter((t) => (t.etiquetas || []).includes(etiquetaActiva)).map((t) => t.id);
    if (idsDeEtiqueta.length < 2) {
      accion.innerHTML = "";
      return;
    }
    const yaTodosMarcados = idsDeEtiqueta.every((id) => temasSeleccionados.has(id));
    accion.innerHTML = `<button type="button" class="btn-seleccionar-etiqueta" id="btn-seleccionar-etiqueta">${
      yaTodosMarcados ? "✓ Los " + idsDeEtiqueta.length + ' de "' + escapeHtml(etiquetaActiva) + '" están seleccionados' : "Seleccionar los " + idsDeEtiqueta.length + ' de "' + escapeHtml(etiquetaActiva) + '"'
    }</button>`;
    if (!yaTodosMarcados) {
      document.getElementById("btn-seleccionar-etiqueta").addEventListener("click", () => {
        idsDeEtiqueta.forEach((id) => temasSeleccionados.add(id));
        renderHistorial();
        renderChipsEtiquetas();
      });
    }
  }

  /**
   * "Ya lo aprendí" / "Volver a practicarlo" (2-sep-2026). No borra nada: el
   * tema se conserva completo, solo deja de contar como pendiente — sale de
   * "Mi progreso" y sus preguntas ya no entran en la trivia diaria (que es
   * lo que empuja la racha). Ver PATCH /api/temas/mios/:id en el backend.
   *
   * Se pinta optimista y se revierte si el servidor dice que no: marcar un
   * tema es un gesto chiquito y esperar el viaje completo se siente lento.
   */
  async function alternarAprendido(id, btn) {
    const tema = historialCache.find((t) => t.id === id);
    if (!tema) return;
    const anterior = !!tema.aprendido;
    tema.aprendido = !anterior;
    mostrarAprendidos = mostrarAprendidos || anterior; // al desmarcar, que no "desaparezca"
    renderHistorial();

    try {
      const res = await fetchConReintento(`${API_BASE}/api/temas/mios/${id}`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json", Authorization: `Bearer ${sesionActual.access_token}` },
        body: JSON.stringify({ aprendido: !anterior }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "No se pudo actualizar el tema.");
      cargarMiProgreso(); // "Mi progreso" ya no debe incluirlo (o volver a incluirlo)
    } catch (err) {
      tema.aprendido = anterior;
      renderHistorial();
      alert(err.message);
    }
  }

  /**
   * Borrar un tema del historial, definitivo. Se avisa con todas sus letras
   * que NO devuelve cupo del mes, porque es la pregunta obvia y la respuesta
   * (el contador cuenta generaciones, no temas guardados) no es adivinable.
   */
  async function borrarTemaDelHistorial(id, btn) {
    const tema = historialCache.find((t) => t.id === id);
    if (!tema) return;
    const confirmado = confirm(
      `¿Borrar "${tema.tema}"?\n\nSe borra para siempre, junto con la trivia que contestaste y los ejercicios que marcaste de ese tema.\n\nOjo: borrarlo NO te devuelve el tema en tu cupo del mes.`
    );
    if (!confirmado) return;

    if (btn) {
      btn.disabled = true;
      btn.textContent = "Borrando…";
    }
    try {
      const res = await fetchConReintento(`${API_BASE}/api/temas/mios/${id}`, {
        method: "DELETE",
        headers: { Authorization: `Bearer ${sesionActual.access_token}` },
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "No se pudo borrar el tema.");

      historialCache = historialCache.filter((t) => t.id !== id);
      temasSeleccionados.delete(id);
      renderChipsEtiquetas();
      renderHistorial();
      cargarMiProgreso();
    } catch (err) {
      if (btn) {
        btn.disabled = false;
        btn.textContent = "🗑️ Borrar";
      }
      alert(err.message);
    }
  }

  function renderHistorial() {
    const cont = document.getElementById("lista-historial");
    const busqueda = (document.getElementById("buscar-historial").value || "").trim().toLowerCase();

    const filtrados = historialCache.filter((t) => {
      const coincideEtiqueta = !etiquetaActiva || (t.etiquetas || []).includes(etiquetaActiva);
      const textoTema = (t.tema || "").toLowerCase();
      const textoEtiquetas = (t.etiquetas || []).join(" ").toLowerCase();
      const coincideBusqueda = !busqueda || textoTema.includes(busqueda) || textoEtiquetas.includes(busqueda);
      return coincideEtiqueta && coincideBusqueda;
    });

    if (!filtrados.length) {
      cont.innerHTML = `<p class="ayuda" style="margin:0;">No hay temas que coincidan con tu búsqueda.</p>`;
      return;
    }

    const permiteSeleccion = historialCache.length >= 2;

    // Los temas marcados como aprendidos se van a su propia sección, abajo
    // y plegada: siguen ahí para reabrirlos o reimprimirlos, pero dejan de
    // competir con lo que sí está pendiente.
    const pendientes = filtrados.filter((t) => !t.aprendido);
    const aprendidos = filtrados.filter((t) => t.aprendido);

    const fila = (t) => `
      <div class="historial-item historial-item--tema${t.aprendido ? " historial-item--aprendido" : ""}" data-id="${t.id}">
        ${permiteSeleccion ? `<input type="checkbox" class="seleccionar" data-seleccionar="${t.id}" ${temasSeleccionados.has(t.id) ? "checked" : ""} title="Seleccionar para armar un repaso">` : ""}
        <div class="historial-item-info">
          <div class="historial-item-linea1">
            <span class="titulo">${t.aprendido ? "✅" : "📘"} ${escapeHtml(t.tema)}</span>
            <span class="fecha">${new Date(t.created_at).toLocaleDateString("es-MX")}</span>
          </div>
          <span class="etiquetas-item">
            ${(t.etiquetas || []).map((e) => `<span class="etiqueta-badge">${escapeHtml(e)}</span>`).join("")}
            <button type="button" class="chip-etiqueta" style="padding:1px 9px; font-size:0.72rem;" data-editar-etiquetas="${t.id}">✏️ Etiquetas</button>
            <button type="button" class="chip-etiqueta chip-aprendido" style="padding:1px 9px; font-size:0.72rem;" data-aprendido="${t.id}">${
              t.aprendido ? "↩️ Volver a practicarlo" : "✅ Ya lo aprendí"
            }</button>
            <button type="button" class="chip-etiqueta chip-borrar" style="padding:1px 9px; font-size:0.72rem;" data-borrar="${t.id}">🗑️ Borrar</button>
          </span>
        </div>
      </div>
    `;

    cont.innerHTML =
      (pendientes.length
        ? pendientes.map(fila).join("")
        : `<p class="ayuda" style="margin:0;">Ya marcaste como aprendidos todos los temas que coinciden. 🎉</p>`) +
      (aprendidos.length
        ? `<div class="bloque-aprendidos">
             <button type="button" id="btn-ver-aprendidos">✅ Ya aprendidos (${aprendidos.length}) ${mostrarAprendidos ? "▲" : "▼"}</button>
             <div style="margin-top:10px; ${mostrarAprendidos ? "" : "display:none;"}">${aprendidos.map(fila).join("")}</div>
           </div>`
        : "");

    const btnVerAprendidos = document.getElementById("btn-ver-aprendidos");
    if (btnVerAprendidos) {
      btnVerAprendidos.addEventListener("click", () => {
        mostrarAprendidos = !mostrarAprendidos;
        renderHistorial();
      });
    }
    cont.querySelectorAll("[data-aprendido]").forEach((btn) => {
      btn.addEventListener("click", (ev) => {
        ev.stopPropagation();
        alternarAprendido(btn.dataset.aprendido, btn);
      });
    });
    cont.querySelectorAll("[data-borrar]").forEach((btn) => {
      btn.addEventListener("click", (ev) => {
        ev.stopPropagation();
        borrarTemaDelHistorial(btn.dataset.borrar, btn);
      });
    });

    cont.querySelectorAll(".historial-item .titulo, .historial-item .fecha").forEach((el) => {
      el.addEventListener("click", () => verTemaDelHistorial(el.closest(".historial-item").dataset.id));
    });
    cont.querySelectorAll("[data-editar-etiquetas]").forEach((btn) => {
      btn.addEventListener("click", (ev) => {
        ev.stopPropagation();
        editarEtiquetas(btn.dataset.editarEtiquetas);
      });
    });
    cont.querySelectorAll("[data-seleccionar]").forEach((chk) => {
      chk.addEventListener("click", (ev) => ev.stopPropagation());
      chk.addEventListener("change", () => {
        const id = chk.dataset.seleccionar;
        if (chk.checked) temasSeleccionados.add(id);
        else temasSeleccionados.delete(id);
        actualizarBarraCombinar();
        renderChipsEtiquetas(); // refresca "Seleccionar los N de X" si ya quedaron todos marcados
      });
    });
    actualizarBarraCombinar();
  }



  /** Muestra u oculta la barra de "Armar repaso" según cuántos temas del
   * historial estén marcados — ver el checkbox `data-seleccionar` arriba. */
  function actualizarBarraCombinar() {
    const barra = document.getElementById("barra-combinar");
    if (!barra) return;
    const n = temasSeleccionados.size;

    if (n < 2) {
      barra.style.display = "none";
      barra.innerHTML = "";
      return;
    }

    const tope = modoExamenActivo ? MAX_TEMAS_COMBINAR_EXAMEN : MAX_TEMAS_COMBINAR;
    const excedido = n > tope;
    barra.style.display = "flex";
    barra.innerHTML = `
      <label class="toggle-modo-examen">
        <input type="checkbox" id="chk-modo-examen" ${modoExamenActivo ? "checked" : ""}>
        🎯 Modo Examen — puro simulador de práctica, sin explicación (hasta ${MAX_TEMAS_COMBINAR_EXAMEN} temas)
      </label>
      <div class="fila-principal">
        <span>${n} temas seleccionados${excedido ? ` — máximo ${tope} para ${modoExamenActivo ? "un simulacro" : "un repaso"}` : ""}</span>
        <div class="acciones">
          <button type="button" class="secundario" id="btn-cancelar-combinar">Cancelar</button>
          <button type="button" class="primario" id="btn-armar-repaso"${excedido ? " disabled" : ""}>${modoExamenActivo ? "🎯 Armar simulacro" : "✨ Armar repaso"}</button>
        </div>
      </div>
    `;
    document.getElementById("chk-modo-examen").addEventListener("change", (ev) => {
      modoExamenActivo = ev.target.checked;
      actualizarBarraCombinar();
    });
    document.getElementById("btn-cancelar-combinar").addEventListener("click", () => {
      temasSeleccionados.clear();
      modoExamenActivo = false;
      renderHistorial();
      renderChipsEtiquetas();
    });
    if (!excedido) {
      document.getElementById("btn-armar-repaso").addEventListener("click", combinarTemas);
    }
  }

  /** Junta el contenido de los temas marcados en el historial en un solo
   * material — pensado para estudiar varios temas juntos antes de un examen.
   * Con el interruptor "Modo Examen" activo (ver actualizarBarraCombinar),
   * el resultado se inclina hacia ejercicios y un simulador de trivia en vez
   * de resumen, y gasta el contador aparte de simulacros del plan (no el de
   * temas normales) — ver resolverAccesoExamen en routes/temas.js. */
  async function combinarTemas() {
    const ids = [...temasSeleccionados];
    const tope = modoExamenActivo ? MAX_TEMAS_COMBINAR_EXAMEN : MAX_TEMAS_COMBINAR;
    if (ids.length < 2 || ids.length > tope) return;

    const cont = document.getElementById("lista-historial");
    document.getElementById("barra-combinar").style.display = "none";
    iniciarTips(cont, modoExamenActivo ? "Armando tu simulacro de examen…" : "Juntando tus temas y armando el repaso…");

    try {
      const res = await fetchConReintento(
        `${API_BASE}/api/temas/combinar`,
        {
          method: "POST",
          headers: { "Content-Type": "application/json", Authorization: `Bearer ${sesionActual.access_token}` },
          body: JSON.stringify({ temaIds: ids, enfoque: modoExamenActivo ? "examen" : "estudio" }),
        },
        null,
        null
      );
      const data = await res.json();
      detenerTips();

      if (res.status === 402) {
        cont.innerHTML = `
          <div class="error">${escapeHtml(data.error)}</div>
          <a href="comprador.html?cuenta=1" style="display:block; text-decoration:none;"><button class="primario">Ver mi plan / mejorar plan</button></a>
        `;
        return;
      }
      if (!res.ok) throw new Error(data.error || "No se pudo armar el repaso.");

      temasSeleccionados.clear();
      modoExamenActivo = false;
      mostrarTemaGenerado(data.contenido, data.tema_id, null, data.gamificacion);
    } catch (err) {
      detenerTips();
      renderHistorial();
      cont.insertAdjacentHTML("afterbegin", `<div class="error" style="margin-bottom:10px;">${escapeHtml(mensajeErrorAmigable(err))}</div>`);
    }
  }

  async function editarEtiquetas(temaId) {
    const actual = historialCache.find((t) => t.id === temaId);
    const texto = prompt("Etiquetas separadas por comas (ej. Matemáticas, Parcial 1):", (actual?.etiquetas || []).join(", "));
    if (texto === null) return; // canceló

    const etiquetas = parsearEtiquetas(texto);
    try {
      const res = await fetchConReintento(`${API_BASE}/api/temas/mios/${temaId}`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json", Authorization: `Bearer ${sesionActual.access_token}` },
        body: JSON.stringify({ etiquetas }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "No se pudieron guardar las etiquetas.");

      if (actual) actual.etiquetas = data.etiquetas;
      document.getElementById("filtros-historial").style.display = "block";
      renderChipsEtiquetas();
      renderHistorial();
    } catch (err) {
      alert("Error: " + mensajeErrorAmigable(err));
    }
  }

  async function verTemaDelHistorial(temaId) {
    const cont = document.getElementById("contenido");
    cont.innerHTML = `<div class="cargando">Cargando tu tema…</div>`;
    try {
      const res = await fetchConReintento(`${API_BASE}/api/temas/mios/${temaId}`, {
        headers: { Authorization: `Bearer ${sesionActual.access_token}` },
      }, cont, "Cargando tu tema… el servidor está despertando, puede tardar hasta un minuto la primera vez.");
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "No se pudo cargar el tema.");

      mostrarTemaGenerado(data.tema.contenido, data.tema.id, data.tema.pdf_url);
    } catch (err) {
      document.getElementById("contenido").innerHTML = `<div class="tarjeta"><div class="error">${escapeHtml(mensajeErrorAmigable(err))}</div></div>`;
    }
  }

  function normalizarTexto(s) {
    return (s || "").trim().toLowerCase();
  }

  /**
   * Antes, al revisar, la opción correcta se pintaba de verde — pero si tú
   * también la habías elegido, se veía idéntica: no había forma de saber
   * cuál habías escogido tú. Y si fallabas, tampoco se decía con palabras
   * cuál era la buena. Ahora cada opción se etiqueta explícitamente
   * ("Tu respuesta" / "Correcta") y debajo de cada pregunta sale una línea
   * que dice qué pasó, en vez de dejarlo todo al color.
   */
  /**
   * Manda el detalle de cómo se contestó la trivia de un tema del historial
   * (ver POST /api/temas/mios/:id/respuestas) — alimenta "Mi progreso"
   * (cargarMiProgreso). No bloquea nada si falla: la persona ya vio su
   * calificación en pantalla.
   */
  async function enviarRespuestasTrivia(temaId, respuestas) {
    try {
      await fetch(`${API_BASE}/api/temas/mios/${encodeURIComponent(temaId)}/respuestas`, {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: `Bearer ${sesionActual.access_token}` },
        body: JSON.stringify({ respuestas }),
      });
    } catch (err) {
      // no bloquea la experiencia si falla
    }
  }

  /**
   * Checkbox ligero "✓ Ya la resolví" en la pestaña Practicar (31-ago-2026)
   * — mismo patrón que g.html (modo grupo), pero aquí solo hay una persona,
   * así que se sobrescribe un solo estado en vez de ir guardando un
   * historial por cada clic (ver PUT/GET /api/temas/mios/:id/ejercicios-resueltos).
   */
  async function cargarEjerciciosResueltos() {
    if (!ultimoTemaId) return;
    // Se recuerda de QUÉ tema se pidió: si el usuario alcanza a abrir otro
    // tema antes de que responda, esta respuesta ya no aplica y marcaría
    // los checkboxes del tema equivocado (31-ago-2026).
    const temaPedido = ultimoTemaId;
    try {
      const res = await fetch(`${API_BASE}/api/temas/mios/${encodeURIComponent(temaPedido)}/ejercicios-resueltos`, {
        headers: { Authorization: `Bearer ${sesionActual.access_token}` },
      });
      if (!res.ok) return;
      const data = await res.json();
      if (temaPedido !== ultimoTemaId) return; // ya estamos viendo otro tema
      (data.indices_resueltos || []).forEach((i) => {
        const chk = document.querySelector(`.chk-ejercicio-resuelto[data-ej="${i}"]`);
        if (chk) chk.checked = true;
      });
    } catch (err) {
      // no es crítico — el checkbox simplemente arranca vacío
    }
  }

  async function guardarEjerciciosResueltos() {
    if (!ultimoTemaId) return;
    const aviso = document.getElementById("progreso-aviso");
    const totalCheckboxes = document.querySelectorAll(".chk-ejercicio-resuelto").length;
    const indices = Array.from(document.querySelectorAll(".chk-ejercicio-resuelto:checked")).map((chk) =>
      parseInt(chk.dataset.ej, 10)
    );

    try {
      const res = await fetch(`${API_BASE}/api/temas/mios/${encodeURIComponent(ultimoTemaId)}/ejercicios-resueltos`, {
        method: "PUT",
        headers: { "Content-Type": "application/json", Authorization: `Bearer ${sesionActual.access_token}` },
        body: JSON.stringify({ indices }),
      });
      if (!res.ok) throw new Error();
      if (aviso) {
        aviso.style.display = "block";
        aviso.textContent = indices.length
          ? `✓ Guardado — ${indices.length} de ${totalCheckboxes} marcados.`
          : "Guardado — todavía no marcaste ninguno.";
      }
    } catch (err) {
      if (aviso) {
        aviso.style.display = "block";
        aviso.textContent = "No se pudo guardar tu progreso — intenta de nuevo en un momento.";
      }
    }
  }

  function revisarTrivia() {
    let total = 0;
    let correctas = 0;
    const detalle = [];

    document.querySelectorAll(".trivia-item").forEach((item, indice) => {
      item.classList.add("revisado");
      const correcta = item.dataset.correcta || "";
      const pregunta = item.dataset.pregunta || "";
      const opciones = item.querySelectorAll(".opcion-btn");
      const feedback = item.querySelector(".trivia-feedback");
      const abierta = item.querySelector(".respuesta-abierta");

      if (opciones.length) {
        total++;
        const seleccionado = item.querySelector(".opcion-btn.seleccionada");
        const acerto = seleccionado && normalizarTexto(seleccionado.dataset.valor) === normalizarTexto(correcta);

        opciones.forEach((btn) => {
          btn.disabled = true;
          const esCorrecta = normalizarTexto(btn.dataset.valor) === normalizarTexto(correcta);
          const esTuya = btn === seleccionado;

          if (esCorrecta) btn.classList.add("correcta");
          else if (esTuya) btn.classList.add("incorrecta");

          // La etiqueta es lo que quita la ambigüedad del color.
          let etiqueta = "";
          if (esTuya && esCorrecta) etiqueta = "Tu respuesta · correcta";
          else if (esTuya) etiqueta = "Tu respuesta";
          else if (esCorrecta) etiqueta = "Correcta";
          if (etiqueta) btn.insertAdjacentHTML("beforeend", `<span class="etiqueta-op">${etiqueta}</span>`);
        });

        feedback.style.display = "block";
        if (acerto) {
          correctas++;
          feedback.className = "trivia-feedback bien";
          feedback.textContent = "✅ ¡Correcto!";
        } else if (seleccionado) {
          feedback.className = "trivia-feedback mal";
          feedback.innerHTML = `❌ La respuesta correcta era: <strong>${escapeHtml(correcta)}</strong>`;
        } else {
          feedback.className = "trivia-feedback";
          feedback.innerHTML = `No elegiste respuesta. La correcta era: <strong>${escapeHtml(correcta)}</strong>`;
        }

        detalle.push({
          indice,
          pregunta,
          respuesta: seleccionado ? seleccionado.dataset.valor : null,
          respuesta_correcta: correcta,
          acerto: !!acerto,
        });
      } else {
        // Pregunta abierta: no se califica, pero sí se compara con la sugerida.
        if (abierta) abierta.disabled = true;
        const escribio = abierta && abierta.value.trim();
        feedback.style.display = "block";
        feedback.className = "trivia-feedback";
        feedback.innerHTML =
          (escribio ? "" : "<em>No escribiste nada.</em> ") +
          `<strong>Respuesta sugerida:</strong> ${escapeHtml(correcta)}`;

        // abierta: no se autocalifica, así que acerto queda en null — igual
        // que en el modo grupo (routes/grupos.js).
        detalle.push({ indice, pregunta, respuesta: escribio || null, respuesta_correcta: correcta, acerto: null });
      }
    });

    // Guarda el resultado en el historial del tema (ver GET /mi-progreso) —
    // si esto falla, la persona no se entera: ya vio su calificación en
    // pantalla, esto solo alimenta "Mi progreso" a futuro.
    if (detalle.length && ultimoTemaId) {
      enviarRespuestasTrivia(ultimoTemaId, detalle);
    }

    const resumen = document.getElementById("trivia-resumen");
    if (resumen && total > 0) {
      resumen.style.display = "block";
      const pct = correctas / total;
      const mensaje =
        pct === 1 ? "¡Todas correctas! 🎉" : pct >= 0.6 ? "¡Vas bien!" : "Vale la pena repasar y volver a intentar.";
      resumen.textContent = `${mensaje} Acertaste ${correctas} de ${total}.`;
    }

    const btnRevisar = document.getElementById("btn-revisar-trivia");
    if (btnRevisar) {
      // Se reemplaza el botón por un clon para soltar el listener anterior
      // (si no, "Intentar de nuevo" volvería a ejecutar la revisión también).
      const nuevo = btnRevisar.cloneNode(false);
      nuevo.textContent = "Intentar de nuevo";
      btnRevisar.replaceWith(nuevo);
      nuevo.addEventListener("click", () => mostrarTemaGenerado(ultimoContenido, ultimoTemaId, null));
    }
  }

  // ── Diagramas del tema ─────────────────────────────────────────────────
  // Antes se dibujaban como SVG de 600px de ancho: en celular el texto
  // acababa renderizando a ~6px o el diagrama se cortaba con scroll
  // lateral. Ahora viven en diagrama.js y salen como HTML responsivo
  // (una columna en celular). Si por alguna razón ese archivo no cargó,
  // no se dibuja nada — el tema se sigue viendo completo.
  function dibujarDiagrama(diagrama) {
    try {
      return window.EnsenaiDiagrama ? window.EnsenaiDiagrama.dibujar(diagrama) : "";
    } catch (err) {
      return "";
    }
  }

  /** Las imágenes fijas de la biblioteca que el tema traiga colgadas
   *  (ver adjuntarIlustraciones en routes/temas.js). Los temas viejos no
   *  traen ninguna y simplemente no se pinta nada. */
  function dibujarIlustraciones(lista) {
    try {
      return window.EnsenaiDiagrama ? window.EnsenaiDiagrama.ilustraciones(lista) : "";
    } catch (err) {
      return "";
    }
  }

  /**
   * Los temas generados ANTES del rediseño tienen `resumen` como un solo
   * string de texto corrido. Aquí se convierte a la forma nueva para que el
   * historial viejo se siga viendo bien, sin tener que migrar la base.
   */
  function normalizarResumen(resumen) {
    const vacio = { que_es: "", secciones: [], pasos: [], ideas_clave: [], ojo_aqui: "", truco: "" };
    if (!resumen) return vacio;
    if (typeof resumen === "string") return { ...vacio, que_es: resumen };
    return {
      que_es: resumen.que_es || "",
      secciones: Array.isArray(resumen.secciones) ? resumen.secciones.filter((s) => s && (s.titulo || s.texto)) : [],
      pasos: Array.isArray(resumen.pasos) ? resumen.pasos.filter(Boolean) : [],
      ideas_clave: Array.isArray(resumen.ideas_clave) ? resumen.ideas_clave.filter(Boolean) : [],
      ojo_aqui: resumen.ojo_aqui || "",
      truco: resumen.truco || "",
    };
  }

  /**
   * Manda a revisar el procedimiento que la persona escribió para UN
   * ejercicio. El enunciado y la solución NO se mandan desde aquí: el
   * servidor los lee del tema guardado (ver POST
   * /api/temas/mios/:id/revisar-ejercicio), así la revisión sabe contra qué
   * comparar y nadie puede alterar el ejercicio desde el navegador.
   */
  async function revisarMiProcedimiento(indice, btn) {
    const salida = document.getElementById("revision-res-" + indice);
    const caja = document.getElementById("procedimiento-" + indice);
    if (!salida || !caja) return;

    const procedimiento = (caja.value || "").trim();
    if (!procedimiento) {
      salida.innerHTML = `<div class="revision-caja"><p class="veredicto">Escribe cómo lo resolviste (aunque sea en pasos cortos) para poder revisarlo.</p></div>`;
      return;
    }
    if (!ultimoTemaId) {
      salida.innerHTML = `<div class="revision-caja"><p class="veredicto">Este material no está guardado, así que no se puede revisar por ejercicio.</p></div>`;
      return;
    }

    btn.disabled = true;
    const textoOriginal = btn.textContent;
    btn.textContent = "Revisando…";
    salida.innerHTML = `<div class="cargando">Leyendo tu procedimiento paso por paso…</div>`;

    try {
      const res = await fetchConReintento(`${API_BASE}/api/temas/mios/${ultimoTemaId}/revisar-ejercicio`, {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: `Bearer ${sesionActual.access_token}` },
        body: JSON.stringify({ indice, procedimiento }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "No se pudo revisar tu procedimiento.");

      const pasos = Array.isArray(data.pasos) ? data.pasos : [];
      salida.innerHTML = `
        <div class="revision-caja">
          <p class="veredicto">${escapeHtml(data.veredicto || "")}</p>
          ${
            pasos.length
              ? `<ol>${pasos
                  .map((p) => `<li>${p.correcto ? "✅" : "⚠️"} ${escapeHtml(p.comentario || "")}</li>`)
                  .join("")}</ol>`
              : ""
          }
          ${data.sugerencia ? `<p class="sugerencia">👉 ${escapeHtml(data.sugerencia)}</p>` : ""}
        </div>`;
    } catch (err) {
      salida.innerHTML = `<div class="revision-caja"><p class="veredicto">${escapeHtml(err.message)}</p></div>`;
    } finally {
      btn.disabled = false;
      btn.textContent = textoOriginal;
    }
  }

  /**
   * "📎 Para imprimir": las hojas de la biblioteca que embonan con ESTE tema
   * (3-sep-2026).
   *
   * El servidor decide cuáles (GET /api/recursos/plantillas/para-tema, ver
   * utils/matcherPlantillas.js). Si no embona ninguna, no se pinta nada:
   * más vale que la sección no exista a que ofrezca material que no viene
   * al caso. Falla en silencio a propósito — es un extra del tema, nunca
   * puede romper la pantalla del tema en sí.
   */
  async function cargarPlantillasDelTema(contenido) {
    const zona = document.getElementById("zona-plantillas-tema");
    if (!zona || !sesionActual) return;
    try {
      const params = new URLSearchParams({ tema: contenido?.tema || "" });
      if (contenido?.nivel) params.set("nivel", contenido.nivel);
      if (contenido?.enfoque) params.set("enfoque", contenido.enfoque);

      const res = await fetch(`${API_BASE}/api/recursos/plantillas/para-tema?${params}`, {
        headers: { Authorization: `Bearer ${sesionActual.access_token}` },
      });
      const data = await res.json();
      const lista = data.plantillas || [];
      if (!lista.length) return;

      // La zona pudo haberse re-dibujado mientras llegaba la respuesta.
      const zonaAhora = document.getElementById("zona-plantillas-tema");
      if (!zonaAhora) return;

      zonaAhora.innerHTML = `
        <div style="margin-top:18px; border-top:2px solid var(--linea); padding-top:14px;">
          <h3 style="margin:0 0 2px; font-size:1rem;">📎 Para imprimir</h3>
          <p class="ayuda" style="margin:0 0 10px; font-size:0.85rem;">Hojas de nuestra biblioteca que le quedan a este tema.</p>
          ${lista
            .map(
              (p) => `
            <div class="plantilla-tema">
              <div class="icono-plantilla">${p.tipo_mime === "application/pdf" ? "📄" : "🖼️"}</div>
              <div style="flex:1 1 auto; min-width:0;">
                <div style="font-weight:800; font-size:0.92rem; line-height:1.3;">${escapeHtml(p.nombre)}</div>
                ${p.descripcion ? `<div class="ayuda" style="margin:2px 0 0; font-size:0.82rem;">${escapeHtml(p.descripcion)}</div>` : ""}
              </div>
              <a href="${escapeHtml(p.archivo_url)}" target="_blank" rel="noopener" data-descarga="${p.id}" style="text-decoration:none; flex:0 0 auto;">
                <button type="button" class="secundario chico">Descargar</button>
              </a>
            </div>`
            )
            .join("")}
        </div>`;

      zonaAhora.querySelectorAll("[data-descarga]").forEach((a) =>
        a.addEventListener("click", () => {
          fetch(`${API_BASE}/api/recursos/plantillas/${a.dataset.descarga}/descarga`, {
            method: "POST",
            headers: { Authorization: `Bearer ${sesionActual.access_token}` },
          }).catch(() => {});
        })
      );
    } catch (err) {
      /* el material extra nunca puede tumbar el tema */
    }
  }

  function mostrarTemaGenerado(contenido, temaId, pdfUrlGuardado, gamificacion) {
    ultimoContenido = contenido;
    ultimoTemaId = temaId;
    const c = contenido;
    const cont = document.getElementById("contenido");

    // Una actividad "existe" solo si trae texto de verdad. En Modo Examen el
    // simulador deja actividad vacía a propósito (ver agents/combinarTemas.js)
    // y antes eso pintaba un recuadro en blanco bajo el título "Actividad"
    // (31-ago-2026).
    const tieneContenido = (a) => !!a && (String(a.titulo || "").trim() || String(a.instrucciones || "").trim());
    const actividadesConTexto = Array.isArray(c.actividades) ? c.actividades.filter(tieneContenido) : [];

    const actividadesHtml = actividadesConTexto.length
      ? actividadesConTexto
          .map(
            (a) => `
        <div class="actividad-box">
          <span class="inteligencia">${escapeHtml(ETIQUETAS_INTELIGENCIA[a.inteligencia] || a.inteligencia)}</span>
          <div style="font-weight:700; margin-bottom:4px;">${formatearTexto(a.titulo || "")}</div>
          <div style="font-size:0.92rem; line-height:1.5;">${formatearLargo(a.instrucciones || "")}</div>
        </div>
      `
          )
          .join("")
      : tieneContenido(c.actividad)
      ? `
        <div class="actividad-box">
          <div style="font-weight:700; margin-bottom:4px;">${formatearTexto(c.actividad.titulo || "")}</div>
          <div style="font-size:0.92rem; line-height:1.5;">${formatearLargo(c.actividad.instrucciones || "")}</div>
        </div>
      `
      : "";

    // Las preguntas ABIERTAS (sin opciones) antes no tenían dónde contestar:
    // solo aparecía la respuesta sugerida al revisar. Ahora llevan su propio
    // campo de texto, para que la persona intente responder antes de ver la
    // sugerencia — que es donde está el valor del repaso.
    const triviaHtml = (c.trivia || [])
      .map(
        (p, i) => `
      <div class="trivia-item" data-correcta="${escapeHtml(p.respuesta_correcta || "")}" data-pregunta="${escapeHtml(p.pregunta || "")}">
        <div class="trivia-pregunta"><span class="trivia-num">${i + 1}</span> ${formatearTexto(p.pregunta || "")}</div>
        ${
          p.opciones?.length
            ? `<div class="opciones">${p.opciones
                .map((o) => `<button type="button" class="opcion-btn" data-valor="${escapeHtml(o)}">${formatearTexto(o)}</button>`)
                .join("")}</div>`
            : `<textarea class="respuesta-abierta" rows="3" placeholder="Escribe tu respuesta aquí…"></textarea>`
        }
        <div class="trivia-feedback" style="display:none;"></div>
      </div>
    `
      )
      .join("");

    const materialExtraHtml = (c.material_extra || [])
      .map((m, i) => {
        const tarjetas = Array.isArray(m.tarjetas) ? m.tarjetas.filter((t) => t && (t.frente || t.reverso)) : [];
        return `
      <div class="material-extra-box">
        <div style="font-weight:700; text-transform:capitalize; margin-bottom:4px;">${escapeHtml(m.tipo || "")}</div>
        ${
          m.contenido
            ? `<div style="font-size:0.92rem; line-height:1.5; white-space:pre-line; margin-bottom:${
                tarjetas.length ? "10px" : "0"
              };">${formatearTexto(m.contenido)}</div>`
            : ""
        }
        ${
          tarjetas.length
            ? `<div class="lista-tarjetas">${tarjetas
                .map(
                  (t) => `<div class="tarjeta-repaso">
                      <div class="frente">${escapeHtml(t.frente || "")}</div>
                      ${t.reverso ? `<div class="reverso">${escapeHtml(t.reverso)}</div>` : ""}
                    </div>`
                )
                .join("")}</div>
               <button type="button" class="secundario btn-imprimir-tarjetas" data-material-idx="${i}" style="margin:10px 0 0;">🖨️ Imprimir ${
                tarjetas.length === 1 ? "tarjeta" : "tarjetas"
              } (${tarjetas.length})</button>`
            : ""
        }
      </div>
    `;
      })
      .join("");

    const r = c.respuestas || {};
    const respuestasHtml = `
      ${
        r.trivia_resuelta?.length
          ? `<h3 style="margin-top:0;">Respuestas de la trivia</h3>` +
            r.trivia_resuelta.map((rt) => `<p style="margin:4px 0;"><strong>${escapeHtml(rt.pregunta)}</strong> — ${escapeHtml(rt.respuesta)}</p>`).join("")
          : ""
      }
      ${r.solucion_actividad ? `<h3>Solución de la actividad</h3><p style="margin:0;">${escapeHtml(r.solucion_actividad)}</p>` : ""}
      ${
        r.conceptos_clave?.length
          ? `<h3>Conceptos clave</h3><ul>${r.conceptos_clave.map((k) => `<li>${escapeHtml(k)}</li>`).join("")}</ul>`
          : ""
      }
      ${r.autoevaluacion ? `<h3>Autoevaluación</h3><p style="margin:0;">${escapeHtml(r.autoevaluacion)}</p>` : ""}
    `;

    const res = normalizarResumen(c.resumen);
    const ejercicios = c.ejercicios || [];

    // ── Pestaña 1: ESTUDIAR ──────────────────────────────────────────────
    const estudiarHtml = `
      ${res.que_es ? `<div class="bloque-est destacado"><p>${formatearTexto(res.que_es)}</p></div>` : ""}
      ${dibujarIlustraciones(c.ilustraciones)}
      ${dibujarDiagrama(c.diagrama)}
      ${res.secciones
        .map(
          (s) => `
        <div class="bloque-est">
          ${s.titulo ? `<h3 class="bloque-titulo">${formatearTexto(s.titulo)}</h3>` : ""}
          ${formatearLargo(s.texto || "")}
        </div>`
        )
        .join("")}
      ${
        res.pasos.length
          ? `<div class="bloque-est">
              <h3 class="bloque-titulo">🧭 Paso a paso</h3>
              <ol class="lista-pasos">${res.pasos.map((p) => `<li>${formatearTexto(p)}</li>`).join("")}</ol>
             </div>`
          : ""
      }
      ${
        res.ideas_clave.length
          ? `<div class="bloque-est">
              <h3 class="bloque-titulo">⭐ Lo que no se te puede olvidar</h3>
              <ul class="lista-ideas">${res.ideas_clave.map((k) => `<li>${formatearTexto(k)}</li>`).join("")}</ul>
             </div>`
          : ""
      }
      ${res.ojo_aqui ? `<div class="caja-ojo"><strong>⚠️ Ojo aquí</strong><p>${formatearTexto(res.ojo_aqui)}</p></div>` : ""}
      ${res.truco ? `<div class="caja-truco"><strong>🎯 Truco para recordarlo</strong><p>${formatearTexto(res.truco)}</p></div>` : ""}
      ${
        c.esquema_visual
          ? `<details class="bloque-est plegable">
              <summary>Ver el esquema completo</summary>
              <p style="white-space:pre-line; margin-top:8px;">${formatearTexto(c.esquema_visual)}</p>
             </details>`
          : ""
      }
    `;

    // ── Pestaña 2: PRACTICAR ─────────────────────────────────────────────
    const ejerciciosHtml = ejercicios
      .map(
        (e, i) => `
      <div class="ejercicio" data-ej="${i}">
        <div class="ejercicio-cabeza">
          <span class="ejercicio-num">${i + 1}</span>
          <p class="ejercicio-enunciado">${formatearTexto(e.enunciado || "")}</p>
        </div>
        ${
          e.pista
            ? `<button type="button" class="btn-pista" data-ej="${i}">💡 Ver pista</button>
               <div class="pista-caja" id="pista-${i}" style="display:none;">${formatearTexto(e.pista)}</div>`
            : ""
        }
        <button type="button" class="btn-solucion" data-ej="${i}">Ver solución</button>
        <div class="solucion-caja" id="solucion-${i}" style="display:none;">
          ${
            (e.pasos || []).length
              ? `<ol class="lista-pasos">${e.pasos.map((p) => `<li>${formatearTexto(p)}</li>`).join("")}</ol>`
              : ""
          }
          ${e.respuesta ? `<div class="ejercicio-respuesta">✅ ${formatearTexto(e.respuesta)}</div>` : ""}
        </div>
        <label class="ejercicio-marcar">
          <input type="checkbox" class="chk-ejercicio-resuelto" data-ej="${i}">
          ✓ Ya la resolví
        </label>
        <!-- "Que lo puedas resolver y la IA te diga cómo lo resolviste"
             (2-sep-2026). Solo aparece en temas guardados: la revisión
             necesita el id del tema para leer el enunciado y la solución
             del lado del servidor. -->
        ${
          temaId
            ? `<button type="button" class="btn-revisar-mio" data-ej="${i}">✍️ Revisar cómo lo resolví</button>
               <div class="revision-mia" id="revision-${i}" style="display:none;">
                 <textarea id="procedimiento-${i}" placeholder="Escribe los pasos que hiciste, aunque sea cortito. Ej.: elevé 3 y 4 al cuadrado, sumé 9+16=25, saqué raíz y me dio 5."></textarea>
                 <button type="button" class="secundario btn-enviar-revision" data-ej="${i}">Revisar mi procedimiento</button>
                 <div id="revision-res-${i}"></div>
               </div>`
            : ""
        }
      </div>`
      )
      .join("");

    const practicarHtml = `
      ${
        ejerciciosHtml
          ? `<p class="ayuda" style="margin:0 0 14px;">Resuélvelos en tu cuaderno primero. La solución trae el procedimiento completo para que puedas ver <em>en qué paso</em> te trabaste.</p>
             ${ejerciciosHtml}
             <button class="secundario btn-guardar-progreso" id="btn-guardar-progreso">💾 Guardar mi progreso</button>
             <div class="progreso-aviso" id="progreso-aviso" style="display:none;"></div>`
          : ""
      }
      ${actividadesHtml ? `<h2 style="margin-top:${ejerciciosHtml ? "22px" : "0"};">✏️ Actividad</h2>${actividadesHtml}` : ""}
      ${!ejerciciosHtml && !actividadesHtml ? `<p class="ayuda">Este tema no trae ejercicios.</p>` : ""}
    `;

    // ── Pestaña 3: REPASAR ───────────────────────────────────────────────
    const repasarHtml = `
      ${
        triviaHtml
          ? `<h2 style="margin-top:0;">🧠 Trivia</h2>
             <p class="ayuda" style="margin:0 0 12px;">Elige tu respuesta en cada pregunta y luego dale a "Revisar mis respuestas".</p>
             ${triviaHtml}
             <div id="trivia-resumen" style="display:none;"></div>
             <button class="primario" id="btn-revisar-trivia">Revisar mis respuestas</button>`
          : ""
      }
      ${
        materialExtraHtml
          ? `<h2 style="margin-top:${triviaHtml ? "24px" : "0"};">📎 Material de repaso</h2>
             <button type="button" class="secundario" id="btn-imprimir-repaso" style="margin:0 0 12px; width:100%;">🖨️ Imprimir todo el material de repaso</button>
             ${materialExtraHtml}`
          : ""
      }
      <div class="respuestas-toggle" style="margin-top:20px;"><button class="secundario" id="btn-respuestas">Ver respuestas</button></div>
      <div class="respuestas-box" id="caja-respuestas">${respuestasHtml}</div>
    `;

    // Racha/medallas nuevas de ESTA generación (ver utils/gamificacion.js) —
    // solo viene cuando mostrarTemaGenerado se llama justo después de
    // generar/combinar; al reabrir un tema del historial no aplica.
    const medallasNuevas = gamificacion?.medallas_nuevas || [];
    // La franja de racha vive fuera de #contenido, así que no se re-pinta
    // sola al mostrar el tema: se le pasa el dato nuevo para que el número
    // de arriba no se quede en el de antes de generar.
    if (gamificacion) actualizarRachaChip(gamificacion);
    const gamificacionBannerHtml = gamificacion
      ? `<div class="aviso" style="margin-bottom:14px;">
          🔥 Racha: ${gamificacion.racha_actual} día${gamificacion.racha_actual === 1 ? "" : "s"}
          ${medallasNuevas.length ? "<br>" + medallasNuevas.map((m) => `🏅 ¡Nueva medalla! ${m.icono} ${escapeHtml(m.nombre)}`).join("<br>") : ""}
        </div>`
      : "";

    const nEj = ejercicios.length;

    // Modo Examen (simulador puro, 31-ago-2026, ver agents/combinarTemas.js)
    // deja el resumen vacío A PROPÓSITO — sin esto, "Estudiar" se abriría
    // por default mostrando un panel completamente en blanco. Si no hay
    // nada que exponer, ni siquiera se muestra esa pestaña, y se arranca
    // directo en Practicar (o Repasar si el simulador es solo trivia).
    const resumenVacio =
      !res.que_es && !res.secciones.length && !res.pasos.length && !res.ideas_clave.length &&
      !res.ojo_aqui && !res.truco && !c.diagrama && !c.esquema_visual && !(c.ilustraciones || []).length;
    // Un simulador puede traer SOLO ejercicios o SOLO trivia. Antes se
    // pintaban igual las tres pestañas y el alumno abría una vacía
    // (31-ago-2026): ahora cada pestaña aparece solo si tiene algo dentro.
    const hayPracticar = !!(ejerciciosHtml || actividadesHtml);
    // respuestasHtml siempre es una plantilla no vacía, así que se mira el
    // dato real: si no hay trivia, ni material extra, ni respuestas con
    // contenido, la pestaña Repasar no aporta nada.
    const hayRespuestasUtiles = !!(
      (r.trivia_resuelta || []).length ||
      String(r.solucion_actividad || "").trim() ||
      (r.conceptos_clave || []).length ||
      String(r.autoevaluacion || "").trim()
    );
    const hayRepasar = !!(triviaHtml || materialExtraHtml || hayRespuestasUtiles);
    const tabInicial = !resumenVacio ? "estudiar" : hayPracticar ? "practicar" : "repasar";

    cont.innerHTML = `
      <a class="volver" id="btn-volver">← Volver</a>
      ${gamificacionBannerHtml}
      <div class="tarjeta">
        <h1>📘 ${escapeHtml(c.tema || "")}</h1>
        <div class="pestanas">
          ${
            resumenVacio
              ? ""
              : `<button class="pestana${tabInicial === "estudiar" ? " activa" : ""}" data-panel="estudiar">📖 Estudiar</button>`
          }
          ${
            hayPracticar
              ? `<button class="pestana${tabInicial === "practicar" ? " activa" : ""}" data-panel="practicar">✏️ Practicar${nEj ? ` <span class="pestana-num">${nEj}</span>` : ""}</button>`
              : ""
          }
          ${
            hayRepasar
              ? `<button class="pestana${tabInicial === "repasar" ? " activa" : ""}" data-panel="repasar">🔁 Repasar</button>`
              : ""
          }
        </div>
        <div class="panel" id="panel-estudiar" style="${tabInicial === "estudiar" ? "" : "display:none;"}">${estudiarHtml}</div>
        <div class="panel" id="panel-practicar" style="${tabInicial === "practicar" ? "" : "display:none;"}">${practicarHtml}</div>
        <div class="panel" id="panel-repasar" style="${tabInicial === "repasar" ? "" : "display:none;"}">${repasarHtml}</div>
        <button class="secundario" id="btn-pdf" style="margin-top:18px; width:100%;">${pdfUrlGuardado ? "📄 Descargar imprimible (PDF)" : "📄 Generar imprimible (PDF)"}</button>
        <div id="zona-plantillas-tema"></div>
      </div>
    `;

    cargarPlantillasDelTema(c);

    document.querySelectorAll(".pestana").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".pestana").forEach((b) => b.classList.toggle("activa", b === btn));
        ["estudiar", "practicar", "repasar"].forEach((p) => {
          document.getElementById("panel-" + p).style.display = p === btn.dataset.panel ? "" : "none";
        });
      });
    });

    document.querySelectorAll(".btn-pista").forEach((btn) => {
      btn.addEventListener("click", () => {
        const caja = document.getElementById("pista-" + btn.dataset.ej);
        caja.style.display = caja.style.display === "none" ? "block" : "none";
        btn.textContent = caja.style.display === "none" ? "💡 Ver pista" : "💡 Ocultar pista";
      });
    });

    document.querySelectorAll(".btn-revisar-mio").forEach((btn) => {
      btn.addEventListener("click", () => {
        const caja = document.getElementById("revision-" + btn.dataset.ej);
        const abierta = caja.style.display !== "none";
        caja.style.display = abierta ? "none" : "block";
        btn.textContent = abierta ? "✍️ Revisar cómo lo resolví" : "✍️ Ocultar";
        if (!abierta) document.getElementById("procedimiento-" + btn.dataset.ej)?.focus();
      });
    });

    document.querySelectorAll(".btn-enviar-revision").forEach((btn) => {
      btn.addEventListener("click", () => revisarMiProcedimiento(parseInt(btn.dataset.ej, 10), btn));
    });

    document.querySelectorAll(".btn-solucion").forEach((btn) => {
      btn.addEventListener("click", () => {
        const caja = document.getElementById("solucion-" + btn.dataset.ej);
        const abierta = caja.style.display !== "none";
        caja.style.display = abierta ? "none" : "block";
        btn.textContent = abierta ? "Ver solución" : "Ocultar solución";
        btn.classList.toggle("abierta", !abierta);
      });
    });

    document.getElementById("btn-volver").addEventListener("click", () => mostrarPerfil());
    document.getElementById("btn-respuestas").addEventListener("click", () => {
      document.getElementById("caja-respuestas").classList.toggle("abierto");
    });

    document.querySelectorAll(".btn-imprimir-tarjetas").forEach((btn) => {
      btn.addEventListener("click", () => {
        const m = (c.material_extra || [])[parseInt(btn.dataset.materialIdx, 10)];
        if (m) imprimirTarjetas(m.tipo, m.tarjetas);
      });
    });

    const btnImprimirRepaso = document.getElementById("btn-imprimir-repaso");
    if (btnImprimirRepaso) {
      btnImprimirRepaso.addEventListener("click", () => imprimirMaterialExtra(c.material_extra, c.titulo || ""));
    }

    const btnGuardarProgreso = document.getElementById("btn-guardar-progreso");
    if (btnGuardarProgreso) {
      btnGuardarProgreso.addEventListener("click", guardarEjerciciosResueltos);
      cargarEjerciciosResueltos();
    }

    document.querySelectorAll(".opcion-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        const item = btn.closest(".trivia-item");
        if (item.classList.contains("revisado")) return;
        item.querySelectorAll(".opcion-btn").forEach((b) => b.classList.remove("seleccionada"));
        btn.classList.add("seleccionada");
      });
    });
    const btnRevisarTrivia = document.getElementById("btn-revisar-trivia");
    if (btnRevisarTrivia) btnRevisarTrivia.addEventListener("click", revisarTrivia);

    let pdfUrlCache = pdfUrlGuardado || null;
    const btnPdf = document.getElementById("btn-pdf");
    btnPdf.addEventListener("click", async () => {
      if (pdfUrlCache) {
        window.open(pdfUrlCache, "_blank");
        return;
      }
      const textoOriginal = btnPdf.textContent;
      btnPdf.disabled = true;
      btnPdf.textContent = "Preparando PDF…";
      try {
        const res = await fetchConReintento(`${API_BASE}/api/temas/pdf`, {
          method: "POST",
          headers: { "Content-Type": "application/json", Authorization: `Bearer ${sesionActual.access_token}` },
          body: JSON.stringify({ contenido: ultimoContenido, modo: "individual", temaId: ultimoTemaId }),
        });
        const data = await res.json();
        if (!data.pdf_url) throw new Error(data.error || "No se pudo generar el PDF.");
        pdfUrlCache = data.pdf_url;
        window.open(pdfUrlCache, "_blank");
        btnPdf.textContent = "📄 Descargar imprimible (PDF)";
      } catch (err) {
        alert("Error: " + mensajeErrorAmigable(err));
        btnPdf.textContent = textoOriginal;
      } finally {
        btnPdf.disabled = false;
      }
    });
  }

  init();
</script>
<!-- Botón flotante de comentarios del piloto (ver feedback.js). Va al final
     y en archivo aparte: así los tres paneles comparten el mismo widget y
     puede leer API_BASE y sesionActual del script de arriba. -->
<script src="feedback.js"></script>
</body>
</html>
