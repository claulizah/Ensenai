<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EnseñAI — Generar tema</title>
<link rel="icon" type="image/png" href="assets/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grandstander:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --profundo: #1E3A8A; --profundo-oscuro: #16296B; --cielo: #60A5FA;
    --menta: #34D399; --aqua: #7DD3FC; --bosque: #065F46;
    --hielo: #F0FDF4; --tinta: #1E3A8A; --linea: #DCEEFC;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: 'Nunito', sans-serif;
    background:
      radial-gradient(circle at 12% 8%, rgba(96,165,250,0.35) 0, transparent 30%),
      radial-gradient(circle at 90% 20%, rgba(125,211,252,0.32) 0, transparent 32%),
      var(--hielo);
    color: var(--tinta); min-height: 100vh;
  }
  header { background: var(--profundo); color: #fff; padding: 18px 24px; display: flex; align-items: center; justify-content: space-between; }
  header a { color: inherit; text-decoration: none; display: flex; align-items: center; gap: 10px; }
  header .marca { font-family: 'Grandstander', sans-serif; font-weight: 700; font-size: 1.4rem; }
  header .marca .ai {
    display: inline-block; color: var(--aqua); background: rgba(255,255,255,0.14);
    padding: 1px 10px; border-radius: 999px; font-size: 0.75em; vertical-align: middle;
  }
  #btnSalir { background: none; border: 1px solid rgba(255,255,255,0.4); color: #fff; padding: 7px 14px; border-radius: 999px; font-size: 0.85rem; cursor: pointer; }
  main { max-width: 640px; margin: 0 auto; padding: 32px 20px 80px; }
  /* La racha vivía como una tarjeta más en medio de la lista de temas
     (pedido de la usuaria, 2-sep-2026: "la racha puede estar fuera de la
     sección de los temas"). Ahora es una franja propia debajo del header:
     se ve en TODAS las pantallas de esta página — también mientras lees un
     tema o contestas la trivia — y deja de competir por atención con
     "Mis temas anteriores". */
  /* ── Pantalla de perfil (2-sep-2026) ───────────────────────────────
     Antes se entraba directo al formulario de generar, con seis tarjetas
     encima. Ahora lo primero es el perfil: quién es, cómo aprende, cómo
     va y sus temas; generar es UN botón. */
  .hero-perfil { display: flex; gap: 14px; align-items: center; }
  .hero-perfil .datos { flex: 1 1 auto; min-width: 0; }
  .hero-perfil h1 { margin: 0; font-size: 1.35rem; line-height: 1.2; }
  .chips-inteligencia { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .chip-inteligencia { border-radius: 999px; padding: 2px 10px; font-size: 0.72rem; font-weight: 800; color: #fff; }
  /* Las tres tarjetas (racha / temas / medallas) tienen que verse del mismo
     alto y con los numeros y las etiquetas alineados entre si. Dos cosas lo
     rompian: el emoji de la racha crece la linea del numero solo en esa
     tarjeta, y "temas completados" ocupa dos renglones donde "medallas"
     ocupa uno. Por eso el numero va en una franja de alto fijo (con el
     emoji a tamano controlado) y la etiqueta reserva siempre dos renglones. */
  .rejilla-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-auto-rows: 1fr; gap: 8px; margin-top: 16px; }
  .stat-perfil {
    background: var(--hielo); border-radius: 14px; padding: 10px 6px; text-align: center;
    display: flex; flex-direction: column; justify-content: center; gap: 2px;
  }
  .stat-perfil .num {
    font-family: 'Grandstander', sans-serif; font-weight: 700; font-size: 1.25rem; color: var(--profundo);
    display: flex; align-items: center; justify-content: center; gap: 5px;
    height: 28px; line-height: 1; white-space: nowrap;
  }
  .stat-perfil .num .emoji { font-size: 1.05rem; line-height: 1; font-family: 'Nunito', sans-serif; }
  .stat-perfil .lbl {
    font-size: 0.7rem; color: #4A6A85; font-weight: 700; line-height: 1.25;
    min-height: 2.5em; display: flex; align-items: center; justify-content: center;
  }
  .burbujas-perfil { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .burbuja-perfil {
    display: flex; align-items: center; gap: 7px; background: #fff; border: 2px solid var(--linea);
    border-radius: 999px; padding: 3px 12px 3px 3px; font-weight: 700; font-size: 0.82rem;
    color: #4A6A85; cursor: pointer; font-family: inherit;
  }
  .burbuja-perfil.activa { border-color: var(--profundo); color: var(--profundo); font-weight: 800; }
  .burbuja-perfil.nueva { padding: 3px 14px; border-style: dashed; }
  .acciones-perfil { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .acciones-perfil .secundario { width: 100%; margin-top: 0; }
  .barra-racha { background: #fff; border-bottom: 2px solid var(--linea); }
  .barra-racha-interna { max-width: 640px; margin: 0 auto; padding: 12px 20px; }
  .barra-racha-fila { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .tarjeta { background: #fff; border: 2px solid var(--linea); border-radius: 18px; padding: 22px; margin-bottom: 18px; box-shadow: 0 3px 0 var(--linea); }
  h1 { font-family: 'Grandstander', sans-serif; font-size: 1.4rem; margin: 0 0 6px; }
  h2 { font-family: 'Grandstander', sans-serif; font-size: 1.15rem; margin: 0 0 8px; color: var(--profundo); }
  h3 { font-family: 'Grandstander', sans-serif; color: var(--bosque); font-size: 0.98rem; margin: 16px 0 8px; }
  p.ayuda { color: #4A6A85; margin: 0 0 16px; }
  label { display: block; font-weight: 700; font-size: 0.9rem; margin: 14px 0 6px; }
  input, select, textarea { width: 100%; padding: 12px 14px; border: 2px solid var(--linea); border-radius: 12px; font-family: inherit; font-size: 1rem; }
  textarea { resize: vertical; min-height: 76px; line-height: 1.45; }
  .zona-foto { border: 2px dashed var(--linea); border-radius: 12px; padding: 14px; text-align: center; }
  .zona-foto input[type="file"] { display: none; }
  .zona-foto .btn-foto {
    display: inline-block; background: var(--hielo); border: 2px solid var(--menta); color: var(--bosque);
    padding: 9px 18px; border-radius: 999px; font-weight: 700; font-size: 0.88rem; cursor: pointer;
  }
  .miniaturas { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; justify-content: center; }
  .miniatura { position: relative; width: 74px; height: 74px; border-radius: 10px; overflow: hidden; border: 2px solid var(--linea); }
  .miniatura img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .miniatura button {
    position: absolute; top: 2px; right: 2px; width: 20px; height: 20px; border-radius: 50%;
    background: rgba(0,0,0,0.62); color: #fff; border: none; font-size: 0.72rem; line-height: 1; cursor: pointer; padding: 0;
  }
  button.primario {
    width: 100%; background: var(--profundo); color: #fff; border: none; padding: 14px; border-radius: 999px;
    font-family: 'Grandstander', sans-serif; font-weight: 600; font-size: 1rem; cursor: pointer; margin-top: 16px;
    box-shadow: 0 4px 0 var(--profundo-oscuro);
  }
  button.secundario { background: none; border: 2px solid var(--linea); color: var(--profundo); padding: 8px 14px; border-radius: 999px; font-weight: 700; font-size: 0.85rem; cursor: pointer; margin-top: 10px; }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .error { background: #FFF0EC; border: 2px solid #FFC4B5; color: #B94A2E; padding: 12px 14px; border-radius: 12px; margin-top: 12px; font-size: 0.9rem; }
  /* Campo obligatorio que se dejó vacío: el aviso va PEGADO al campo. El
     error suelto al pie del formulario no se relacionaba con nada en
     celular — ver marcarCampoFaltante(). */
  .campo-faltante { border-color: #E86A4B !important; background: #FFF6F3 !important; }
  .error-campo { color: #B94A2E; font-size: 0.85rem; font-weight: 700; margin: 4px 0 2px; }
  .aviso { background: var(--hielo); border: 2px dashed var(--menta); border-radius: 12px; padding: 12px 14px; font-size: 0.9rem; color: var(--bosque); margin-bottom: 16px; }
  .cargando { text-align: center; padding: 40px 20px; color: #4A6A85; }
  .actividad-box { background: var(--hielo); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; }
  .actividad-box .inteligencia { display: inline-block; background: var(--menta); color: #fff; font-size: 0.72rem; font-weight: 700; padding: 2px 10px; border-radius: 999px; margin-bottom: 6px; text-transform: uppercase; }
  .barra-perfil-fila { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .barra-perfil-label { flex: 0 0 130px; font-size: 0.8rem; font-weight: 700; color: var(--profundo); }
  .barra-perfil-track { flex: 1; background: var(--linea); border-radius: 999px; height: 10px; overflow: hidden; }
  .barra-perfil-fill { height: 100%; background: var(--aqua); border-radius: 999px; }
  .barra-perfil-fill.dominante { background: var(--profundo); }
  .barra-perfil-pct { flex: 0 0 32px; text-align: right; font-size: 0.78rem; color: #4A6A85; }
  .avatar-perfil {
    display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
    border-radius: 50%; color: #fff; overflow: hidden; vertical-align: middle;
  }
  .avatar-perfil img { width: 78%; height: 78%; object-fit: contain; display: block; }
  .rejilla-avatares { display: flex; flex-wrap: wrap; gap: 8px; }
  .opcion-avatar {
    width: 46px; height: 46px; border-radius: 50%; border: 2px solid var(--linea); background: #fff;
    font-size: 1.3rem; cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: border-color .15s, transform .15s;
  }
  .opcion-avatar img { width: 76%; height: 76%; object-fit: contain; }
  .opcion-avatar:hover { transform: translateY(-2px); border-color: var(--cielo); }
  .opcion-avatar.activa { border-color: var(--profundo); background: #EAF1FE; }

  /* ── Intro al quiz (onboarding) ── */
  .rejilla-intro { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .chip-intro {
    width: 40px; height: 40px; border-radius: 50%; color: #fff;
    display: inline-flex; align-items: center; justify-content: center; font-size: 1.05rem;
  }

  /* ── Tarjeta de perfil activo ── */
  .perfil-activo {
    display: flex; align-items: center; gap: 11px;
    border: 2px solid var(--linea); border-radius: 14px; padding: 11px 14px; margin-top: 8px;
    background: #fff;
  }
  .perfil-activo.neutro { border-style: dashed; }
  .perfil-activo strong { display: block; font-size: 0.93rem; color: var(--profundo); }
  .perfil-activo .pa-sub { display: block; font-size: 0.79rem; color: #5b7d99; margin-top: 1px; }
  .pa-icono {
    flex-shrink: 0; width: 34px; height: 34px; border-radius: 50%; color: #fff;
    display: inline-flex; align-items: center; justify-content: center; font-size: 0.95rem;
    background: var(--linea);
  }
  .pa-icono.chico { width: 24px; height: 24px; font-size: 0.75rem; vertical-align: middle; margin-right: 4px; }

  /* ── Pestañas del material ── */
  .pestanas { display: flex; gap: 4px; background: var(--hielo); border-radius: 999px; padding: 4px; margin: 14px 0 20px; }
  .pestana {
    flex: 1; border: none; background: none; padding: 10px 6px; border-radius: 999px; cursor: pointer;
    font-family: 'Grandstander', sans-serif; font-weight: 600; font-size: 0.86rem; color: #5b7d99;
    transition: background .15s, color .15s;
  }
  .pestana.activa { background: #fff; color: var(--profundo); box-shadow: 0 2px 6px rgba(30,58,138,0.12); }
  .pestana-num { display: inline-block; background: var(--menta); color: #fff; border-radius: 999px; padding: 0 6px; font-size: 0.72rem; }

  /* ── Bloques de la pestaña Estudiar ── */
  .bloque-est { border-left: 4px solid var(--linea); padding: 2px 0 2px 14px; margin-bottom: 18px; }
  .bloque-est p { margin: 0; line-height: 1.65; font-size: 0.95rem; }
  .bloque-est.destacado { border-left-color: var(--menta); background: var(--hielo); border-radius: 0 12px 12px 0; padding: 14px 16px; }
  .bloque-est.destacado p { font-size: 1rem; color: var(--bosque); font-weight: 600; }
  .bloque-titulo { font-family: 'Grandstander', sans-serif; color: var(--profundo); font-size: 0.98rem; margin: 0 0 6px; }
  .parrafo-largo { margin: 0 0 10px; line-height: 1.6; }
  .parrafo-largo:last-child { margin-bottom: 0; }
  .lista-pasos { margin: 0; padding-left: 20px; }
  .lista-pasos li { margin-bottom: 7px; line-height: 1.55; font-size: 0.94rem; }
  .lista-ideas { margin: 0; padding-left: 18px; list-style: none; }
  .lista-ideas li { margin-bottom: 7px; line-height: 1.5; font-size: 0.94rem; position: relative; }
  .lista-ideas li::before { content: "▪"; color: var(--menta); position: absolute; left: -14px; font-size: 1.1rem; }
  .caja-ojo, .caja-truco { border-radius: 12px; padding: 13px 16px; margin-bottom: 16px; }
  .caja-ojo { background: #FFF7E6; border: 2px solid #FFDFA0; }
  .caja-truco { background: #F3F0FF; border: 2px solid #D9D2FF; }
  .caja-ojo strong, .caja-truco strong { display: block; font-size: 0.88rem; margin-bottom: 4px; }
  .caja-ojo strong { color: #8A6100; } .caja-truco strong { color: #4B3BA8; }
  .caja-ojo p, .caja-truco p { margin: 0; font-size: 0.93rem; line-height: 1.55; }
  .bloque-est.plegable { border-left-color: var(--cielo); }
  .bloque-est.plegable summary { cursor: pointer; font-weight: 700; font-size: 0.9rem; color: #5b7d99; }


  /* ── Ejercicios ── */
  .ejercicio { border: 2px solid var(--linea); border-radius: 14px; padding: 15px; margin-bottom: 12px; }
  .ejercicio-cabeza { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 10px; }
  .ejercicio-num {
    flex-shrink: 0; width: 26px; height: 26px; border-radius: 50%; background: var(--profundo); color: #fff;
    font-family: 'Grandstander', sans-serif; font-size: 0.8rem;
    display: flex; align-items: center; justify-content: center;
  }
  .ejercicio-enunciado { margin: 0; font-weight: 700; line-height: 1.5; font-size: 0.95rem; }
  .btn-pista, .btn-solucion {
    border: 2px solid var(--linea); background: #fff; border-radius: 999px; padding: 7px 16px;
    font-family: inherit; font-weight: 700; font-size: 0.82rem; cursor: pointer; color: #5b7d99; margin-right: 6px;
  }
  .btn-solucion { border-color: var(--menta); color: var(--bosque); }
  .btn-revisar-mio { display: inline-block; margin-top: 8px; background: #fff; border: 2px solid var(--cielo); color: var(--profundo); font-family: inherit; font-weight: 700; font-size: 0.82rem; padding: 5px 12px; border-radius: 999px; cursor: pointer; }
  .btn-solucion.abierta { background: var(--hielo); }
  .pista-caja { background: #FFF7E6; border-radius: 10px; padding: 10px 13px; margin-top: 9px; font-size: 0.9rem; color: #8A6100; }
  .solucion-caja { background: var(--hielo); border-radius: 10px; padding: 13px 15px; margin-top: 10px; }
  .ejercicio-respuesta {
    background: var(--menta); color: #fff; border-radius: 8px; padding: 8px 13px; margin-top: 10px;
    font-weight: 700; font-size: 0.93rem;
  }
  .ejercicio-marcar {
    display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 0.85rem; font-weight: 700;
    color: var(--bosque); cursor: pointer;
  }
  .ejercicio-marcar input { width: 17px; height: 17px; accent-color: var(--menta); cursor: pointer; }
  .btn-guardar-progreso { width: 100%; margin-top: 4px; }
  .progreso-aviso { text-align: center; font-size: 0.85rem; font-weight: 700; color: var(--bosque); margin-top: 8px; }

  /* ── Espera con tips ── */
  .zona-espera { padding: 20px 4px 8px; text-align: center; }
  .espera-barra { height: 5px; border-radius: 999px; background: var(--linea); overflow: hidden; margin-bottom: 16px; }
  .espera-barra span {
    display: block; height: 100%; width: 38%; border-radius: 999px;
    background: linear-gradient(90deg, var(--cielo), var(--menta));
    animation: espera-desliza 1.5s ease-in-out infinite;
  }
  @keyframes espera-desliza {
    0%   { transform: translateX(-100%); }
    100% { transform: translateX(265%); }
  }
  .espera-titulo { color: #4A6A85; font-size: 0.92rem; margin: 0 0 16px; }
  .btn-seguir-navegando {
    background: none; border: none; color: #5b7d99; font-family: inherit; font-weight: 700;
    font-size: 0.83rem; text-decoration: underline; cursor: pointer; margin-top: 14px;
  }
  /* Aviso flotante de "se está generando en segundo plano" (31-ago-2026):
     generar tarda ~1 min y antes eso dejaba la pantalla secuestrada. Ahora
     se puede seguir navegando y este aviso avisa cuando el tema ya está. */
  .aviso-generacion {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 16px; z-index: 60;
    display: flex; align-items: center; gap: 10px; max-width: calc(100% - 24px);
    background: #fff; border: 2px solid var(--aqua); border-radius: 999px; padding: 10px 14px;
    box-shadow: 0 6px 20px rgba(30,58,138,0.18);
    font-size: 0.86rem; font-weight: 700; color: var(--profundo);
  }
  .aviso-generacion.listo { border-color: var(--menta); }
  .aviso-generacion.falla { border-color: #FFC4B5; color: #B94A2E; }
  .aviso-generacion .texto { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .aviso-generacion button {
    flex-shrink: 0; border: none; border-radius: 999px; padding: 7px 14px; cursor: pointer;
    font-family: 'Grandstander', sans-serif; font-weight: 600; font-size: 0.82rem;
    background: var(--menta); color: #fff;
  }
  .aviso-generacion button.cerrar { background: none; color: #5b7d99; padding: 7px 4px; font-size: 1rem; }
  .tip-caja {
    display: flex; gap: 12px; text-align: left; align-items: flex-start;
    background: var(--hielo); border: 2px dashed var(--menta); border-radius: 14px; padding: 14px 16px;
    animation: tip-aparece .45s ease;
  }
  @keyframes tip-aparece { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .tip-icono { font-size: 1.15rem; line-height: 1.4; flex-shrink: 0; }
  .tip-texto { margin: 0; font-size: 0.92rem; line-height: 1.5; color: var(--bosque); }
  .tip-puntos { display: flex; gap: 5px; justify-content: center; margin-top: 12px; }
  .tip-puntos span { width: 6px; height: 6px; border-radius: 50%; background: var(--linea); transition: background .3s; }
  .tip-puntos span.activo { background: var(--menta); }

  /* ── Quiz de perfil ── */
  .quiz-pregunta { border: 2px solid var(--linea); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  .quiz-enunciado { font-weight: 700; font-size: 0.92rem; margin: 0 0 10px; line-height: 1.4; }
  .quiz-opciones { display: grid; gap: 6px; }
  .quiz-opcion {
    display: flex; align-items: center; gap: 9px; text-align: left; width: 100%;
    background: #fff; border: 2px solid var(--linea); border-radius: 10px; padding: 9px 12px;
    font-family: inherit; font-size: 0.9rem; color: var(--tinta); cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .quiz-opcion:hover { border-color: var(--cielo); background: var(--hielo); }
  .quiz-marca {
    flex-shrink: 0; width: 26px; height: 22px; border-radius: 999px; background: var(--linea);
    font-size: 0.68rem; font-weight: 800; color: #5b7d99;
    display: flex; align-items: center; justify-content: center;
  }
  .quiz-opcion.primaria { border-color: var(--profundo); background: #EAF1FE; font-weight: 700; }
  .quiz-opcion.primaria .quiz-marca { background: var(--profundo); color: #fff; }
  .quiz-opcion.secundaria { border-color: var(--menta); background: #E7FBF3; }
  .quiz-opcion.secundaria .quiz-marca { background: var(--menta); color: #fff; }

  /* ── Resultado del perfil ── */
  .perfil-principales { display: grid; gap: 10px; }
  .perfil-principal { display: flex; align-items: center; gap: 12px; border: 2px solid; border-radius: 14px; padding: 12px 14px; background: #fff; }
  .perfil-principal strong { display: block; font-size: 1rem; color: var(--profundo); font-family: 'Grandstander', sans-serif; }
  .perfil-icono {
    flex-shrink: 0; width: 38px; height: 38px; border-radius: 50%; color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 1.05rem;
  }
  .perfil-icono.chico { width: 30px; height: 30px; font-size: 0.9rem; margin-bottom: 6px; }
  .perfil-tipo-chico { display: block; font-size: 0.76rem; color: #5b7d99; margin-top: 1px; }
  .chip-secundaria { background: var(--hielo); border: 1px solid var(--linea); border-radius: 999px; padding: 5px 12px; font-size: 0.8rem; color: #4A6A85; }
  .detalle-quiz { margin-top: 14px; }
  .detalle-quiz summary { cursor: pointer; font-size: 0.85rem; color: #5b7d99; font-weight: 700; }

  let sesionActual = null;

  let ultimoTemaId = null;

  let mostrarAprendidos = false;

  let progresoCache = null;
  let etiquetaActivaProgreso = "";
  // Ids de temas del historial marcados para juntar en un repaso de examen
  // (ver combinarTemas() más abajo). Vive fuera de renderHistorial() para
  // no perderse cuando la persona busca o filtra por etiqueta.

  // Modo Examen admite más temas de golpe (ej. "todo Matemáticas del primer
  // parcial") porque el simulacro está pensado para practicar, no para leer
  // — el backend acepta hasta este mismo número (ver routes/temas.js).
  const MAX_TEMAS_COMBINAR_EXAMEN = 12;
  // Se mantiene fuera de actualizarBarraCombinar() para no perderse cada
  // vez que se vuelve a dibujar la barra al cambiar la selección.
  let modoExamenActivo = false;

  function escapeHtml(str) {
    const d = document.createElement("div");
    d.textContent = str || "";
    return d.innerHTML;
  }

  /**
   * El modelo escribe en markdown aunque se le pida texto plano — sale
   * "**1. Género Narrativo**" con los asteriscos a la vista, que se ve roto.
   * Esto convierte lo mínimo (negritas, cursivas, código y saltos de línea)
   * a HTML de verdad.
   *
   * SIEMPRE escapa primero: las únicas etiquetas que llegan al DOM son las
   * que se generan aquí, nunca las que pudiera traer el texto.
   */
  function formatearTexto(str) {
    let t = escapeHtml(str || "");
    t = t.replace(/\*\*\*([^*]+)\*\*\*/g, "<strong><em>$1</em></strong>");
    t = t.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    t = t.replace(/(^|[\s([{])\*([^*\s][^*]*?)\*/g, "$1<em>$2</em>");
    t = t.replace(/__([^_]+)__/g, "<strong>$1</strong>");
    t = t.replace(/`([^`]+)`/g, "<code>$1</code>");
    return t.replace(/\n/g, "<br>");
  }

  /**
   * "Más estructurado cuando hay mucho texto" (pedido de la usuaria,
   * 2-sep-2026): la IA suele devolver la actividad como UN párrafo enorme
   * con los pasos numerados en línea ("1. Ponte de pie... 2. Repite el
   * verso..."). En celular eso es un muro de texto imposible de seguir
   * MIENTRAS haces la actividad. Esto lo estructura al pintarlo, sin tocar
   * lo que ya está guardado — así también se arreglan los temas viejos del
   * historial, no solo los que se generen de aquí en adelante.
   *
   * Reglas a propósito conservadoras (mejor no partir que partir mal):
   * - Lista numerada solo si los marcadores van 1, 2, 3... consecutivos y
   *   hay al menos dos. Así "3.5", "(3, 4, 5)" o "1/2" no la disparan.
   * - Viñetas solo cuando el guion/•/– ABRE renglón: a media frase casi
   *   siempre es un inciso, no una lista.
   * - Sin marcadores, un texto muy largo se parte en párrafos de ~3 frases
   *   para que respire; uno corto se deja exactamente igual que antes.
   */
  function formatearLargo(str) {
    const bruto = String(str == null ? "" : str).trim();
    if (!bruto) return "";

    // 1) Pasos numerados: "1. ", "2) "...
    const marcas = [];
    const re = /(^|[\s (])(\d{1,2})[.)]\s+/g;
    let m;
    while ((m = re.exec(bruto)) !== null) {
      marcas.push({ num: parseInt(m[2], 10), inicio: m.index + m[1].length, fin: re.lastIndex });
    }
    const secuencia = [];
    let esperado = 1;
    for (let i = 0; i < marcas.length; i++) {
      if (marcas[i].num === esperado) {
        secuencia.push(marcas[i]);
        esperado++;
      }
    }
    if (secuencia.length >= 2) {
      const pasos = [];
      for (let i = 0; i < secuencia.length; i++) {
        const hasta = i + 1 < secuencia.length ? secuencia[i + 1].inicio : bruto.length;
        const paso = bruto.slice(secuencia[i].fin, hasta).trim();
        if (paso) pasos.push(paso);
      }
      if (pasos.length >= 2) {
        const intro = bruto.slice(0, secuencia[0].inicio).trim();
        return (
          (intro ? `<p class="parrafo-largo">${formatearTexto(intro)}</p>` : "") +
          `<ol class="lista-pasos">${pasos.map((p) => `<li>${formatearTexto(p)}</li>`).join("")}</ol>`
        );
      }
    }

    // 2) Viñetas al inicio de renglón
    const renglones = bruto.split(/\n+/).map((l) => l.trim()).filter(Boolean);
    const esVineta = (l) => /^[-–—•*]\s+/.test(l);
    const primera = renglones.findIndex(esVineta);
    if (primera !== -1 && renglones.slice(primera).filter(esVineta).length >= 2) {
      const intro = renglones.slice(0, primera).join(" ").trim();
      const items = [];
      renglones.slice(primera).forEach((l) => {
        if (esVineta(l)) items.push(l.replace(/^[-–—•*]\s+/, ""));
        else if (items.length) items[items.length - 1] += " " + l;
      });
      return (
        (intro ? `<p class="parrafo-largo">${formatearTexto(intro)}</p>` : "") +
        `<ul class="lista-ideas">${items.map((t) => `<li>${formatearTexto(t)}</li>`).join("")}</ul>`
      );
    }

    // 3) Sin marcadores: párrafos que respiren
    const parrafos = [];
    bruto
      .split(/\n{2,}/)
      .map((b) => b.trim())
      .filter(Boolean)
      .forEach((bloque) => {
        if (bloque.length <= 320) {
          parrafos.push(bloque);
          return;
        }
        const frases = bloque.match(/[^.!?…]+[.!?…]+["'”’)\]]*\s*|[^.!?…]+$/g) || [bloque];
        let acumulado = "";
        frases.forEach((f) => {
          acumulado += f;
          if (acumulado.length >= 220) {
            parrafos.push(acumulado.trim());
            acumulado = "";
          }
        });
        const resto = acumulado.trim();
        if (resto) {
          // Una cola muy corta como párrafo suelto se ve peor que pegada.
          if (resto.length < 60 && parrafos.length) parrafos[parrafos.length - 1] += " " + resto;
          else parrafos.push(resto);
        }
      });
    return parrafos.map((p) => `<p class="parrafo-largo">${formatearTexto(p)}</p>`).join("");
  }

  /* El imprimible del material de repaso (tarjetas de doblar, memorama,
     y "imprimir todo") vive en imprimible.js — lo comparten tema.html,
     g.html y grupo.html. Aqui solo quedan los dos atajos. */
  function imprimirTarjetas(tipo, tarjetas) {
    if (window.EnsenaiImprimible) window.EnsenaiImprimible.tarjetas(tipo, tarjetas);
  }

    if (window.EnsenaiImprimible) window.EnsenaiImprimible.materialExtra(materiales, tituloTema);
  }

  // Un fetch que nunca llegó al servidor (sin internet, backend caído,
  // CORS) lanza un TypeError genérico ("Failed to fetch" en Chrome, "Load
  // failed" en Safari) — no tiene sentido mostrárselo tal cual al usuario.
  // Un error de negocio real (los que lanzamos nosotros con Error(...) más
  // abajo) sí es legible y se muestra tal cual.
  /**
   * Marca un campo obligatorio vacío: lo pinta, escribe el motivo justo
   * debajo, lo desplaza a la vista y le pone el cursor dentro.
   *
   * Existe porque la validación pintaba el error al FINAL del formulario,
   * a media pantalla del campo culpable: en celular se leía "escribe sobre
   * qué tema quieres generar material" sin ver que el campo Tema estaba
   * vacío, y la gente terminaba escribiendo el tema en Etiquetas
   * (reporte sep-2026).
   */
  function marcarCampoFaltante(campo, mensaje) {
    if (!campo) return;
    limpiarCampoFaltante(campo);
    campo.classList.add("campo-faltante");
    const aviso = document.createElement("p");
    aviso.className = "error-campo";
    aviso.id = `error-campo-${campo.id}`;
    aviso.textContent = `⚠️ ${mensaje}`;
    campo.insertAdjacentElement("afterend", aviso);
    campo.setAttribute("aria-invalid", "true");
    campo.scrollIntoView({ behavior: "smooth", block: "center" });
    // El foco va después del scroll: enfocar primero hace que el navegador
    // salte de golpe y se pierda el desplazamiento suave.
    setTimeout(() => campo.focus({ preventScroll: true }), 300);
    // Se limpia sola en cuanto la persona empieza a escribir.
    campo.addEventListener("input", () => limpiarCampoFaltante(campo), { once: true });
  }

  function limpiarCampoFaltante(campo) {
    if (!campo) return;
    campo.classList.remove("campo-faltante");
    campo.removeAttribute("aria-invalid");
    document.getElementById(`error-campo-${campo.id}`)?.remove();
  }

  function mensajeErrorAmigable(err) {
    return err instanceof TypeError
      ? "No pudimos conectar con el servidor. Revisa tu internet e intenta de nuevo."
      : err.message;
  }

  // El backend (Render, plan gratuito) se "duerme" tras un rato sin uso y
  // tarda 30-60s en despertar con la primera petición — esa primera
  // petición puede fallar con un "Failed to fetch" genérico. Este helper
  // avisa con un mensaje amigable y reintenta una vez antes de rendirse.
  // Rutas que CREAN algo caro (gastan cupo del plan y minutos de modelo).
  // Nunca se reintentan solas: si el primer intento ya llegó al servidor,
  // un reintento genera el material DOS veces.
  const RUTAS_QUE_NO_SE_REINTENTAN = [
    "/api/temas/generar", "/api/temas/combinar", "/api/temas/revisar",
    // El PDF también cuesta (llama a la IA y sube a Storage) y adaptar por
    // inteligencia genera 8 actividades con el modelo.
    "/api/temas/pdf", "/actividades",
  ];
  // Agregar un tema a la liga (POST /api/grupos/<id>/temas) consume cupo del
  // plan y crea la fila: reintentarlo a ciegas dejaba el tema DUPLICADO en el
  // grupo. Se detecta aparte porque la ruta lleva el id del grupo en medio.
  const esAgregarTemaALiga = (url) => /\/api\/grupos\/[^/]+\/temas(\?|$)/.test(url);
  // Un fetch que truena casi de inmediato es "nunca salió" (servidor
  // dormido, sin internet); uno que truena después de un rato pudo haber
  // llegado y seguir procesándose del otro lado.
  const MS_FALLO_INMEDIATO = 3000;

  async function fetchConReintento(url, opciones, cont, mensajeEspera) {
    const metodo = (opciones?.method || "GET").toUpperCase();
    const esIdempotente = metodo === "GET" || metodo === "HEAD";
    const esCara = RUTAS_QUE_NO_SE_REINTENTAN.some((r) => url.includes(r)) || esAgregarTemaALiga(url);
    const t0 = Date.now();

    try {
      return await fetch(url, opciones);
    } catch (err) {
      const tardo = Date.now() - t0;

      // Peticiones que escriben: reintentar a ciegas es lo que producía
      // material duplicado y cupo gastado doble (31-ago-2026). Solo se
      // reintenta lo que es seguro reintentar.
      if (!esIdempotente && (esCara || tardo >= MS_FALLO_INMEDIATO)) {
        throw new Error(
          tardo >= MS_FALLO_INMEDIATO
            ? "Se perdió la conexión, pero es posible que el material SÍ se haya generado del otro lado. Revisa si ya aparece en tu lista antes de volver a intentar, para no generarlo dos veces."
            : "No pudimos conectar con el servidor. Vuelve a intentarlo."
        );
      }

      if (cont) {
        cont.innerHTML = `<div class="cargando">${mensajeEspera || "Despertando el servidor… puede tardar hasta un minuto la primera vez, ya casi."}</div>`;
      }
      await new Promise((r) => setTimeout(r, 4000));
      try {
        return await fetch(url, opciones);
      } catch (err2) {
        throw new Error("El servidor está tardando en responder. Espera unos segundos y vuelve a intentarlo.");
      }
    }
  }

  async function init() {
    const { data } = await supabaseClient.auth.getSession();
    if (!data.session) {
      window.location.href = "comprador.html?despues=tema";
      return;
    }
    sesionActual = data.session;

    document.getElementById("btnSalir").onclick = async () => {
      await supabaseClient.auth.signOut();
      window.location.href = "comprador.html";
    };

    await cargarTipoUsuario();
    mostrarPerfil();

    // Si quedó una generación a medias (se bloqueó el celular, se cerró la
    // pestaña), se retoma en silencio y se avisa cuando esté lista.
    reanudarTrabajoPendiente();

    // `?bienvenida=1` lo pone comprador.html cuando alguien acaba de decir
    // quién es. En vez de dejarlo frente a un formulario vacío, se le abre
    // directo el quiz: es lo más "wow" del producto y explica de golpe por
    // qué el material va a estar personalizado.
    const params = new URLSearchParams(window.location.search);
    if (params.get("bienvenida") === "1") {
      mostrarIntroQuiz();
      // Quitar el parámetro para que la intro no se repita al refrescar.
      // En try/catch porque replaceState truena en contextos sin origen
      // (por ejemplo al abrir el archivo directo con file://).
      try {
        history.replaceState({}, "", "tema.html");
      } catch (err) {
        /* sin consecuencias: solo significa que al refrescar se vuelve a ver */
      }
    }
  }

      return;

    const perfil = perfilesCache.find((p) => p.id === perfilActivoId) || perfilesCache[0];

    const g = gamificacionCache || { racha_actual: 0, medallas: [] };

    cont.innerHTML = `

        <div class="datos">

                (t) =>

              .join("")}

      ${
        tipos.length
          ? `<p class="ayuda" style="margin:14px 0 0; font-size:0.85rem;">${esAdulto ? "Aprendes" : "Aprende"} mejor ${escapeHtml(
              tipos.map((t) => (COMO_APRENDE[t] || "").toLowerCase()).filter(Boolean).join(", y también ")
            )}. Todo el material sale así.</p>`
          : ""
      }
      <div class="rejilla-stats">
        <div class="stat-perfil"><div class="num"><span class="emoji">🔥</span>${g.racha_actual || 0}</div><div class="lbl">día${g.racha_actual === 1 ? "" : "s"} de racha</div></div>
        <div class="stat-perfil"><div class="num">${completados}</div><div class="lbl">tema${completados === 1 ? "" : "s"} completado${completados === 1 ? "" : "s"}</div></div>
        <div class="stat-perfil"><div class="num">${(g.medallas || []).length}</div><div class="lbl">medalla${(g.medallas || []).length === 1 ? "" : "s"}</div></div>

    cont.querySelectorAll("[data-perfil-burbuja]").forEach((btn) => {

  /**
   * Racha + medallas + trivia diaria — el "gancho para volver" del modo
   * individual (ver utils/gamificacion.js en el backend). Si algo falla
   * aquí no debe estorbar el resto de la app: simplemente no se muestra
   * nada, la persona sigue pudiendo generar temas con normalidad.
   */
  let triviaDiariaCargada = false;

  async function cargarGamificacion() {
    const cont = document.getElementById("barra-racha");
    if (!cont) return;
    try {
      const res = await fetchConReintento(
        `${API_BASE}/api/temas/mi-plan`,
        { headers: { Authorization: `Bearer ${sesionActual.access_token}` } },
        null,
        null
      );
      const plan = await res.json();
      if (!res.ok) throw new Error(plan.error || "No se pudo cargar tu racha.");
      gamificacionCache = plan.gamificacion || { racha_actual: 0, racha_record: 0, medallas: [] };
      renderGamificacion(gamificacionCache);
      pintarHeroPerfil(); // la racha y las medallas también se ven en el perfil
    } catch (err) {
      // No es crítico: mejor esconder la franja que dejar un hueco roto.
      const barra = document.getElementById("barra-racha");
      if (barra) barra.style.display = "none";
    }
  }

  function renderGamificacion(g) {
    const cont = document.getElementById("barra-racha");
    if (!cont) return;
    cont.style.display = "";
    cont.innerHTML = `
      <div class="barra-racha-interna">
      <div class="barra-racha-fila">
        <div>
          <p id="racha-titulo" style="margin:0; font-weight:800; font-family:'Grandstander',sans-serif; color:var(--profundo); font-size:1.05rem;"></p>
          <p id="racha-sub" class="ayuda" style="margin:2px 0 0; font-size:0.82rem;"></p>
        </div>
        <button type="button" class="secundario" id="btn-abrir-trivia-diaria" style="white-space:nowrap;">🧠 Trivia diaria</button>
      </div>
      <div id="zona-trivia-diaria" style="display:none; margin-top:14px;"></div>
      </div>
    `;
    actualizarRachaChip(g);
    document.getElementById("btn-abrir-trivia-diaria").addEventListener("click", toggleTriviaDiaria);
  }

  // Actualiza SOLO el texto de la racha, sin volver a crear #zona-trivia-diaria
  // — se usa después de completar la trivia diaria, cuando esa zona ya trae
  // las respuestas revisadas y no se debe perder ese estado.
  function actualizarRachaChip(g) {
    const titulo = document.getElementById("racha-titulo");
    const sub = document.getElementById("racha-sub");
    // Los números se leen con || 0: si el backend responde sin ellos (o con
    // una forma vieja), la franja decía "Récord: undefined días".
    const actual = g.racha_actual || 0;
    const record = g.racha_record || 0;
    if (titulo) titulo.textContent = `🔥 Racha: ${actual} día${actual === 1 ? "" : "s"}`;
    if (sub) {
      sub.textContent =
        actual > 0
          ? `Récord: ${record} día${record === 1 ? "" : "s"}`
          : "Genera un tema o haz tu trivia diaria para empezar tu racha.";
    }
  }

  /**
   * "Mi progreso" (31-ago-2026): a diferencia de la racha (que mide
   * actividad), esto mide DOMINIO — qué tema ya se domina y cuál sigue
   * flojo, usando las respuestas de trivia que se van guardando por tema
   * (ver enviarRespuestasTrivia y GET /api/temas/mi-progreso). Igual que la
   * racha, junta el progreso de TODOS los perfiles/hijos de la cuenta —
   * mis_temas no guarda con cuál se generó cada tema.
   */
  async function cargarMiProgreso() {
    const cont = document.getElementById("zona-mi-progreso");
    if (!cont) return;
    try {
      const res = await fetchConReintento(
        `${API_BASE}/api/temas/mi-progreso`,
        { headers: { Authorization: `Bearer ${sesionActual.access_token}` } },
        null,
        null
      );
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "No se pudo cargar tu progreso.");
      progresoCache = data;
      etiquetaActivaProgreso = ""; // por si se recarga después de generar más temas
      renderMiProgreso();
    } catch (err) {
      document.getElementById("tarjeta-mi-progreso")?.remove(); // no es crítico — mejor ocultarlo que dejar un hueco roto
    }
  }

  /**
   * Filtro por etiqueta dentro de "Mi progreso" (31-ago-2026): en vez de una
   * racha separada por materia/parcial (que necesitaría una categoría
   * confiable y las etiquetas son libres y opcionales), se reutiliza la
   * etiqueta que la persona ya le puso a cada tema — el dato ya viene en
   * GET /mi-progreso, así que filtrar es puro trabajo del navegador, sin
   * pedir nada nuevo al backend. Mismo patrón visual (.chip-etiqueta) que
   * el filtro del historial (renderChipsEtiquetas), con su propia variable
   * (etiquetaActivaProgreso) para no mezclarse con ese filtro.
   */
  function renderChipsEtiquetasProgreso(temasSinFiltrar) {
    const cont = document.getElementById("chips-etiquetas-progreso");
    if (!cont) return;
    const todasEtiquetas = [...new Set(temasSinFiltrar.flatMap((t) => t.etiquetas || []))].sort();
    if (!todasEtiquetas.length) {
      cont.innerHTML = "";
      return;
    }
    cont.innerHTML =
      `<button type="button" class="chip-etiqueta${etiquetaActivaProgreso === "" ? " activa" : ""}" data-etiqueta="">Todas</button>` +
      todasEtiquetas
        .map((e) => `<button type="button" class="chip-etiqueta${etiquetaActivaProgreso === e ? " activa" : ""}" data-etiqueta="${escapeHtml(e)}">${escapeHtml(e)}</button>`)
        .join("");
    cont.querySelectorAll(".chip-etiqueta").forEach((btn) => {
      btn.addEventListener("click", () => {
        etiquetaActivaProgreso = btn.dataset.etiqueta;
        renderMiProgreso();
      });
    });
  }

  function renderMiProgreso() {
    const cont = document.getElementById("zona-mi-progreso");
    if (!cont || !progresoCache) return;
    const todosLosTemas = progresoCache.temas || [];

    if (todosLosTemas.length === 0) {
      cont.innerHTML = `<p class="ayuda" style="margin:0;">Contesta la trivia de un tema para empezar a ver aquí en qué vas mejor y qué te conviene repasar.</p>`;
      return;
    }

    const temas = etiquetaActivaProgreso ? todosLosTemas.filter((t) => (t.etiquetas || []).includes(etiquetaActivaProgreso)) : todosLosTemas;

    // Con un filtro activo, el resumen (promedio, intentos) se recalcula
    // SOLO sobre los temas de esa etiqueta — "cómo voy en Primer Parcial"
    // tiene que ser el promedio de Primer Parcial, no el general.
    const promedio_general = temas.length
      ? Math.round(temas.reduce((sum, t) => sum + t.promedio_porcentaje, 0) / temas.length)
      : null;
    const total_intentos = temas.reduce((sum, t) => sum + t.intentos, 0);

    const chipsHtml = `<div id="chips-etiquetas-progreso" style="display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px;"></div>`;

    const resumenHtml = temas.length
      ? `
      <p class="ayuda" style="margin:0 0 12px; font-size:0.85rem;">
        ${temas.length} tema${temas.length === 1 ? "" : "s"} con trivia contestada
        ${promedio_general !== null ? ` — promedio${etiquetaActivaProgreso ? ` en "${escapeHtml(etiquetaActivaProgreso)}"` : " general"}: <strong>${promedio_general}%</strong>` : ""}
        (${total_intentos} intento${total_intentos === 1 ? "" : "s"} en total).
      </p>
    `
      : `<p class="ayuda" style="margin:0 0 12px;">Ningún tema con esa etiqueta tiene trivia contestada todavía.</p>`;

    const filasHtml = temas
      .map((t) => {
        let tendencia = "";
        if (t.intentos > 1) {
          if (t.ultimo_porcentaje > t.primer_porcentaje) tendencia = " · 📈 mejorando";
          else if (t.ultimo_porcentaje < t.primer_porcentaje) tendencia = " · 📉 bajando";
          else tendencia = " · ➡️ sin cambio";
        }
        return `
        <div style="display:flex; align-items:center; justify-content:space-between; gap:10px; padding:9px 0; border-top:1px dashed var(--linea, #E3E9EF);">
          <div style="min-width:0;">
            <div style="font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${escapeHtml(t.tema)}</div>
            <div class="ayuda" style="font-size:0.78rem; margin-top:2px;">${t.intentos} intento${t.intentos === 1 ? "" : "s"}${tendencia}</div>
          </div>
          <span style="flex-shrink:0; font-weight:800; padding:4px 10px; border-radius:999px; font-size:0.85rem; ${
            t.necesita_repaso
              ? "background:#FFF0EC; color:#B3431E;"
              : "background:var(--hielo); color:var(--bosque);"
          }">${t.promedio_porcentaje}%${t.necesita_repaso ? " · repasar" : ""}</span>
        </div>
      `;
      })
      .join("");

    cont.innerHTML = chipsHtml + resumenHtml + filasHtml;
    renderChipsEtiquetasProgreso(todosLosTemas);
  }

  async function toggleTriviaDiaria() {
    const zona = document.getElementById("zona-trivia-diaria");
    if (!zona) return;
    const abrir = zona.style.display === "none";
    zona.style.display = abrir ? "block" : "none";

    try {

      );

  function renderTriviaDiaria(data) {
    const zona = document.getElementById("zona-trivia-diaria");
    if (!zona) return;
    if (!data.disponible) {
      zona.innerHTML = `<p class="ayuda" style="margin:0;">${escapeHtml(

    // Mismo patrón visual que la trivia de un tema normal (.trivia-item,

        ${

                .join("")}</div>`

        }

      </div>

      )
      .join("");

    zona.innerHTML = `
      <p class="ayuda" style="margin:0 0 10px; font-size:0.85rem;">Preguntas de tus propios temas — no gasta cupo de tu plan.</p>
      ${triviaHtml}
      <div id="trivia-diaria-resumen" style="display:none;"></div>
      <button type="button" class="primario" id="btn-revisar-trivia-diaria" style="width:100%;">Revisar mis respuestas</button>
    `;
    zona.querySelectorAll(".opcion-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
