<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EnseñAI — Generar tema</title>
<link rel="icon" type="image/png" href="assets/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grandstander:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --profundo: #1E3A8A; --profundo-oscuro: #16296B; --cielo: #60A5FA;
    --menta: #34D399; --aqua: #7DD3FC; --bosque: #065F46;
    --hielo: #F0FDF4; --tinta: #1E3A8A; --linea: #DCEEFC;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: 'Nunito', sans-serif;
    background:
      radial-gradient(circle at 12% 8%, rgba(96,165,250,0.35) 0, transparent 30%),
      radial-gradient(circle at 90% 20%, rgba(125,211,252,0.32) 0, transparent 32%),
      var(--hielo);
    color: var(--tinta); min-height: 100vh;
  }
  header { background: var(--profundo); color: #fff; padding: 18px 24px; display: flex; align-items: center; justify-content: space-between; }
  header a { color: inherit; text-decoration: none; display: flex; align-items: center; gap: 10px; }
  header .marca { font-family: 'Grandstander', sans-serif; font-weight: 700; font-size: 1.4rem; }
  header .marca .ai {
    display: inline-block; color: var(--aqua); background: rgba(255,255,255,0.14);
    padding: 1px 10px; border-radius: 999px; font-size: 0.75em; vertical-align: middle;
  }
  #btnSalir { background: none; border: 1px solid rgba(255,255,255,0.4); color: #fff; padding: 7px 14px; border-radius: 999px; font-size: 0.85rem; cursor: pointer; }
  main { max-width: 640px; margin: 0 auto; padding: 32px 20px 80px; }
  .tarjeta { background: #fff; border: 2px solid var(--linea); border-radius: 18px; padding: 22px; margin-bottom: 18px; box-shadow: 0 3px 0 var(--linea); }
  h1 { font-family: 'Grandstander', sans-serif; font-size: 1.4rem; margin: 0 0 6px; }
  h2 { font-family: 'Grandstander', sans-serif; font-size: 1.15rem; margin: 0 0 8px; color: var(--profundo); }
  h3 { font-family: 'Grandstander', sans-serif; color: var(--bosque); font-size: 0.98rem; margin: 16px 0 8px; }
  p.ayuda { color: #4A6A85; margin: 0 0 16px; }
  label { display: block; font-weight: 700; font-size: 0.9rem; margin: 14px 0 6px; }
  input, select, textarea { width: 100%; padding: 12px 14px; border: 2px solid var(--linea); border-radius: 12px; font-family: inherit; font-size: 1rem; }
  textarea { resize: vertical; min-height: 76px; line-height: 1.45; }
  .zona-foto { border: 2px dashed var(--linea); border-radius: 12px; padding: 14px; text-align: center; }
  .zona-foto input[type="file"] { display: none; }
  .zona-foto .btn-foto {
    display: inline-block; background: var(--hielo); border: 2px solid var(--menta); color: var(--bosque);
    padding: 9px 18px; border-radius: 999px; font-weight: 700; font-size: 0.88rem; cursor: pointer;
  }
  .miniaturas { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; justify-content: center; }
  .miniatura { position: relative; width: 74px; height: 74px; border-radius: 10px; overflow: hidden; border: 2px solid var(--linea); }
  .miniatura img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .miniatura button {
    position: absolute; top: 2px; right: 2px; width: 20px; height: 20px; border-radius: 50%;
    background: rgba(0,0,0,0.62); color: #fff; border: none; font-size: 0.72rem; line-height: 1; cursor: pointer; padding: 0;
  }
  button.primario {
    width: 100%; background: var(--profundo); color: #fff; border: none; padding: 14px; border-radius: 999px;
    font-family: 'Grandstander', sans-serif; font-weight: 600; font-size: 1rem; cursor: pointer; margin-top: 16px;
    box-shadow: 0 4px 0 var(--profundo-oscuro);
  }
  button.secundario { background: none; border: 2px solid var(--linea); color: var(--profundo); padding: 8px 14px; border-radius: 999px; font-weight: 700; font-size: 0.85rem; cursor: pointer; margin-top: 10px; }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .error { background: #FFF0EC; border: 2px solid #FFC4B5; color: #B94A2E; padding: 12px 14px; border-radius: 12px; margin-top: 12px; font-size: 0.9rem; }
  .aviso { background: var(--hielo); border: 2px dashed var(--menta); border-radius: 12px; padding: 12px 14px; font-size: 0.9rem; color: var(--bosque); margin-bottom: 16px; }
  .cargando { text-align: center; padding: 40px 20px; color: #4A6A85; }
  .actividad-box { background: var(--hielo); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; }
  .actividad-box .inteligencia { display: inline-block; background: var(--menta); color: #fff; font-size: 0.72rem; font-weight: 700; padding: 2px 10px; border-radius: 999px; margin-bottom: 6px; text-transform: uppercase; }
  .barra-perfil-fila { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .barra-perfil-label { flex: 0 0 130px; font-size: 0.8rem; font-weight: 700; color: var(--profundo); }
  .barra-perfil-track { flex: 1; background: var(--linea); border-radius: 999px; height: 10px; overflow: hidden; }
  .barra-perfil-fill { height: 100%; background: var(--aqua); border-radius: 999px; }
  .barra-perfil-fill.dominante { background: var(--profundo); }
  .barra-perfil-pct { flex: 0 0 32px; text-align: right; font-size: 0.78rem; color: #4A6A85; }
  /* ── Pestañas del material ── */
  .pestanas { display: flex; gap: 4px; background: var(--hielo); border-radius: 999px; padding: 4px; margin: 14px 0 20px; }
  .pestana {
    flex: 1; border: none; background: none; padding: 10px 6px; border-radius: 999px; cursor: pointer;
    font-family: 'Grandstander', sans-serif; font-weight: 600; font-size: 0.86rem; color: #5b7d99;
    transition: background .15s, color .15s;
  }
  .pestana.activa { background: #fff; color: var(--profundo); box-shadow: 0 2px 6px rgba(30,58,138,0.12); }
  .pestana-num { display: inline-block; background: var(--menta); color: #fff; border-radius: 999px; padding: 0 6px; font-size: 0.72rem; }

  /* ── Bloques de la pestaña Estudiar ── */
  .bloque-est { border-left: 4px solid var(--linea); padding: 2px 0 2px 14px; margin-bottom: 18px; }
  .bloque-est p { margin: 0; line-height: 1.65; font-size: 0.95rem; }
  .bloque-est.destacado { border-left-color: var(--menta); background: var(--hielo); border-radius: 0 12px 12px 0; padding: 14px 16px; }
  .bloque-est.destacado p { font-size: 1rem; color: var(--bosque); font-weight: 600; }
  .bloque-titulo { font-family: 'Grandstander', sans-serif; color: var(--profundo); font-size: 0.98rem; margin: 0 0 6px; }
  .lista-pasos { margin: 0; padding-left: 20px; }
  .lista-pasos li { margin-bottom: 7px; line-height: 1.55; font-size: 0.94rem; }
  .lista-ideas { margin: 0; padding-left: 18px; list-style: none; }
  .lista-ideas li { margin-bottom: 7px; line-height: 1.5; font-size: 0.94rem; position: relative; }
  .lista-ideas li::before { content: "▪"; color: var(--menta); position: absolute; left: -14px; font-size: 1.1rem; }
  .caja-ojo, .caja-truco { border-radius: 12px; padding: 13px 16px; margin-bottom: 16px; }
  .caja-ojo { background: #FFF7E6; border: 2px solid #FFDFA0; }
  .caja-truco { background: #F3F0FF; border: 2px solid #D9D2FF; }
  .caja-ojo strong, .caja-truco strong { display: block; font-size: 0.88rem; margin-bottom: 4px; }
  .caja-ojo strong { color: #8A6100; } .caja-truco strong { color: #4B3BA8; }
  .caja-ojo p, .caja-truco p { margin: 0; font-size: 0.93rem; line-height: 1.55; }
  .bloque-est.plegable { border-left-color: var(--cielo); }
  .bloque-est.plegable summary { cursor: pointer; font-weight: 700; font-size: 0.9rem; color: #5b7d99; }

  /* ── Ejercicios ── */
  .ejercicio { border: 2px solid var(--linea); border-radius: 14px; padding: 15px; margin-bottom: 12px; }
  .ejercicio-cabeza { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 10px; }
  .ejercicio-num {
    flex-shrink: 0; width: 26px; height: 26px; border-radius: 50%; background: var(--profundo); color: #fff;
    font-family: 'Grandstander', sans-serif; font-size: 0.8rem;
    display: flex; align-items: center; justify-content: center;
  }
  .ejercicio-enunciado { margin: 0; font-weight: 700; line-height: 1.5; font-size: 0.95rem; }
  .btn-pista, .btn-solucion {
    border: 2px solid var(--linea); background: #fff; border-radius: 999px; padding: 7px 16px;
    font-family: inherit; font-weight: 700; font-size: 0.82rem; cursor: pointer; color: #5b7d99; margin-right: 6px;
  }
  .btn-solucion { border-color: var(--menta); color: var(--bosque); }
  .btn-solucion.abierta { background: var(--hielo); }
  .pista-caja { background: #FFF7E6; border-radius: 10px; padding: 10px 13px; margin-top: 9px; font-size: 0.9rem; color: #8A6100; }
  .solucion-caja { background: var(--hielo); border-radius: 10px; padding: 13px 15px; margin-top: 10px; }
  .ejercicio-respuesta {
    background: var(--menta); color: #fff; border-radius: 8px; padding: 8px 13px; margin-top: 10px;
    font-weight: 700; font-size: 0.93rem;
  }

  /* ── Espera con tips ── */
  .zona-espera { padding: 20px 4px 8px; text-align: center; }
  .espera-barra { height: 5px; border-radius: 999px; background: var(--linea); overflow: hidden; margin-bottom: 16px; }
  .espera-barra span {
    display: block; height: 100%; width: 38%; border-radius: 999px;
    background: linear-gradient(90deg, var(--cielo), var(--menta));
    animation: espera-desliza 1.5s ease-in-out infinite;
  }
  @keyframes espera-desliza {
    0%   { transform: translateX(-100%); }
    100% { transform: translateX(265%); }
  }
  .espera-titulo { color: #4A6A85; font-size: 0.92rem; margin: 0 0 16px; }
  .tip-caja {
    display: flex; gap: 12px; text-align: left; align-items: flex-start;
    background: var(--hielo); border: 2px dashed var(--menta); border-radius: 14px; padding: 14px 16px;
    animation: tip-aparece .45s ease;
  }
  @keyframes tip-aparece { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .tip-icono { font-size: 1.15rem; line-height: 1.4; flex-shrink: 0; }
  .tip-texto { margin: 0; font-size: 0.92rem; line-height: 1.5; color: var(--bosque); }
  .tip-puntos { display: flex; gap: 5px; justify-content: center; margin-top: 12px; }
  .tip-puntos span { width: 6px; height: 6px; border-radius: 50%; background: var(--linea); transition: background .3s; }
  .tip-puntos span.activo { background: var(--menta); }

  /* ── Quiz de perfil ── */
  .quiz-pregunta { border: 2px solid var(--linea); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  .quiz-enunciado { font-weight: 700; font-size: 0.92rem; margin: 0 0 10px; line-height: 1.4; }
  .quiz-opciones { display: grid; gap: 6px; }
  .quiz-opcion {
    display: flex; align-items: center; gap: 9px; text-align: left; width: 100%;
    background: #fff; border: 2px solid var(--linea); border-radius: 10px; padding: 9px 12px;
    font-family: inherit; font-size: 0.9rem; color: var(--tinta); cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .quiz-opcion:hover { border-color: var(--cielo); background: var(--hielo); }
  .quiz-marca {
    flex-shrink: 0; width: 26px; height: 22px; border-radius: 999px; background: var(--linea);
    font-size: 0.68rem; font-weight: 800; color: #5b7d99;
    display: flex; align-items: center; justify-content: center;
  }
  .quiz-opcion.primaria { border-color: var(--profundo); background: #EAF1FE; font-weight: 700; }
  .quiz-opcion.primaria .quiz-marca { background: var(--profundo); color: #fff; }
  .quiz-opcion.secundaria { border-color: var(--menta); background: #E7FBF3; }
  .quiz-opcion.secundaria .quiz-marca { background: var(--menta); color: #fff; }

  /* ── Resultado del perfil ── */
  .perfil-principales { display: grid; gap: 10px; }
  .perfil-principal { display: flex; align-items: center; gap: 12px; border: 2px solid; border-radius: 14px; padding: 12px 14px; background: #fff; }
  .perfil-principal strong { display: block; font-size: 1rem; color: var(--profundo); font-family: 'Grandstander', sans-serif; }
  .perfil-icono {
    flex-shrink: 0; width: 38px; height: 38px; border-radius: 50%; color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 1.05rem;
  }
  .perfil-icono.chico { width: 30px; height: 30px; font-size: 0.9rem; margin-bottom: 6px; }
  .perfil-tipo-chico { display: block; font-size: 0.76rem; color: #5b7d99; margin-top: 1px; }
  .chip-secundaria { background: var(--hielo); border: 1px solid var(--linea); border-radius: 999px; padding: 5px 12px; font-size: 0.8rem; color: #4A6A85; }
  .detalle-quiz { margin-top: 14px; }
  .detalle-quiz summary { cursor: pointer; font-size: 0.85rem; color: #5b7d99; font-weight: 700; }
  .rejilla-ajuste { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .opcion-ajuste {
    text-align: left; background: #fff; border: 2px solid var(--linea); border-radius: 12px; padding: 11px;
    font-family: inherit; cursor: pointer; transition: border-color .15s, background .15s;
  }
  .opcion-ajuste strong { display: block; font-size: 0.86rem; color: var(--profundo); line-height: 1.25; }
  .opcion-ajuste:hover { border-color: var(--cielo); }

  .actividad-preview { background: var(--hielo); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; }
  .actividad-preview .actividad-preview-tipo { display: inline-block; background: var(--profundo); color: #fff; font-size: 0.72rem; font-weight: 700; padding: 2px 10px; border-radius: 999px; margin-bottom: 6px; text-transform: uppercase; }
  .actividad-preview p { margin: 0; font-size: 0.9rem; }
  .trivia-item { border: 2px solid var(--linea); border-radius: 14px; padding: 16px; margin-bottom: 12px; background: #fff; }
  .trivia-item:last-child { margin-bottom: 0; }
  .trivia-pregunta { display: flex; align-items: flex-start; gap: 10px; font-weight: 700; margin-bottom: 12px; line-height: 1.4; }
  .trivia-num {
    flex-shrink: 0; width: 24px; height: 24px; border-radius: 50%; background: var(--profundo); color: #fff;
    font-size: 0.78rem; font-family: 'Grandstander', sans-serif; display: flex; align-items: center; justify-content: center;
  }
  .opciones { display: grid; gap: 8px; }
  .opcion-btn {
    text-align: left; background: #fff; border: 2px solid var(--linea); border-radius: 10px; padding: 10px 14px;
    font-family: inherit; font-size: 0.94rem; color: var(--tinta); cursor: pointer; transition: border-color .15s, background .15s;
  }
  .opcion-btn:hover:not(:disabled) { border-color: var(--cielo); background: var(--hielo); }
  .opcion-btn.seleccionada { border-color: var(--profundo); background: #EAF1FE; font-weight: 700; }
  .opcion-btn.correcta { border-color: var(--menta); background: #E7FBF3; font-weight: 700; color: var(--bosque); }
  .opcion-btn.incorrecta { border-color: #E4796B; background: #FFF0EC; color: #B94A2E; }
  .opcion-btn:disabled { cursor: default; }
  .trivia-feedback { margin-top: 10px; font-size: 0.86rem; color: var(--bosque); background: var(--hielo); border-radius: 8px; padding: 8px 12px; }
  #trivia-resumen { text-align: center; font-weight: 700; color: var(--bosque); margin: 4px 0 12px; font-family: 'Grandstander', sans-serif; }
  .material-extra-box { background: #fff; border: 2px dashed var(--aqua); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; }
  .respuestas-toggle { text-align: center; }
  .respuestas-box { background: var(--hielo); border-radius: 12px; padding: 14px 16px; margin-top: 12px; display: none; }
  .respuestas-box.abierto { display: block; }
  .historial-item { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; padding: 10px 0; border-top: 1px dashed var(--linea); gap: 6px 10px; cursor: pointer; }
  .historial-item:first-child { border-top: none; }
  .historial-item .titulo { font-weight: 700; }
  .historial-item .fecha { color: #4A6A85; font-size: 0.8rem; }
  .historial-item .etiquetas-item { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 4px; }
  .etiqueta-badge { display: inline-block; background: var(--hielo); border: 1px solid var(--aqua); color: var(--bosque); font-size: 0.72rem; font-weight: 700; padding: 1px 9px; border-radius: 999px; }
  .chip-etiqueta { background: #fff; border: 2px solid var(--linea); color: var(--profundo); font-size: 0.8rem; font-weight: 700; padding: 4px 12px; border-radius: 999px; cursor: pointer; font-family: inherit; }
  .chip-etiqueta.activa { background: var(--profundo); border-color: var(--profundo); color: #fff; }
  #buscar-historial { margin-bottom: 8px; }
  .volver { color: var(--profundo); font-weight: 700; text-decoration: none; display: inline-block; margin-bottom: 14px; cursor: pointer; }
</style>
</head>
<body>

<header>
  <a href="index.html"><span class="marca">Enseñ<span class="ai">AI</span></span></a>
  <button id="btnSalir">Cerrar sesión</button>
</header>

<main id="contenido">
  <div class="cargando">Cargando…</div>
</main>

<script>
  const API_BASE = "https://ensenai-backend.onrender.com";
  const SUPABASE_URL = "https://azslvqfgeghhzghfxmdh.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF6c2x2cWZnZWdoaHpnaGZ4bWRoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzOTUzMzksImV4cCI6MjEwMTk3MTMzOX0.zd22nrf9OUrg0h2YnGJJt9mkKzoFERM54F4S48r-xEQ";
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const NIVELES = [
    { value: "primaria_baja", label: "Primaria baja (6-8 años)" },
    { value: "primaria_alta", label: "Primaria alta (9-12 años)" },
    { value: "secundaria", label: "Secundaria (12-15 años)" },
    { value: "preparatoria", label: "Preparatoria (15-18 años)" },
    { value: "universidad", label: "Universidad / autodidacta (18+)" },
  ];

  const ETIQUETAS_INTELIGENCIA = {
    linguistica: "Lingüística", logico_matematica: "Lógico-matemática", espacial: "Espacial",
    musical: "Musical", kinestesica: "Corporal-kinestésica", interpersonal: "Interpersonal",
    intrapersonal: "Intrapersonal", naturalista: "Naturalista",
  };

  // Mismo sistema de color por inteligencia que usa la landing, para que
  // el perfil se lea igual en todo el producto.
  const COLOR_INTELIGENCIA = {
    linguistica: "#F97066", logico_matematica: "#F5A524", espacial: "#7C6FE0",
    musical: "#EC7BC0", kinestesica: "#34D399", interpersonal: "#60A5FA",
    intrapersonal: "#7DD3FC", naturalista: "#84CC16",
  };

  const ICONO_INTELIGENCIA = {
    linguistica: "📖", logico_matematica: "🔢", espacial: "🎨", musical: "♪",
    kinestesica: "🏃", interpersonal: "👥", intrapersonal: "💭", naturalista: "🌿",
  };

  const COMO_APRENDE = {
    linguistica: "Leyendo y contando", logico_matematica: "Con lógica y pasos",
    espacial: "Viendo e imaginando", musical: "Con ritmo y sonido",
    kinestesica: "Moviéndose y haciendo", interpersonal: "Con otras personas",
    intrapersonal: "A su ritmo, en calma", naturalista: "Explorando y clasificando",
  };

  let sesionActual = null;
  let ultimoContenido = null;
  let ultimoTemaId = null;
  let perfilesCache = [];
  let perfilSeleccionadoId = "";
  let historialCache = [];
  let etiquetaActiva = "";

  function escapeHtml(str) {
    const d = document.createElement("div");
    d.textContent = str || "";
    return d.innerHTML;
  }

  // El backend (Render, plan gratuito) se "duerme" tras un rato sin uso y
  // tarda 30-60s en despertar con la primera petición — esa primera
  // petición puede fallar con un "Failed to fetch" genérico. Este helper
  // avisa con un mensaje amigable y reintenta una vez antes de rendirse.
  async function fetchConReintento(url, opciones, cont, mensajeEspera) {
    try {
      return await fetch(url, opciones);
    } catch (err) {
      if (cont) {
        cont.innerHTML = `<div class="cargando">${mensajeEspera || "Despertando el servidor… puede tardar hasta un minuto la primera vez, ya casi."}</div>`;
      }
      await new Promise((r) => setTimeout(r, 4000));
      try {
        return await fetch(url, opciones);
      } catch (err2) {
        throw new Error("El servidor está tardando en responder. Espera unos segundos y vuelve a intentarlo.");
      }
    }
  }

  async function init() {
    const { data } = await supabaseClient.auth.getSession();
    if (!data.session) {
      window.location.href = "comprador.html?despues=tema";
      return;
    }
    sesionActual = data.session;

    document.getElementById("btnSalir").onclick = async () => {
      await supabaseClient.auth.signOut();
      window.location.href = "comprador.html";
    };

  async function cargarPerfiles() {
    const cont = document.getElementById("zona-perfiles");
    try {
      const res = await fetch(`${API_BASE}/api/aprendizaje/perfiles`, {
        headers: { Authorization: `Bearer ${sesionActual.access_token}` },
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "No se pudieron cargar tus perfiles.");

      perfilesCache = data.perfiles || [];
      const limite = data.limite_perfiles;

      const listaHtml = perfilesCache.length
        ? perfilesCache
            .map(
              (p) => `
        <div class="historial-item" data-perfil-id="${p.id}">
          <span class="titulo">🧩 ${escapeHtml(p.nombre)} <span style="font-weight:400; color:#4A6A85;">— ${escapeHtml(ETIQUETAS_INTELIGENCIA[p.inteligencia_dominante?.[0]] || "")}</span></span>

        </div>
      `
            )
            .join("")

        <p class="ayuda" style="margin:10px 0 0; font-size:0.85rem;">${perfilesCache.length} de ${limite} perfil(es) de tu plan.</p>

            : `<p class="ayuda" style="margin:6px 0 0; font-size:0.85rem;">Llegaste al límite de tu plan — <a href="comprador.html">mejora tu plan</a> para agregar más.</p>`

      `;

      if (document.getElementById("btn-nuevo-perfil")) {
        document.getElementById("btn-nuevo-perfil").addEventListener("click", () => mostrarQuizPerfil());

      cont.innerHTML = `<div class="error">${escapeHtml(err.message)}</div>`;

  // ── Quiz de perfil de aprendizaje ───────────────────────────────────────
  // Estado del quiz en curso: por cada pregunta, qué eligió como primera y
  // (opcionalmente) como segunda opción. Se guardan TIPOS, no índices,
  // porque el backend ahora baraja el orden de las opciones en cada
  // pregunta para no sesgar el resultado hacia las primeras de la lista.
  // ── Tips mientras se genera el material ─────────────────────────────────
  // Generar tarda ~30 segundos. En vez de dejar a la persona mirando un
  // "cargando", se aprovecha para darle algo que de verdad le sirva: un
  // consejo corto de cómo acompañar el estudio. Los primeros son específicos
  // del perfil que eligió (refuerzan por qué el perfil importa), y los
  // generales vienen del marco del documento "Sistema Cognitivo Integral"
  // (evocación activa, repaso espaciado, mentalidad de crecimiento).
  const TIPS_POR_INTELIGENCIA = {
    linguistica: [
      "Pídele que te cuente el tema con sus propias palabras, sin ver los apuntes. Si lo puede explicar, lo entendió.",
      "Inventar una historia corta con los conceptos del tema los fija mucho mejor que repetirlos.",
    ],
    logico_matematica: [
      "Antes de empezar, pregúntale “¿qué crees que va a pasar aquí?”. Predecir activa el cerebro más que solo leer.",
      "Buscar el patrón — qué se repite, qué cambia — le ordena el tema más rápido que memorizarlo por partes.",
    ],
    espacial: [
      "Pídele que te DIBUJE lo que entendió, en vez de contártelo. A quien piensa en imágenes le fija mucho más el tema.",
      "Dos colores en los apuntes: uno para las ideas principales y otro para los ejemplos. La diferencia se nota.",
    ],
    musical: [
      "Ponerle tonada a lo que hay que memorizar funciona de verdad: una lista con ritmo se recuerda semanas después.",
      "Que grabe una nota de voz explicando el tema y la escuche después. Oírse a sí mismo/a explicar ayuda mucho.",
    ],
    kinestesica: [
      "Estudiar de pie o caminando no es distracción. A quien aprende con el cuerpo, quedarse quieto le cuesta el doble.",
      "Convertir el tema en algo que se pueda actuar o tocar con las manos vale más que media hora de lectura.",
    ],
    interpersonal: [
      "Que te explique el tema a ti, o hasta a un peluche. Enseñar en voz alta es de las formas más rápidas de fijar algo.",
      "Inviertan papeles: que ella o él te tome el examen a ti. Preparar las preguntas obliga a entender el tema.",
    ],
    intrapersonal: [
      "Dale unos minutos a solas antes de empezar. Necesita ordenar sus ideas antes de recibir nuevas.",
      "Preguntarle “¿esto con qué se te parece de tu vida?” conecta el tema con algo que ya sabe.",
    ],
    naturalista: [
      "Relaciona el tema con algo real que pueda observar. Clasificar y comparar le ordena la cabeza.",
      "Sacar el estudio al patio o al parque no es perder el tiempo: el entorno le ayuda a enganchar.",
    ],
  };

  const TIPS_GENERALES = [
    "Repasar tres veces en días distintos fija mucho más que estudiar tres horas seguidas.",
    "Releer los apuntes se siente productivo pero engaña. Cerrar el cuaderno y tratar de recordar es lo que funciona.",
    "Elogia el esfuerzo, no la inteligencia: “te esforzaste mucho” construye más que “qué inteligente eres”.",
    "Sesiones de 20 a 25 minutos con un descanso rinden más que una hora seguida.",
    "Dormir bien después de estudiar es parte del estudio: el cerebro consolida lo aprendido mientras duerme.",
    "Si algo no le sale, pregúntale “¿qué parte exactamente?”. Ubicar dónde se traba ahorra muchísimo tiempo.",
    "Equivocarse y corregir fija más que acertar a la primera. Un error no es tiempo perdido.",
  ];

  let tipsIntervalo = null;

  function armarListaTips() {
    const perfil = perfilesCache.find((p) => p.id === document.getElementById("perfil-input")?.value);
    const dominantes = perfil?.inteligencia_dominante || [];
    const propios = dominantes.flatMap((t) => TIPS_POR_INTELIGENCIA[t] || []);
    // Los del perfil van primero (son los que más resuenan), luego los generales.
    return [...propios, ...TIPS_GENERALES];
  }

  function iniciarTips(contenedor, encabezado) {
    detenerTips();
    const tips = armarListaTips();
    let i = 0;

    const pintar = () => {
      contenedor.innerHTML = `
        <div class="zona-espera">
          <div class="espera-barra"><span></span></div>
          <p class="espera-titulo">${escapeHtml(encabezado)}</p>
          <div class="tip-caja">
            <span class="tip-icono">💡</span>
            <p class="tip-texto">${escapeHtml(tips[i % tips.length])}</p>
          </div>
          <div class="tip-puntos">${tips
            .slice(0, Math.min(tips.length, 6))
            .map((_, k) => `<span class="${k === i % Math.min(tips.length, 6) ? "activo" : ""}"></span>`)
            .join("")}</div>
        </div>`;
    };

    pintar();
    tipsIntervalo = setInterval(() => { i++; pintar(); }, 6000);
  }

  function detenerTips() {
    if (tipsIntervalo) { clearInterval(tipsIntervalo); tipsIntervalo = null; }
  }

  let respuestasQuiz = {};
  let preguntasQuiz = [];
  let resultadoQuiz = null;
  let ajusteManual = null;

  // Tipo de usuario elegido al registrarse (papa/estudiante/educador/adulto/otro).
  // Decide qué versión del quiz se pide: "ninos" está redactada para que un
  // papá describa a su hijo ("Cuando tiene tiempo libre, prefiere…"), y
  // "adulto" está en primera persona ("Cuando tengo tiempo libre, prefiero…").
  // Antes siempre se pedía la de niños, así que un adolescente o un adulto
  // aprendiendo por su cuenta contestaba preguntas escritas para otra persona.
  let tipoUsuario = null;

  function versionQuiz() {
    return tipoUsuario === "estudiante" || tipoUsuario === "adulto" ? "adulto" : "ninos";
  }

  async function cargarTipoUsuario() {
    try {
      const res = await fetch(`${API_BASE}/api/aprendizaje/mi-tipo`, {
        headers: { Authorization: `Bearer ${sesionActual.access_token}` },
      });
      if (res.ok) tipoUsuario = (await res.json()).tipo_usuario || null;
    } catch (err) {
      tipoUsuario = null; // sin tipo, se usa la versión de niños como antes
    }
  }

  async function mostrarQuizPerfil() {
    const cont = document.getElementById("zona-perfiles");
    cont.innerHTML = `
      <label>Nombre de este perfil</label>
      <input type="text" id="nombre-perfil-input" placeholder="${versionQuiz() === "adulto" ? "Ej. Yo, Mi maestría, Inglés…" : "Ej. Sofía, Mateo, yo…"}">
      <div id="preguntas-perfil" style="margin-top:14px;"><div class="cargando">Cargando preguntas…</div></div>
    `;

    respuestasQuiz = {};
    resultadoQuiz = null;
    ajusteManual = null;

    const res = await fetch(`${API_BASE}/api/aprendizaje/quiz?version=${versionQuiz()}`);
    const data = await res.json();
    preguntasQuiz = data.preguntas || [];

    document.getElementById("preguntas-perfil").innerHTML = `
      <div class="aviso" style="margin-bottom:14px;">
        Elige la opción que <strong>más</strong> ${versionQuiz() === "adulto" ? "te describe" : "se le parece"}. Si dudas entre dos, márcalas las dos — la segunda cuenta un poco menos y nos ayuda a afinar el resultado.
      </div>
      ${preguntasQuiz.map((p, i) => pintarPreguntaQuiz(p, i)).join("")}
      <div id="aviso-confiabilidad"></div>
      <button class="primario" id="btn-guardar-perfil">Ver resultado</button>
      <button class="secundario" style="width:100%;" id="btn-cancelar-perfil">Cancelar</button>
    `;

    conectarOpcionesQuiz();
    document.getElementById("btn-guardar-perfil").addEventListener("click", calcularPerfilQuiz);
    document.getElementById("btn-cancelar-perfil").addEventListener("click", cargarPerfiles);
  }

  function pintarPreguntaQuiz(p, i) {
    return `
      <div class="quiz-pregunta" data-pregunta="${p.id}">
        <p class="quiz-enunciado">${i + 1}. ${escapeHtml(p.pregunta)}</p>
        <div class="quiz-opciones">
          ${p.opciones
            .map(
              (op) => `
            <button type="button" class="quiz-opcion" data-pregunta="${p.id}" data-tipo="${escapeHtml(op.tipo)}">
              <span class="quiz-marca"></span>${escapeHtml(op.texto)}
            </button>`
            )
            .join("")}
        </div>
      </div>`;
  }

  function conectarOpcionesQuiz() {
    document.querySelectorAll(".quiz-opcion").forEach((btn) => {
      btn.addEventListener("click", () => {
        const id = btn.dataset.pregunta;
        const tipo = btn.dataset.tipo;
        const r = respuestasQuiz[id] || { primaria: null, secundaria: null };

        if (r.primaria === tipo) {
          // Quitar la primera: la segunda (si hay) sube a primera.
          r.primaria = r.secundaria;
          r.secundaria = null;
        } else if (r.secundaria === tipo) {
          r.secundaria = null;
        } else if (!r.primaria) {
          r.primaria = tipo;
        } else {
          r.secundaria = tipo;
        }

        respuestasQuiz[id] = r;
        refrescarPregunta(id);
      });
    });
  }

  function refrescarPregunta(id) {
    const r = respuestasQuiz[id] || {};
    document.querySelectorAll(`.quiz-opcion[data-pregunta="${id}"]`).forEach((btn) => {
      const tipo = btn.dataset.tipo;
      const marca = btn.querySelector(".quiz-marca");
      btn.classList.toggle("primaria", r.primaria === tipo);
      btn.classList.toggle("secundaria", r.secundaria === tipo);
      marca.textContent = r.primaria === tipo ? "1ª" : r.secundaria === tipo ? "2ª" : "";
    });
  }

  /**
   * Misma regla que usa el backend (`evaluarConfiabilidad`), pero aplicada
   * antes de mandar: si claramente no se contestó pensando, no tiene caso
   * gastar uno de los espacios de perfil del plan en un resultado que no
   * significa nada.
   */
  function revisarConfiabilidad(respuestas) {
    const primarias = respuestas.map((r) => r.primaria).filter(Boolean);
    const distintos = new Set(primarias).size;
    if (distintos === 1) return "siempre_lo_mismo";
    if (distintos === 2 && primarias.length >= 10) return "muy_poca_variedad";
    return null;
  }

  async function calcularPerfilQuiz(forzar) {
    const nombre = document.getElementById("nombre-perfil-input").value.trim();
    const avisoCont = document.getElementById("aviso-confiabilidad");
    avisoCont.innerHTML = "";

    if (!nombre) {
      avisoCont.innerHTML = `<div class="error">Escribe un nombre para este perfil.</div>`;
      return;
    }

    const respuestas = [];
    for (const p of preguntasQuiz) {
      const r = respuestasQuiz[p.id];
      if (!r || !r.primaria) {
        avisoCont.innerHTML = `<div class="error">Falta contestar la pregunta ${p.id}. Elige al menos una opción en cada una.</div>`;
        return;
      }
      respuestas.push(r);
    }

    if (forzar !== true) {
      const motivo = revisarConfiabilidad(respuestas);
      if (motivo) {
        avisoCont.innerHTML = `
          <div class="error">
            <strong>El resultado no va a ser muy útil así.</strong><br>
            ${
              motivo === "siempre_lo_mismo"
                ? "Elegiste la misma opción en todas las preguntas."
                : "Casi todas tus respuestas fueron de dos tipos nada más."
            }
            Vale más la pena contestarlo con calma — son 12 preguntas rápidas.
            <div style="margin-top:10px; display:flex; gap:8px; flex-wrap:wrap;">
              <button class="secundario" style="margin:0; width:auto;" id="btn-rehacer-quiz">Contestar de nuevo</button>
              <button class="secundario" style="margin:0; width:auto;" id="btn-forzar-quiz">Usarlo de todos modos</button>
            </div>
          </div>`;
        document.getElementById("btn-rehacer-quiz").addEventListener("click", mostrarQuizPerfil);
        document.getElementById("btn-forzar-quiz").addEventListener("click", () => calcularPerfilQuiz(true));
        avisoCont.scrollIntoView({ behavior: "smooth", block: "center" });
        return;
      }
    }

    try {
      const res = await fetchConReintento(
        `${API_BASE}/api/aprendizaje/calcular`,
        {
          method: "POST",
          headers: { "Content-Type": "application/json", Authorization: `Bearer ${sesionActual.access_token}` },
          body: JSON.stringify({ respuestas }),
        },
        document.getElementById("zona-perfiles"),
        "Calculando el perfil…"
      );
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "No se pudo calcular el perfil.");

      resultadoQuiz = { nombre, respuestas, data };
      ajusteManual = null;
      mostrarResultadoPerfil();
    } catch (err) {
      avisoCont.innerHTML = `<div class="error">${escapeHtml(err.message)}</div>`;
    }
  }

  /**
   * Resultado del quiz, ANTES de guardarlo. Dos cosas a propósito:
   *
   * 1. No se muestran los 8 porcentajes al frente. Salen de 12 respuestas,
   *    así que un "33%" sugiere una precisión que el test no tiene; se
   *    destacan las 2 principales, las siguientes 2 en chico, y el detalle
   *    numérico queda detrás de un "ver detalle" para quien lo quiera.
   * 2. Se puede ajustar. Quien contesta conoce a su hijo mucho mejor que
   *    12 preguntas — si el resultado no le suena, lo corrige y ese es el
   *    perfil que se guarda.
   */
  function mostrarResultadoPerfil() {
    const { nombre, data } = resultadoQuiz;
    const cont = document.getElementById("zona-perfiles");
    const principales = ajusteManual || data.perfil_dominante || [];
    const secundarias = (data.secundarias || []).filter((t) => !principales.includes(t));
    const porcentajes = data.porcentajes || {};

    const tarjeta = (tipo) => `
      <div class="perfil-principal" style="border-color:${COLOR_INTELIGENCIA[tipo] || "#ccc"};">
        <span class="perfil-icono" style="background:${COLOR_INTELIGENCIA[tipo] || "#ccc"};">${ICONO_INTELIGENCIA[tipo] || "•"}</span>
        <div>
          <strong>${escapeHtml(COMO_APRENDE[tipo] || "")}</strong>
          <span class="perfil-tipo-chico">${escapeHtml(ETIQUETAS_INTELIGENCIA[tipo] || tipo)}</span>
        </div>
      </div>`;

    const filasDetalle = Object.entries(porcentajes)
      .sort((a, b) => b[1] - a[1])
      .map(
        ([tipo, pct]) => `
      <div class="barra-perfil-fila">
        <span class="barra-perfil-label">${escapeHtml(ETIQUETAS_INTELIGENCIA[tipo] || tipo)}</span>
        <div class="barra-perfil-track"><div class="barra-perfil-fill${principales.includes(tipo) ? " dominante" : ""}" style="width:${pct}%"></div></div>
        <span class="barra-perfil-pct">${pct}%</span>
      </div>`
      )
      .join("");

    cont.innerHTML = `
      <h3 style="margin-top:0;">Así aprende ${escapeHtml(nombre)}</h3>
      <div class="perfil-principales">${principales.map(tarjeta).join("")}</div>
      ${
        secundarias.length
          ? `<p class="ayuda" style="margin:12px 0 6px; font-size:0.85rem;">También le funciona:</p>
             <div style="display:flex; flex-wrap:wrap; gap:6px;">
               ${secundarias
                 .map(
                   (t) =>
                     `<span class="chip-secundaria">${ICONO_INTELIGENCIA[t] || "•"} ${escapeHtml(ETIQUETAS_INTELIGENCIA[t] || t)}</span>`
                 )
                 .join("")}
             </div>`
          : ""
      }
      ${ajusteManual ? `<p class="ayuda" style="margin:12px 0 0; font-size:0.82rem;">✏️ Ajustado por ti.</p>` : ""}

      <details class="detalle-quiz">
        <summary>Ver el detalle del quiz</summary>
        <div style="margin-top:10px;">${filasDetalle}</div>
        <p class="ayuda" style="margin:8px 0 0; font-size:0.78rem;">Sale de 12 preguntas — tómalo como una guía de por dónde entrarle, no como una medición exacta.</p>
      </details>

      <div class="aviso" style="margin-top:16px;">
        <strong>¿Te suena?</strong> ${versionQuiz() === "adulto" ? "Tú te conoces mejor que 12 preguntas." : "Tú lo conoces mejor que 12 preguntas."} Si algo no encaja, ajústalo.
      </div>
      <button class="primario" id="btn-confirmar-perfil">Sí, guardar perfil</button>
      <button class="secundario" style="width:100%;" id="btn-ajustar-perfil">Ajustar</button>
      <button class="secundario" style="width:100%;" id="btn-cancelar-resultado">Cancelar</button>
    `;

    document.getElementById("btn-confirmar-perfil").addEventListener("click", guardarPerfilQuiz);
    document.getElementById("btn-ajustar-perfil").addEventListener("click", mostrarAjustePerfil);
    document.getElementById("btn-cancelar-resultado").addEventListener("click", cargarPerfiles);
  }

  function mostrarAjustePerfil() {
    const { nombre, data } = resultadoQuiz;
    const cont = document.getElementById("zona-perfiles");
    let elegidas = (ajusteManual || data.perfil_dominante || []).slice(0, 2);

    const pintar = () => {
      cont.innerHTML = `
        <h3 style="margin-top:0;">¿Cómo aprende mejor ${escapeHtml(nombre)}?</h3>
        <p class="ayuda" style="margin:0 0 12px;">Elige hasta dos. Son las que van a guiar el estilo de sus actividades.</p>
        <div class="rejilla-ajuste">
          ${Object.keys(ETIQUETAS_INTELIGENCIA)

  // ── Fotos de resumen/apuntes ────────────────────────────────────────────
  // Las fotos de celular son enormes (4-8 MB) y viajan como base64 dentro
  // del JSON, así que las reducimos en el navegador ANTES de subirlas: el
  // lado largo se limita a 1400px y se recomprimen como JPEG. Con eso una
  // foto de apuntes queda en ~200-400 KB y sigue siendo perfectamente
  // legible para el generador, sin que la subida tarde en datos móviles.
  const MAX_FOTOS = 3;
  const LADO_MAX = 1400;
  let fotosSeleccionadas = [];

  function comprimirImagen(file) {
    return new Promise((resolve, reject) => {
      const lector = new FileReader();
      lector.onerror = () => reject(new Error("No se pudo leer la imagen."));
      lector.onload = () => {
        const img = new Image();
        img.onerror = () => reject(new Error("Ese archivo no parece ser una imagen válida."));
        img.onload = () => {
          const escala = Math.min(1, LADO_MAX / Math.max(img.width, img.height));
          const canvas = document.createElement("canvas");
          canvas.width = Math.round(img.width * escala);
          canvas.height = Math.round(img.height * escala);
          canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL("image/jpeg", 0.82));
        };
        img.src = lector.result;
      };
      lector.readAsDataURL(file);
    });
  }

  function pintarMiniaturas() {
    const cont = document.getElementById("miniaturas-fotos");
    if (!cont) return;
    cont.innerHTML = fotosSeleccionadas
      .map(
        (src, i) => `
        <div class="miniatura">
          <img src="${src}" alt="Foto ${i + 1}">
          <button type="button" data-quitar-foto="${i}" title="Quitar">✕</button>
        </div>`
      )
      .join("");
    cont.querySelectorAll("[data-quitar-foto]").forEach((btn) => {
      btn.addEventListener("click", () => {
        fotosSeleccionadas.splice(Number(btn.dataset.quitarFoto), 1);
        pintarMiniaturas();
      });
    });
  }

  async function alElegirFotos(ev) {
    const resultado = document.getElementById("resultado-generar");
    const archivos = [...ev.target.files].filter((f) => f.type.startsWith("image/"));
    ev.target.value = ""; // permite volver a elegir el mismo archivo

    for (const archivo of archivos) {
      if (fotosSeleccionadas.length >= MAX_FOTOS) {
        if (resultado) resultado.innerHTML = `<div class="error">Puedes subir hasta ${MAX_FOTOS} fotos.</div>`;
        break;
      }
      try {
        fotosSeleccionadas.push(await comprimirImagen(archivo));
      } catch (err) {
        if (resultado) resultado.innerHTML = `<div class="error">${escapeHtml(err.message)}</div>`;
      }
    }
    pintarMiniaturas();
  }

  async function generarTema() {
    const tema = document.getElementById("tema-input").value.trim();
    const nivel = document.getElementById("nivel-input").value;
    const perfilId = document.getElementById("perfil-input").value || null;
    const detalles = document.getElementById("detalles-input").value.trim();
    const etiquetas = parsearEtiquetas(document.getElementById("etiquetas-input").value);
    const resultado = document.getElementById("resultado-generar");
    resultado.innerHTML = "";

    if (!tema) {
      resultado.innerHTML = `<div class="error">Escribe sobre qué tema quieres generar material.</div>`;
      return;
    }

    iniciarTips(
      resultado,
      fotosSeleccionadas.length
        ? "Leyendo tus fotos y preparando el material…"
        : "Preparando el material…"
    );

    try {
      const res = await fetchConReintento(
        `${API_BASE}/api/temas/generar`,
        {
          method: "POST",
          headers: { "Content-Type": "application/json", Authorization: `Bearer ${sesionActual.access_token}` },
          body: JSON.stringify({ tema, nivel, modo: "individual", perfilId, etiquetas, detalles, imagenes: fotosSeleccionadas }),
        },
        null, // no sobreescribir la zona de tips con el mensaje de reintento
        null
      );
      const data = await res.json();
      detenerTips();
      if (res.status === 402) {
        resultado.innerHTML = `
          <div class="error">${escapeHtml(data.error)}</div>
          <a href="comprador.html" style="display:block; text-decoration:none;"><button class="primario">Ver mi plan / mejorar plan</button></a>
        `;
        return;
      }
      if (!res.ok) throw new Error(data.error || "No se pudo generar el material.");

      fotosSeleccionadas = []; // el tema ya se generó; no arrastrar las fotos al siguiente
      mostrarTemaGenerado(data.contenido, data.tema_id, null);
    } catch (err) {
      detenerTips();
      resultado.innerHTML = `<div class="error">${escapeHtml(err.message)}</div>`;
    }
  }

  async function cargarHistorial() {
    const cont = document.getElementById("lista-historial");
    try {
      const res = await fetch(`${API_BASE}/api/temas/mios`, {
        headers: { Authorization: `Bearer ${sesionActual.access_token}` },
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "No se pudo cargar tu historial.");

      historialCache = data.temas || [];
      etiquetaActiva = "";

      if (historialCache.length === 0) {
        document.getElementById("filtros-historial").style.display = "none";
        cont.innerHTML = `<p class="ayuda" style="margin:0;">Todavía no has generado ningún tema.</p>`;
        return;
      }

      // Solo mostramos los filtros si hay al menos una etiqueta usada en
      // todo el historial — si nadie ha etiquetado nada todavía, no tiene
      // caso mostrar chips vacíos.
      const hayEtiquetas = historialCache.some((t) => (t.etiquetas || []).length);
      document.getElementById("filtros-historial").style.display = historialCache.length > 3 || hayEtiquetas ? "block" : "none";

      document.getElementById("buscar-historial").oninput = renderHistorial;
      renderChipsEtiquetas();
      renderHistorial();
    } catch (err) {
      cont.innerHTML = `<div class="error">No se pudo cargar tu historial.</div>`;
    }
  }

  function renderChipsEtiquetas() {
    const cont = document.getElementById("chips-etiquetas");
    const todasEtiquetas = [...new Set(historialCache.flatMap((t) => t.etiquetas || []))].sort();
    if (!todasEtiquetas.length) {
      cont.innerHTML = "";
      return;
    }
    cont.innerHTML =
      `<button type="button" class="chip-etiqueta${etiquetaActiva === "" ? " activa" : ""}" data-etiqueta="">Todas</button>` +
      todasEtiquetas
        .map((e) => `<button type="button" class="chip-etiqueta${etiquetaActiva === e ? " activa" : ""}" data-etiqueta="${escapeHtml(e)}">${escapeHtml(e)}</button>`)
        .join("");
    cont.querySelectorAll(".chip-etiqueta").forEach((btn) => {
      btn.addEventListener("click", () => {
        etiquetaActiva = btn.dataset.etiqueta;
        renderChipsEtiquetas();
        renderHistorial();
      });
    });
  }

  function renderHistorial() {
    const cont = document.getElementById("lista-historial");
    const busqueda = (document.getElementById("buscar-historial").value || "").trim().toLowerCase();

    const filtrados = historialCache.filter((t) => {
      const coincideEtiqueta = !etiquetaActiva || (t.etiquetas || []).includes(etiquetaActiva);
      const textoTema = (t.tema || "").toLowerCase();
      const textoEtiquetas = (t.etiquetas || []).join(" ").toLowerCase();
      const coincideBusqueda = !busqueda || textoTema.includes(busqueda) || textoEtiquetas.includes(busqueda);
      return coincideEtiqueta && coincideBusqueda;
    });

    if (!filtrados.length) {
      cont.innerHTML = `<p class="ayuda" style="margin:0;">No hay temas que coincidan con tu búsqueda.</p>`;
      return;
    }

    cont.innerHTML = filtrados
      .map(
        (t) => `
      <div class="historial-item" data-id="${t.id}">
        <span class="titulo">📘 ${escapeHtml(t.tema)}</span>
        <span class="fecha">${new Date(t.created_at).toLocaleDateString("es-MX")}</span>
        <span class="etiquetas-item">
          ${(t.etiquetas || []).map((e) => `<span class="etiqueta-badge">${escapeHtml(e)}</span>`).join("")}
          <button type="button" class="chip-etiqueta" style="padding:1px 9px; font-size:0.72rem;" data-editar-etiquetas="${t.id}">✏️ Etiquetas</button>
        </span>
      </div>
    `
      )
      .join("");

    cont.querySelectorAll(".historial-item .titulo, .historial-item .fecha").forEach((el) => {
      el.addEventListener("click", () => verTemaDelHistorial(el.closest(".historial-item").dataset.id));
    });
    cont.querySelectorAll("[data-editar-etiquetas]").forEach((btn) => {
      btn.addEventListener("click", (ev) => {
        ev.stopPropagation();
        editarEtiquetas(btn.dataset.editarEtiquetas);
      });
    });
  }

    const actual = historialCache.find((t) => t.id === temaId);
    const texto = prompt("Etiquetas separadas por comas (ej. Matemáticas, Parcial 1):", (actual?.etiquetas || []).join(", "));

  function revisarTrivia() {
    let total = 0;
    let correctas = 0;
    document.querySelectorAll(".trivia-item").forEach((item) => {
      item.classList.add("revisado");
      const correcta = item.dataset.correcta || "";
      const opciones = item.querySelectorAll(".opcion-btn");
      const feedback = item.querySelector(".trivia-feedback");
      if (opciones.length) {
        total++;
        const seleccionado = item.querySelector(".opcion-btn.seleccionada");
        opciones.forEach((btn) => {
          btn.disabled = true;
          if (normalizarTexto(btn.dataset.valor) === normalizarTexto(correcta)) {
            btn.classList.add("correcta");
          } else if (btn === seleccionado) {
            btn.classList.add("incorrecta");
          }
        });
        if (seleccionado && normalizarTexto(seleccionado.dataset.valor) === normalizarTexto(correcta)) {
          correctas++;
        } else if (!seleccionado) {
          feedback.style.display = "block";
          feedback.textContent = "No elegiste una respuesta.";
        }
      } else if (correcta) {
        feedback.style.display = "block";
        feedback.innerHTML = `<strong>Respuesta sugerida:</strong> ${escapeHtml(correcta)}`;
      }
    });

    const resumen = document.getElementById("trivia-resumen");
    if (resumen && total > 0) {
      resumen.style.display = "block";
      resumen.textContent = `Obtuviste ${correctas} de ${total} correctas.`;
    }
    const btnRevisar = document.getElementById("btn-revisar-trivia");
    if (btnRevisar) btnRevisar.style.display = "none";
  }

  /**
   * Los temas generados ANTES del rediseño tienen `resumen` como un solo
   * string de texto corrido. Aquí se convierte a la forma nueva para que el
   * historial viejo se siga viendo bien, sin tener que migrar la base.
   */
  function normalizarResumen(resumen) {
    const vacio = { que_es: "", secciones: [], pasos: [], ideas_clave: [], ojo_aqui: "", truco: "" };
    if (!resumen) return vacio;
    if (typeof resumen === "string") return { ...vacio, que_es: resumen };
    return {
      que_es: resumen.que_es || "",
      secciones: Array.isArray(resumen.secciones) ? resumen.secciones.filter((s) => s && (s.titulo || s.texto)) : [],
      pasos: Array.isArray(resumen.pasos) ? resumen.pasos.filter(Boolean) : [],
      ideas_clave: Array.isArray(resumen.ideas_clave) ? resumen.ideas_clave.filter(Boolean) : [],
      ojo_aqui: resumen.ojo_aqui || "",
      truco: resumen.truco || "",
    };
  }

      ${
        triviaHtml
          ? `<h2 style="margin-top:0;">🧠 Trivia</h2>
             <p class="ayuda" style="margin:0 0 12px;">Elige tu respuesta en cada pregunta y luego dale a "Revisar mis respuestas".</p>
             ${triviaHtml}
             <div id="trivia-resumen" style="display:none;"></div>
             <button class="primario" id="btn-revisar-trivia">Revisar mis respuestas</button>`
          : ""
      }
      ${materialExtraHtml ? `<h2 style="margin-top:${triviaHtml ? "24px" : "0"};">📎 Material extra</h2>${materialExtraHtml}` : ""}
      <div class="respuestas-toggle" style="margin-top:20px;"><button class="secundario" id="btn-respuestas">Ver respuestas</button></div>
      <div class="respuestas-box" id="caja-respuestas">${respuestasHtml}</div>
    `;

    const nEj = ejercicios.length;
    cont.innerHTML = `
      <a class="volver" id="btn-volver">← Volver</a>
      <div class="tarjeta">
        <h1>📘 ${escapeHtml(c.tema || "")}</h1>
        <div class="pestanas">
          <button class="pestana activa" data-panel="estudiar">📖 Estudiar</button>
          <button class="pestana" data-panel="practicar">✏️ Practicar${nEj ? ` <span class="pestana-num">${nEj}</span>` : ""}</button>
          <button class="pestana" data-panel="repasar">🔁 Repasar</button>
        </div>
        <div class="panel" id="panel-estudiar">${estudiarHtml}</div>
        <div class="panel" id="panel-practicar" style="display:none;">${practicarHtml}</div>
        <div class="panel" id="panel-repasar" style="display:none;">${repasarHtml}</div>
        <button class="secundario" id="btn-pdf" style="margin-top:18px; width:100%;">${pdfUrlGuardado ? "📄 Descargar imprimible (PDF)" : "📄 Generar imprimible (PDF)"}</button>
      </div>
    `;

    document.querySelectorAll(".pestana").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".pestana").forEach((b) => b.classList.toggle("activa", b === btn));
        ["estudiar", "practicar", "repasar"].forEach((p) => {
          document.getElementById("panel-" + p).style.display = p === btn.dataset.panel ? "" : "none";
        });
      });
    });

    document.querySelectorAll(".btn-pista").forEach((btn) => {
      btn.addEventListener("click", () => {
        const caja = document.getElementById("pista-" + btn.dataset.ej);
        caja.style.display = caja.style.display === "none" ? "block" : "none";
        btn.textContent = caja.style.display === "none" ? "💡 Ver pista" : "💡 Ocultar pista";
      });
    });

    document.querySelectorAll(".btn-solucion").forEach((btn) => {
      btn.addEventListener("click", () => {
        const caja = document.getElementById("solucion-" + btn.dataset.ej);
        const abierta = caja.style.display !== "none";
        caja.style.display = abierta ? "none" : "block";
        btn.textContent = abierta ? "Ver solución" : "Ocultar solución";
        btn.classList.toggle("abierta", !abierta);
      });
    });

    document.getElementById("btn-volver").addEventListener("click", mostrarFormulario);
    document.getElementById("btn-respuestas").addEventListener("click", () => {
      document.getElementById("caja-respuestas").classList.toggle("abierto");
    });

    document.querySelectorAll(".opcion-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        const item = btn.closest(".trivia-item");
        if (item.classList.contains("revisado")) return;
        item.querySelectorAll(".opcion-btn").forEach((b) => b.classList.remove("seleccionada"));
        btn.classList.add("seleccionada");
      });
    });
    const btnRevisarTrivia = document.getElementById("btn-revisar-trivia");
    if (btnRevisarTrivia) btnRevisarTrivia.addEventListener("click", revisarTrivia);

    let pdfUrlCache = pdfUrlGuardado || null;
    const btnPdf = document.getElementById("btn-pdf");
    btnPdf.addEventListener("click", async () => {
      if (pdfUrlCache) {
        window.open(pdfUrlCache, "_blank");
        return;
      }
      const textoOriginal = btnPdf.textContent;
      btnPdf.disabled = true;
      btnPdf.textContent = "Preparando PDF…";
      try {
        const res = await fetch(`${API_BASE}/api/temas/pdf`, {
          method: "POST",
          headers: { "Content-Type": "application/json", Authorization: `Bearer ${sesionActual.access_token}` },
          body: JSON.stringify({ contenido: ultimoContenido, modo: "individual", temaId: ultimoTemaId }),
        });
        const data = await res.json();
        if (!data.pdf_url) throw new Error(data.error || "No se pudo generar el PDF.");
        pdfUrlCache = data.pdf_url;
        window.open(pdfUrlCache, "_blank");
        btnPdf.textContent = "📄 Descargar imprimible (PDF)";
      } catch (err) {
        alert("Error: " + err.message);
        btnPdf.textContent = textoOriginal;
      } finally {
        btnPdf.disabled = false;
      }
    });
  }

  init();
</script>
</body>
</html>
