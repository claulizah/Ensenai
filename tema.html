        if (item.classList.contains("revisado")) return;
        item.querySelectorAll(".opcion-btn").forEach((b) => b.classList.remove("seleccionada"));
        btn.classList.add("seleccionada");
      });
    });
    document.getElementById("btn-revisar-trivia-diaria").addEventListener("click", revisarTriviaDiaria);
  }

  async function revisarTriviaDiaria() {
    const zona = document.getElementById("zona-trivia-diaria");
    if (!zona) return;
    let total = 0;
    let correctas = 0;

    zona.querySelectorAll(".trivia-item").forEach((item) => {
      item.classList.add("revisado");
      const correcta = item.dataset.correcta || "";
      const opciones = item.querySelectorAll(".opcion-btn");
      const feedback = item.querySelector(".trivia-feedback");
      const abierta = item.querySelector(".respuesta-abierta");

      if (opciones.length) {
        total++;
        const seleccionado = item.querySelector(".opcion-btn.seleccionada");
        const acerto = seleccionado && normalizarTexto(seleccionado.dataset.valor) === normalizarTexto(correcta);

        opciones.forEach((btn) => {
          btn.disabled = true;
          const esCorrecta = normalizarTexto(btn.dataset.valor) === normalizarTexto(correcta);
          const esTuya = btn === seleccionado;
          if (esCorrecta) btn.classList.add("correcta");
          else if (esTuya) btn.classList.add("incorrecta");
          let etiqueta = "";
          if (esTuya && esCorrecta) etiqueta = "Tu respuesta · correcta";
          else if (esTuya) etiqueta = "Tu respuesta";
          else if (esCorrecta) etiqueta = "Correcta";
          if (etiqueta) btn.insertAdjacentHTML("beforeend", `<span class="etiqueta-op">${etiqueta}</span>`);
        });

        feedback.style.display = "block";
        if (acerto) {
          correctas++;
          feedback.className = "trivia-feedback bien";
          feedback.textContent = "✅ ¡Correcto!";
        } else if (seleccionado) {
          feedback.className = "trivia-feedback mal";
          feedback.innerHTML = `❌ La respuesta correcta era: <strong>${escapeHtml(correcta)}</strong>`;
        } else {
          feedback.className = "trivia-feedback";
          feedback.innerHTML = `No elegiste respuesta. La correcta era: <strong>${escapeHtml(correcta)}</strong>`;
        }
      } else {
        if (abierta) abierta.disabled = true;
        const escribio = abierta && abierta.value.trim();
        feedback.style.display = "block";
        feedback.className = "trivia-feedback";
        feedback.innerHTML =
          (escribio ? "" : "<em>No escribiste nada.</em> ") + `<strong>Respuesta sugerida:</strong> ${escapeHtml(correcta)}`;
      }
    });

    const resumen = document.getElementById("trivia-diaria-resumen");
    if (resumen && total > 0) {
      resumen.style.display = "block";
      const pct = correctas / total;
      const mensaje = pct === 1 ? "¡Todas correctas! 🎉" : pct >= 0.6 ? "¡Vas bien!" : "Vale la pena repasar y volver mañana.";
      resumen.textContent = `${mensaje} Acertaste ${correctas} de ${total}.`;
    }

    const btnRevisar = document.getElementById("btn-revisar-trivia-diaria");
    if (btnRevisar) btnRevisar.style.display = "none";

    try {
      const res = await fetchConReintento(
        `${API_BASE}/api/temas/trivia-diaria/completar`,
        {
          method: "POST",
          headers: { "Content-Type": "application/json", Authorization: `Bearer ${sesionActual.access_token}` },
          body: JSON.stringify({ aciertos: correctas, total }),
        },
        null,
        null
      );
      const data = await res.json();
      if (res.ok && data.gamificacion) {
        const g = data.gamificacion;
        const medallasNuevas = g.medallas_nuevas || [];
        zona.insertAdjacentHTML(
          "beforeend",
          `<div class="aviso" style="margin-top:12px;">
            🔥 Racha: ${g.racha_actual} día${g.racha_actual === 1 ? "" : "s"}
            ${medallasNuevas.length ? "<br>" + medallasNuevas.map((m) => `🏅 ¡Nueva medalla! ${m.icono} ${escapeHtml(m.nombre)}`).join("<br>") : ""}
          </div>`
        );
        actualizarRachaChip(g);
      }
    } catch (err) {
      // si falla no pasa nada — ya vio sus respuestas, solo no se actualiza la racha visualmente
    }
  }

  async function cargarPerfiles() {
    // En la pantalla de perfil no existe #zona-perfiles: igual hay que traer
    // los perfiles, porque son lo que se pinta arriba (pintarHeroPerfil).
    const cont = document.getElementById("zona-perfiles");
    try {
      const res = await fetchConReintento(`${API_BASE}/api/aprendizaje/perfiles`, {
        headers: { Authorization: `Bearer ${sesionActual.access_token}` },
      }, cont);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "No se pudieron cargar tus perfiles.");

      perfilesCache = data.perfiles || [];
      const limite = data.limite_perfiles;
      limitePerfilesCache = limite;
      pintarHeroPerfil();
      if (!cont) return; // estamos en la pantalla de perfil: no hay lista que pintar

      const listaHtml = perfilesCache.length
        ? perfilesCache
            .map(
              (p) => `
        <div class="historial-item" data-perfil-id="${p.id}">
          <span class="titulo">
            ${htmlAvatar(p, 26)}
            ${escapeHtml(p.nombre)}
            <span style="font-weight:400; color:#4A6A85;">— ${escapeHtml(
              (p.inteligencia_dominante || []).map((t) => COMO_APRENDE[t] || ETIQUETAS_INTELIGENCIA[t] || t).join(" · ")
            )}</span>
          </span>
          <span style="display:flex; gap:6px;">
            <button class="secundario" style="margin:0; padding:6px 10px;" data-rehacer="${p.id}" title="Volver a hacer el quiz">🔄 Rehacer</button>
            <button class="secundario" style="margin:0; padding:6px 10px;" data-borrar="${p.id}">Borrar</button>
          </span>
        </div>
      `
            )
            .join("")
        : `<p class="ayuda" style="margin:0 0 10px;">Todavía no tienes perfiles guardados.</p>`;

      cont.innerHTML = `
        ${listaHtml}
        <p class="ayuda" style="margin:10px 0 0; font-size:0.85rem;">${perfilesCache.length} de ${limite} perfil(es) de tu plan.</p>
        ${
          perfilesCache.length < limite
            ? `<button class="secundario" style="width:100%;" id="btn-nuevo-perfil">+ Agregar perfil (hacer quiz)</button>`
            : `<p class="ayuda" style="margin:6px 0 0; font-size:0.85rem;">Llegaste al límite de tu plan — <a href="comprador.html?cuenta=1">mejora tu plan</a> para agregar más.</p>`
        }
      `;

      if (document.getElementById("btn-nuevo-perfil")) {
        document.getElementById("btn-nuevo-perfil").addEventListener("click", () => mostrarQuizPerfil());
      }
      cont.querySelectorAll("[data-borrar]").forEach((btn) => {
        btn.addEventListener("click", () => borrarPerfil(btn.dataset.borrar));
      });
      // "Rehacer" resuelve la fricción de que un perfil solo se pudiera
      // borrar: si el niño creció, cambió su forma de aprender, o el quiz se
      // contestó a la ligera la primera vez, antes había que borrarlo — y en
      // el plan Gratis eso te dejaba en cero perfiles.
      cont.querySelectorAll("[data-rehacer]").forEach((btn) => {
        btn.addEventListener("click", () => mostrarQuizPerfil(btn.dataset.rehacer));
      });

      // llena el selector de perfil del formulario de generación
      const select = document.getElementById("perfil-input");
      if (select) {
        const previo = select.value;
        select.innerHTML =
          `<option value="">Balanceado (sin perfil específico)</option>` +
          perfilesCache.map((p) => `<option value="${p.id}">${escapeHtml(p.nombre)}</option>`).join("");
        // Si solo hay un perfil, se preselecciona: es lo que la persona
        // quiere el 99% de las veces y evita generar con "Balanceado" sin
        // darse cuenta.
        // Prioridad: lo que ya estaba elegido en el selector > el perfil que
        // la persona tiene abierto en su pantalla de perfil > el único que
        // existe. Así, entrar desde "Sofía" y darle a generar no termina
        // haciendo material para Mateo.
        select.value = perfilesCache.some((p) => p.id === previo)
          ? previo
          : perfilesCache.some((p) => p.id === perfilActivoId)
          ? perfilActivoId
          : perfilesCache.length === 1
          ? perfilesCache[0].id
          : previo;
        select.onchange = pintarPerfilActivo;
        pintarPerfilActivo();
      }
    } catch (err) {
      if (cont) cont.innerHTML = `<div class="error">${escapeHtml(mensajeErrorAmigable(err))}</div>`;
    }
  }

  /**
   * Tarjeta que deja ver de un golpe para quién se va a generar el material
   * y con qué estilo. Antes solo estaba el `<select>`, muy fácil de pasar por
   * alto — y quien tiene varios hijos terminaba generando con el perfil
   * equivocado sin enterarse.
   */
  function pintarPerfilActivo() {
    const cont = document.getElementById("perfil-activo");
    if (!cont) return;
    const id = document.getElementById("perfil-input")?.value;
    const perfil = perfilesCache.find((p) => p.id === id);

    if (!perfil) {
      cont.className = "perfil-activo neutro";
      cont.innerHTML = `<span class="pa-icono">⚖️</span>
        <div><strong>Perfil balanceado</strong><span class="pa-sub">El material no se adapta a una forma de aprender en particular.</span></div>`;
      return;
    }

    const tipos = (perfil.inteligencia_dominante || []).slice(0, 2);
    cont.className = "perfil-activo";
    cont.style.borderColor = COLOR_INTELIGENCIA[tipos[0]] || "var(--linea)";
    cont.innerHTML = `
      ${htmlAvatar(perfil, 38)}
      <div>
        <strong>Generando para ${escapeHtml(perfil.nombre)}</strong>
        <span class="pa-sub">${tipos.map((t) => escapeHtml(COMO_APRENDE[t] || ETIQUETAS_INTELIGENCIA[t] || t)).join(" · ")}</span>
      </div>`;
  }

  // ── Quiz de perfil de aprendizaje ───────────────────────────────────────
  // Estado del quiz en curso: por cada pregunta, qué eligió como primera y
  // (opcionalmente) como segunda opción. Se guardan TIPOS, no índices,
  // porque el backend ahora baraja el orden de las opciones en cada
  // pregunta para no sesgar el resultado hacia las primeras de la lista.
  // ── Tips mientras se genera el material ─────────────────────────────────
  // Generar tarda ~30 segundos. En vez de dejar a la persona mirando un
  // "cargando", se aprovecha para darle algo que de verdad le sirva: un
  // consejo corto de cómo acompañar el estudio. Los primeros son específicos
  // del perfil que eligió (refuerzan por qué el perfil importa), y los
  // generales vienen del marco del documento "Sistema Cognitivo Integral"
  // (evocación activa, repaso espaciado, mentalidad de crecimiento).
  const TIPS_POR_INTELIGENCIA = {
    linguistica: [
      "Pídele que te cuente el tema con sus propias palabras, sin ver los apuntes. Si lo puede explicar, lo entendió.",
      "Inventar una historia corta con los conceptos del tema los fija mucho mejor que repetirlos.",
    ],
    logico_matematica: [
      "Antes de empezar, pregúntale “¿qué crees que va a pasar aquí?”. Predecir activa el cerebro más que solo leer.",
      "Buscar el patrón — qué se repite, qué cambia — le ordena el tema más rápido que memorizarlo por partes.",
    ],
    espacial: [
      "Pídele que te DIBUJE lo que entendió, en vez de contártelo. A quien piensa en imágenes le fija mucho más el tema.",
      "Dos colores en los apuntes: uno para las ideas principales y otro para los ejemplos. La diferencia se nota.",
    ],
    musical: [
      "Ponerle tonada a lo que hay que memorizar funciona de verdad: una lista con ritmo se recuerda semanas después.",
      "Que grabe una nota de voz explicando el tema y la escuche después. Oírse a sí mismo/a explicar ayuda mucho.",
    ],
    kinestesica: [
      "Estudiar de pie o caminando no es distracción. A quien aprende con el cuerpo, quedarse quieto le cuesta el doble.",
      "Convertir el tema en algo que se pueda actuar o tocar con las manos vale más que media hora de lectura.",
    ],
    interpersonal: [
      "Que te explique el tema a ti, o hasta a un peluche. Enseñar en voz alta es de las formas más rápidas de fijar algo.",
      "Inviertan papeles: que ella o él te tome el examen a ti. Preparar las preguntas obliga a entender el tema.",
    ],
    intrapersonal: [
      "Dale unos minutos a solas antes de empezar. Necesita ordenar sus ideas antes de recibir nuevas.",
      "Preguntarle “¿esto con qué se te parece de tu vida?” conecta el tema con algo que ya sabe.",
    ],
    naturalista: [
      "Relaciona el tema con algo real que pueda observar. Clasificar y comparar le ordena la cabeza.",
      "Sacar el estudio al patio o al parque no es perder el tiempo: el entorno le ayuda a enganchar.",
    ],
  };

  const TIPS_GENERALES = [
    "Repasar tres veces en días distintos fija mucho más que estudiar tres horas seguidas.",
    "Releer los apuntes se siente productivo pero engaña. Cerrar el cuaderno y tratar de recordar es lo que funciona.",
    "Elogia el esfuerzo, no la inteligencia: “te esforzaste mucho” construye más que “qué inteligente eres”.",
    "Sesiones de 20 a 25 minutos con un descanso rinden más que una hora seguida.",
    "Dormir bien después de estudiar es parte del estudio: el cerebro consolida lo aprendido mientras duerme.",
    "Si algo no le sale, pregúntale “¿qué parte exactamente?”. Ubicar dónde se traba ahorra muchísimo tiempo.",
    "Equivocarse y corregir fija más que acertar a la primera. Un error no es tiempo perdido.",
  ];

  let tipsIntervalo = null;

  function armarListaTips() {
    const perfil = perfilesCache.find((p) => p.id === document.getElementById("perfil-input")?.value);
    const dominantes = perfil?.inteligencia_dominante || [];
    const propios = dominantes.flatMap((t) => TIPS_POR_INTELIGENCIA[t] || []);
    // Los del perfil van primero (son los que más resuenan), luego los generales.
    return [...propios, ...TIPS_GENERALES];
  }

  /**
   * `encabezado` acepta un string fijo (como antes) o un arreglo de etapas
   * [{ ms, texto }] para que el título vaya cambiando según el tiempo real
   * transcurrido (31-ago-2026, pedido explícito de la usuaria: "que no se
   * sienta tan tardado" al generar un tema). No hace la generación más
   * rápida — el backend sigue tardando lo mismo — pero deja de sentirse
   * "colgado" mostrando en qué va, en vez de un mismo mensaje fijo todo
   * el rato. Las etapas son un estimado (no vienen del backend en tiempo
   * real), así que se pisan un poco optimistas a propósito.
   */
  function iniciarTips(contenedor, encabezado, accion) {
    detenerTips();
    const tips = armarListaTips();
    const etapas = Array.isArray(encabezado) ? encabezado : null;
    const inicio = Date.now();
    let i = 0;
    let tick = 0;

    const tituloActual = () => {
      if (!etapas) return encabezado;
      const transcurrido = Date.now() - inicio;
      let actual = etapas[0]?.texto || "";
      for (const etapa of etapas) {
        if (transcurrido >= etapa.ms) actual = etapa.texto;
      }
      return actual;
    };

    // Se dibuja UNA vez y después solo se actualiza el texto. Antes se
    // reemplazaba todo el innerHTML cada 2 segundos: el botón "seguir
    // navegando" se destruía y volvía a crearse constantemente, así que un
    // clic que cayera justo en ese instante se perdía (31-ago-2026).
    const nPuntos = Math.min(tips.length, 6);
    contenedor.innerHTML = `
      <div class="zona-espera">
        <div class="espera-barra"><span></span></div>
        <p class="espera-titulo"></p>
        <div class="tip-caja">
          <span class="tip-icono">💡</span>
          <p class="tip-texto"></p>
        </div>
        <div class="tip-puntos">${Array.from({ length: nPuntos }, () => "<span></span>").join("")}</div>
        ${accion ? `<button type="button" class="btn-seguir-navegando" id="btn-accion-espera"></button>` : ""}
      </div>`;

    const elTitulo = contenedor.querySelector(".espera-titulo");
    const elTip = contenedor.querySelector(".tip-texto");
    const elPuntos = [...contenedor.querySelectorAll(".tip-puntos span")];
    const elAccion = accion ? contenedor.querySelector("#btn-accion-espera") : null;
    if (elAccion) {
      elAccion.textContent = accion.texto;
      elAccion.addEventListener("click", accion.onClick); // se conecta una sola vez
    }

    const actualizar = () => {
      if (elTitulo) elTitulo.textContent = tituloActual();
      if (elTip) elTip.textContent = tips[i % tips.length];
      elPuntos.forEach((p, k) => p.classList.toggle("activo", k === i % nPuntos));
    };

    actualizar();
    // Se refresca cada 2s (para que la etapa se sienta viva) pero el tip
    // solo cambia cada 3 refrescos (~6s), igual que antes.
    tipsIntervalo = setInterval(() => {
      tick++;
      if (tick % 3 === 0) i++;
      actualizar();
    }, 2000);
  }

  // ── Generación en segundo plano ────────────────────────────────────────
  // Generar un tema ya no secuestra la pantalla: el trabajo vive en el
  // servidor (ver POST /api/temas/generar-async) y este aviso flotante
  // avisa cuando está listo. Cerrar la página, bloquear el celular o
  // perder la red no lo cancelan — al volver se retoma el mismo trabajo.
  let generacionEnCurso = null;

  function quitarAvisoGeneracion() {
    document.getElementById("aviso-generacion")?.remove();
  }

  function mostrarAvisoGeneracion({ estado, texto, accionTexto, onAccion }) {
    quitarAvisoGeneracion();
    const div = document.createElement("div");
    div.className = `aviso-generacion${estado === "listo" ? " listo" : estado === "falla" ? " falla" : ""}`;
    div.id = "aviso-generacion";
    div.innerHTML = `
      <span class="texto">${escapeHtml(texto)}</span>
      ${accionTexto ? `<button type="button" id="btn-aviso-generacion">${escapeHtml(accionTexto)}</button>` : ""}
      <button type="button" class="cerrar" id="btn-cerrar-aviso" title="Cerrar">✕</button>
    `;
    document.body.appendChild(div);
    if (accionTexto && onAccion) {
      document.getElementById("btn-aviso-generacion").addEventListener("click", () => {
        quitarAvisoGeneracion();
        onAccion();
      });
    }
    document.getElementById("btn-cerrar-aviso")?.addEventListener("click", quitarAvisoGeneracion);
  }

  function detenerTips() {
    if (tipsIntervalo) { clearInterval(tipsIntervalo); tipsIntervalo = null; }
  }

  let respuestasQuiz = {};
  let preguntasQuiz = [];
  let resultadoQuiz = null;
  let ajusteManual = null;

  // Tipo de usuario elegido al registrarse (papa/estudiante/educador/adulto/otro).
  // Decide qué versión del quiz se pide: "ninos" está redactada para que un
  // papá describa a su hijo ("Cuando tiene tiempo libre, prefiere…"), y
  // "adulto" está en primera persona ("Cuando tengo tiempo libre, prefiero…").
  // Antes siempre se pedía la de niños, así que un adolescente o un adulto
  // aprendiendo por su cuenta contestaba preguntas escritas para otra persona.
  let tipoUsuario = null;

  function versionQuiz() {
    return tipoUsuario === "estudiante" || tipoUsuario === "adulto" ? "adulto" : "ninos";
  }

  async function cargarTipoUsuario() {
    try {
      const res = await fetchConReintento(`${API_BASE}/api/aprendizaje/mi-tipo`, {
        headers: { Authorization: `Bearer ${sesionActual.access_token}` },
      });
      if (res.ok) tipoUsuario = (await res.json()).tipo_usuario || null;
    } catch (err) {
      tipoUsuario = null; // sin tipo, se usa la versión de niños como antes
    }
  }

  // ── Avatares de los perfiles ────────────────────────────────────────────
  // Se guarda solo el ID (ej. "avatar-03"), nunca la imagen: los archivos
  // viven en el frontend. Antes este selector iba a ser de animales (zorro,
  // búho, tortuga...) pero se cambió a caritas de niños ilustradas — set
  // comprado en Etsy (licencia "comercial pequeño, hasta 100 ventas" — NO
  // renovada a licencia extendida todavía; hacerlo antes de que las
  // suscripciones de pago combinadas pasen de ~90). Los archivos viven en
  // assets/avatares/avatar-01.png … avatar-24.png. Si algún perfil ya
  // guardado tenía un id de la época de animales (avatar-01..12), no truena:
  // simplemente ahora ese id apunta a una carita en vez de un emoji.
  const USAR_ILUSTRACIONES = true;
  const AVATARES = [
    { id: "avatar-01", file: "avatar-01.png" }, { id: "avatar-02", file: "avatar-02.png" },
    { id: "avatar-03", file: "avatar-03.png" }, { id: "avatar-04", file: "avatar-04.png" },
    { id: "avatar-05", file: "avatar-05.png" }, { id: "avatar-06", file: "avatar-06.png" },
    { id: "avatar-07", file: "avatar-07.png" }, { id: "avatar-08", file: "avatar-08.png" },
    { id: "avatar-09", file: "avatar-09.png" }, { id: "avatar-10", file: "avatar-10.png" },
    { id: "avatar-11", file: "avatar-11.png" }, { id: "avatar-12", file: "avatar-12.png" },
    { id: "avatar-13", file: "avatar-13.png" }, { id: "avatar-14", file: "avatar-14.png" },
    { id: "avatar-15", file: "avatar-15.png" }, { id: "avatar-16", file: "avatar-16.png" },
    { id: "avatar-17", file: "avatar-17.png" }, { id: "avatar-18", file: "avatar-18.png" },
    { id: "avatar-19", file: "avatar-19.png" }, { id: "avatar-20", file: "avatar-20.png" },
    { id: "avatar-21", file: "avatar-21.png" }, { id: "avatar-22", file: "avatar-22.png" },
    { id: "avatar-23", file: "avatar-23.png" }, { id: "avatar-24", file: "avatar-24.png" },
  ];

  // Avatares de adultos/adolescentes autodidactas: iniciales sobre un color
  // llamativo, sacado del mismo set de colores de inteligencias (así se ve
  // parte del mismo sistema visual). Se calcula del nombre — no requiere
  // guardar nada nuevo en el backend.
  const PALETA_INICIALES = Object.values(COLOR_INTELIGENCIA);

  function iniciales(nombre) {
    const palabras = (nombre || "").trim().split(/\s+/).filter(Boolean);
    if (palabras.length === 0) return "?";
    if (palabras.length === 1) return palabras[0].slice(0, 2).toUpperCase();
    return (palabras[0][0] + palabras[1][0]).toUpperCase();
  }

  function colorIniciales(nombre) {
    const str = (nombre || "").trim() || "?";
    let hash = 0;
    for (let i = 0; i < str.length; i++) hash = (hash * 31 + str.charCodeAt(i)) >>> 0;
    return PALETA_INICIALES[hash % PALETA_INICIALES.length];
  }

  function htmlAvatarIniciales(nombre, tam = 34) {
    const estilo = `width:${tam}px; height:${tam}px; background:${colorIniciales(nombre)}; font-family:'Grandstander',sans-serif; font-weight:700; color:#fff; font-size:${Math.round(tam * 0.4)}px;`;
    return `<span class="avatar-perfil" style="${estilo}">${escapeHtml(iniciales(nombre))}</span>`;
  }

  /** Devuelve el HTML del avatar de un perfil: iniciales para cuentas de adultos/autodidactas, ilustración de niños si ya existen (o el ícono de su inteligencia) para el resto. */
  function htmlAvatar(perfil, tam = 34) {
    if (versionQuiz() === "adulto") return htmlAvatarIniciales(perfil?.nombre, tam);

    const av = AVATARES.find((a) => a.id === perfil?.avatar);
    const tipo = perfil?.inteligencia_dominante?.[0];
    const fondo = COLOR_INTELIGENCIA[tipo] || "#B9CFE4";
    const estilo = `width:${tam}px; height:${tam}px; background:${fondo}; font-size:${Math.round(tam * 0.5)}px;`;

    if (av && USAR_ILUSTRACIONES) {
      return `<span class="avatar-perfil" style="${estilo}"><img src="assets/avatares/${av.file}" alt=""></span>`;
    }
    return `<span class="avatar-perfil" style="${estilo}">${ICONO_INTELIGENCIA[tipo] || "🧩"}</span>`;
  }

  let avatarElegido = null;

  function pintarSelectorAvatar() {
    const cont = document.getElementById("selector-avatar");
    if (!cont) return;
    cont.innerHTML = AVATARES.map(
      (a, i) => `
      <button type="button" class="opcion-avatar${avatarElegido === a.id ? " activa" : ""}" data-avatar="${a.id}" aria-pressed="${avatarElegido === a.id}" aria-label="Avatar ${i + 1}${avatarElegido === a.id ? " (elegido)" : ""}">
        <img src="assets/avatares/${a.file}" alt="">
      </button>`
    ).join("");
    cont.querySelectorAll("[data-avatar]").forEach((btn) => {
      btn.addEventListener("click", () => {
        // Volver a picar el mismo lo deselecciona.
        avatarElegido = avatarElegido === btn.dataset.avatar ? null : btn.dataset.avatar;
        pintarSelectorAvatar();
      });
    });
  }

  // Si viene `perfilIdEditando`, el quiz actualiza ese perfil en vez de
  // crear uno nuevo (así no choca con el límite de perfiles del plan).
  let perfilIdEditando = null;

  async function mostrarQuizPerfil(idExistente) {
    // El quiz vive dentro de la tarjeta de perfiles, que solo existe en la
    // pantalla de generar. Desde el perfil (botón "Contestar el quiz" o
    // "+ Agregar") hay que ir allá primero, o esto tronaría con cont null.
    if (!document.getElementById("zona-perfiles")) {
      mostrarFormulario("perfiles");
      await cargarPerfiles();
      return mostrarQuizPerfil(idExistente);
    }

    perfilIdEditando = idExistente || null;
    const existente = perfilesCache.find((p) => p.id === perfilIdEditando);
    const cont = document.getElementById("zona-perfiles");
    cont.innerHTML = `
      ${
        existente
          ? `<div class="aviso" style="margin-bottom:14px;">Vas a rehacer el quiz de <strong>${escapeHtml(existente.nombre)}</strong>. Su perfil se actualiza — no se crea uno nuevo ni se gasta espacio de tu plan.</div>`
          : ""
      }
      <label>Nombre de este perfil</label>
      <div style="display:flex; align-items:center; gap:10px;">
        <input type="text" id="nombre-perfil-input" style="flex:1;" value="${existente ? escapeHtml(existente.nombre) : ""}" placeholder="${versionQuiz() === "adulto" ? "Ej. Yo, Mi maestría, Inglés…" : "Ej. Sofía, Mateo, yo…"}">
        ${versionQuiz() === "adulto" ? `<span id="vista-avatar-iniciales"></span>` : ""}
      </div>
      ${
        versionQuiz() === "adulto"
          ? ""
          : `<label>Elige un avatar (opcional)</label><div class="rejilla-avatares" id="selector-avatar"></div>`
      }
      <div id="preguntas-perfil" style="margin-top:14px;"><div class="cargando">Cargando preguntas…</div></div>
    `;

    respuestasQuiz = {};
    resultadoQuiz = null;
    ajusteManual = null;
    avatarElegido = existente?.avatar || null;

    if (versionQuiz() === "adulto") {
      // Adultos y adolescentes autodidactas: nada de caritas de niños ni
      // set de animales — un avatar de iniciales con color llamativo,
      // calculado del nombre. No se guarda nada nuevo: se recalcula del
      // campo "nombre" que ya existe, así que no toca el backend.
      const inputNombre = document.getElementById("nombre-perfil-input");
      const vista = document.getElementById("vista-avatar-iniciales");
      const actualizarVista = () => { if (vista) vista.innerHTML = htmlAvatarIniciales(inputNombre.value, 40); };
      inputNombre.addEventListener("input", actualizarVista);
      actualizarVista();
    } else {
      pintarSelectorAvatar();
    }

    const res = await fetchConReintento(`${API_BASE}/api/aprendizaje/quiz?version=${versionQuiz()}`);
    const data = await res.json();
    preguntasQuiz = data.preguntas || [];

    document.getElementById("preguntas-perfil").innerHTML = `
      <div class="aviso" style="margin-bottom:14px;">
        Elige la opción que <strong>más</strong> ${versionQuiz() === "adulto" ? "te describe" : "se le parece"}. Si dudas entre dos, márcalas las dos — la segunda cuenta un poco menos y nos ayuda a afinar el resultado.
      </div>
      ${preguntasQuiz.map((p, i) => pintarPreguntaQuiz(p, i)).join("")}
      <div id="aviso-confiabilidad"></div>
      <button class="primario" id="btn-guardar-perfil">Ver resultado</button>
      <button class="secundario" style="width:100%;" id="btn-cancelar-perfil">Cancelar</button>
    `;

    conectarOpcionesQuiz();
    document.getElementById("btn-guardar-perfil").addEventListener("click", calcularPerfilQuiz);
    document.getElementById("btn-cancelar-perfil").addEventListener("click", cargarPerfiles);
  }

  function pintarPreguntaQuiz(p, i) {
    return `
      <div class="quiz-pregunta" data-pregunta="${p.id}">
        <p class="quiz-enunciado">${i + 1}. ${escapeHtml(p.pregunta)}</p>
        <div class="quiz-opciones">
          ${p.opciones
            .map(
              (op) => `
            <button type="button" class="quiz-opcion" data-pregunta="${p.id}" data-tipo="${escapeHtml(op.tipo)}">
              <span class="quiz-marca"></span>${escapeHtml(op.texto)}
            </button>`
            )
            .join("")}
        </div>
      </div>`;
  }

  function conectarOpcionesQuiz() {
    document.querySelectorAll(".quiz-opcion").forEach((btn) => {
      btn.addEventListener("click", () => {
        const id = btn.dataset.pregunta;
        const tipo = btn.dataset.tipo;
        const r = respuestasQuiz[id] || { primaria: null, secundaria: null };

        if (r.primaria === tipo) {
          // Quitar la primera: la segunda (si hay) sube a primera.
          r.primaria = r.secundaria;
          r.secundaria = null;
        } else if (r.secundaria === tipo) {
          r.secundaria = null;
        } else if (!r.primaria) {
          r.primaria = tipo;
        } else {
          r.secundaria = tipo;
        }

        respuestasQuiz[id] = r;
        refrescarPregunta(id);
      });
    });
  }

  function refrescarPregunta(id) {
    const r = respuestasQuiz[id] || {};
    document.querySelectorAll(`.quiz-opcion[data-pregunta="${id}"]`).forEach((btn) => {
      const tipo = btn.dataset.tipo;
      const marca = btn.querySelector(".quiz-marca");
      btn.classList.toggle("primaria", r.primaria === tipo);
      btn.classList.toggle("secundaria", r.secundaria === tipo);
      marca.textContent = r.primaria === tipo ? "1ª" : r.secundaria === tipo ? "2ª" : "";
    });
  }

  /**
   * Misma regla que usa el backend (`evaluarConfiabilidad`), pero aplicada
   * antes de mandar: si claramente no se contestó pensando, no tiene caso
   * gastar uno de los espacios de perfil del plan en un resultado que no
   * significa nada.
   */
  function revisarConfiabilidad(respuestas) {
    const primarias = respuestas.map((r) => r.primaria).filter(Boolean);
    const distintos = new Set(primarias).size;
    if (distintos === 1) return "siempre_lo_mismo";
    if (distintos === 2 && primarias.length >= 10) return "muy_poca_variedad";
    return null;
  }

  async function calcularPerfilQuiz(forzar) {
    const nombre = document.getElementById("nombre-perfil-input").value.trim();
    const avisoCont = document.getElementById("aviso-confiabilidad");
    avisoCont.innerHTML = "";

    if (!nombre) {
      avisoCont.innerHTML = `<div class="error">Escribe un nombre para este perfil.</div>`;
      return;
    }

    const respuestas = [];
    for (const p of preguntasQuiz) {
      const r = respuestasQuiz[p.id];
      if (!r || !r.primaria) {
        avisoCont.innerHTML = `<div class="error">Falta contestar la pregunta ${p.id}. Elige al menos una opción en cada una.</div>`;
        return;
      }
      respuestas.push(r);
    }

    if (forzar !== true) {
      const motivo = revisarConfiabilidad(respuestas);
      if (motivo) {
        avisoCont.innerHTML = `
          <div class="error">
            <strong>El resultado no va a ser muy útil así.</strong><br>
            ${
              motivo === "siempre_lo_mismo"
                ? "Elegiste la misma opción en todas las preguntas."
                : "Casi todas tus respuestas fueron de dos tipos nada más."
            }
            Vale más la pena contestarlo con calma — son 12 preguntas rápidas.
            <div style="margin-top:10px; display:flex; gap:8px; flex-wrap:wrap;">
              <button class="secundario" style="margin:0; width:auto;" id="btn-rehacer-quiz">Contestar de nuevo</button>
              <button class="secundario" style="margin:0; width:auto;" id="btn-forzar-quiz">Usarlo de todos modos</button>
            </div>
          </div>`;
        document.getElementById("btn-rehacer-quiz").addEventListener("click", mostrarQuizPerfil);
        document.getElementById("btn-forzar-quiz").addEventListener("click", () => calcularPerfilQuiz(true));
        avisoCont.scrollIntoView({ behavior: "smooth", block: "center" });
        return;
      }
    }

    try {
      const res = await fetchConReintento(
        `${API_BASE}/api/aprendizaje/calcular`,
        {
          method: "POST",
          headers: { "Content-Type": "application/json", Authorization: `Bearer ${sesionActual.access_token}` },
          body: JSON.stringify({ respuestas }),
        },
        document.getElementById("zona-perfiles"),
        "Calculando el perfil…"
      );
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "No se pudo calcular el perfil.");

      resultadoQuiz = { nombre, respuestas, data };
      ajusteManual = null;
      mostrarResultadoPerfil();
    } catch (err) {
      avisoCont.innerHTML = `<div class="error">${escapeHtml(mensajeErrorAmigable(err))}</div>`;
    }
  }

  /**
   * Resultado del quiz, ANTES de guardarlo. Dos cosas a propósito:
   *
   * 1. No se muestran los 8 porcentajes al frente. Salen de 12 respuestas,
   *    así que un "33%" sugiere una precisión que el test no tiene; se
   *    destacan las 2 principales, las siguientes 2 en chico, y el detalle
   *    numérico queda detrás de un "ver detalle" para quien lo quiera.
   * 2. Se puede ajustar. Quien contesta conoce a su hijo mucho mejor que
   *    12 preguntas — si el resultado no le suena, lo corrige y ese es el
   *    perfil que se guarda.
   */
  function mostrarResultadoPerfil() {
    const { nombre, data } = resultadoQuiz;
    const cont = document.getElementById("zona-perfiles");
    const principales = ajusteManual || data.perfil_dominante || [];
    const secundarias = (data.secundarias || []).filter((t) => !principales.includes(t));
    const porcentajes = data.porcentajes || {};

    const tarjeta = (tipo) => `
      <div class="perfil-principal" style="border-color:${COLOR_INTELIGENCIA[tipo] || "#ccc"};">
        <span class="perfil-icono" style="background:${COLOR_INTELIGENCIA[tipo] || "#ccc"};">${ICONO_INTELIGENCIA[tipo] || "•"}</span>
        <div>
          <strong>${escapeHtml(COMO_APRENDE[tipo] || "")}</strong>
          <span class="perfil-tipo-chico">${escapeHtml(ETIQUETAS_INTELIGENCIA[tipo] || tipo)}</span>
        </div>
      </div>`;

    const filasDetalle = Object.entries(porcentajes)
      .sort((a, b) => b[1] - a[1])
      .map(
        ([tipo, pct]) => `
      <div class="barra-perfil-fila">
        <span class="barra-perfil-label">${escapeHtml(ETIQUETAS_INTELIGENCIA[tipo] || tipo)}</span>
        <div class="barra-perfil-track"><div class="barra-perfil-fill${principales.includes(tipo) ? " dominante" : ""}" style="width:${pct}%"></div></div>
        <span class="barra-perfil-pct">${pct}%</span>
      </div>`
      )
      .join("");

    cont.innerHTML = `
      <h3 style="margin-top:0;">Así aprende ${escapeHtml(nombre)}</h3>
      <div class="perfil-principales">${principales.map(tarjeta).join("")}</div>
      ${
        secundarias.length
          ? `<p class="ayuda" style="margin:12px 0 6px; font-size:0.85rem;">También le funciona:</p>
             <div style="display:flex; flex-wrap:wrap; gap:6px;">
               ${secundarias
                 .map(
                   (t) =>
                     `<span class="chip-secundaria">${ICONO_INTELIGENCIA[t] || "•"} ${escapeHtml(ETIQUETAS_INTELIGENCIA[t] || t)}</span>`
                 )
                 .join("")}
             </div>`
          : ""
      }
      ${ajusteManual ? `<p class="ayuda" style="margin:12px 0 0; font-size:0.82rem;">✏️ Ajustado por ti.</p>` : ""}

      <details class="detalle-quiz">
        <summary>Ver el detalle del quiz</summary>
        <div style="margin-top:10px;">${filasDetalle}</div>
        <p class="ayuda" style="margin:8px 0 0; font-size:0.78rem;">Sale de 12 preguntas — tómalo como una guía de por dónde entrarle, no como una medición exacta.</p>
      </details>

      <div class="aviso" style="margin-top:16px;">
        <strong>¿Te suena?</strong> ${versionQuiz() === "adulto" ? "Tú te conoces mejor que 12 preguntas." : "Tú lo conoces mejor que 12 preguntas."} Si algo no encaja, ajústalo.
      </div>
      <button class="primario" id="btn-confirmar-perfil">Sí, guardar perfil</button>
      <button class="secundario" style="width:100%;" id="btn-ajustar-perfil">Ajustar</button>
      <button class="secundario" style="width:100%;" id="btn-cancelar-resultado">Cancelar</button>
    `;

    document.getElementById("btn-confirmar-perfil").addEventListener("click", guardarPerfilQuiz);
    document.getElementById("btn-ajustar-perfil").addEventListener("click", mostrarAjustePerfil);
    document.getElementById("btn-cancelar-resultado").addEventListener("click", cargarPerfiles);
  }

  function mostrarAjustePerfil() {
    const { nombre, data } = resultadoQuiz;
    const cont = document.getElementById("zona-perfiles");
    let elegidas = (ajusteManual || data.perfil_dominante || []).slice(0, 2);

    const pintar = () => {
      cont.innerHTML = `
        <h3 style="margin-top:0;">¿Cómo aprende mejor ${escapeHtml(nombre)}?</h3>
        <p class="ayuda" style="margin:0 0 12px;">Elige hasta dos. Son las que van a guiar el estilo de sus actividades.</p>
        <div class="rejilla-ajuste">
          ${Object.keys(ETIQUETAS_INTELIGENCIA)
            .map(
              (t) => `
            <button type="button" class="opcion-ajuste${elegidas.includes(t) ? " activa" : ""}" data-tipo="${t}"
              style="${elegidas.includes(t) ? `border-color:${COLOR_INTELIGENCIA[t]}; background:${COLOR_INTELIGENCIA[t]}1A;` : ""}">
              <span class="perfil-icono chico" style="background:${COLOR_INTELIGENCIA[t]};">${ICONO_INTELIGENCIA[t]}</span>
              <strong>${escapeHtml(COMO_APRENDE[t])}</strong>
              <span class="perfil-tipo-chico">${escapeHtml(ETIQUETAS_INTELIGENCIA[t])}</span>
            </button>`
            )
            .join("")}
        </div>
        <div id="error-ajuste"></div>
        <button class="primario" id="btn-aplicar-ajuste">Listo</button>
        <button class="secundario" style="width:100%;" id="btn-cancelar-ajuste">Regresar sin ajustar</button>
      `;

      cont.querySelectorAll(".opcion-ajuste").forEach((btn) => {
        btn.addEventListener("click", () => {
          const t = btn.dataset.tipo;
          if (elegidas.includes(t)) elegidas = elegidas.filter((x) => x !== t);
          else if (elegidas.length < 2) elegidas.push(t);
          else elegidas = [elegidas[1], t]; // reemplaza la más vieja
          pintar();
        });
      });

      document.getElementById("btn-aplicar-ajuste").addEventListener("click", () => {
        if (!elegidas.length) {
          document.getElementById("error-ajuste").innerHTML = `<div class="error">Elige al menos una.</div>`;
          return;
        }
        ajusteManual = elegidas.slice();
        mostrarResultadoPerfil();
      });
      document.getElementById("btn-cancelar-ajuste").addEventListener("click", mostrarResultadoPerfil);
    };

    pintar();
  }

  async function guardarPerfilQuiz() {
    const { nombre, respuestas } = resultadoQuiz;
    const cont = document.getElementById("zona-perfiles");
    try {
      const editando = Boolean(perfilIdEditando);
      const res = await fetchConReintento(
        editando ? `${API_BASE}/api/aprendizaje/perfiles/${perfilIdEditando}` : `${API_BASE}/api/aprendizaje/perfiles`,
        {
          method: editando ? "PUT" : "POST",
          headers: { "Content-Type": "application/json", Authorization: `Bearer ${sesionActual.access_token}` },
          body: JSON.stringify({ nombre, respuestas, dominante_manual: ajusteManual || undefined, avatar: avatarElegido || undefined }),
        },
        cont,
        "Guardando el perfil…"
      );
      const data = await res.json();

      perfilIdEditando = null;
      cargarPerfiles();
    } catch (err) {
      cont.insertAdjacentHTML("beforeend", `<div class="error">${escapeHtml(mensajeErrorAmigable(err))}</div>`);
    }
  }

  async function borrarPerfil(perfilId) {
    if (!confirm("¿Borrar este perfil?")) return;
    try {
      const res = await fetchConReintento(`${API_BASE}/api/aprendizaje/perfiles/${perfilId}`, {
        method: "DELETE",

      });
