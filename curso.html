<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EnseñAI — Curso</title>
<link rel="icon" type="image/png" href="assets/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grandstander:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --profundo: #1E3A8A; --profundo-oscuro: #16296B; --cielo: #60A5FA;
    --menta: #34D399; --aqua: #7DD3FC; --bosque: #065F46;
    --hielo: #F0FDF4; --tinta: #1E3A8A; --linea: #DCEEFC;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: 'Nunito', sans-serif;
    background:
      radial-gradient(circle at 12% 8%, rgba(96,165,250,0.35) 0, transparent 30%),
      radial-gradient(circle at 90% 20%, rgba(125,211,252,0.32) 0, transparent 32%),
      var(--hielo);
    color: var(--tinta); min-height: 100vh;
  }
  header {
    background: var(--profundo); color: #fff; padding: 18px 24px;
    display: flex; align-items: center; gap: 10px;
  }
  header a { color: inherit; text-decoration: none; display: flex; align-items: center; gap: 10px; }
  header .marca { font-family: 'Grandstander', sans-serif; font-weight: 700; font-size: 1.4rem; }
  header .marca .ai {
    display: inline-block; color: var(--aqua); background: rgba(255,255,255,0.14);
    padding: 1px 10px; border-radius: 999px; font-size: 0.75em; vertical-align: middle;
  }
  main { max-width: 620px; margin: 0 auto; padding: 32px 20px 80px; }
  .tarjeta {
    background: #fff; border: 2px solid var(--linea); border-radius: 18px;
    padding: 22px; margin-bottom: 18px; box-shadow: 0 3px 0 var(--linea);
  }
  .etiqueta {
    display: inline-block; background: var(--hielo); color: var(--bosque);
    font-weight: 700; font-size: 0.78rem; padding: 4px 12px; border-radius: 999px;
    margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.02em;
  }
  h1 { font-family: 'Grandstander', sans-serif; font-size: 1.6rem; margin: 0 0 6px; }
  .creador { color: #4A6A85; font-size: 0.95rem; margin-bottom: 18px; }
  video { width: 100%; border-radius: 14px; margin-bottom: 18px; background: #000; }
  h3 { font-family: 'Grandstander', sans-serif; color: var(--bosque); font-size: 1rem; margin: 18px 0 8px; }
  p.texto { line-height: 1.6; margin: 0; }
  .precio {
    font-family: 'Grandstander', sans-serif; font-size: 1.4rem; color: var(--profundo);
    margin: 4px 0 16px;
  }
  button.primario {
    width: 100%; background: var(--profundo); color: #fff; border: none;
    padding: 16px; border-radius: 999px; font-family: 'Grandstander', sans-serif;
    font-weight: 600; font-size: 1.05rem; cursor: pointer;
    box-shadow: 0 4px 0 var(--profundo-oscuro);
  }
  button.primario:disabled { opacity: 0.6; cursor: not-allowed; }
  .aviso {
    background: var(--hielo); border: 2px dashed var(--aqua); border-radius: 12px;
    padding: 12px 14px; font-size: 0.9rem; color: var(--bosque); margin-top: 12px;
  }
  .error {
    background: #FFF0EC; border: 2px solid #FFC4B5; color: #B94A2E;
    padding: 12px 14px; border-radius: 12px; margin-top: 12px; font-size: 0.9rem;
  }
  .cargando { text-align: center; padding: 60px 20px; color: #4A6A85; }
</style>
</head>
<body>

<header>
  <a href="index.html"><span class="marca">Enseñ<span class="ai">AI</span></span></a>
</header>

<main id="contenido">
  <div class="cargando">Cargando curso…</div>
</main>

<script>
  const API_BASE = "https://ensenai-backend.onrender.com";
  const SUPABASE_URL = "https://azslvqfgeghhzghfxmdh.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF6c2x2cWZnZWdoaHpnaGZ4bWRoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzOTUzMzksImV4cCI6MjEwMTk3MTMzOX0.zd22nrf9OUrg0h2YnGJJt9mkKzoFERM54F4S48r-xEQ";
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const params = new URLSearchParams(window.location.search);
let slug = params.get("slug");
if (!slug) {
  const match = window.location.pathname.match(/^\/c\/([^/]+)\/?$/);
  if (match) slug = decodeURIComponent(match[1]);
}

  function escapeHtml(str) {
    const d = document.createElement("div");
    d.textContent = str || "";
    return d.innerHTML;
  }

  async function cargarCurso() {
    const cont = document.getElementById("contenido");
    if (!slug) {
      cont.innerHTML = `<div class="error">Falta el curso (liga incompleta).</div>`;
      return;
    }

    try {
      const res = await fetch(`${API_BASE}/api/courses/publico/${slug}`);
      const data = await res.json();
      if (!data.course) throw new Error(data.error || "Curso no encontrado.");

      const { course, preview } = data;
      const audienciaTexto = { ninos: "Niños", padres: "Padres/cuidadores", profesionales: "Profesionales" }[course.audience] || course.audience;

      cont.innerHTML = `
        <div class="tarjeta">
          <span class="etiqueta">${audienciaTexto}</span>
          <h1>${escapeHtml(course.title)}</h1>
          <p class="creador">Por ${escapeHtml(course.creators?.name || "Creador de EnseñAI")}</p>
          <video controls src="${escapeHtml(course.video_url)}" poster=""></video>
          ${preview?.resumen ? `<h3>De qué trata</h3><p class="texto">${escapeHtml(preview.resumen)}</p>` : ""}
          <p class="precio">$${Number(course.price_mxn).toFixed(2)} MXN</p>
          <div id="zona-accion">
            <button class="primario" id="btnComprar">Obtener acceso</button>
          </div>
          <div id="mensaje"></div>
        </div>
      `;

      document.getElementById("btnComprar").addEventListener("click", () => manejarCompra(course.id));
      await revisarSiYaTieneAcceso(course.id);
    } catch (err) {
      cont.innerHTML = `<div class="error">${escapeHtml(err.message)}</div>`;
    }
  }

  async function obtenerSesion() {
    const { data } = await supabaseClient.auth.getSession();
    return data.session;
  }

  async function revisarSiYaTieneAcceso(courseId) {
    const session = await obtenerSesion();
    if (!session) return;

    try {
      const res = await fetch(`${API_BASE}/api/purchases/mis-cursos`, {
        headers: { Authorization: `Bearer ${session.access_token}` },
      });
      const data = await res.json();
      const yaComprado = (data.cursos || []).some((c) => c.course_id === courseId);
      if (yaComprado) {
        document.getElementById("zona-accion").innerHTML =
          `<div class="aviso">✓ Ya tienes acceso a este curso — el video de arriba está disponible completo.</div>`;
      }
    } catch (err) {
      // si falla, simplemente no mostramos el aviso — no bloquea nada
    }
  }

  async function manejarCompra(courseId) {
    const mensaje = document.getElementById("mensaje");
    mensaje.innerHTML = "";
    const btn = document.getElementById("btnComprar");

    const session = await obtenerSesion();
    if (!session) {
      window.location.href = `comprador.html?despues=curso&slug=${encodeURIComponent(slug)}`;
      return;
    }

    btn.disabled = true;
    btn.textContent = "Un momento…";

    try {
      const res = await fetch(`${API_BASE}/api/purchases/redeem`, {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: `Bearer ${session.access_token}` },
        body: JSON.stringify({ courseId }),
      });
      const data = await res.json();

      if (data.status === "canjeado") {
        document.getElementById("zona-accion").innerHTML =
          `<div class="aviso">✓ ¡Listo! Ya tienes acceso — recarga la página para ver el video completo.</div>`;
        return;
      }

      // si no hay créditos disponibles, lo mandamos a comprar un paquete
      if (data.error && data.error.includes("créditos")) {
        window.location.href = `comprador.html?despues=curso&slug=${encodeURIComponent(slug)}&comprar=creditos`;
        return;
      }

      throw new Error(data.error || "No se pudo procesar.");
    } catch (err) {
      mensaje.innerHTML = `<div class="error">${escapeHtml(err.message)}</div>`;
      btn.disabled = false;
      btn.textContent = "Obtener acceso";
    }
  }

  cargarCurso();
</script>
</body>
</html>
