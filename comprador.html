<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EnseñAI — Mi cuenta</title>
<link rel="icon" type="image/png" href="assets/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grandstander:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --profundo: #1E3A8A; --profundo-oscuro: #16296B; --cielo: #60A5FA;
    --menta: #34D399; --aqua: #7DD3FC; --bosque: #065F46;
    --hielo: #F0FDF4; --tinta: #1E3A8A; --linea: #DCEEFC;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: 'Nunito', sans-serif;
    background:
      radial-gradient(circle at 12% 8%, rgba(96,165,250,0.35) 0, transparent 30%),
      radial-gradient(circle at 90% 20%, rgba(125,211,252,0.32) 0, transparent 32%),
      var(--hielo);
    color: var(--tinta); min-height: 100vh;
  }
  header { background: var(--profundo); color: #fff; padding: 18px 24px; display: flex; align-items: center; justify-content: space-between; }
  header a { color: inherit; text-decoration: none; display: flex; align-items: center; gap: 10px; }
  header .marca { font-family: 'Grandstander', sans-serif; font-weight: 700; font-size: 1.4rem; }
  header .marca .ai {
    display: inline-block; color: var(--aqua); background: rgba(255,255,255,0.14);
    padding: 1px 10px; border-radius: 999px; font-size: 0.75em; vertical-align: middle;
  }
  #btnSalir { background: none; border: 1px solid rgba(255,255,255,0.4); color: #fff; padding: 7px 14px; border-radius: 999px; font-size: 0.85rem; cursor: pointer; display: none; }
  main { max-width: 560px; margin: 0 auto; padding: 32px 20px 80px; }
  .tarjeta { background: #fff; border: 2px solid var(--linea); border-radius: 18px; padding: 22px; margin-bottom: 18px; box-shadow: 0 3px 0 var(--linea); }
  h1 { font-family: 'Grandstander', sans-serif; font-size: 1.4rem; margin: 0 0 6px; text-align: center; }
  p.ayuda { color: #4A6A85; text-align: center; margin: 0 0 20px; }
  label { display: block; font-weight: 700; font-size: 0.9rem; margin: 14px 0 6px; }
  input { width: 100%; padding: 12px 14px; border: 2px solid var(--linea); border-radius: 12px; font-family: inherit; font-size: 1rem; }
  button.primario {
    width: 100%; background: var(--profundo); color: #fff; border: none; padding: 14px; border-radius: 999px;
    font-family: 'Grandstander', sans-serif; font-weight: 600; font-size: 1rem; cursor: pointer; margin-top: 18px;
    box-shadow: 0 4px 0 var(--profundo-oscuro);
  }
  button.primario:disabled { opacity: 0.6; cursor: not-allowed; }
  button.secundario { width: 100%; background: none; border: none; color: #5b7d99; font-weight: 700; font-size: 0.9rem; cursor: pointer; margin-top: 10px; text-decoration: underline; }
  .enlace-chico { display: block; text-align: center; color: #5b7d99; font-size: 0.85rem; margin-top: 14px; cursor: pointer; text-decoration: underline; }
  .error { background: #FFF0EC; border: 2px solid #FFC4B5; color: #B94A2E; padding: 12px 14px; border-radius: 12px; margin-top: 14px; font-size: 0.9rem; }
  /* ── Pantalla de bienvenida "¿quién eres?" ── */
  .bienvenida-intro { text-align: center; margin-bottom: 22px; }
  .bienvenida-intro .saludo { color: var(--bosque); font-weight: 700; font-size: 0.88rem; margin: 0 0 6px; }
  .rejilla-tipos { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .tarjeta-tipo {
    display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px;
    background: #fff; border: 2px solid var(--linea); border-radius: 18px; padding: 20px 12px;
    font-family: inherit; cursor: pointer; transition: transform .15s, border-color .15s, box-shadow .15s;
  }
  .tarjeta-tipo:hover { transform: translateY(-3px); border-color: var(--cielo); box-shadow: 0 8px 18px rgba(30,58,138,0.10); }
  .tarjeta-tipo .emoji {
    width: 62px; height: 62px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 1.9rem; line-height: 1;
  }
  .tarjeta-tipo .titulo { display: block; font-family: 'Grandstander', sans-serif; font-weight: 700; font-size: 0.98rem; color: var(--profundo); margin-bottom: 3px; }
  .tarjeta-tipo .sub { display: block; font-size: 0.78rem; color: #5b7d99; line-height: 1.35; }
  .tarjeta-tipo.ancha { grid-column: 1 / -1; flex-direction: row; text-align: left; gap: 14px; padding: 16px 18px; }
  .tarjeta-tipo.ancha .emoji { width: 48px; height: 48px; font-size: 1.5rem; flex-shrink: 0; }

  .segmentado { display: flex; background: var(--hielo); border-radius: 999px; padding: 4px; margin-bottom: 22px; }
  .segmentado button { flex: 1; border: none; background: none; padding: 10px; border-radius: 999px; font-family: 'Grandstander', sans-serif; font-weight: 600; font-size: 0.92rem; cursor: pointer; color: #5b7d99; transition: background 0.15s, color 0.15s; }
  .segmentado button.activo { background: #fff; color: var(--profundo); box-shadow: 0 2px 6px rgba(30,58,138,0.12); }
  .aviso { background: var(--hielo); border: 2px dashed var(--menta); border-radius: 12px; padding: 12px 14px; font-size: 0.9rem; color: var(--bosque); margin-bottom: 18px; text-align: center; }
  .creditos-num { font-family: 'Grandstander', sans-serif; font-size: 2.2rem; color: var(--profundo); text-align: center; margin: 4px 0; }
  .creditos-label { text-align: center; color: #4A6A85; margin-bottom: 16px; }
  .paquetes { display: grid; gap: 10px; }
  .paquete { border: 2px solid var(--linea); border-radius: 14px; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
  .paquete:hover { border-color: var(--cielo); }
  .paquete .nombre { font-weight: 700; }
  .paquete .precio { color: var(--bosque); font-weight: 700; }
  .curso-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-top: 1px dashed var(--linea); }
  .curso-item:first-child { border-top: none; padding-top: 0; }
  .curso-item a { color: var(--profundo); font-weight: 700; text-decoration: none; }
  .cargando { text-align: center; padding: 40px 20px; color: #4A6A85; }

  /* ── "Invita y gana" (31-ago-2026) ──
     Antes el código propio vivía en un <input readonly> con "flex:1" junto
     a un <button class="secundario"> — pero .secundario trae width:100% en
     su propia regla, y dentro de un flex row eso gana sobre el flex:1 del
     input (el input queda con flex-basis:0 y absorbe todo el shrink de la
     fila): el botón terminaba ocupando casi toda la fila y el código se
     veía colapsado/en blanco. Ahora el código va en su propia cajita (no es
     un input) y el botón de copiar tiene tamaño de contenido, no 100%. */
  .caja-codigo {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: var(--hielo); border: 2px dashed var(--aqua); border-radius: 14px;
    padding: 14px 16px; margin-bottom: 18px;
  }
  .caja-codigo .codigo-texto {
    font-family: 'Grandstander', sans-serif; font-weight: 700; font-size: 1.2rem;
    letter-spacing: 1.5px; color: var(--profundo); word-break: break-all;
  }
  .btn-copiar-codigo {
    flex: 0 0 auto; background: var(--menta); color: #fff; border: none; border-radius: 999px;
    padding: 9px 16px; font-family: 'Grandstander', sans-serif; font-weight: 600; font-size: 0.85rem;
    cursor: pointer; white-space: nowrap;
  }
  .separador-referidos {
    display: flex; align-items: center; gap: 10px; margin: 4px 0 12px;
    color: #5b7d99; font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px;
  }
  .separador-referidos::before, .separador-referidos::after { content: ""; flex: 1; height: 1px; background: var(--linea); }
  .btn-canjear-chico {
    flex: 0 0 auto; background: var(--profundo); color: #fff; border: none; border-radius: 999px;
    padding: 0 20px; font-family: 'Grandstander', sans-serif; font-weight: 600; font-size: 0.9rem; cursor: pointer;
  }
</style>
</head>
<body>

<header>
  <a href="index.html"><span class="marca">Enseñ<span class="ai">AI</span></span></a>
  <button id="btnSalir">Cerrar sesión</button>
</header>

<main id="contenido">
  <div class="cargando">Cargando…</div>
</main>

<script>
  const API_BASE = "https://ensenai-backend.onrender.com";
  const SUPABASE_URL = "https://azslvqfgeghhzghfxmdh.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF6c2x2cWZnZWdoaHpnaGZ4bWRoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzOTUzMzksImV4cCI6MjEwMTk3MTMzOX0.zd22nrf9OUrg0h2YnGJJt9mkKzoFERM54F4S48r-xEQ";
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const params = new URLSearchParams(window.location.search);
  let sesionActual = null;

  function escapeHtml(str) {
    const d = document.createElement("div");
    d.textContent = str || "";
    return d.innerHTML;
  }

  // Un fetch que nunca llegó al servidor (sin internet, backend caído,
  // CORS) lanza un TypeError genérico ("Failed to fetch" en Chrome, "Load
  // failed" en Safari) — no tiene sentido mostrárselo tal cual al usuario.
  function mensajeErrorAmigable(err) {
    return err instanceof TypeError
      ? "No pudimos conectar con el servidor. Revisa tu internet e intenta de nuevo."
      : err.message;
  }

  // El backend (Render, plan gratuito) se "duerme" tras un rato sin uso y
  // tarda 30-60s en despertar con la primera petición — esa primera
  // petición puede fallar con un "Failed to fetch" genérico. Este helper
  // avisa con un mensaje amigable y reintenta una vez antes de rendirse.
  async function fetchConReintento(url, opciones, cont, mensajeEspera) {
    try {
      return await fetch(url, opciones);
    } catch (err) {
      if (cont) {
        cont.innerHTML = `<div class="cargando">${mensajeEspera || "Despertando el servidor… puede tardar hasta un minuto la primera vez, ya casi."}</div>`;
      }
      await new Promise((r) => setTimeout(r, 4000));
      try {
        return await fetch(url, opciones);
      } catch (err2) {
        throw new Error("El servidor está tardando en responder. Espera unos segundos y vuelve a intentarlo.");
      }
    }
  }

  // ── ¿Quién eres? (se pregunta una sola vez) ─────────────────────────────
  const TIPOS_USUARIO = [
    {
      id: "papa",
      emoji: "👨‍👩‍👧",
      fondo: "#EAF1FE",
      titulo: "Soy papá o mamá",
      sub: "Quiero apoyar a mi hijo/a con la tarea y el estudio",
      destino: "tema.html",
    },
    {
      id: "estudiante",
      emoji: "📚",
      fondo: "#E7FBF3",
      titulo: "Soy estudiante",
      sub: "Quiero estudiar mis temas a mi manera",
      destino: "tema.html",
    },
    {
      id: "educador",
      emoji: "🍎",
      fondo: "#FFF0EC",
      titulo: "Doy clases o acompaño",
      sub: "Maestro/a, psicólogo/a u otro profesional de la educación",
      destino: "grupo.html",
    },
    {
      id: "adulto",
      emoji: "💡",
      fondo: "#FFF7E6",
      titulo: "Quiero aprender algo",
      sub: "Por mi cuenta, a mi ritmo — sin importar mi edad",
      destino: "tema.html",
    },
    {
      id: "otro",
      emoji: "✨",
      fondo: "#F3F0FF",
      titulo: "Otra cosa",
      sub: "Prefiero echar un ojo primero",
      destino: "tema.html",
      ancha: true,
    },
  ];

  /**
   * Regresa el tipo guardado, `null` si nunca lo ha contestado, o
   * `"desconocido"` si no se pudo consultar (backend dormido, sin red).
   * En ese último caso NO se muestra la bienvenida — vale más dejarlo
   * pasar al dashboard que atorarlo en una pantalla por un error de red.
   */
  async function obtenerTipoUsuario(session) {
    try {
      const res = await fetchConReintento(
        `${API_BASE}/api/aprendizaje/mi-tipo`,
        { headers: { Authorization: `Bearer ${session.access_token}` } },
        document.getElementById("contenido"),
        "Preparando tu cuenta…"
      );
      if (!res.ok) return "desconocido";
      const data = await res.json();
      return data.tipo_usuario || null;
    } catch (err) {
      return "desconocido";
    }
  }

  function mostrarBienvenida(session) {
    document.getElementById("contenido").innerHTML = `
      <div class="tarjeta">
        <div class="bienvenida-intro">
          <p class="saludo">Bienvenido/a a EnseñAI 🎉</p>
          <h1>¿Quién eres?</h1>
          <p class="ayuda" style="margin:0;">Así te mostramos lo que te sirve y nada más. Puedes cambiarlo después.</p>
        </div>
        <div class="rejilla-tipos">
          ${TIPOS_USUARIO.map(
            (t) => `
            <button type="button" class="tarjeta-tipo${t.ancha ? " ancha" : ""}" data-tipo="${t.id}">
              <span class="emoji" style="background:${t.fondo};">${t.emoji}</span>
              <span>
                <span class="titulo">${escapeHtml(t.titulo)}</span>
                <span class="sub">${escapeHtml(t.sub)}</span>
              </span>
            </button>`
          ).join("")}
        </div>
        <div id="error-bienvenida"></div>
      </div>
    `;

    document.querySelectorAll(".tarjeta-tipo").forEach((btn) => {
      btn.addEventListener("click", () => guardarTipoUsuario(session, btn.dataset.tipo));
    });
  }

  async function guardarTipoUsuario(session, tipo) {
    const cont = document.getElementById("contenido");
    const elegido = TIPOS_USUARIO.find((t) => t.id === tipo);
    cont.innerHTML = `<div class="cargando">Preparando tu cuenta…</div>`;

    try {
      const res = await fetchConReintento(
        `${API_BASE}/api/aprendizaje/mi-tipo`,
        {
          method: "PUT",
          headers: { "Content-Type": "application/json", Authorization: `Bearer ${session.access_token}` },
          body: JSON.stringify({ tipo_usuario: tipo }),
        },
        cont,
        "Guardando…"
      );
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "No se pudo guardar.");

      // Si venía con una intención explícita en la URL (ej. dio clic en
      // "Soy maestro/a" desde la landing), esa manda sobre el default.
      // Quien viene a generar material va DIRECTO al quiz de inteligencias,
      // no al formulario. Es la parte más distintiva del producto (y la que
      // hace que el material se sienta personalizado), así que enseñarla
      // primero explica de golpe para qué sirve todo lo demás. Quien da
      // clases se salta esto: su material es para un grupo con perfiles
      // mezclados, así que un perfil individual no le aporta al inicio.
      const destinoUrl =
        params.get("despues") === "grupo"
          ? "grupo.html"
          : params.get("despues") === "tema"
          ? "tema.html?bienvenida=1"
          : elegido.destino === "tema.html"
          ? "tema.html?bienvenida=1"
          : elegido.destino;
      window.location.href = destinoUrl;
    } catch (err) {
      mostrarBienvenida(session);
      document.getElementById("error-bienvenida").innerHTML = `<div class="error">${escapeHtml(mensajeErrorAmigable(err))}</div>`;
    }
  }

  /**
   * Al volver de Stripe, ANTES se mostraba "✓ ¡Suscripción activada!" solo
   * porque la URL traía ?suscripcion=exitosa — sin comprobar nada. Cuando el
   * webhook fallaba, la persona veía el mensaje de éxito y justo abajo
   * "Plan Gratis": pagó y el producto le decía que sí y que no al mismo
   * tiempo. Ahora se consulta el plan de verdad antes de afirmar nada.
   *
   * Se reintenta unas veces porque el webhook de Stripe puede tardar unos
   * segundos legítimamente — no es un error, solo hay que esperarlo.
   */
  async function confirmarSuscripcion(session) {
    const cont = document.getElementById("contenido");
    cont.innerHTML = `<div class="cargando">Confirmando tu pago con el banco… esto tarda unos segundos.</div>`;

    for (let intento = 0; intento < 6; intento++) {
      try {
        const res = await fetchConReintento(
          `${API_BASE}/api/temas/mi-plan`,
          { headers: { Authorization: `Bearer ${session.access_token}` } },
          null,
          null
        );
        if (res.ok) {
          const plan = await res.json();
          if (plan.nivel && plan.nivel !== "gratis") {
            const nombre = { aprendemos: "Esencial", ilimitado: "Ilimitado" }[plan.nivel] || plan.nivel;
            mostrarDashboard(session, `✓ ¡Listo! Tu plan ${nombre} ya está activo.`);
            return;
          }
        }
      } catch (err) {
        /* seguimos intentando */
      }
      await new Promise((r) => setTimeout(r, 2500));
    }

    // Se acabaron los intentos y el plan sigue en gratis: hay que decirlo,
    // no fingir éxito. El cobro pudo haberse hecho igual.
    mostrarDashboard(
      session,
      "⏳ Tu pago se procesó, pero tu plan todavía no se activa. Suele tardar un par de minutos — recarga esta página en un momento. Si sigue igual, escríbenos y lo activamos a mano; no se te va a cobrar dos veces."
    );
  }

  async function init() {
    const { data } = await supabaseClient.auth.getSession();
    document.getElementById("btnSalir").style.display = data.session ? "inline-block" : "none";

    if (params.get("compra") === "exitosa") {
      mostrarDashboard(data.session, "✓ ¡Pago recibido! Tus créditos ya están activos.");
      return;
    }

    if (params.get("suscripcion") === "exitosa") {
      await confirmarSuscripcion(data.session);
      return;
    }

    if (data.session) {
      // La primera vez que alguien entra (recién confirmó su correo) todavía
      // no sabemos quién es: si es papá, estudiante, maestro/psicólogo o un
      // adulto aprendiendo por su cuenta. Preguntarlo una sola vez nos deja
      // mandarlo a la pantalla correcta y, sobre todo, pedirle la versión
      // adecuada del quiz de inteligencias — antes siempre se pedía la de
      // "el papá describe a su hijo", aunque quien contestara fuera un
      // adolescente o un adulto.
      const tipo = await obtenerTipoUsuario(data.session);
      if (tipo === null) {
        mostrarBienvenida(data.session);
        return;
      }

      if (params.get("despues") === "grupo") {
        window.location.href = "grupo.html";
        return;
      }
      if (params.get("despues") === "tema") {
        window.location.href = "tema.html";
        return;
      }
      mostrarDashboard(data.session);
    } else {
      mostrarLogin("login");
    }
  }

  // Antes, "Entra a tu cuenta" y "Regístrate" vivían en la misma pantalla
  // sin distinguirse: al dar clic en "Regístrate" se mandaba el registro
  // de inmediato pero el título seguía diciendo "Entra a tu cuenta", lo
  // que hacía parecer que el registro no había funcionado. Ahora es un
  // selector de dos pestañas (Iniciar sesión / Crear cuenta) que cambia
  // título, texto de ayuda y botón según el modo — así siempre es claro
  // en qué pantalla estás antes de dar clic.
  function mostrarLogin(modo) {
    const esRegistro = modo === "registro";
    document.getElementById("contenido").innerHTML = `
      <div class="tarjeta">
        <div class="segmentado">
          <button id="tabLogin" class="${esRegistro ? "" : "activo"}" type="button">Iniciar sesión</button>
          <button id="tabRegistro" class="${esRegistro ? "activo" : ""}" type="button">Crear cuenta</button>
        </div>
        <h1>${esRegistro ? "Crea tu cuenta" : "Entra a tu cuenta"}</h1>
        <p class="ayuda">${esRegistro ? "Un minuto y ya puedes generar tu primer tema, gratis." : "Para generar material personalizado por tema y forma de aprender."}</p>
        <div id="error-auth"></div>
        <label for="correo">Correo</label>
        <input type="email" id="correo" placeholder="tucorreo@ejemplo.com">
        <label for="contrasena">Contraseña</label>
        <input type="password" id="contrasena" placeholder="Mínimo 6 caracteres">
        <button class="primario" id="btnAccion">${esRegistro ? "Crear cuenta" : "Entrar"}</button>
        ${
          esRegistro
            ? `<p class="ayuda" style="font-size:0.78rem; margin:12px 0 0;">Al crear tu cuenta aceptas los <a href="terminos.html" target="_blank">términos y condiciones</a> y el <a href="privacidad.html" target="_blank">aviso de privacidad</a>.</p>`
            : `<span class="enlace-chico" id="btnOlvide">¿Olvidaste tu contraseña?</span>`
        }
      </div>
    `;
    document.getElementById("tabLogin").addEventListener("click", () => mostrarLogin("login"));
    document.getElementById("tabRegistro").addEventListener("click", () => mostrarLogin("registro"));
    document.getElementById("btnAccion").addEventListener("click", () => iniciarSesion(esRegistro));
    if (!esRegistro) document.getElementById("btnOlvide").addEventListener("click", mostrarOlvideContrasena);
    // Enter en cualquiera de los dos campos hace lo mismo que tocar el botón
    // — sin esto había que tocar "Entrar"/"Crear cuenta" a mano incluso en
    // celular, que es la pantalla donde más fricción de un toque de más se
    // nota (es la primera pantalla real del producto para alguien nuevo).
    ["correo", "contrasena"].forEach((id) => {
      document.getElementById(id).addEventListener("keydown", (ev) => {
        if (ev.key === "Enter") iniciarSesion(esRegistro);
      });
    });
    document.getElementById("correo").focus();
  }

  function mostrarOlvideContrasena() {
    document.getElementById("contenido").innerHTML = `
      <div class="tarjeta">
        <h1>Recupera tu contraseña</h1>
        <p class="ayuda">Te mandamos una liga a tu correo para poner una nueva.</p>
        <div id="error-auth"></div>
        <label for="correo-recuperar">Correo</label>
        <input type="email" id="correo-recuperar" placeholder="tucorreo@ejemplo.com">
        <button class="primario" id="btnMandarRecuperacion">Mandar liga de recuperación</button>
        <span class="enlace-chico" id="btnRegresarLogin">← Regresar a iniciar sesión</span>
      </div>
    `;
    document.getElementById("btnMandarRecuperacion").addEventListener("click", mandarRecuperacion);
    document.getElementById("btnRegresarLogin").addEventListener("click", () => mostrarLogin("login"));
    document.getElementById("correo-recuperar").addEventListener("keydown", (ev) => {
      if (ev.key === "Enter") mandarRecuperacion();
    });
    document.getElementById("correo-recuperar").focus();
  }

  async function mandarRecuperacion() {
    const correo = document.getElementById("correo-recuperar").value.trim();
    const errorDiv = document.getElementById("error-auth");
    errorDiv.innerHTML = "";

    if (!correo) {
      errorDiv.innerHTML = `<div class="error">Escribe tu correo.</div>`;
      return;
    }

    const btn = document.getElementById("btnMandarRecuperacion");
    btn.disabled = true;
    btn.textContent = "Mandando…";

    try {
      const redirectTo = `${window.location.origin}/restablecer.html`;
      const { error } = await supabaseClient.auth.resetPasswordForEmail(correo, { redirectTo });
      if (error) throw new Error(error.message);

      document.getElementById("contenido").innerHTML = `
        <div class="tarjeta">
          <div class="aviso">✓ Si ese correo tiene una cuenta, te mandamos una liga para restablecer tu contraseña. Revisa tu bandeja (y spam).</div>
          <span class="enlace-chico" id="btnRegresarLogin2">← Regresar a iniciar sesión</span>
        </div>
      `;
      document.getElementById("btnRegresarLogin2").addEventListener("click", () => mostrarLogin("login"));
    } catch (err) {
      errorDiv.innerHTML = `<div class="error">${escapeHtml(mensajeErrorAmigable(err))}</div>`;
      btn.disabled = false;
      btn.textContent = "Mandar liga de recuperación";
    }
  }

  // Supabase Auth regresa sus mensajes de error en inglés y en un tono muy
  // técnico ("Invalid login credentials") — poco útil para alguien que
  // apenas está probando la plataforma. Los traducimos a algo accionable,
  // y en el caso más común (intentar entrar sin tener cuenta todavía) le
  // señalamos directamente el botón de registro en vez de dejarlo adivinar.
  function traducirErrorAuth(mensaje, esRegistro) {
    const m = (mensaje || "").toLowerCase();
    if (m.includes("invalid login credentials")) {
      return 'Ese correo o contraseña no coinciden con ninguna cuenta. Si es tu primera vez aquí, dale clic a "Crear cuenta" arriba en vez de "Iniciar sesión".';
    }
    if (m.includes("already registered")) {
      return 'Ya existe una cuenta con ese correo — dale clic a "Iniciar sesión" arriba en vez de "Crear cuenta".';
    }
    if (m.includes("email not confirmed")) {
      return "Todavía no confirmas tu correo. Revisa tu bandeja de entrada (y spam) y confirma tu cuenta antes de entrar.";
    }
    if (m.includes("password should be at least")) {
      return "La contraseña debe tener al menos 6 caracteres.";
    }
    if (m.includes("unable to validate email")) {
      return "Ese correo no parece válido — revisa que esté bien escrito.";
    }
    return mensaje;
  }

  async function iniciarSesion(esRegistro) {
    const correo = document.getElementById("correo").value.trim();
    const contrasena = document.getElementById("contrasena").value;
    const errorDiv = document.getElementById("error-auth");
    errorDiv.innerHTML = "";

    if (!correo || contrasena.length < 6) {
      errorDiv.innerHTML = `<div class="error">Escribe un correo válido y una contraseña de al menos 6 caracteres.</div>`;
      return;
    }

    try {
      const { data, error } = esRegistro
        ? await supabaseClient.auth.signUp({ email: correo, password: contrasena })
        : await supabaseClient.auth.signInWithPassword({ email: correo, password: contrasena });

      if (error) throw new Error(error.message);

      if (esRegistro && !data.session) {
        document.getElementById("contenido").innerHTML = `
          <div class="tarjeta">
            <div class="aviso">✓ ¡Cuenta creada! Te mandamos un correo para confirmarla — revisa tu bandeja (y spam), confírmala, y ya puedes entrar.</div>
            <span class="enlace-chico" id="btnRegresarLogin3">← Regresar a iniciar sesión</span>
          </div>
        `;
        document.getElementById("btnRegresarLogin3").addEventListener("click", () => mostrarLogin("login"));
        return;
      }

      init();
    } catch (err) {
      errorDiv.innerHTML = `<div class="error">${escapeHtml(err instanceof TypeError ? mensajeErrorAmigable(err) : traducirErrorAuth(err.message, esRegistro))}</div>`;
    }
  }

  async function mostrarDashboard(session, avisoExtra) {
    sesionActual = session;
    document.getElementById("contenido").innerHTML = `
      ${avisoExtra ? `<div class="aviso">${avisoExtra}</div>` : ""}
      <div class="tarjeta">
        <h1 style="text-align:left; font-size:1.1rem;">Mi plan</h1>
        <div id="zonaSuscripcion"><div class="cargando">Cargando…</div></div>
      </div>
      <div class="tarjeta">
        <h1 style="text-align:left; font-size:1.1rem;">🔥 Racha y medallas</h1>
        <div id="zonaGamificacion"><div class="cargando">Cargando…</div></div>
      </div>
      <div class="tarjeta">
        <h1 style="text-align:left; font-size:1.1rem;">🎁 Invita y gana</h1>
        <div id="zonaReferidos"><div class="cargando">Cargando…</div></div>
      </div>
      <div class="tarjeta">
        <h1 style="text-align:left; font-size:1.1rem;">✨ Genera material sobre un tema</h1>
        <p class="ayuda" style="margin:0 0 4px; text-align:left;">Explicación, trivia e imprimible adaptados a tu edad y a tu forma de aprender. También administras ahí los perfiles de aprendizaje (uno por hijo/a) y el quiz de inteligencias múltiples.</p>
        <a href="tema.html" style="display:block; text-decoration:none;"><button class="primario" style="margin-top:14px;">Generar tema</button></a>
      </div>
      <div class="tarjeta">
        <h1 style="text-align:left; font-size:1.1rem;">¿Eres maestro/a o psicólogo/a?</h1>
        <p class="ayuda" style="margin:0 0 4px; text-align:left;">Genera material para todo tu grupo y compártelo con una sola liga — tus alumnos o pacientes entran gratis, sin cuenta.</p>
        <a href="grupo.html" style="display:block; text-decoration:none;"><button class="primario" style="margin-top:14px;">🏫 Ir a Mi grupo</button></a>
      </div>
    `;

    cargarSuscripcion(session);
    cargarGamificacion(session);
    cargarReferidos(session);

    document.getElementById("btnSalir").onclick = async () => {
      await supabaseClient.auth.signOut();
      window.location.href = "comprador.html";
    };
  }

  const NOMBRES_NIVEL = { gratis: "Gratis", aprendemos: "Esencial", ilimitado: "Ilimitado" };

  async function cargarSuscripcion(session) {
    const cont = document.getElementById("zonaSuscripcion");
    try {
      const res = await fetchConReintento(
        `${API_BASE}/api/temas/mi-plan`,
        { headers: { Authorization: `Bearer ${session.access_token}` } },
        cont,
        "Cargando tu plan…"
      );
      const plan = await res.json();
      if (!res.ok) throw new Error(plan.error || "No se pudo cargar tu plan.");

      const limiteMostrado = plan.limite_temas_mes_efectivo ?? plan.limite_temas_mes;
      const usoTexto =
        plan.limite_temas_mes === null
          ? `${plan.usados_este_mes} temas generados este mes — sin límite`
          : `${plan.usados_este_mes} de ${limiteMostrado} temas este mes${plan.boost_bienvenida_activo ? " (con el boost de bienvenida del primer mes)" : ""}`;
      const bonoTexto =
        plan.referidos?.bono_disponible > 0
          ? `<p class="ayuda" style="margin:4px 0 0; text-align:left; font-size:0.85rem;">🎁 Tienes ${plan.referidos.bono_disponible} tema${plan.referidos.bono_disponible === 1 ? "" : "s"} de regalo por invitar — se usan automáticamente cuando se te acabe el límite del mes.</p>`
          : "";

      let botones = "";
      if (plan.nivel !== "ilimitado") {
        botones += `<button class="primario" style="margin-top:10px;" id="btnIlimitado">Pasar a Ilimitado — $129/mes</button>`;
      }
      if (plan.nivel === "gratis") {
        botones += `<button class="secundario" style="width:100%; margin-top:6px;" id="btnAprendemos">Pasar a Esencial — $79/mes (20 temas, 3 perfiles)</button>`;
      }

      cont.innerHTML = `
        <p class="ayuda" style="margin:0 0 4px; text-align:left;"><strong>Plan ${NOMBRES_NIVEL[plan.nivel] || plan.nivel}</strong>${plan.precio_mxn ? ` — $${Number(plan.precio_mxn).toFixed(2)} MXN/mes` : ""}</p>
        <p class="ayuda" style="margin:0 0 4px; text-align:left; font-size:0.85rem;">${escapeHtml(usoTexto)}</p>
        ${bonoTexto}
        <p class="ayuda" style="margin:4px 0 0; text-align:left; font-size:0.85rem;">Hasta ${plan.limite_perfiles} perfil(es) de aprendizaje.</p>
        ${botones}
      `;
      if (document.getElementById("btnIlimitado")) {
        document.getElementById("btnIlimitado").addEventListener("click", () => suscribirse(session, "individual", "ilimitado"));
      }
      if (document.getElementById("btnAprendemos")) {
        document.getElementById("btnAprendemos").addEventListener("click", () => suscribirse(session, "individual", "aprendemos"));
      }
    } catch (err) {
      cont.innerHTML = `<div class="error">No se pudo cargar tu plan.</div>`;
    }
  }

  // Mismo catálogo que utils/gamificacion.js en el backend (CATALOGO_MEDALLAS)
  // — es contenido de presentación, no configuración, así que vive aquí
  // igual de fijo que NOMBRES_NIVEL arriba. Si se agrega una medalla nueva
  // hay que agregarla en los dos lados.
  const CATALOGO_MEDALLAS = [
    { codigo: "primer_paso", nombre: "Primer paso", icono: "🌱", descripcion: "Generaste tu primer tema." },
    { codigo: "racha_3", nombre: "Racha de 3 días", icono: "🔥", descripcion: "3 días seguidos estudiando." },
    { codigo: "racha_7", nombre: "Racha de 7 días", icono: "🔥🔥", descripcion: "7 días seguidos estudiando." },
    { codigo: "racha_30", nombre: "Racha de 30 días", icono: "🔥🔥🔥", descripcion: "30 días seguidos estudiando." },
    { codigo: "temas_10", nombre: "10 temas", icono: "📚", descripcion: "Generaste 10 temas." },
    { codigo: "temas_50", nombre: "50 temas", icono: "📚📚", descripcion: "Generaste 50 temas." },
    { codigo: "examen_1", nombre: "Primer simulacro", icono: "🎯", descripcion: "Armaste tu primer simulacro de examen." },
    { codigo: "examen_5", nombre: "5 simulacros", icono: "🎯🎯", descripcion: "Armaste 5 simulacros de examen." },
    { codigo: "etiqueta_1", nombre: "Organizador", icono: "🏷️", descripcion: "Usaste tu primera etiqueta." },
    { codigo: "trivia_diaria_1", nombre: "Trivia diaria", icono: "🧠", descripcion: "Completaste tu primera trivia diaria." },
  ];

  async function cargarGamificacion(session) {
    const cont = document.getElementById("zonaGamificacion");
    try {
      const res = await fetchConReintento(
        `${API_BASE}/api/temas/mi-plan`,
        { headers: { Authorization: `Bearer ${session.access_token}` } },
        cont,
        "Cargando…"
      );
      const plan = await res.json();
      if (!res.ok) throw new Error(plan.error || "No se pudo cargar tu racha.");

      const g = plan.gamificacion || { racha_actual: 0, racha_record: 0, medallas: [] };
      const ganadas = new Set(g.medallas || []);

      const medallasHtml = CATALOGO_MEDALLAS.map((m) => {
        const obtenida = ganadas.has(m.codigo);
        return `
          <div title="${escapeHtml(m.descripcion)}" style="text-align:center; padding:8px 4px; border-radius:12px; background:${obtenida ? "#EAF1FE" : "#F4F6F8"};">
            <div style="font-size:1.6rem; ${obtenida ? "" : "filter:grayscale(1); opacity:0.35;"}">${m.icono}</div>
            <div style="font-size:0.68rem; margin-top:2px; color:${obtenida ? "var(--profundo)" : "#9AA7B0"}; font-weight:${obtenida ? "700" : "400"};">${escapeHtml(m.nombre)}</div>
          </div>
        `;
      }).join("");

      cont.innerHTML = `
        <p class="ayuda" style="margin:0 0 4px; text-align:left;"><strong>🔥 Racha: ${g.racha_actual} día${g.racha_actual === 1 ? "" : "s"}</strong>${g.racha_record > 0 ? ` · récord: ${g.racha_record}` : ""}</p>
        <p class="ayuda" style="margin:0 0 12px; text-align:left; font-size:0.85rem;">Genera un tema o haz tu trivia diaria (en tema.html) para mantenerla.</p>
        <div style="display:grid; grid-template-columns:repeat(5, 1fr); gap:6px;">${medallasHtml}</div>
      `;
    } catch (err) {
      cont.innerHTML = `<div class="error">No se pudo cargar tu racha.</div>`;
    }
  }

  /**
   * Programa de referidos (ver utils/referidos.js en el backend): muestra
   * el código propio para compartir, y un campo para canjear el de alguien
   * más. Quien invita gana temas de regalo; quien canjea no gana nada
   * aparte del boost normal de cuenta nueva (ya reflejado arriba en "Mi
   * plan").
   */
  async function cargarReferidos(session) {
    const cont = document.getElementById("zonaReferidos");
    try {
      const res = await fetchConReintento(
        `${API_BASE}/api/temas/mi-plan`,
        { headers: { Authorization: `Bearer ${session.access_token}` } },
        cont,
        "Cargando…"
      );
      const plan = await res.json();
      if (!res.ok) throw new Error(plan.error || "No se pudo cargar tu código.");

      const codigo = plan.referidos?.codigo || "";

      cont.innerHTML = `
        <p class="ayuda" style="margin:0 0 12px; text-align:left; font-size:0.85rem;">Comparte tu código — cada vez que alguien nuevo lo use, ganas un tema de regalo. 🎉</p>
        <div class="caja-codigo">
          <span class="codigo-texto" id="miCodigoReferido">${escapeHtml(codigo)}</span>
          <button type="button" class="btn-copiar-codigo" id="btnCopiarCodigo">📋 Copiar</button>
        </div>
        <div class="separador-referidos"><span>¿Alguien te compartió un código?</span></div>
        <div style="display:flex; align-items:center; gap:8px;">
          <input type="text" id="codigoACanjear" placeholder="Ej. MARIAUX8M" style="flex:1;">
          <button type="button" class="btn-canjear-chico" id="btnCanjearCodigo">Canjear</button>
        </div>
        <div id="resultadoCanje" style="margin-top:10px;"></div>
      `;

      document.getElementById("btnCopiarCodigo").addEventListener("click", async () => {
        const btn = document.getElementById("btnCopiarCodigo");
        try {
          await navigator.clipboard.writeText(codigo);
          btn.textContent = "✓ ¡Copiado!";
          setTimeout(() => (btn.textContent = "📋 Copiar"), 1500);
        } catch (err) {
          // Sin permiso de portapapeles (poco común) — al menos se ve seleccionado.
          window.getSelection()?.selectAllChildren(document.getElementById("miCodigoReferido"));
        }
      });

      document.getElementById("btnCanjearCodigo").addEventListener("click", async () => {
        const input = document.getElementById("codigoACanjear");
        const resultado = document.getElementById("resultadoCanje");
        const codigoIngresado = input.value.trim();
        if (!codigoIngresado) return;
        resultado.innerHTML = `<div class="cargando">Canjeando…</div>`;
        try {
          const res2 = await fetchConReintento(`${API_BASE}/api/referidos/canjear`, {
            method: "POST",
            headers: { "Content-Type": "application/json", Authorization: `Bearer ${session.access_token}` },
            body: JSON.stringify({ codigo: codigoIngresado }),
          }, null, null);
          const data2 = await res2.json();
          if (!res2.ok) throw new Error(data2.error || "No se pudo canjear el código.");
          resultado.innerHTML = `<div class="aviso">✓ ¡Código canjeado!</div>`;
          input.value = "";
        } catch (err) {
          resultado.innerHTML = `<div class="error">${escapeHtml(mensajeErrorAmigable(err))}</div>`;
        }
      });
    } catch (err) {
      cont.innerHTML = `<div class="error">No se pudo cargar tu código de referido.</div>`;
    }
  }

  async function suscribirse(session, tipo, nivel) {
    const cont = document.getElementById("zonaSuscripcion");
    cont.innerHTML = `<div class="cargando">Redirigiendo a pago seguro…</div>`;
    try {
      const res = await fetchConReintento(
        `${API_BASE}/api/purchases/checkout-suscripcion`,
        {
          method: "POST",
          headers: { "Content-Type": "application/json", Authorization: `Bearer ${session.access_token}` },
          body: JSON.stringify({ tipo, nivel }),
        },
        cont,
        "Preparando tu pago… (si el servidor estaba dormido, puede tardar unos segundos)"
      );
      const data = await res.json();
      if (!data.checkout_url) throw new Error(data.error || "No se pudo iniciar el pago.");
      window.location.href = data.checkout_url;
    } catch (err) {
      cont.innerHTML = `
        <div class="error">${escapeHtml(mensajeErrorAmigable(err))}</div>
        <button class="secundario" style="width:100%;" onclick="suscribirse(sesionActual, '${tipo}', '${nivel}')">Reintentar</button>
      `;
    }
  }

  init();
</script>
</body>
</html>
