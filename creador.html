<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EnseñAI — Perfil de creador</title>
<link rel="icon" type="image/png" href="assets/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grandstander:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --profundo: #1E3A8A; --profundo-oscuro: #16296B; --cielo: #60A5FA;
    --menta: #34D399; --aqua: #7DD3FC; --bosque: #065F46;
    --hielo: #F0FDF4; --tinta: #1E3A8A; --linea: #DCEEFC;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: 'Nunito', sans-serif;
    background:
      radial-gradient(circle at 12% 8%, rgba(96,165,250,0.35) 0, transparent 30%),
      radial-gradient(circle at 90% 20%, rgba(125,211,252,0.32) 0, transparent 32%),
      var(--hielo);
    color: var(--tinta); min-height: 100vh;
  }
  header { background: var(--profundo); color: #fff; padding: 18px 24px; display: flex; align-items: center; gap: 10px; }
  header a { color: inherit; text-decoration: none; display: flex; align-items: center; gap: 10px; }
  header .marca { font-family: 'Grandstander', sans-serif; font-weight: 700; font-size: 1.4rem; }
  header .marca .ai {
    display: inline-block; color: var(--aqua); background: rgba(255,255,255,0.14);
    padding: 1px 10px; border-radius: 999px; font-size: 0.75em; vertical-align: middle;
  }
  main { max-width: 620px; margin: 0 auto; padding: 32px 20px 80px; }

  .perfil-tarjeta { text-align: center; margin-bottom: 26px; }
  .avatar {
    width: 84px; height: 84px; border-radius: 50%; background: var(--profundo);
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-family: 'Grandstander', sans-serif; font-weight: 700; font-size: 2rem;
    margin: 0 auto 14px; box-shadow: 0 4px 0 var(--profundo-oscuro);
  }
  .perfil-tarjeta h1 { font-family: 'Grandstander', sans-serif; font-size: 1.5rem; margin: 0 0 8px; }
  .perfil-bio { color: #4A6A85; line-height: 1.6; max-width: 480px; margin: 0 auto; }
  .badge-verificado {
    display: inline-flex; align-items: center; gap: 5px; background: var(--hielo); color: var(--bosque);
    font-weight: 700; font-size: 0.8rem; padding: 4px 12px; border-radius: 999px; margin-top: 10px;
  }

  h2.seccion { font-family: 'Grandstander', sans-serif; font-size: 1.1rem; color: var(--profundo); margin: 28px 0 14px; }

  .curso-card {
    background: #fff; border: 2px solid var(--linea); border-radius: 16px; padding: 16px 18px;
    margin-bottom: 12px; display: block; text-decoration: none; color: inherit;
    box-shadow: 0 3px 0 var(--linea); transition: transform 0.12s;
  }
  .curso-card:hover { transform: translateY(-2px); border-color: var(--cielo); }
  .curso-etiqueta {
    display: inline-block; background: var(--hielo); color: var(--bosque); font-weight: 700; font-size: 0.72rem;
    padding: 3px 10px; border-radius: 999px; margin-bottom: 8px; text-transform: uppercase;
  }
  .curso-card h3 { font-family: 'Grandstander', sans-serif; font-size: 1.05rem; margin: 0 0 6px; color: var(--profundo); }
  .curso-precio { color: var(--bosque); font-weight: 700; font-size: 0.9rem; }

  .vacio { text-align: center; color: #4A6A85; padding: 30px 0; }
  .error { background: #FFF0EC; border: 2px solid #FFC4B5; color: #B94A2E; padding: 12px 14px; border-radius: 12px; font-size: 0.9rem; text-align: center; }
  .cargando { text-align: center; padding: 60px 20px; color: #4A6A85; }
</style>
</head>
<body>

<header>
  <a href="index.html"><span class="marca">Enseñ<span class="ai">AI</span></span></a>
</header>

<main id="contenido">
  <div class="cargando">Cargando perfil…</div>
</main>

<script>
  const API_BASE = "https://ensenai-backend.onrender.com";
  const params = new URLSearchParams(window.location.search);
  const slug = params.get("slug");

  function escapeHtml(str) {
    const d = document.createElement("div");
    d.textContent = str || "";
    return d.innerHTML;
  }

  const AUDIENCIA_TEXTO = { ninos: "Niños", padres: "Padres/cuidadores", profesionales: "Profesionales" };

  async function cargarPerfil() {
    const cont = document.getElementById("contenido");
    if (!slug) {
      cont.innerHTML = `<div class="error">Falta el creador (liga incompleta).</div>`;
      return;
    }

    try {
      const res = await fetch(`${API_BASE}/api/creators/publico/${slug}`);
      const data = await res.json();
      if (!data.creator) throw new Error(data.error || "Creador no encontrado.");

      const { creator, courses } = data;
      const inicial = (creator.name || "?").trim().charAt(0).toUpperCase();

      const listaCursos = courses.length
        ? courses
            .map(
              (c) => `
          <a class="curso-card" href="curso.html?slug=${encodeURIComponent(c.slug)}">
            <span class="curso-etiqueta">${AUDIENCIA_TEXTO[c.audience] || c.audience}</span>
            <h3>${escapeHtml(c.title)}</h3>
            <span class="curso-precio">$${Number(c.price_mxn).toFixed(2)} MXN</span>
          </a>`
            )
            .join("")
        : `<div class="vacio">Este creador todavía no tiene cursos publicados.</div>`;

      cont.innerHTML = `
        <div class="perfil-tarjeta">
          <div class="avatar">${inicial}</div>
          <h1>${escapeHtml(creator.name)}</h1>
          ${creator.bio ? `<p class="perfil-bio">${escapeHtml(creator.bio)}</p>` : ""}
        </div>

        <h2 class="seccion">Cursos publicados (${courses.length})</h2>
        ${listaCursos}
      `;
    } catch (err) {
      cont.innerHTML = `<div class="error">${escapeHtml(err.message)}</div>`;
    }
  }

  cargarPerfil();
</script>
</body>
</html>
