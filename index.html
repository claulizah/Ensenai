<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EnseñAI — Muy pronto</title>
<meta name="description" content="Sube un video, EnseñAI genera el material de apoyo. Muy pronto.">
<link rel="icon" type="image/png" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --profundo: #1E3A8A;
    --profundo-oscuro: #16296B;
    --cielo: #60A5FA;
    --menta: #34D399;
    --aqua: #7DD3FC;
    --bosque: #065F46;
    --hielo: #F0FDF4;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
  }

  body {
    font-family: 'Nunito', sans-serif;
    background:
      radial-gradient(circle at 12% 8%, rgba(96,165,250,0.35) 0, transparent 30%),
      radial-gradient(circle at 90% 20%, rgba(125,211,252,0.32) 0, transparent 32%),
      radial-gradient(circle at 85% 90%, rgba(96,165,250,0.22) 0, transparent 30%),
      radial-gradient(circle at 8% 85%, rgba(125,211,252,0.25) 0, transparent 28%),
      linear-gradient(160deg, rgba(96,165,250,0.16) 0%, rgba(125,211,252,0.12) 45%, transparent 75%),
      var(--hielo);
    color: var(--profundo);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow: hidden;
  }

  .wrap {
    position: relative;
    max-width: 560px;
    width: 100%;
    text-align: center;
  }

  .marca-fila {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }

  .marca {
    font-family: 'Fredoka', sans-serif;
    font-weight: 700;
    font-size: clamp(2.2rem, 6.5vw, 3.2rem);
    letter-spacing: -0.01em;
    color: var(--profundo);
  }

  .marca .ai {
    color: var(--bosque);
  }

  .signature {
    margin: 30px auto 28px;
    width: min(220px, 60vw);
    height: auto;
    display: block;
  }

  .tagline {
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: clamp(1.15rem, 3.4vw, 1.5rem);
    line-height: 1.35;
    color: var(--profundo);
    margin-bottom: 14px;
  }

  .desc {
    font-size: 1rem;
    line-height: 1.6;
    color: #4A6A85;
    max-width: 420px;
    margin: 0 auto 34px;
  }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    font-size: 0.85rem;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--bosque);
    background: var(--hielo);
    border: 2px solid var(--menta);
    padding: 10px 20px;
    border-radius: 999px;
  }

  .pill-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--menta);
    animation: pulse 1.8s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.75); }
  }

  @media (prefers-reduced-motion: reduce) {
    .pill-dot { animation: none; }
  }

  footer {
    margin-top: 40px;
    font-size: 0.8rem;
    color: #7B93A8;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="marca-fila">
      <img src="assets/favicon-48.png" alt="" width="42" height="42">
      <div class="marca">Enseñ<span class="ai">AI</span></div>
    </div>

    <img class="signature" src="assets/logo-full.png" alt="EnseñAI">

    <p class="tagline">Sube un video. Recibe el material listo para enseñar.</p>
    <p class="desc">
      Resúmenes, trivias y memoramas generados automáticamente a partir de tu clase —
      pensado para maestros, psicólogos y educadores.
    </p>

    <span class="pill"><span class="pill-dot"></span> Muy pronto</span>

    <footer>EnseñAI · ensenai.com</footer>
  </div>
</body>
</html>
