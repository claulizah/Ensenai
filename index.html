<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EnseñAI — Muy pronto</title>
<meta name="description" content="Sube un video, EnseñAI genera el material de apoyo. Muy pronto.">
<meta property="og:title" content="EnseñAI">
<meta property="og:description" content="Sube un video. Recibe el material listo para enseñar — resúmenes, trivias y memoramas generados automáticamente.">
<meta property="og:image" content="https://ensenai.com/assets/logo-full.png">
<meta property="og:url" content="https://ensenai.com">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --profundo: #1E3A8A;
    --profundo-oscuro: #16296B;
    --cielo: #60A5FA;
    --menta: #34D399;
    --aqua: #7DD3FC;
    --bosque: #065F46;
    --hielo: #F0FDF4;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
  }

  body {
    font-family: 'Nunito', sans-serif;
    background:
      radial-gradient(circle at 10% 10%, rgba(124,111,224,0.30) 0, transparent 32%),
      radial-gradient(circle at 90% 15%, rgba(125,211,252,0.35) 0, transparent 34%),
      radial-gradient(circle at 85% 88%, rgba(52,211,153,0.28) 0, transparent 32%),
      radial-gradient(circle at 10% 85%, rgba(96,165,250,0.28) 0, transparent 30%),
      linear-gradient(150deg, rgba(124,111,224,0.14) 0%, rgba(125,211,252,0.14) 45%, rgba(52,211,153,0.10) 80%),
      var(--hielo);
    color: var(--profundo);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow: hidden;
  }

  .wrap {
    position: relative;
    max-width: 560px;
    width: 100%;
    text-align: center;
  }

  .marca-fila {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }

  .marca {
    font-family: 'Fredoka', sans-serif;
    font-weight: 700;
    font-size: clamp(2.2rem, 6.5vw, 3.2rem);
    letter-spacing: -0.01em;
    color: var(--profundo);
  }

  .marca .ai {
    display: inline-block;
    color: var(--profundo);
    background: rgba(30,58,138,0.10);
    padding: 1px 12px;
    border-radius: 999px;
    font-size: 0.75em;
    vertical-align: middle;
  }

  .signature {
    margin: 30px auto 28px;
    width: min(220px, 60vw);
    height: auto;
    display: block;
    animation: flotar 3.5s ease-in-out infinite;
  }
  @keyframes flotar { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  @media (prefers-reduced-motion: reduce) { .signature { animation: none; } }

  .icono-header {
    flex-shrink: 0;
  }

  .tagline {
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: clamp(1.2rem, 3.6vw, 1.6rem);
    line-height: 1.35;
    color: var(--bosque);
    margin-bottom: 14px;
  }

  .desc {
    font-size: 1rem;
    line-height: 1.6;
    color: #2E4A63;
    max-width: 420px;
    margin: 0 auto 34px;
  }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    font-size: 0.85rem;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--bosque);
    background: var(--hielo);
    border: 2px solid var(--menta);
    padding: 10px 20px;
    border-radius: 999px;
  }

  .pill-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--menta);
    animation: pulse 1.8s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.75); }
  }

  @media (prefers-reduced-motion: reduce) {
    .pill-dot { animation: none; }
  }

  footer {
    margin-top: 40px;
    font-size: 0.8rem;
    color: #7B93A8;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="marca-fila">
      <svg class="icono-header" width="34" height="34" viewBox="20 20 160 150" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M62 140 C32 150 22 175 37 197" stroke="#1E3A8A" stroke-width="14" fill="none" stroke-linecap="round"/>
        <path d="M138 140 C168 150 178 175 163 197" stroke="#1E3A8A" stroke-width="14" fill="none" stroke-linecap="round"/>
        <path d="M92 150 C86 172 88 190 96 203" stroke="#1E3A8A" stroke-width="14" fill="none" stroke-linecap="round"/>
        <path d="M108 150 C114 172 112 190 104 203" stroke="#1E3A8A" stroke-width="14" fill="none" stroke-linecap="round"/>
        <circle cx="100" cy="92" r="62" fill="none" stroke="#1E3A8A" stroke-width="6"/>
        <circle cx="80" cy="98" r="7" fill="#1E3A8A"/>
        <circle cx="120" cy="98" r="7" fill="#1E3A8A"/>
        <path d="M86 122 Q100 131 114 122" stroke="#1E3A8A" stroke-width="4" fill="none" stroke-linecap="round"/>
      </svg>
      <div class="marca">Enseñ<span class="ai">AI</span></div>
    </div>

    <img class="signature" src="assets/logo-full.png" alt="EnseñAI">

    <p class="tagline">Sube un video. Recibe el material listo para enseñar.</p>
    <p class="desc">
      Resúmenes, trivias y memoramas generados automáticamente a partir de tu clase —
      pensado para maestros, psicólogos y educadores.
    </p>

    <span class="pill"><span class="pill-dot"></span> Muy pronto</span>

    <footer>EnseñAI · ensenai.com</footer>
  </div>
</body>
</html>
