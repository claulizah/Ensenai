<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EnseñAI — Mis ventas</title>
<link rel="icon" type="image/png" href="assets/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grandstander:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --profundo: #1E3A8A; --profundo-oscuro: #16296B; --cielo: #60A5FA;
    --menta: #34D399; --aqua: #7DD3FC; --bosque: #065F46;
    --hielo: #F0FDF4; --tinta: #1E3A8A; --linea: #DCEEFC;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: 'Nunito', sans-serif;
    background:
      radial-gradient(circle at 12% 8%, rgba(96,165,250,0.35) 0, transparent 30%),
      radial-gradient(circle at 90% 20%, rgba(125,211,252,0.32) 0, transparent 32%),
      var(--hielo);
    color: var(--tinta); min-height: 100vh;
  }
  header { background: var(--profundo); color: #fff; padding: 18px 24px; display: flex; align-items: center; gap: 10px; }
  header a { color: inherit; text-decoration: none; display: flex; align-items: center; gap: 10px; }
  header .marca { font-family: 'Grandstander', sans-serif; font-weight: 700; font-size: 1.4rem; }
  header .marca .ai { display: inline-block; color: var(--aqua); background: rgba(255,255,255,0.14); padding: 1px 10px; border-radius: 999px; font-size: 0.75em; vertical-align: middle; }
  header .sub { opacity: 0.75; font-size: 0.85rem; }
  main { max-width: 620px; margin: 0 auto; padding: 28px 20px 80px; }

  h1 { font-family: 'Grandstander', sans-serif; font-weight: 600; font-size: 1.4rem; margin: 0 0 6px; text-align: center; }
  p.ayuda { color: #4A6A85; margin: 0 0 20px; text-align: center; }
  label { display: block; font-weight: 700; font-size: 0.9rem; margin: 16px 0 6px; color: var(--profundo); }
  input[type=email] { width: 100%; padding: 13px 16px; border: 2px solid var(--linea); border-radius: 14px; font-family: inherit; font-size: 1rem; }

  button.primario {
    margin-top: 22px; width: 100%; background: var(--profundo); color: #fff; border: none;
    padding: 15px; border-radius: 999px; font-family: 'Grandstander', sans-serif; font-weight: 600;
    font-size: 1rem; cursor: pointer; box-shadow: 0 4px 0 var(--profundo-oscuro);
  }
  button.primario:disabled { opacity: 0.6; cursor: not-allowed; }

  .tarjeta { background: #fff; border: 2px solid var(--linea); border-radius: 18px; padding: 20px; margin-bottom: 16px; box-shadow: 0 3px 0 var(--linea); }
  .resumen-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .resumen-num { font-family: 'Grandstander', sans-serif; font-size: 1.8rem; color: var(--profundo); text-align: center; }
  .resumen-label { text-align: center; color: #4A6A85; font-size: 0.85rem; }

  .curso-fila { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-top: 1px dashed var(--linea); }
  .curso-fila:first-child { border-top: none; padding-top: 0; }
  .curso-fila .nombre { font-weight: 700; }
  .curso-fila .detalle { text-align: right; font-size: 0.85rem; color: #4A6A85; }
  .curso-fila .ganado { color: var(--bosque); font-weight: 700; }

  .error { background: #FFF0EC; border: 2px solid #FFC4B5; color: #B94A2E; padding: 12px 14px; border-radius: 12px; margin-bottom: 16px; font-size: 0.9rem; }
  .cargando { text-align: center; padding: 40px 20px; color: #4A6A85; }
  .vacio { text-align: center; color: #4A6A85; padding: 20px 0; font-size: 0.9rem; }
</style>
</head>
<body>

<header>
  <a href="creator.html"><span class="marca">Enseñ<span class="ai">AI</span></span></a>
  <span class="sub">· Mis ventas</span>
</header>

<main id="contenido">
  <div class="tarjeta">
    <h1>Revisa tus ventas y ganancias</h1>
    <p class="ayuda">Recuerda: la plataforma se queda con el 30% de comisión, tú recibes el 70%.</p>
    <div id="error-identificar"></div>
    <label for="correo">Tu correo (el mismo con el que te registraste)</label>
    <input type="email" id="correo" placeholder="tucorreo@ejemplo.com">
    <button class="primario" id="btnEntrar" onclick="verVentas()">Ver mis ventas</button>
  </div>
</main>

<script>
  const API_BASE = "https://ensenai-backend.onrender.com";

  function escapeHtml(str) {
    const d = document.createElement("div");
    d.textContent = str || "";
    return d.innerHTML;
  }

  async function verVentas() {
    const correo = document.getElementById("correo").value.trim();
    const errorDiv = document.getElementById("error-identificar");
    errorDiv.innerHTML = "";
    if (!correo) {
      errorDiv.innerHTML = `<div class="error">Escribe tu correo.</div>`;
      return;
    }

    const btn = document.getElementById("btnEntrar");
    btn.disabled = true;
    btn.textContent = "Buscando…";

    try {
      const resCreador = await fetch(`${API_BASE}/api/creators`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: "—", email: correo }),
      });
      const dataCreador = await resCreador.json();
      if (!dataCreador.creator?.id) throw new Error(dataCreador.error || "No se encontró tu perfil.");

      const resVentas = await fetch(`${API_BASE}/api/creators/${dataCreador.creator.id}/ventas`);
      const ventas = await resVentas.json();

      mostrarResultado(ventas);
    } catch (err) {
      errorDiv.innerHTML = `<div class="error">${escapeHtml(err.message)}</div>`;
      btn.disabled = false;
      btn.textContent = "Ver mis ventas";
    }
  }

  function mostrarResultado(ventas) {
    const cont = document.getElementById("contenido");
    const cursosConVentas = (ventas.por_curso || []).filter((c) => c.ventas > 0);
    const cursosSinVentas = (ventas.por_curso || []).filter((c) => c.ventas === 0);

    cont.innerHTML = `
      <div class="tarjeta">
        <div class="resumen-grid">
          <div>
            <div class="resumen-num">$${Number(ventas.total_ganado).toFixed(2)}</div>
            <div class="resumen-label">Total ganado (MXN)</div>
          </div>
          <div>
            <div class="resumen-num">${ventas.total_ventas}</div>
            <div class="resumen-label">Ventas totales</div>
          </div>
        </div>
      </div>

      <div class="tarjeta">
        <h1 style="text-align:left; font-size:1.1rem;">Por curso</h1>
        ${
          cursosConVentas.length === 0
            ? `<div class="vacio">Todavía no tienes ventas registradas.</div>`
            : cursosConVentas
                .map(
                  (c) => `
            <div class="curso-fila">
              <span class="nombre">${escapeHtml(c.title)}</span>
              <span class="detalle">${c.ventas} venta${c.ventas === 1 ? "" : "s"}<br><span class="ganado">$${Number(c.ganado).toFixed(2)}</span></span>
            </div>`
                )
                .join("")
        }
        ${
          cursosSinVentas.length > 0
            ? `<p class="vacio" style="margin-top:10px;">${cursosSinVentas.length} curso(s) más sin ventas todavía.</p>`
            : ""
        }
      </div>
    `;
  }
</script>
</body>
</html>
