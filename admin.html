<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EnseñAI — Admin biblioteca</title>
<link rel="icon" type="image/png" href="assets/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grandstander:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --profundo: #1E3A8A; --profundo-oscuro: #16296B; --cielo: #60A5FA;
    --menta: #34D399; --aqua: #7DD3FC; --bosque: #065F46;
    --hielo: #F0FDF4; --tinta: #1E3A8A; --linea: #DCEEFC;
    --coral: #FF8A70; --rojo: #DC2626;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: 'Nunito', sans-serif;
    background:
      radial-gradient(circle at 12% 8%, rgba(96,165,250,0.25) 0, transparent 30%),
      radial-gradient(circle at 90% 20%, rgba(125,211,252,0.22) 0, transparent 32%),
      var(--hielo);
    color: var(--tinta); min-height: 100vh;
  }
  header { background: var(--profundo); color: #fff; padding: 18px 24px; display: flex; align-items: center; justify-content: space-between; }
  header a { color: inherit; text-decoration: none; display: flex; align-items: center; gap: 10px; }
  header .marca { font-family: 'Grandstander', sans-serif; font-weight: 700; font-size: 1.4rem; }
  header .marca .ai {
    display: inline-block; color: var(--aqua); background: rgba(255,255,255,0.14);
    padding: 1px 10px; border-radius: 999px; font-size: 0.75em; vertical-align: middle;
  }
  header .etiqueta { font-size: 0.8rem; opacity: .8; margin-left: 4px; }
  #btnSalir { background: none; border: 1px solid rgba(255,255,255,0.4); color: #fff; padding: 7px 14px; border-radius: 999px; font-size: 0.85rem; cursor: pointer; }

  main { max-width: 960px; margin: 0 auto; padding: 28px 20px 80px; }

  .tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .tabs button {
    background: #fff; border: 2px solid var(--linea); color: var(--profundo);
    padding: 9px 18px; border-radius: 999px; font-family: 'Nunito', sans-serif;
    font-weight: 700; font-size: 0.92rem; cursor: pointer;
  }
  .tabs button.activo { background: var(--profundo); border-color: var(--profundo); color: #fff; }
  .tabs button .cuenta { opacity: .7; font-weight: 600; }

  .tarjeta { background: #fff; border: 2px solid var(--linea); border-radius: 18px; padding: 22px; margin-bottom: 18px; box-shadow: 0 3px 0 var(--linea); }
  h1 { font-family: 'Grandstander', sans-serif; font-size: 1.35rem; margin: 0 0 6px; }
  h2 { font-family: 'Grandstander', sans-serif; font-size: 1.1rem; margin: 0 0 8px; color: var(--profundo); }
  p.ayuda { color: #4A6A85; margin: 0 0 16px; font-size: 0.92rem; line-height: 1.5; }

  label { display: block; font-weight: 700; font-size: 0.85rem; margin: 12px 0 4px; color: var(--profundo-oscuro); }
  input[type=text], input[type=url], textarea, select {
    width: 100%; padding: 10px 12px; border: 2px solid var(--linea); border-radius: 10px;
    font-family: 'Nunito', sans-serif; font-size: 0.95rem; background: #fff; color: var(--tinta);
  }
  textarea { resize: vertical; min-height: 60px; }
  input[type=file] { margin-top: 4px; }
  .fila { display: flex; gap: 12px; flex-wrap: wrap; }
  .fila > div { flex: 1; min-width: 180px; }
  .check { display: flex; align-items: center; gap: 8px; margin: 14px 0 0; }
  .check input { width: auto; }
  .check label { margin: 0; }

  button.primario {
    background: var(--profundo); color: #fff; border: none; border-radius: 999px;
    padding: 11px 22px; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 0.95rem;
    cursor: pointer; margin-top: 16px;
  }
  button.primario:disabled { opacity: .5; cursor: default; }
  button.secundario {
    background: #fff; color: var(--profundo); border: 2px solid var(--linea); border-radius: 999px;
    padding: 6px 14px; font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 0.82rem; cursor: pointer;
  }
  button.peligro { color: var(--rojo); border-color: #FBD5D5; }
  button.chico { padding: 5px 12px; font-size: 0.78rem; }

  .error { background: #FEF2F2; color: var(--rojo); border: 2px solid #FBD5D5; border-radius: 10px; padding: 10px 14px; margin-top: 12px; font-size: 0.88rem; }
  .exito { background: #ECFDF5; color: var(--bosque); border: 2px solid #A7F3D0; border-radius: 10px; padding: 10px 14px; margin-top: 12px; font-size: 0.88rem; }
  .cargando { color: #6B85A6; font-size: 0.9rem; padding: 10px 0; }

  .filtros { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  .filtros input, .filtros select { width: auto; min-width: 160px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
  .item {
    border: 2px solid var(--linea); border-radius: 14px; padding: 14px; background: #fbfdff;
    display: flex; flex-direction: column; gap: 6px;
  }
  .item.inactiva { opacity: .5; }
  .item .miniatura {
    width: 100%; height: 90px; border-radius: 10px; background: #fff; border: 1px solid var(--linea);
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .item .miniatura img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .item .miniatura .pdf-tag { font-size: 0.75rem; font-weight: 800; color: var(--profundo); }
  .item .nombre { font-weight: 800; font-size: 0.95rem; }
  .item .meta { font-size: 0.78rem; color: #6B85A6; }
  .item .claves { display: flex; flex-wrap: wrap; gap: 4px; }
  .item .claves span { background: var(--linea); color: var(--profundo-oscuro); font-size: 0.72rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
  .item .acciones { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  .pill-estado { font-size: 0.72rem; font-weight: 800; padding: 2px 9px; border-radius: 999px; align-self: flex-start; }
  .pill-si { background: #ECFDF5; color: var(--bosque); }
  .pill-no { background: #FEF3C7; color: #92400E; }

  table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--linea); }
  th { color: var(--profundo-oscuro); font-size: 0.78rem; text-transform: uppercase; letter-spacing: .03em; }

  .pantalla-bloqueo { max-width: 480px; margin: 90px auto; text-align: center; }
  .pantalla-bloqueo h1 { font-size: 1.5rem; }
</style>
</head>
<body>
<header>
  <a href="index.html">
    <span class="marca">Enseñ<span class="ai">AI</span></span>
    <span class="etiqueta">Admin biblioteca</span>
  </a>
  <button id="btnSalir" style="display:none;">Cerrar sesión</button>
</header>

<main id="app">
  <div class="cargando">Cargando…</div>
</main>

<script>
  const API_BASE = "https://ensenai-backend.onrender.com";
  const SUPABASE_URL = "https://azslvqfgeghhzghfxmdh.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF6c2x2cWZnZWdoaHpnaGZ4bWRoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzOTUzMzksImV4cCI6MjEwMTk3MTMzOX0.zd22nrf9OUrg0h2YnGJJt9mkKzoFERM54F4S48r-xEQ";
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const CATEGORIAS_ILUSTRACION = [
    { value: "emociones", label: "Emociones" },
    { value: "cuerpo_vida", label: "Cuerpo y vida" },
    { value: "tierra_espacio", label: "Tierra y espacio" },
    { value: "matematicas", label: "Matemáticas" },
    { value: "mexico", label: "México" },
    { value: "lenguaje", label: "Lenguaje" },
    { value: "convivencia", label: "Convivencia" },
    { value: "otros", label: "Otros" },
  ];
  const NIVELES = [
    { value: "", label: "Cualquier nivel" },
    { value: "preescolar", label: "Preescolar (3-5 años)" },
    { value: "primaria_baja", label: "Primaria baja (6-8 años)" },
    { value: "primaria_alta", label: "Primaria alta (9-12 años)" },
    { value: "secundaria", label: "Secundaria (12-15 años)" },
    { value: "preparatoria", label: "Preparatoria (15-18 años)" },
    { value: "universidad", label: "Universidad / autodidacta (18+)" },
  ];
  const TIPOS_ILUSTRACION = ["image/svg+xml", "image/png", "image/jpeg", "image/webp"];
  const TIPOS_PLANTILLA = [...TIPOS_ILUSTRACION, "application/pdf"];
  const MAX_BYTES = 2 * 1024 * 1024;

  let sesionActual = null;
  let pestañaActiva = "ilustraciones";
  let ilustraciones = [];
  let plantillas = [];
  let faltantes = [];

  function escapeHtml(str) {
    const d = document.createElement("div");
    d.textContent = str || "";
    return d.innerHTML;
  }

  function fmtFecha(iso) {
    try { return new Date(iso).toLocaleDateString("es-MX", { day: "numeric", month: "short", year: "numeric" }); }
    catch (e) { return ""; }
  }

  function fmtBytes(n) {
    if (!n) return "";
    if (n < 1024) return `${n} B`;
    return `${(n / 1024).toFixed(0)} KB`;
  }

  async function llamar(ruta, opciones = {}) {
    const res = await fetch(`${API_BASE}${ruta}`, {
      ...opciones,
      headers: {
        "Content-Type": "application/json",
        Authorization: `Bearer ${sesionActual.access_token}`,
        ...(opciones.headers || {}),
      },
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `No se pudo completar la operación (${res.status}).`);
    return data;
  }

  /** Lee un <input type=file> y regresa { archivoBase64, tipoMime } o null. */
  function leerArchivo(input) {
    return new Promise((resolve, reject) => {
      const file = input.files && input.files[0];
      if (!file) return resolve(null);
      if (file.size > MAX_BYTES) {
        return reject(new Error(`El archivo pesa ${(file.size / 1024 / 1024).toFixed(1)} MB y el máximo son 2 MB.`));
      }
      const lector = new FileReader();
      lector.onload = () => resolve({ archivoBase64: lector.result, tipoMime: file.type });
      lector.onerror = () => reject(new Error("No se pudo leer el archivo."));
      lector.readAsDataURL(file);
    });
  }

  async function init() {
    const { data } = await supabaseClient.auth.getSession();
    if (!data.session) {
      window.location.href = "comprador.html?despues=admin";
      return;
    }
    sesionActual = data.session;

    document.getElementById("btnSalir").onclick = async () => {
      await supabaseClient.auth.signOut();
      window.location.href = "comprador.html";
    };

    try {
      const { admin } = await llamar("/api/admin/soy-admin");
      if (!admin) {
        mostrarBloqueo();
        return;
      }
    } catch (err) {
      mostrarBloqueo("No pudimos confirmar tu acceso. Intenta de nuevo en un momento.");
      return;
    }

    document.getElementById("btnSalir").style.display = "inline-block";
    await Promise.all([cargarIlustraciones(), cargarPlantillas(), cargarFaltantes()]);
    render();
  }

  function mostrarBloqueo(msg) {
    document.getElementById("app").innerHTML = `
      <div class="pantalla-bloqueo">
        <h1>🔒 Esta sección es solo para administradores</h1>
        <p class="ayuda">${escapeHtml(msg || "Tu cuenta no tiene permisos para ver la biblioteca. Si crees que esto es un error, revisa que tu correo esté en ADMIN_EMAILS.")}</p>
        <a href="app.html"><button class="primario">Volver a EnseñAI</button></a>
      </div>
    `;
    document.getElementById("btnSalir").style.display = "inline-block";
  }

  /* ═══════════════ Ilustraciones ═══════════════ */

  async function cargarIlustraciones(categoria, q) {
    const params = new URLSearchParams();
    if (categoria) params.set("categoria", categoria);
    if (q) params.set("q", q);
    const data = await llamar(`/api/admin/ilustraciones${params.toString() ? "?" + params : ""}`);
    ilustraciones = data.ilustraciones || [];
  }

  async function cargarPlantillas() {
    const data = await llamar("/api/admin/plantillas");
    plantillas = data.plantillas || [];
  }

  async function cargarFaltantes() {
    const data = await llamar("/api/admin/faltantes");
    faltantes = data.faltantes || [];
  }

  /* ═══════════════ Render principal ═══════════════ */

  function render() {
    const app = document.getElementById("app");
    app.innerHTML = `
      <div class="tabs">
        <button data-tab="ilustraciones" class="${pestañaActiva === "ilustraciones" ? "activo" : ""}">🖼️ Ilustraciones <span class="cuenta">(${ilustraciones.length})</span></button>
        <button data-tab="plantillas" class="${pestañaActiva === "plantillas" ? "activo" : ""}">📄 Plantillas <span class="cuenta">(${plantillas.length})</span></button>
        <button data-tab="faltantes" class="${pestañaActiva === "faltantes" ? "activo" : ""}">🧩 Faltantes <span class="cuenta">(${faltantes.filter(f => !f.resuelta).length})</span></button>
      </div>
      <div id="panel"></div>
    `;
    app.querySelectorAll(".tabs button").forEach((b) => {
      b.onclick = () => { pestañaActiva = b.dataset.tab; render(); };
    });
    if (pestañaActiva === "ilustraciones") renderIlustraciones();
    if (pestañaActiva === "plantillas") renderPlantillas();
    if (pestañaActiva === "faltantes") renderFaltantes();
  }

  /* ═══════════════ Panel: Ilustraciones ═══════════════ */

  function renderIlustraciones() {
    const panel = document.getElementById("panel");
    panel.innerHTML = `
      <div class="tarjeta">
        <h2>Subir ilustración</h2>
        <p class="ayuda">Se engancha sola a los temas que mencionen sus palabras clave — el maestro nunca la pide directamente.</p>
        <form id="form-ilustracion">
          <div class="fila">
            <div>
              <label>Nombre</label>
              <input type="text" name="nombre" required placeholder="Ej. Sistema solar">
            </div>
            <div>
              <label>Categoría</label>
              <select name="categoria" required>
                ${CATEGORIAS_ILUSTRACION.map(c => `<option value="${c.value}">${c.label}</option>`).join("")}
              </select>
            </div>
          </div>
          <label>Palabras clave (separadas por coma)</label>
          <input type="text" name="palabrasClave" required placeholder="sistema solar, planetas, orbita">
          <label>Descripción (opcional)</label>
          <textarea name="descripcion" placeholder="Para acordarte de qué es, no la ve nadie más."></textarea>
          <div class="fila">
            <div>
              <label>Licencia (opcional)</label>
              <input type="text" name="licencia" placeholder="Ej. CC BY-SA 4.0">
            </div>
            <div>
              <label>Autor (opcional)</label>
              <input type="text" name="autor" placeholder="Ej. Wikimedia Commons">
            </div>
          </div>
          <label>Fuente / URL original (opcional)</label>
          <input type="url" name="fuenteUrl" placeholder="https://...">
          <label>Archivo (SVG, PNG, JPG o WEBP — máx. 2 MB)</label>
          <input type="file" name="archivo" accept=".svg,.png,.jpg,.jpeg,.webp" required>
          <button class="primario" type="submit">Subir ilustración</button>
          <div id="msg-ilustracion"></div>
        </form>
      </div>

      <div class="tarjeta">
        <h2>Biblioteca (${ilustraciones.length})</h2>
        <div class="filtros">
          <input type="text" id="buscar-ilustracion" placeholder="Buscar por nombre o palabra clave…">
          <select id="filtro-categoria">
            <option value="">Todas las categorías</option>
            ${CATEGORIAS_ILUSTRACION.map(c => `<option value="${c.value}">${c.label}</option>`).join("")}
          </select>
        </div>
        <div id="grid-ilustraciones" class="grid"></div>
      </div>
    `;

    document.getElementById("form-ilustracion").addEventListener("submit", subirIlustracion);
    document.getElementById("buscar-ilustracion").addEventListener("input", debounce(refiltrarIlustraciones, 350));
    document.getElementById("filtro-categoria").addEventListener("change", refiltrarIlustraciones);
    dibujarGridIlustraciones();
  }

  async function refiltrarIlustraciones() {
    const q = document.getElementById("buscar-ilustracion").value.trim();
    const categoria = document.getElementById("filtro-categoria").value;
    document.getElementById("grid-ilustraciones").innerHTML = `<div class="cargando">Buscando…</div>`;
    try {
      await cargarIlustraciones(categoria, q);
      dibujarGridIlustraciones();
    } catch (err) {
      document.getElementById("grid-ilustraciones").innerHTML = `<div class="error">${escapeHtml(err.message)}</div>`;
    }
  }

  function dibujarGridIlustraciones() {
    const cont = document.getElementById("grid-ilustraciones");
    if (!ilustraciones.length) {
      cont.innerHTML = `<p class="ayuda" style="margin:0;">Todavía no hay ilustraciones aquí.</p>`;
      return;
    }
    cont.innerHTML = ilustraciones.map((i) => `
      <div class="item ${i.activa ? "" : "inactiva"}" data-id="${i.id}">
        <div class="miniatura"><img src="${i.image_url}" alt="${escapeHtml(i.nombre)}" loading="lazy"></div>
        <span class="pill-estado ${i.activa ? "pill-si" : "pill-no"}">${i.activa ? "Activa" : "Desactivada"}</span>
        <div class="nombre">${escapeHtml(i.nombre)}</div>
        <div class="meta">${CATEGORIAS_ILUSTRACION.find(c => c.value === i.categoria)?.label || i.categoria} · ${fmtBytes(i.tamano_bytes)}</div>
        <div class="claves">${(i.palabras_clave || []).slice(0, 5).map(k => `<span>${escapeHtml(k)}</span>`).join("")}</div>
        <div class="acciones">
          <button class="secundario chico" data-accion="toggle">${i.activa ? "Desactivar" : "Activar"}</button>
          <button class="secundario chico peligro" data-accion="borrar">Borrar</button>
        </div>
      </div>
    `).join("");

    cont.querySelectorAll(".item").forEach((el) => {
      const id = el.dataset.id;
      const ilu = ilustraciones.find((x) => x.id === id);
      el.querySelector('[data-accion="toggle"]').onclick = () => alternarActivaIlustracion(ilu);
      el.querySelector('[data-accion="borrar"]').onclick = () => borrarIlustracion(ilu);
    });
  }

  async function subirIlustracion(ev) {
    ev.preventDefault();
    const form = ev.target;
    const msg = document.getElementById("msg-ilustracion");
    msg.innerHTML = "";
    const boton = form.querySelector("button[type=submit]");

    try {
      const archivo = await leerArchivo(form.archivo);
      if (!archivo) throw new Error("Elige un archivo.");
      if (!TIPOS_ILUSTRACION.includes(archivo.tipoMime)) throw new Error("Ese tipo de archivo no se acepta. Usa SVG, PNG, JPG o WEBP.");

      boton.disabled = true;
      boton.textContent = "Subiendo…";

      await llamar("/api/admin/ilustraciones", {
        method: "POST",
        body: JSON.stringify({
          nombre: form.nombre.value.trim(),
          categoria: form.categoria.value,
          palabrasClave: form.palabrasClave.value,
          descripcion: form.descripcion.value.trim(),
          licencia: form.licencia.value.trim(),
          autor: form.autor.value.trim(),
          fuenteUrl: form.fuenteUrl.value.trim(),
          archivoBase64: archivo.archivoBase64,
          tipoMime: archivo.tipoMime,
        }),
      });

      msg.innerHTML = `<div class="exito">Ilustración subida ✓</div>`;
      form.reset();
      await cargarIlustraciones();
      dibujarGridIlustraciones();
      document.getElementById("panel").querySelector("h2").scrollIntoView({ behavior: "smooth" });
    } catch (err) {
      msg.innerHTML = `<div class="error">${escapeHtml(err.message)}</div>`;
    } finally {
      boton.disabled = false;
      boton.textContent = "Subir ilustración";
    }
  }

  async function alternarActivaIlustracion(ilu) {
    try {
      await llamar(`/api/admin/ilustraciones/${ilu.id}`, {
        method: "PATCH",
        body: JSON.stringify({ activa: !ilu.activa }),
      });
      ilu.activa = !ilu.activa;
      dibujarGridIlustraciones();
    } catch (err) {
      alert(err.message);
    }
  }

  async function borrarIlustracion(ilu) {
    if (!confirm(`¿Borrar "${ilu.nombre}"? No se puede deshacer.`)) return;
    try {
      await llamar(`/api/admin/ilustraciones/${ilu.id}`, { method: "DELETE" });
      ilustraciones = ilustraciones.filter((x) => x.id !== ilu.id);
      render();
    } catch (err) {
      alert(err.message);
    }
  }

  /* ═══════════════ Panel: Plantillas ═══════════════ */

  function renderPlantillas() {
    const panel = document.getElementById("panel");
    panel.innerHTML = `
      <div class="tarjeta">
        <h2>📦 Subir varias a la vez</h2>
        <p class="ayuda">Para cargar un cuadernillo completo sin llenar un formulario por hoja. Si el archivo se llama <code>nivel__categoria__enfoque__Nombre.pdf</code>, esos datos se llenan solos; si no, se usa el nombre del archivo tal cual y queda en categoría "otros".</p>
        <input type="file" id="pl-lote" multiple accept=".svg,.png,.jpg,.jpeg,.webp,.pdf">
        <div class="check">
          <input type="checkbox" id="chk-lote-ia">
          <label for="chk-lote-ia">✨ Que la IA les ponga nombre y descripción mirando cada hoja (tarda unos segundos por archivo)</label>
        </div>
        <div class="check">
          <input type="checkbox" id="chk-lote-marcar" checked>
          <label for="chk-lote-marcar">Ponerles la marca de EnseñAI, y saltarse las que ya estén en la biblioteca</label>
        </div>
        <div class="check">
          <input type="checkbox" id="chk-lote-publicar">
          <label for="chk-lote-publicar">Publicarlas de inmediato (si no, las revisas aquí abajo antes)</label>
        </div>
        <button class="primario" type="button" id="btn-lote">Subir las que elegí</button>
        <div id="avance-lote"></div>
      </div>

      <div class="tarjeta">
        <h2>Subir plantilla</h2>
        <p class="ayuda">El maestro la busca y la descarga tal cual — formatos, fichas, planeaciones. Puedes subirla sin publicar para revisarla antes.</p>
        <form id="form-plantilla">
          <div class="fila">
            <div>
              <label>Nombre</label>
              <input type="text" name="nombre" required placeholder="Ej. Ficha de seguimiento semanal">
            </div>
            <div>
              <label>Categoría</label>
              <input type="text" name="categoria" placeholder="Ej. planeacion, evaluacion…" value="otros">
            </div>
          </div>
          <label>Descripción (opcional)</label>
          <textarea name="descripcion" placeholder="Para qué sirve y cómo se usa."></textarea>
          <div class="fila">
            <div>
              <label>Nivel</label>
              <select name="nivel">
                ${NIVELES.map(n => `<option value="${n.value}">${n.label}</option>`).join("")}
              </select>
            </div>
            <div>
              <label>Enfoque</label>
              <select name="enfoque">
                <option value="">Escolar y psicoeducativo</option>
                <option value="escolar">Solo escolar</option>
                <option value="psicoeducativo">Solo psicoeducativo</option>
              </select>
            </div>
          </div>
          <label>Archivo (SVG, PNG, JPG, WEBP o PDF — máx. 2 MB)</label>
          <input type="file" name="archivo" accept=".svg,.png,.jpg,.jpeg,.webp,.pdf" required>
          <p class="ayuda" id="estado-analisis" style="margin:4px 0 0;">Al elegir el archivo, la IA mira la hoja y llena los campos de arriba. Todo queda editable.</p>
          <div class="check">
            <input type="checkbox" name="marcar" id="chk-marcar" checked>
            <label for="chk-marcar">Ponerle la marca de EnseñAI (pastilla abajo a la derecha, solo en PDF)</label>
          </div>
          <div class="check">
            <input type="checkbox" name="publicada" id="chk-publicada">
            <label for="chk-publicada">Publicar de inmediato (si no, solo tú la ves)</label>
          </div>
          <button class="primario" type="submit">Subir plantilla</button>
          <div id="msg-plantilla"></div>
        </form>
      </div>

      <div class="tarjeta">
        <h2>Biblioteca (<span id="cuenta-biblioteca">${plantillas.length}</span>)</h2>
        <div id="barra-seleccion"></div>
        <div id="grid-plantillas" class="grid"></div>
      </div>
    `;

    document.getElementById("form-plantilla").addEventListener("submit", subirPlantilla);
    document.getElementById("form-plantilla").archivo.addEventListener("change", analizarArchivoElegido);
    document.getElementById("btn-lote").addEventListener("click", subirLotePlantillas);
    dibujarGridPlantillas();
  }

  /**
   * Selección múltiple en la biblioteca (4-sep-2026).
   *
   * Con 230 hojas, publicarlas de una en una son 230 clics; y si algo sale
   * mal en una tanda, deshacerlo a mano es peor. Los ids seleccionados
   * viven aquí afuera para que sobrevivan a los redibujados del grid.
   */
  let plantillasElegidas = new Set();

  function dibujarGridPlantillas() {
    const cont = document.getElementById("grid-plantillas");
    // El título se pinta una vez con renderPlantillas(), pero la lista se
    // vuelve a cargar después de subir, publicar o borrar: sin esto, el
    // encabezado se quedaba con el número viejo mientras la barra de abajo
    // ya mostraba el nuevo (se veía "Biblioteca (210)" y "Seleccionar las 271").
    const cuenta = document.getElementById("cuenta-biblioteca");
    if (cuenta) cuenta.textContent = String(plantillas.length);
    if (!plantillas.length) {
      plantillasElegidas.clear();
      cont.innerHTML = `<p class="ayuda" style="margin:0;">Todavía no hay plantillas aquí.</p>`;
      const barra = document.getElementById("barra-seleccion");
      if (barra) barra.innerHTML = "";
      return;
    }

    // Se limpian los ids de plantillas que ya no existen (borradas).
    const vivas = new Set(plantillas.map((p) => p.id));
    plantillasElegidas = new Set([...plantillasElegidas].filter((id) => vivas.has(id)));

    cont.innerHTML = plantillas.map((p) => {
      // Desde schema_v40 el bucket es privado: la miniatura y el botón
      // "Ver" usan la liga firmada que manda el backend, no archivo_url
      // (que ahora es el marcador "privado:<ruta>", no una URL).
      const url = p.vista_url || (String(p.archivo_url || "").startsWith("http") ? p.archivo_url : "");
      return `
      <div class="item" data-id="${p.id}">
        <div class="check" style="margin:0 0 6px;">
          <input type="checkbox" id="chk-pl-${p.id}" data-elegir="${p.id}" ${plantillasElegidas.has(p.id) ? "checked" : ""}>
          <label for="chk-pl-${p.id}" style="font-size:0.8rem;">Seleccionar</label>
        </div>
        <div class="miniatura">
          ${p.tipo_mime === "application/pdf"
            ? `<span class="pdf-tag">📄 PDF</span>`
            : url
              ? `<img src="${escapeHtml(url)}" alt="${escapeHtml(p.nombre)}" loading="lazy">`
              : `<span class="pdf-tag">🖼️</span>`}
        </div>
        <span class="pill-estado ${p.publicada ? "pill-si" : "pill-no"}">${p.publicada ? "Publicada" : "Borrador"}</span>
        <div class="nombre">${escapeHtml(p.nombre)}</div>
        <div class="meta">${escapeHtml(p.categoria)} · ${p.nivel ? NIVELES.find(n => n.value === p.nivel)?.label || p.nivel : "Cualquier nivel"} · ${p.descargas || 0} descargas</div>
        <div class="acciones">
          ${url ? `<a href="${escapeHtml(url)}" target="_blank" rel="noopener"><button class="secundario chico">Ver</button></a>` : ""}
          <button class="secundario chico" data-accion="toggle">${p.publicada ? "Ocultar" : "Publicar"}</button>
          <button class="secundario chico peligro" data-accion="borrar">Borrar</button>
        </div>
      </div>
    `;}).join("");

    cont.querySelectorAll(".item").forEach((el) => {
      const id = el.dataset.id;
      const pl = plantillas.find((x) => x.id === id);
      el.querySelector('[data-accion="toggle"]').onclick = () => alternarPublicadaPlantilla(pl);
      el.querySelector('[data-accion="borrar"]').onclick = () => borrarPlantilla(pl);
      el.querySelector("[data-elegir]").onchange = (ev) => {
        if (ev.target.checked) plantillasElegidas.add(id);
        else plantillasElegidas.delete(id);
        dibujarBarraSeleccion();
      };
    });

    dibujarBarraSeleccion();
  }

  function dibujarBarraSeleccion() {
    const barra = document.getElementById("barra-seleccion");
    if (!barra) return;
    const n = plantillasElegidas.size;
    const todas = n > 0 && n === plantillas.length;

    barra.innerHTML = `
      <div class="check" style="margin:0 0 8px;">
        <input type="checkbox" id="chk-todas" ${todas ? "checked" : ""}>
        <label for="chk-todas">${todas ? "Quitar la selección" : `Seleccionar las ${plantillas.length}`}</label>
      </div>
      <p class="ayuda" style="margin:0 0 8px;">${n ? `${n} seleccionada${n === 1 ? "" : "s"}` : "Ninguna seleccionada"}</p>
      <div style="display:flex; flex-wrap:wrap; gap:6px;">
        <button type="button" class="secundario chico" data-lote="publicar" ${n ? "" : "disabled"}>Publicar</button>
        <button type="button" class="secundario chico" data-lote="ocultar" ${n ? "" : "disabled"}>Ocultar</button>
        <button type="button" class="secundario chico peligro" data-lote="borrar" ${n ? "" : "disabled"}>Borrar</button>
      </div>
      <div id="avance-seleccion"></div>`;

    barra.querySelector("#chk-todas").onchange = (ev) => {
      plantillasElegidas = ev.target.checked ? new Set(plantillas.map((p) => p.id)) : new Set();
      dibujarGridPlantillas();
    };
    barra.querySelectorAll("[data-lote]").forEach((b) => {
      b.onclick = () => accionEnLote(b.dataset.lote);
    });
  }

  /**
   * Publica, oculta o borra todas las seleccionadas, una por una con los
   * endpoints de siempre. Va en serie a propósito: 230 peticiones en
   * paralelo no las agradece ni Render ni Supabase, y así se puede ir
   * diciendo cuántas van.
   */
  async function accionEnLote(accion) {
    const ids = [...plantillasElegidas];
    if (!ids.length) return;

    if (accion === "borrar") {
      const seguro = confirm(
        `Vas a borrar ${ids.length} plantilla(s) para siempre, junto con su archivo. Esto no se puede deshacer.\n\n¿Le seguimos?`
      );
      if (!seguro) return;
    }

    const avance = document.getElementById("avance-seleccion");
    const botones = document.querySelectorAll("#barra-seleccion [data-lote], #chk-todas");
    botones.forEach((b) => (b.disabled = true));

    let hechas = 0;
    const fallas = [];
    for (const id of ids) {
      const pl = plantillas.find((x) => x.id === id);
      try {
        if (accion === "borrar") {
          await llamar(`/api/admin/plantillas/${id}`, { method: "DELETE" });
        } else {
          await llamar(`/api/admin/plantillas/${id}`, {
            method: "PATCH",
            body: JSON.stringify({ publicada: accion === "publicar" }),
          });
        }
        hechas++;
      } catch (err) {
        fallas.push(`${pl?.nombre || id}: ${err.message}`);
      }
      if (avance) {
        avance.innerHTML = `<p class="ayuda" style="margin:8px 0 0;"><strong>${hechas + fallas.length} de ${ids.length}</strong>${fallas.length ? ` · ✗ ${fallas.length} con problema` : ""}</p>`;
      }
    }

    plantillasElegidas = new Set();
    await cargarPlantillas();
    dibujarGridPlantillas();

    const av = document.getElementById("avance-seleccion");
    if (av) {
      const verbo = accion === "borrar" ? "borrada" : accion === "publicar" ? "publicada" : "ocultada";
      av.innerHTML =
        `<div class="exito" style="margin-top:6px;">${hechas} plantilla(s) ${verbo}(s).</div>` +
        (fallas.length ? `<div class="error" style="margin-top:6px; text-align:left;">${fallas.map((f) => escapeHtml(f)).join("<br>")}</div>` : "");
    }
  }

  /**
   * Subida múltiple de plantillas (3-sep-2026).
   *
   * Nació de un problema real: los cuadernillos que Claudia hizo en Canva
   * salen partidos en ~230 hojas sueltas, y llenar 230 veces el formulario
   * de arriba no es un flujo, es un castigo. Esto sube todas de un jalón
   * usando el MISMO endpoint de siempre (POST /api/admin/plantillas), una
   * por una: no hace falta backend nuevo, y si una falla las demás siguen.
   *
   * La metadata viaja en el NOMBRE del archivo, separada por dobles guiones
   * bajos, para que se pueda revisar y corregir desde el explorador de
   * archivos antes de subir nada:
   *
   *   preescolar__lenguaje__escolar__Laberinto de la letra A.pdf
   *   └ nivel      └ categoría └ enfoque  └ nombre que verá el maestro
   *
   * Todo es opcional de derecha a izquierda: con 3 partes se asume que
   * falta el enfoque, con 2 que solo viene categoría, y un archivo sin
   * ningún "__" se sube con su propio nombre y categoría "otros".
   */
  const NIVELES_VALIDOS = ["preescolar", "primaria_baja", "primaria_alta", "secundaria", "preparatoria", "universidad"];

  function datosDesdeNombre(nombreArchivo) {
    const sinExtension = nombreArchivo.replace(/\.[^.]+$/, "");
    const partes = sinExtension.split("__").map((x) => x.trim()).filter((x, i, a) => i < a.length - 1 ? x !== "" : true);

    let nivel = "", categoria = "", enfoque = "", nombre = sinExtension;

    if (partes.length >= 4) {
      [nivel, categoria, enfoque] = partes;
      nombre = partes.slice(3).join(" — ");
    } else if (partes.length === 3) {
      [nivel, categoria] = partes;
      nombre = partes[2];
    } else if (partes.length === 2) {
      categoria = partes[0];
      nombre = partes[1];
    }

    // "todos" / "cualquiera" es la forma de decir "sirve para cualquier
    // nivel", que en la base se guarda como null.
    if (!NIVELES_VALIDOS.includes(nivel)) nivel = "";
    if (enfoque !== "escolar" && enfoque !== "psicoeducativo") enfoque = "";

    return {
      nombre: nombre.trim() || sinExtension,
      categoria: (categoria || "otros").toLowerCase(),
      nivel,
      enfoque,
    };
  }

  function leerArchivoSuelto(file) {
    return new Promise((resolve, reject) => {
      const lector = new FileReader();
      lector.onload = () => resolve(lector.result);
      lector.onerror = () => reject(new Error("No se pudo leer el archivo."));
      lector.readAsDataURL(file);
    });
  }

  /**
   * Le pide a la IA que proponga los datos de una hoja (4-sep-2026).
   *
   * Devuelve la propuesta o null; nunca lanza, porque esto es una ayuda:
   * si falla, la persona llena los campos a mano y sube igual.
   */
  async function proponerDatos(archivoBase64, tipoMime, nombreArchivo) {
    try {
      const { propuesta } = await llamar("/api/admin/plantillas/analizar", {
        method: "POST",
        body: JSON.stringify({ archivoBase64, tipoMime, nombreArchivo }),
      });
      return propuesta || null;
    } catch (err) {
      return null;
    }
  }

  /**
   * Al elegir un archivo en el formulario de una sola plantilla, se llenan
   * los campos solos. Solo se pisan los que estén VACÍOS o con su valor por
   * omisión: si la persona ya escribió algo, su texto manda.
   */
  async function analizarArchivoElegido(ev) {
    const form = document.getElementById("form-plantilla");
    const estado = document.getElementById("estado-analisis");
    const file = ev.target.files && ev.target.files[0];
    if (!file || !estado) return;

    if (file.size > MAX_BYTES) {
      estado.textContent = `Ese archivo pesa ${(file.size / 1024 / 1024).toFixed(1)} MB y el máximo son 2 MB.`;
      return;
    }

    estado.textContent = "✨ Mirando la hoja para proponerte los datos…";
    const archivoBase64 = await leerArchivoSuelto(file).catch(() => null);
    if (!archivoBase64) {
      estado.textContent = "No pude leer el archivo. Llena los campos a mano.";
      return;
    }

    const p = await proponerDatos(archivoBase64, file.type, file.name);
    if (!p) {
      estado.textContent = "No pude proponerte los datos. Llénalos a mano y súbela igual.";
      return;
    }

    if (!form.nombre.value.trim()) form.nombre.value = p.nombre;
    if (!form.descripcion.value.trim()) form.descripcion.value = p.descripcion || "";
    if (!form.categoria.value.trim() || form.categoria.value.trim() === "otros") form.categoria.value = p.categoria;
    if (!form.nivel.value) form.nivel.value = p.nivel || "";
    if (!form.enfoque.value) form.enfoque.value = p.enfoque || "";
    estado.textContent = "✨ Datos propuestos — revísalos y corrige lo que quieras antes de subir.";
  }

  async function subirLotePlantillas() {
    const input = document.getElementById("pl-lote");
    const avance = document.getElementById("avance-lote");
    const boton = document.getElementById("btn-lote");
    const publicar = document.getElementById("chk-lote-publicar").checked;
    const conIA = document.getElementById("chk-lote-ia").checked;
    const conMarca = document.getElementById("chk-lote-marcar").checked;
    const archivos = Array.from(input.files || []);

    if (!archivos.length) {
      avance.innerHTML = `<div class="error">Primero elige los archivos.</div>`;
      return;
    }

    boton.disabled = true;
    const fallas = [];
    // Una hoja repetida no es una falla: se cuenta aparte para que el
    // resumen final no parezca un desastre cuando todo salió bien.
    const repetidas = [];
    let subidas = 0;

    const pintar = (i) => {
      avance.innerHTML = `
        <p class="ayuda" style="margin:8px 0 4px;"><strong>${i} de ${archivos.length}</strong> · ✓ ${subidas} subidas${repetidas.length ? ` · ⏭️ ${repetidas.length} ya estaban` : ""}${fallas.length ? ` · ✗ ${fallas.length} con problema` : ""}${conIA && i < archivos.length ? " · ✨ con IA, tarda más" : ""}</p>
        ${repetidas.length ? `<div class="aviso" style="text-align:left;">${repetidas.map((r) => escapeHtml(r)).join("<br>")}</div>` : ""}
        ${fallas.length ? `<div class="error" style="text-align:left;">${fallas.map((f) => escapeHtml(f)).join("<br>")}</div>` : ""}
      `;
    };
    pintar(0);

    for (let i = 0; i < archivos.length; i++) {
      const file = archivos[i];
      try {
        if (file.size > MAX_BYTES) {
          throw new Error(`pesa ${(file.size / 1024 / 1024).toFixed(1)} MB (máx. 2 MB)`);
        }
        if (!TIPOS_PLANTILLA.includes(file.type)) {
          throw new Error("ese tipo de archivo no se acepta");
        }
        let datos = datosDesdeNombre(file.name);
        const archivoBase64 = await leerArchivoSuelto(file);

        // Con la IA prendida, su propuesta manda sobre lo que dice el
        // nombre del archivo — salvo el nivel y el enfoque, que si venían
        // en el nombre los puso una persona y esos ganan.
        if (conIA) {
          const p = await proponerDatos(archivoBase64, file.type, file.name);
          if (p) {
            // Lo que venga en el NOMBRE DEL ARCHIVO manda sobre la IA:
            // categoría, nivel y enfoque los puso una persona a propósito.
            // Sin esto pasaba algo confuso: dos hojas del mismo cuadernillo
            // quedaban en categorías distintas porque el modelo veía una
            // como "lenguaje" (por la palabra que se escribe) y otra como
            // "matemáticas" (por la figura). De la IA se toma lo que sí
            // requiere mirar la hoja: el nombre y la descripción.
            const veniaEnElNombre = file.name.includes("__");
            datos = {
              nombre: p.nombre,
              categoria: veniaEnElNombre ? datos.categoria : p.categoria || datos.categoria,
              nivel: datos.nivel || p.nivel || "",
              enfoque: datos.enfoque || p.enfoque || "",
              descripcion: p.descripcion || "",
            };
          }
        }
        await llamar("/api/admin/plantillas", {
          method: "POST",
          body: JSON.stringify({
            nombre: datos.nombre,
            descripcion: datos.descripcion || "",
            categoria: datos.categoria,
            nivel: datos.nivel || null,
            enfoque: datos.enfoque || null,
            publicada: publicar,
            marcar: conMarca,
            archivoBase64,
            tipoMime: file.type,
          }),
        });
        subidas++;
      } catch (err) {
        if (/ya está en la biblioteca/i.test(err.message || "")) repetidas.push(`${file.name}: ${err.message}`);
        else fallas.push(`${file.name}: ${err.message}`);
      }
      pintar(i + 1);
    }

    boton.disabled = false;
    input.value = "";
    await cargarPlantillas();
    dibujarGridPlantillas();
    avance.innerHTML += `<div class="exito" style="margin-top:6px;">Listo: ${subidas} plantilla(s) en la biblioteca${publicar ? " y ya publicadas" : " sin publicar — revísalas abajo y publícalas"}${repetidas.length ? `, y ${repetidas.length} que ya tenías se saltaron` : ""}.</div>`;
  }

  async function subirPlantilla(ev) {
    ev.preventDefault();
    const form = ev.target;
    const msg = document.getElementById("msg-plantilla");
    msg.innerHTML = "";
    const boton = form.querySelector("button[type=submit]");

    try {
      const archivo = await leerArchivo(form.archivo);
      if (!archivo) throw new Error("Elige un archivo.");
      if (!TIPOS_PLANTILLA.includes(archivo.tipoMime)) throw new Error("Ese tipo de archivo no se acepta. Usa SVG, PNG, JPG, WEBP o PDF.");

      boton.disabled = true;
      boton.textContent = "Subiendo…";

      const respuesta = await llamar("/api/admin/plantillas", {
        method: "POST",
        body: JSON.stringify({
          nombre: form.nombre.value.trim(),
          descripcion: form.descripcion.value.trim(),
          categoria: form.categoria.value.trim() || "otros",
          nivel: form.nivel.value || null,
          enfoque: form.enfoque.value || null,
          publicada: form.publicada.checked,
          marcar: form.marcar.checked,
          archivoBase64: archivo.archivoBase64,
          tipoMime: archivo.tipoMime,
        }),
      });

      msg.innerHTML =
        `<div class="exito">Plantilla subida ✓${respuesta?.marcada ? " (con marca)" : ""}</div>` +
        (respuesta?.aviso ? `<div class="aviso" style="margin-top:6px;">${escapeHtml(respuesta.aviso)}</div>` : "");
      form.reset();
      await cargarPlantillas();
      dibujarGridPlantillas();
    } catch (err) {
      msg.innerHTML = `<div class="error">${escapeHtml(err.message)}</div>`;
    } finally {
      boton.disabled = false;
      boton.textContent = "Subir plantilla";
    }
  }

  async function alternarPublicadaPlantilla(pl) {
    try {
      await llamar(`/api/admin/plantillas/${pl.id}`, {
        method: "PATCH",
        body: JSON.stringify({ publicada: !pl.publicada }),
      });
      pl.publicada = !pl.publicada;
      dibujarGridPlantillas();
    } catch (err) {
      alert(err.message);
    }
  }

  async function borrarPlantilla(pl) {
    if (!confirm(`¿Borrar "${pl.nombre}"? No se puede deshacer.`)) return;
    try {
      await llamar(`/api/admin/plantillas/${pl.id}`, { method: "DELETE" });
      plantillas = plantillas.filter((x) => x.id !== pl.id);
      render();
    } catch (err) {
      alert(err.message);
    }
  }

  /* ═══════════════ Panel: Faltantes ═══════════════ */

  function renderFaltantes() {
    const panel = document.getElementById("panel");
    const pendientes = faltantes.filter(f => !f.resuelta);
    const resueltas = faltantes.filter(f => f.resuelta);

    panel.innerHTML = `
      <div class="tarjeta">
        <h2>Lo que falta ilustrar</h2>
        <p class="ayuda">Temas que se generaron y no encontraron ninguna ilustración — ordenados de más pedidos a menos. Sube una ilustración con palabras clave que los cubra y márcalo como resuelto.</p>
        ${!faltantes.length ? `<p class="ayuda" style="margin:0;">Nada pendiente todavía — o falta correr <code>db/schema_v38.sql</code> en Supabase.</p>` : `
        <table>
          <thead><tr><th>Tema</th><th>Nivel</th><th>Veces pedido</th><th>Última vez</th><th></th></tr></thead>
          <tbody>
            ${pendientes.map(f => `
              <tr data-id="${f.id}">
                <td>${escapeHtml(f.tema_ejemplo)}</td>
                <td>${f.nivel ? NIVELES.find(n => n.value === f.nivel)?.label || f.nivel : "—"}</td>
                <td>${f.veces}</td>
                <td>${fmtFecha(f.ultima_vez)}</td>
                <td><button class="secundario chico" data-accion="resolver">Marcar resuelto</button></td>
              </tr>
            `).join("")}
            ${resueltas.map(f => `
              <tr data-id="${f.id}" style="opacity:.45;">
                <td>${escapeHtml(f.tema_ejemplo)}</td>
                <td>${f.nivel ? NIVELES.find(n => n.value === f.nivel)?.label || f.nivel : "—"}</td>
                <td>${f.veces}</td>
                <td>${fmtFecha(f.ultima_vez)}</td>
                <td><button class="secundario chico" data-accion="reabrir">Reabrir</button></td>
              </tr>
            `).join("")}
          </tbody>
        </table>
        `}
      </div>
    `;

    panel.querySelectorAll('[data-accion="resolver"]').forEach((btn) => {
      const id = btn.closest("tr").dataset.id;
      btn.onclick = () => marcarFaltante(id, true);
    });
    panel.querySelectorAll('[data-accion="reabrir"]').forEach((btn) => {
      const id = btn.closest("tr").dataset.id;
      btn.onclick = () => marcarFaltante(id, false);
    });
  }

  async function marcarFaltante(id, resuelta) {
    try {
      await llamar(`/api/admin/faltantes/${id}`, {
        method: "PATCH",
        body: JSON.stringify({ resuelta }),
      });
      const f = faltantes.find((x) => x.id === id);
      if (f) f.resuelta = resuelta;
      renderFaltantes();
    } catch (err) {
      alert(err.message);
    }
  }

  /* ═══════════════ util ═══════════════ */

  function debounce(fn, ms) {
    let t;
    return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
  }

  init();
</script>
</body>
</html>
