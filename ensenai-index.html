<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EnseñAI — Muy pronto</title>
<meta name="description" content="Sube un video, EnseñAI genera el material de apoyo. Muy pronto.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --pizarra: #2E86AB;
    --pizarra-deep: #1B3B4B;
    --tiza: #FDF8EF;
    --chispa: #F4A259;
    --hoja: #6FB98F;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
  }

  body {
    font-family: 'Work Sans', sans-serif;
    background:
      radial-gradient(circle at 15% 20%, rgba(255,255,255,0.5) 0, transparent 45%),
      radial-gradient(circle at 85% 75%, rgba(255,255,255,0.35) 0, transparent 40%),
      var(--pizarra-deep);
    color: var(--tiza);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow: hidden;
  }

  /* textura tipo polvo de tiza, sutil */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.06;
    background-image: radial-gradient(circle, #fff 1px, transparent 1px);
    background-size: 22px 22px;
  }

  .wrap {
    position: relative;
    max-width: 560px;
    width: 100%;
    text-align: center;
  }

  .marca {
    font-family: 'Fredoka', sans-serif;
    font-weight: 700;
    font-size: clamp(2.4rem, 7vw, 3.4rem);
    letter-spacing: -0.01em;
    color: var(--tiza);
  }

  .marca .ai {
    color: var(--chispa);
  }

  .signature {
    margin: 36px auto 32px;
    width: min(280px, 70vw);
    height: auto;
    display: block;
  }

  .tagline {
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: clamp(1.15rem, 3.4vw, 1.5rem);
    line-height: 1.35;
    color: var(--tiza);
    margin-bottom: 14px;
  }

  .desc {
    font-size: 1rem;
    line-height: 1.6;
    color: rgba(253, 248, 239, 0.78);
    max-width: 420px;
    margin: 0 auto 34px;
  }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: 'Work Sans', sans-serif;
    font-weight: 600;
    font-size: 0.85rem;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--pizarra-deep);
    background: var(--hoja);
    padding: 10px 20px;
    border-radius: 999px;
  }

  .pill-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--pizarra-deep);
    animation: pulse 1.8s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.75); }
  }

  @media (prefers-reduced-motion: reduce) {
    .pill-dot { animation: none; }
  }

  footer {
    margin-top: 40px;
    font-size: 0.8rem;
    color: rgba(253, 248, 239, 0.45);
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="marca">Enseñ<span class="ai">AI</span></div>

    <svg class="signature" viewBox="0 0 220 90" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Un video se convierte en material de estudio">
      <!-- video / play -->
      <rect x="4" y="20" width="56" height="50" rx="10" stroke="#FDF8EF" stroke-width="2.5" opacity="0.9"/>
      <path d="M25 34 L44 45 L25 56 Z" fill="#F4A259"/>

      <!-- flecha tipo tiza -->
      <path d="M68 45 C 88 30, 108 60, 128 45" stroke="#FDF8EF" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.85"/>
      <path d="M120 38 L129 45 L119 51" stroke="#FDF8EF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.85"/>

      <!-- tarjetas de trivia/memorama -->
      <rect x="146" y="14" width="42" height="30" rx="6" fill="#6FB98F" opacity="0.9" transform="rotate(-6 146 14)"/>
      <rect x="152" y="22" width="42" height="30" rx="6" fill="#2E86AB" stroke="#FDF8EF" stroke-width="2"/>
      <path d="M164 37 h18 M164 43 h12" stroke="#FDF8EF" stroke-width="2" stroke-linecap="round"/>

      <!-- estrellita -->
      <path d="M198 58 l2.4 5 5.6.5 -4.2 3.7 1.3 5.5 -4.9-2.9 -4.9 2.9 1.3-5.5 -4.2-3.7 5.6-.5z" fill="#F4A259"/>
    </svg>

    <p class="tagline">Sube un video. Recibe el material listo para enseñar.</p>
    <p class="desc">
      Resúmenes, trivias y memoramas generados automáticamente a partir de tu clase —
      pensado para maestros, psicólogos y educadores.
    </p>

    <span class="pill"><span class="pill-dot"></span> Muy pronto</span>

    <footer>EnseñAI · ensenai.com</footer>
  </div>
</body>
</html>
