<!DOCTYPE html>
<html lang="es">
<head>

     iPhone y la barra de pestañas queda debajo de la rayita del home. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>EnseñAI — Mi grupo</title>

<style>
  :root {
    --profundo: #1E3A8A; --profundo-oscuro: #16296B; --cielo: #60A5FA;
    --menta: #34D399; --aqua: #7DD3FC; --bosque: #065F46;
    --hielo: #F0FDF4; --tinta: #1E3A8A; --linea: #DCEEFC;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: 'Nunito', sans-serif;
    background:
      radial-gradient(circle at 12% 8%, rgba(96,165,250,0.35) 0, transparent 30%),
      radial-gradient(circle at 90% 20%, rgba(125,211,252,0.32) 0, transparent 32%),
      var(--hielo);
    color: var(--tinta); min-height: 100vh;
  }
  header { background: var(--profundo); color: #fff; padding: 18px 24px; display: flex; align-items: center; justify-content: space-between; }
  header a { color: inherit; text-decoration: none; display: flex; align-items: center; gap: 10px; }
  header .marca { font-family: 'Grandstander', sans-serif; font-weight: 700; font-size: 1.4rem; }
  header .marca .ai {
    display: inline-block; color: var(--aqua); background: rgba(255,255,255,0.14);
    padding: 1px 10px; border-radius: 999px; font-size: 0.75em; vertical-align: middle;
  }
  #btnSalir { background: none; border: 1px solid rgba(255,255,255,0.4); color: #fff; padding: 7px 14px; border-radius: 999px; font-size: 0.85rem; cursor: pointer; }
  main { max-width: 680px; margin: 0 auto; padding: 32px 20px 80px; }
  .tarjeta { background: #fff; border: 2px solid var(--linea); border-radius: 18px; padding: 22px; margin-bottom: 18px; box-shadow: 0 3px 0 var(--linea); }
  h1 { font-family: 'Grandstander', sans-serif; font-size: 1.4rem; margin: 0 0 6px; }
  h2 { font-family: 'Grandstander', sans-serif; font-size: 1.15rem; margin: 0 0 4px; }
  h3 { font-family: 'Grandstander', sans-serif; color: var(--bosque); font-size: 1rem; margin: 16px 0 8px; }
  p.ayuda { color: #4A6A85; margin: 0 0 16px; }
  label { display: block; font-weight: 700; font-size: 0.9rem; margin: 14px 0 6px; }
  input, select, textarea { width: 100%; padding: 12px 14px; border: 2px solid var(--linea); border-radius: 12px; font-family: inherit; font-size: 1rem; }
  textarea { resize: vertical; min-height: 70px; }
  .zona-espera { padding: 18px 4px 6px; text-align: center; }
  .espera-barra { height: 5px; border-radius: 999px; background: var(--linea); overflow: hidden; margin-bottom: 14px; }
  .espera-barra span {
    display: block; height: 100%; width: 38%; border-radius: 999px;
    background: linear-gradient(90deg, var(--cielo), var(--menta));
    animation: espera-desliza 1.5s ease-in-out infinite;
  }
  @keyframes espera-desliza { 0% { transform: translateX(-100%); } 100% { transform: translateX(265%); } }
  .espera-titulo { color: #4A6A85; font-size: 0.92rem; margin: 0 0 14px; }
  .tip-caja {
    display: flex; gap: 12px; text-align: left; align-items: flex-start;
    background: var(--hielo); border: 2px dashed var(--menta); border-radius: 14px; padding: 14px 16px;
    animation: tip-aparece .45s ease;
  }
  @keyframes tip-aparece { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .tip-icono { font-size: 1.15rem; line-height: 1.4; flex-shrink: 0; }
  .tip-texto { margin: 0; font-size: 0.92rem; line-height: 1.5; color: var(--bosque); }
  .tip-puntos { display: flex; gap: 5px; justify-content: center; margin-top: 12px; }
  .tip-puntos span { width: 6px; height: 6px; border-radius: 50%; background: var(--linea); transition: background .3s; }
  .tip-puntos span.activo { background: var(--menta); }
  .btn-seguir-navegando {
    background: none; border: none; color: #5b7d99; font-family: inherit; font-weight: 700;
    font-size: 0.83rem; text-decoration: underline; cursor: pointer; margin-top: 14px;
  }
  /* Aviso flotante de "se esta generando en segundo plano" (1-sep-2026):
     generar material de grupo tarda ~1 min y antes eso secuestraba la
     pantalla; peor aun, si en ese rato se re-dibujaba #contenido (crear otro
     grupo, agregar un tema), la generacion terminaba en el vacio. */
  .aviso-generacion {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 16px; z-index: 60;
    display: flex; align-items: center; gap: 10px; max-width: calc(100% - 24px);
    background: #fff; border: 2px solid var(--aqua); border-radius: 999px; padding: 10px 14px;
    box-shadow: 0 6px 20px rgba(30,58,138,0.18);
    font-size: 0.86rem; font-weight: 700; color: var(--profundo);
  }
  .aviso-generacion.listo { border-color: var(--menta); }
  .aviso-generacion.falla { border-color: #FFC4B5; color: #B94A2E; }
  .aviso-generacion .texto { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .aviso-generacion button {
    flex-shrink: 0; border: none; border-radius: 999px; padding: 7px 14px; cursor: pointer;
    font-family: 'Grandstander', sans-serif; font-weight: 600; font-size: 0.82rem;
    background: var(--menta); color: #fff;
  }
  .aviso-generacion button.cerrar { background: none; color: #5b7d99; padding: 7px 4px; font-size: 1rem; }

  .zona-foto { border: 2px dashed var(--linea); border-radius: 12px; padding: 14px; text-align: center; }
  .zona-foto input[type="file"] { display: none; }
  .zona-foto .btn-foto {
    display: inline-block; background: var(--hielo); border: 2px solid var(--menta); color: var(--bosque);
    padding: 9px 18px; border-radius: 999px; font-weight: 700; font-size: 0.88rem; cursor: pointer;
  }
  .miniaturas { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; justify-content: center; }
  .miniatura { position: relative; width: 74px; height: 74px; border-radius: 10px; overflow: hidden; border: 2px solid var(--linea); }
  .miniatura img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .miniatura button {
    position: absolute; top: 2px; right: 2px; width: 20px; height: 20px; border-radius: 50%;
    background: rgba(0,0,0,0.62); color: #fff; border: none; font-size: 0.72rem; line-height: 1; cursor: pointer; padding: 0;
  }
  button.primario {
    background: var(--profundo); color: #fff; border: none; padding: 14px 20px; border-radius: 999px;
    font-family: 'Grandstander', sans-serif; font-weight: 600; font-size: 1rem; cursor: pointer; margin-top: 14px;
    box-shadow: 0 4px 0 var(--profundo-oscuro); width: 100%;
  }
  button.secundario { background: none; border: 2px solid var(--linea); color: var(--profundo); padding: 10px 16px; border-radius: 999px; font-weight: 700; font-size: 0.9rem; cursor: pointer; }
  button.chico { padding: 8px 14px; font-size: 0.85rem; margin-top: 0; width: auto; }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .error { background: #FFF0EC; border: 2px solid #FFC4B5; color: #B94A2E; padding: 12px 14px; border-radius: 12px; margin-top: 12px; font-size: 0.9rem; }
  /* Campo obligatorio vacio: el aviso va PEGADO al campo. El error suelto
     al pie del formulario no se relacionaba con nada en celular — ver
     marcarCampoFaltante(). */
  .campo-faltante { border-color: #E86A4B !important; background: #FFF6F3 !important; }
  .error-campo { color: #B94A2E; font-size: 0.85rem; font-weight: 700; margin: 4px 0 2px; }
  .aviso { background: var(--hielo); border: 2px dashed var(--menta); border-radius: 12px; padding: 12px 14px; font-size: 0.9rem; color: var(--bosque); margin-bottom: 16px; }
  .cargando { text-align: center; padding: 40px 20px; color: #4A6A85; }
  .grupo-item { border: 2px solid var(--linea); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  .grupo-item .nombre { font-family: 'Grandstander', sans-serif; font-weight: 700; font-size: 1.05rem; margin-bottom: 4px; }
  .metricas { display: flex; gap: 16px; margin: 10px 0; flex-wrap: wrap; }
  .metrica { background: var(--hielo); border-radius: 10px; padding: 8px 14px; text-align: center; }
  .metrica .num { font-family: 'Grandstander', sans-serif; font-weight: 700; color: var(--profundo); font-size: 1.2rem; }
  .metrica .label { font-size: 0.72rem; color: #4A6A85; text-transform: uppercase; letter-spacing: 0.02em; }
  /* Panel del maestro en dos niveles (2-sep-2026) */
  .tarjeta-grupo .cabeza-grupo { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .tarjeta-grupo .metricas-chicas { font-size: 0.78rem; color: #4A6A85; font-weight: 700; white-space: nowrap; }
  .viendo-ahora { background: var(--hielo); border-radius: 14px; padding: 12px 14px; margin-top: 12px; }
  .viendo-ahora.vacio { background: none; border: 2px dashed var(--linea); }
  .viendo-ahora .etiqueta-mini { margin: 0; font-size: 0.7rem; color: #4A6A85; font-weight: 800; letter-spacing: 0.03em; }
  .viendo-ahora .titulo-vigente { margin: 4px 0 0; font-weight: 800; font-size: 0.92rem; }
  .chip-bajos { background: #FFF0EC; border: 1px solid #FFC4B5; color: #B94A2E; font-family: inherit; font-weight: 800; font-size: 0.76rem; border-radius: 999px; padding: 2px 10px; cursor: pointer; }
  .fila-bajo { display: flex; justify-content: space-between; gap: 10px; padding: 5px 0; border-top: 1px dashed var(--linea); font-size: 0.82rem; }
  .fila-alumno { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 0; border-top: 1px dashed var(--linea); }
  .fila-alumno:first-child { border-top: 0; }
  .fila-alumno .quien { min-width: 0; }
  .fila-alumno .nombre-alumno { font-weight: 800; font-size: 0.9rem; }
  .chip-racha { flex-shrink: 0; background: var(--hielo); color: var(--bosque); border-radius: 999px; padding: 4px 12px; font-weight: 800; font-size: 0.85rem; }
  .chip-racha.apagada { background: #F2F5F8; color: #7B93A8; }
  .acciones-grupo { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
  .acciones-grupo button { width: 100%; margin-top: 0; }
  .liga-box { display: flex; gap: 8px; align-items: center; background: var(--hielo); border-radius: 10px; padding: 8px 12px; margin: 10px 0; }
  .liga-box input { border: none; background: none; padding: 4px; font-size: 0.9rem; flex: 1; color: var(--bosque); font-weight: 700; }
  .tema-item { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; padding: 10px 0; border-top: 1px dashed var(--linea); gap: 10px; }
  .tema-item:first-child { border-top: none; }
  .tema-item .titulo { font-weight: 700; flex: 1; }
  .tema-item .seleccionar { width: 18px; height: 18px; flex-shrink: 0; accent-color: var(--menta); cursor: pointer; }
  .hint-combinar { color: #4A6A85; font-size: 0.85rem; margin: -6px 0 10px; }
  .barra-combinar { display: flex; flex-direction: column; gap: 10px; background: var(--hielo); border: 2px solid var(--aqua); border-radius: 12px; padding: 10px 14px; margin-bottom: 12px; font-weight: 700; font-size: 0.9rem; }
  .barra-combinar .fila-principal { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .barra-combinar .acciones { display: flex; gap: 8px; }
  .toggle-modo-examen { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 0.85rem; color: var(--profundo); cursor: pointer; }
  .toggle-modo-examen input { width: 17px; height: 17px; accent-color: #F97066; cursor: pointer; }
  .estado {
    font-size: 0.72rem; font-weight: 700; padding: 3px 10px; border-radius: 999px; text-transform: uppercase; letter-spacing: 0.02em;
    white-space: nowrap;
  }
  .estado.pagado, .estado.gratis_prueba, .estado.cubierto_suscripcion { background: var(--hielo); color: var(--bosque); }
  .estado.pendiente { background: #FFF3E0; color: #B36B00; }
  .toggle-row { display: flex; align-items: center; gap: 10px; margin: 14px 0; }
  .toggle-row input { width: auto; }
  .divisor { border: none; border-top: 1px dashed var(--linea); margin: 18px 0; }
  .editor-trivia { background: var(--hielo); border-radius: 14px; padding: 14px; margin: 12px 0; }
  .pregunta-editable { background: #fff; border: 2px solid var(--linea); border-radius: 12px; padding: 12px; margin-bottom: 10px; }
  .pregunta-editable:last-of-type { margin-bottom: 0; }
  .pregunta-editable .fila-top { display: flex; gap: 8px; align-items: flex-start; }
  .pregunta-editable textarea { flex: 1; min-height: 44px; font-size: 0.92rem; }
  .fila-opcion { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .fila-opcion input[type="radio"] { width: auto; flex-shrink: 0; }
  .fila-opcion input[type="text"] { padding: 8px 10px; font-size: 0.9rem; }
  .fila-opcion.correcta input[type="text"] { border-color: var(--menta); }
  /* ── Editor completo del material (2-sep-2026) ─────────────────────────
     Antes el maestro solo veia (y editaba) la trivia: el resumen, el
     diagrama, la actividad, los ejercicios y el material de repaso se
     compartian a ciegas. Ahora se ve y se edita todo antes de mandarlo. */
  .bloque-editor { background: var(--hielo); border-radius: 14px; padding: 4px 14px 14px; margin: 12px 0; }
  .bloque-editor > summary {
    cursor: pointer; list-style: none; padding: 12px 0 10px; font-weight: 800; font-size: 0.92rem;
    color: var(--profundo); display: flex; align-items: center; gap: 8px;
  }
  .bloque-editor > summary::-webkit-details-marker { display: none; }
  .bloque-editor > summary::after { content: "▾"; margin-left: auto; color: #7FA3C0; font-size: 0.85rem; }
  .bloque-editor[open] > summary::after { content: "▴"; }
  .bloque-editor .campo { background: #fff; border: 2px solid var(--linea); border-radius: 12px; padding: 12px; margin-bottom: 10px; }
  .bloque-editor .campo:last-child { margin-bottom: 0; }
  .bloque-editor label.et { display: block; font-size: 0.75rem; font-weight: 800; color: #4A6A85; margin: 0 0 4px; text-transform: uppercase; letter-spacing: 0.02em; }
  .bloque-editor textarea { width: 100%; min-height: 62px; font-size: 0.92rem; font-family: inherit; }
  .bloque-editor input[type="text"] { width: 100%; padding: 8px 10px; font-size: 0.9rem; font-family: inherit; }
  .bloque-editor .fila-borrable { display: flex; gap: 8px; align-items: flex-start; }
  .bloque-editor .fila-borrable > *:first-child { flex: 1; min-width: 0; }
  .bloque-editor .btn-mini { flex: 0 0 auto; margin: 0; padding: 6px 10px; font-size: 0.8rem; }
  .bloque-editor .agregar { width: 100%; margin-top: 8px; }
  .bloque-editor .vista-diagrama { background: #fff; border-radius: 12px; padding: 2px 12px 12px; }
  .bloque-editor .nota { font-size: 0.8rem; color: #4A6A85; margin: 0 0 8px; }
  .par-tarjeta { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; align-items: start; margin-bottom: 8px; }
  /* Las plantillas traen sus propios estilos desde plantillas.js */
  @media (max-width: 560px) { .par-tarjeta { grid-template-columns: 1fr auto; } }
</style>
</head>

<!-- Intro "qué puedes hacer aquí" — compartida con tema.html (ver intro.js).
     Va antes del script de la página porque este llama a window.introHTML(). -->
<script src="diagrama.js"></script>

<script>
  const API_BASE = "https://ensenai-backend.onrender.com";
  const SUPABASE_URL = "https://azslvqfgeghhzghfxmdh.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF6c2x2cWZnZWdoaHpnaGZ4bWRoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzOTUzMzksImV4cCI6MjEwMTk3MTMzOX0.zd22nrf9OUrg0h2YnGJJt9mkKzoFERM54F4S48r-xEQ";
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const NIVELES = [
    { value: "primaria_baja", label: "Primaria baja (6-8 años)" },
    { value: "primaria_alta", label: "Primaria alta (9-12 años)" },
    { value: "secundaria", label: "Secundaria (12-15 años)" },
    { value: "preparatoria", label: "Preparatoria (15-18 años)" },
    { value: "universidad", label: "Universidad / autodidacta (18+)" },
  ];

  let sesionActual = null;
  // Contenido recién generado por grupo, editable antes de compartirlo con
  // la liga (el profesional puede ajustar la trivia). Se mutan aquí en vez
  // de en `data.contenido` directamente para poder re-renderizar el editor
  // sin perder el resto del material (resumen, actividades, etc.).
  const contenidoEnEdicion = {};

  // Ids de temas ya activos en la liga marcados para juntar en un repaso de
  // examen (ver combinarTemasGrupo() más abajo), por grupo — un profesional
  // puede tener varios grupos abiertos en la misma pantalla.
  const temasSeleccionadosPorGrupo = {};
  const MAX_TEMAS_COMBINAR = 6;
  // Modo Examen (misma idea que en tema.html): puro simulador de práctica
  // (sin resumen, diagrama ni actividad — solo ejercicios y/o trivia, lo
  // que aplique según el tema) — pensado para armar una guía de examen que
  // el profesional comparte con su grupo. Admite más temas de golpe porque
  // no hay que releerlo, solo practicarlo.
  const MAX_TEMAS_COMBINAR_EXAMEN = 12;
  const modoExamenActivoPorGrupo = {};

  function escapeHtml(str) {
    const d = document.createElement("div");
    d.textContent = str || "";
    return d.innerHTML;
  }

  // Un fetch que nunca llegó al servidor (sin internet, backend caído,
  // CORS) lanza un TypeError genérico ("Failed to fetch" en Chrome, "Load
  // failed" en Safari) — no tiene sentido mostrárselo tal cual al usuario.
  /**
   * Marca un campo obligatorio vacio: lo pinta, escribe el motivo justo
   * debajo, lo desplaza a la vista y le pone el cursor dentro.
   *
   * Existe porque la validacion pintaba el error al FINAL del formulario,
   * a media pantalla del campo culpable: en celular se leia "escribe sobre
   * que tema quieres generar material" sin ver que el campo Tema estaba
   * vacio, y la gente terminaba escribiendo el tema en Etiquetas
   * (reporte sep-2026).
   */
  function marcarCampoFaltante(campo, mensaje) {
    if (!campo) return;
    limpiarCampoFaltante(campo);
    campo.classList.add("campo-faltante");
    const aviso = document.createElement("p");
    aviso.className = "error-campo";
    aviso.id = `error-campo-${campo.id}`;
    aviso.textContent = `⚠️ ${mensaje}`;
    campo.insertAdjacentElement("afterend", aviso);
    campo.setAttribute("aria-invalid", "true");
    campo.scrollIntoView({ behavior: "smooth", block: "center" });
    // El foco va despues del scroll: enfocar primero hace que el navegador
    // salte de golpe y se pierda el desplazamiento suave.
    setTimeout(() => campo.focus({ preventScroll: true }), 300);
    campo.addEventListener("input", () => limpiarCampoFaltante(campo), { once: true });
  }

  function limpiarCampoFaltante(campo) {
    if (!campo) return;
    campo.classList.remove("campo-faltante");
    campo.removeAttribute("aria-invalid");
    document.getElementById(`error-campo-${campo.id}`)?.remove();
  }

  function mensajeErrorAmigable(err) {
    return err instanceof TypeError
      ? "No pudimos conectar con el servidor. Revisa tu internet e intenta de nuevo."
      : err.message;
  }

  // El backend (Render, plan gratuito) se "duerme" tras un rato sin uso y
  // tarda 30-60s en despertar con la primera petición — esa primera
  // petición puede fallar con un "Failed to fetch" genérico. Este helper
  // avisa con un mensaje amigable y reintenta una vez antes de rendirse.
  // Rutas que CREAN algo caro (gastan cupo del plan y minutos de modelo).
  // Nunca se reintentan solas: si el primer intento ya llegó al servidor,
  // un reintento genera el material DOS veces.
  const RUTAS_QUE_NO_SE_REINTENTAN = [
    "/api/temas/generar", "/api/temas/combinar", "/api/temas/revisar",
    // El PDF también cuesta (llama a la IA y sube a Storage) y adaptar por
    // inteligencia genera 8 actividades con el modelo.
    "/api/temas/pdf", "/actividades",
  ];
  // Agregar un tema a la liga (POST /api/grupos/<id>/temas) consume cupo del
  // plan y crea la fila: reintentarlo a ciegas dejaba el tema DUPLICADO en el
  // grupo. Se detecta aparte porque la ruta lleva el id del grupo en medio.
  const esAgregarTemaALiga = (url) => /\/api\/grupos\/[^/]+\/temas(\?|$)/.test(url);
  // Un fetch que truena casi de inmediato es "nunca salió" (servidor
  // dormido, sin internet); uno que truena después de un rato pudo haber
  // llegado y seguir procesándose del otro lado.
  const MS_FALLO_INMEDIATO = 3000;

  async function fetchConReintento(url, opciones, cont, mensajeEspera) {
    const metodo = (opciones?.method || "GET").toUpperCase();
    const esIdempotente = metodo === "GET" || metodo === "HEAD";
    const esCara = RUTAS_QUE_NO_SE_REINTENTAN.some((r) => url.includes(r)) || esAgregarTemaALiga(url);
    const t0 = Date.now();

    try {
      return await fetch(url, opciones);
    } catch (err) {
      const tardo = Date.now() - t0;

      // Peticiones que escriben: reintentar a ciegas es lo que producía
      // material duplicado y cupo gastado doble (31-ago-2026). Solo se
      // reintenta lo que es seguro reintentar.
      if (!esIdempotente && (esCara || tardo >= MS_FALLO_INMEDIATO)) {
        throw new Error(
          tardo >= MS_FALLO_INMEDIATO
            ? "Se perdió la conexión, pero es posible que el material SÍ se haya generado del otro lado. Revisa si ya aparece en tu lista antes de volver a intentar, para no generarlo dos veces."
            : "No pudimos conectar con el servidor. Vuelve a intentarlo."
        );
      }

      if (cont) {
        cont.innerHTML = `<div class="cargando">${mensajeEspera || "Despertando el servidor… puede tardar hasta un minuto la primera vez, ya casi."}</div>`;
      }
      await new Promise((r) => setTimeout(r, 4000));
      try {
        return await fetch(url, opciones);
      } catch (err2) {
        throw new Error("El servidor está tardando en responder. Espera unos segundos y vuelve a intentarlo.");
      }
    }
  }

  async function init() {
    const { data } = await supabaseClient.auth.getSession();
    if (!data.session) {
      window.location.href = "comprador.html?despues=grupo";
      return;
    }
    sesionActual = data.session;

    document.getElementById("btnSalir").onclick = async () => {
      await supabaseClient.auth.signOut();
      window.location.href = "comprador.html";
    };

    const qp = new URLSearchParams(window.location.search);
    let avisoInicial = null;
    if (qp.get("tema_grupo") === "activado") {
      avisoInicial = "✓ ¡Pago recibido! Tu tema ya está activo en la liga de tu grupo.";
    } else if (qp.get("suscripcion") === "exitosa") {
      avisoInicial = "✓ ¡Suscripción de grupo activada! Los temas que agregues quedan cubiertos automáticamente.";

  async function cargarGrupos(avisoInicial) {
    const cont = document.getElementById("contenido");
    try {
      const res = await fetchConReintento(`${API_BASE}/api/grupos/mios`, {
        headers: { Authorization: `Bearer ${sesionActual.access_token}` },
      }, cont);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "No se pudieron cargar tus grupos.");

      renderGrupos(data.grupos || [], avisoInicial);
    } catch (err) {
      cont.innerHTML = `<div class="tarjeta"><div class="error">${escapeHtml(mensajeErrorAmigable(err))}</div></div>`;
    }
  }

  /**
   * El panel del maestro pasó de UNA pantallota a dos niveles (2-sep-2026,
   * pedido de la usuaria: "que no se vea como una pantalla con muchísima
   * info"). Antes cada grupo traía, siempre abierto, sus métricas, su liga,
   * el formulario completo de generar y su lista de temas: con tres grupos
   * era imposible encontrar nada.
   *
   *   renderListaGrupos  → una tarjeta corta por grupo: qué está viendo,
   *                        cuántos van, su liga y dos botones.
   *   renderGrupoDetalle → el grupo abierto, con todo el detalle de antes.
   *
   * Cuál se pinta lo decide grupoAbiertoId, que se conserva entre
   * re-dibujos: cargarGrupos() se llama desde muchos lados (crear grupo,
   * agregar tema, pagar) y el maestro no debe salir del grupo que está
   * viendo por eso.
   */
  let gruposCache = [];
  let grupoAbiertoId = null;
  const resumenTemaCache = {};

  function renderGrupos(grupos, avisoInicial) {
    gruposCache = grupos;
    const abierto = grupoAbiertoId ? grupos.find((g) => g.id === grupoAbiertoId) : null;
    if (grupoAbiertoId && !abierto) grupoAbiertoId = null; // se borró o cambió de cuenta
    if (abierto) renderGrupoDetalle(abierto, avisoInicial);
    else renderListaGrupos(grupos, avisoInicial);
  }

  function abrirGrupo(id, anclaje) {
    grupoAbiertoId = id;
    const g = gruposCache.find((x) => x.id === id);
    if (!g) return cargarGrupos();
    renderGrupoDetalle(g);
    if (anclaje === "generar") {
      setTimeout(() => document.getElementById(`zona-generar-${id}`)?.scrollIntoView({ behavior: "smooth", block: "start" }), 60);
    }
  }

  function volverALista() {
    grupoAbiertoId = null;
    renderListaGrupos(gruposCache);
  }

  /** El tema activo más reciente de un grupo — es el que el maestro tiene
   * "en el aire" y lo único que necesita ver desde la lista. */
  function temaVigente(g) {
    const activos = (g.temas || []).filter((t) => t.pago_status !== "pendiente");
    return activos.length ? activos[activos.length - 1] : null;

  /**
   * Plantillas de la biblioteca (2-sep-2026, junto con admin.html): archivos
   * que la usuaria sube a mano y el maestro descarga tal cual — formatos,
   * fichas, planeaciones. No pasan por la IA ni dependen de un tema.

   * mientras la biblioteca esté vacía (o no se haya corrido schema_v38), el
   * maestro no ve un recuadro vacío.
   */
  /**

   * grupos, el formulario de crear y la biblioteca entera, una tras otra.

  let vistaGrupo = "grupos";

  function pintarVistaGrupo() {
    ["grupos", "hojas", "plan"].forEach((v) => {

   * Biblioteca de plantillas: la pinta plantillas.js, compartido con
   * tema.html (4-sep-2026). Aquí solo queda el enganche — dónde se pinta,

   *
   * El catálogo completo es del plan Ilimitado; a los demás el módulo les
   * pinta la invitación con el conteo real de hojas (quién ve qué lo
   * decide el servidor, ver routes/recursos.js).
   */
  async function cargarPlantillas() {
    const tarjeta = document.getElementById("tarjeta-plantillas");
    const cont = document.getElementById("lista-plantillas");
    if (!tarjeta || !cont || !window.EnsenaiPlantillas || !sesionActual) return;

    await window.EnsenaiPlantillas.biblioteca({
      cont,
      API_BASE,

        vistaGrupo = "plan";
        pintarVistaGrupo();
        window.EnsenaiTabs?.marcar("plan");
      },
    });

    // El módulo marca el contenedor cuando sí pintó algo; si no, la tarjeta
    // se queda escondida en vez de dejar un recuadro vacío.

      const cuenta = document.getElementById("cuenta-plantillas");
      if (cuenta && cont.dataset.plTotal) cuenta.textContent = `· ${cont.dataset.plTotal}`;
      tarjeta.style.display = "block";
      window.EnsenaiTabs?.globo("hojas", cont.dataset.plTotal || "");

      // La pestaña "Hojas" siempre existe: no puede quedarse en blanco.

        <h2>📄 Imprimibles</h2>

  /**
   * "19 de 28 contestaron · promedio 74% · 3 abajo del 50%". Los nombres NO
   * se muestran de entrada (decisión de la usuaria: "al seleccionar se
   * muestra la lista desplegable"): el conteo es un botón que despliega
   * quiénes son. Una sola petición por grupo, y solo del tema vigente.
   */
  async function pintarResumenVigente(g) {
    const cont = document.getElementById(`resumen-${g.id}`);
    const vigente = temaVigente(g);
    if (!cont || !vigente) return;

    try {
      const resumen = await resumenDeTema(g.id, vigente.id);
      if (!document.body.contains(cont)) return; // cambió de pantalla mientras cargaba

      if (!resumen.contestaron) {
        cont.textContent = "Todavía nadie contesta la trivia de este tema.";
        return;
      }
      cont.innerHTML = `
        ${resumen.contestaron} contestaron${resumen.promedio !== null ? ` · promedio ${resumen.promedio}%` : ""}
        ${
          resumen.bajos.length
            ? ` · <button type="button" class="chip-bajos" data-ver-bajos="${vigente.id}">${resumen.bajos.length} abajo del 50% ▾</button>`
            : ""
        }
        <div id="bajos-${vigente.id}" style="display:none; margin-top:8px;"></div>`;

      cont.querySelector("[data-ver-bajos]")?.addEventListener("click", () => alternarBajos(g.id, vigente.id));
    } catch (err) {
      cont.textContent = "No se pudo leer cómo van (revisa tu conexión).";
    }
  }

  /** Trae y resume las respuestas de un tema. Se cachea por tema: el maestro
   * entra y sale de sus grupos todo el tiempo. */
  async function resumenDeTema(grupoId, temaId) {
    if (resumenTemaCache[temaId]) return resumenTemaCache[temaId];

    const res = await fetchConReintento(`${API_BASE}/api/grupos/${grupoId}/temas/${temaId}/respuestas`, {
      headers: { Authorization: `Bearer ${sesionActual.access_token}` },
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "No se pudieron leer las respuestas.");

    const respuestas = data.respuestas || [];
    const conPuntaje = respuestas.filter((r) => r.total_cerradas > 0);
    const porcentaje = (r) => Math.round((r.aciertos / r.total_cerradas) * 100);
    const resumen = {
      contestaron: respuestas.length,
      promedio: conPuntaje.length ? Math.round(conPuntaje.reduce((s, r) => s + porcentaje(r), 0) / conPuntaje.length) : null,
      bajos: conPuntaje
        .filter((r) => porcentaje(r) < 50)
        .map((r, i) => ({ nombre: r.nombre || `Anónimo ${i + 1}`, porcentaje: porcentaje(r) })),
    };
    resumenTemaCache[temaId] = resumen;
    return resumen;
  }

  function alternarBajos(grupoId, temaId) {
    const caja = document.getElementById(`bajos-${temaId}`);
    if (!caja) return;
    const abierta = caja.style.display === "block";
    caja.style.display = abierta ? "none" : "block";
    const btn = document.querySelector(`[data-ver-bajos="${temaId}"]`);
    const resumen = resumenTemaCache[temaId];
    if (btn && resumen) btn.textContent = `${resumen.bajos.length} abajo del 50% ${abierta ? "▾" : "▴"}`;
    if (abierta || !resumen) return;

    caja.innerHTML = resumen.bajos
      .map(
        (a) => `<div class="fila-bajo"><span>${escapeHtml(a.nombre)}</span><strong>${a.porcentaje}%</strong></div>`
      )
      .join("");
  }

  /**
   * "Que los alumnos la sigan y el maestro pueda revisarla" (2-sep-2026).
   * Lista de quién está siguiendo el material del grupo, ordenada por racha.
   * En grupos anónimos no hay nombres — se numeran, que es justo lo que
   * necesita quien atiende pacientes: ver constancia, no identificar.
   */
  async function cargarAlumnos(grupoId) {
    const cont = document.getElementById(`alumnos-${grupoId}`);
    if (!cont) return;
    try {
      const res = await fetchConReintento(`${API_BASE}/api/grupos/${grupoId}/alumnos`, {
        headers: { Authorization: `Bearer ${sesionActual.access_token}` },
      }, cont);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "No se pudo cargar el avance de tu grupo.");

      const alumnos = data.alumnos || [];
      if (!alumnos.length) {
        cont.innerHTML = `<p class="ayuda" style="margin:0;">Todavía nadie contesta una trivia ni marca ejercicios. En cuanto lo hagan, aquí verás quién le está siguiendo.</p>`;
        return;
      }

      const hoy = new Date().toISOString().slice(0, 10);
      const ayer = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
      const cuando = (d) => (d === hoy ? "hoy" : d === ayer ? "ayer" : d ? new Date(`${d}T12:00:00Z`).toLocaleDateString("es-MX") : "—");

      let anonimos = 0;
      cont.innerHTML = alumnos
        .map((a) => {
          const quien = a.nombre ? escapeHtml(a.nombre) : `Anónimo ${++anonimos}`;
          // Una racha viva (movida hoy o ayer) se ve en color; una que ya se
          // rompió se deja apagada, para que el maestro distinga de un
          // vistazo quién sigue enganchado y quién se quedó atrás.
          const viva = a.ultimo_dia === hoy || a.ultimo_dia === ayer;
          return `
            <div class="fila-alumno">
              <div class="quien">
                <div class="nombre-alumno">${quien}</div>
                <div class="ayuda" style="font-size:0.76rem;">${a.dias_activos} día${a.dias_activos === 1 ? "" : "s"} en total · última vez ${cuando(a.ultimo_dia)}</div>
              </div>
              <span class="chip-racha${viva ? "" : " apagada"}">🔥 ${a.racha_actual}</span>
            </div>`;
        })
        .join("");
    } catch (err) {
      cont.innerHTML = `<p class="ayuda" style="margin:0;">No se pudo cargar el avance de tu grupo ahorita.</p>`;
    }
  }

  const NOMBRES_NIVEL_GRUPO = { gratis: "Gratis", aprendemos: "Esencial", ilimitado: "Ilimitado" };

  async function cargarSuscripcionGrupo() {
    const cont = document.getElementById("zona-suscripcion-grupo");
    if (!cont) return;
    try {
      const res = await fetchConReintento(
        `${API_BASE}/api/grupos/mi-plan`,
        { headers: { Authorization: `Bearer ${sesionActual.access_token}` } },
        cont,
        "Cargando tu plan…"
      );
      const plan = await res.json();
      if (!res.ok) throw new Error(plan.error || "No se pudo cargar tu plan.");

      const usoTexto =
        plan.limite_temas_mes === null
          ? `${plan.temas_usados_este_mes} temas-grupo cubiertos este mes — sin límite`
          : `${plan.temas_usados_este_mes} de ${plan.limite_temas_mes} temas-grupo cubiertos este mes`;

      cont.innerHTML = `
        <p class="ayuda" style="margin:0 0 4px;"><strong>Plan ${NOMBRES_NIVEL_GRUPO[plan.nivel] || plan.nivel}</strong>${plan.precio_mxn ? ` — $${Number(plan.precio_mxn).toFixed(2)} MXN` : ""}</p>
        <p class="ayuda" style="margin:0 0 4px; font-size:0.85rem;">${escapeHtml(usoTexto)}</p>
        <p class="ayuda" style="margin:0; font-size:0.85rem;">${plan.grupos_actuales} de ${plan.limite_grupos} grupo(s) creados.</p>
        <div id="zona-botones-plan-grupo"></div>
      `;
      pintarBotonesPlanGrupo(plan);
    } catch (err) {
      cont.innerHTML = `<div class="error">No se pudo cargar tu plan.</div>`;
    }
  }

  /**
   * Botones de plan con selector mensual/anual (3-sep-2026, schema_v39).
   * Igual que en comprador.html: los montos reales viven en
   * platform_settings y los cobra el backend; esto es solo la etiqueta.
   */
  const PRECIOS_GRUPO = {
    aprendemos: { mensual: 89, anual: 890 },
    ilimitado: { mensual: 129, anual: 1290 },
  };
  let periodoElegidoGrupo = "mensual";

  function pintarBotonesPlanGrupo(plan) {
    const zona = document.getElementById("zona-botones-plan-grupo");
    if (!zona) return;
    if (plan.nivel === "ilimitado") {
      zona.innerHTML = "";
      return;
    }

    const anual = periodoElegidoGrupo === "anual";
    const etiqueta = (nivel) =>
      anual
        ? `$${PRECIOS_GRUPO[nivel].anual.toLocaleString("es-MX")}/año`
        : `$${PRECIOS_GRUPO[nivel].mensual}/mes`;

    let html = `
      <div style="display:flex; gap:6px; margin-top:12px;">
        <button type="button" class="${anual ? "secundario" : "primario"} chico" data-periodo="mensual" style="flex:1; width:auto;">Mensual</button>
        <button type="button" class="${anual ? "primario" : "secundario"} chico" data-periodo="anual" style="flex:1; width:auto;">Anual · 2 meses gratis</button>
      </div>
      <button class="primario" style="margin-top:10px;" id="btn-ilimitado-grupo">Pasar a Ilimitado — ${etiqueta("ilimitado")}</button>`;
    if (plan.nivel === "gratis") {
      html += `<button class="secundario" style="width:100%; margin-top:6px;" id="btn-aprendemos-grupo">Pasar a Esencial — ${etiqueta("aprendemos")} (20 temas-grupo, 3 grupos)</button>`;
    }
    html += `<p class="ayuda" style="margin:6px 0 0; font-size:0.8rem;">🎉 Precio de fundador: se te queda mientras no canceles, aunque suba después.</p>`;
    zona.innerHTML = html;

    zona.querySelectorAll("[data-periodo]").forEach((b) =>
      b.addEventListener("click", () => {
        periodoElegidoGrupo = b.dataset.periodo;
        pintarBotonesPlanGrupo(plan);
      })
    );
    const btnIli = document.getElementById("btn-ilimitado-grupo");
    if (btnIli) btnIli.addEventListener("click", () => suscribirGrupo("ilimitado", periodoElegidoGrupo));
    const btnEse = document.getElementById("btn-aprendemos-grupo");
    if (btnEse) btnEse.addEventListener("click", () => suscribirGrupo("aprendemos", periodoElegidoGrupo));
  }

  async function suscribirGrupo(nivel, periodo = "mensual") {
    const cont = document.getElementById("zona-suscripcion-grupo");
    cont.innerHTML = `<div class="cargando">Redirigiendo a pago seguro…</div>`;
    try {
      const res = await fetchConReintento(
        `${API_BASE}/api/purchases/checkout-suscripcion`,
        {
          method: "POST",
          headers: { "Content-Type": "application/json", Authorization: `Bearer ${sesionActual.access_token}` },
          body: JSON.stringify({ tipo: "grupo", nivel, periodo }),
        },
        cont,
        "Preparando tu pago… (si el servidor estaba dormido, puede tardar unos segundos)"
      );
      const data = await res.json();
      if (!data.checkout_url) throw new Error(data.error || "No se pudo iniciar el pago.");
      window.location.href = data.checkout_url;
    } catch (err) {
      cont.innerHTML = `
        <div class="error">${escapeHtml(mensajeErrorAmigable(err))}</div>
        <button class="secundario" style="width:100%;" onclick="suscribirGrupo('${nivel}', '${periodo}')">Reintentar</button>
      `;
    }
  }

  function copiarLiga(grupoId) {
    const input = document.getElementById(`liga-${grupoId}`);
    input.select();
    navigator.clipboard?.writeText(input.value);
  }

  async function crearGrupo() {
    const nombre = document.getElementById("nombre-grupo-nuevo").value.trim();
    const mostrarNombres = document.getElementById("mostrar-nombres-nuevo").checked;
    const resultado = document.getElementById("resultado-crear-grupo");
    resultado.innerHTML = "";

    if (!nombre) {
      resultado.innerHTML = `<div class="error">Escribe un nombre para tu grupo.</div>`;
      return;
    }

    try {
      const res = await fetchConReintento(`${API_BASE}/api/grupos`, {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: `Bearer ${sesionActual.access_token}` },
        body: JSON.stringify({ nombre, mostrarNombres }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "No se pudo crear el grupo.");

      grupoAbiertoId = null; // el grupo nuevo se ve en la lista, con los demás
      cargarGrupos();
    } catch (err) {
      resultado.innerHTML = `<div class="error">${escapeHtml(mensajeErrorAmigable(err))}</div>`;
    }
  }

  // ── Fotos de temario/apuntes ────────────────────────────────────────────
  // Mismo mecanismo que en tema.html: las fotos de celular pesan varios MB
  // y viajan como base64 dentro del JSON, así que se reducen a 1400px de
  // lado y se recomprimen como JPEG antes de subirlas. Aquí se guardan por
  // grupo, porque en esta pantalla puede haber varias ligas abiertas a la vez.
  // Nombres legibles de las inteligencias, para "Adaptar por inteligencia"
  // (grupo.html no las necesitaba antes: las 8 solo se veían en g.html).
  const ETIQUETAS_INTELIGENCIA = {
    linguistica: "Lingüística", logico_matematica: "Lógico-matemática", espacial: "Espacial",
    musical: "Musical", kinestesica: "Corporal-kinestésica", interpersonal: "Interpersonal",
    intrapersonal: "Intrapersonal", naturalista: "Naturalista",
  };

  const MAX_FOTOS = 3;
  const LADO_MAX = 1400;
  const fotosPorGrupo = {};

  // ── Tips mientras se genera ─────────────────────────────────────────────
  // En modo grupo la generación tarda (es el material más completo que
  // produce el sistema). Estos consejos están escritos para quien da clase o
  // acompaña, no para un papá — y varios explican POR QUÉ el material viene
  // como viene, que es la duda más común de un profesional que lo estrena.
  const TIPS_GRUPO = [
    "En un salón hay perfiles mezclados. Por eso la actividad viene diseñada para que le entre todo el grupo: se puede resolver hablando, escribiendo, dibujando o moviéndose.",
    "Si quieres una versión distinta para cada tipo de inteligencia, el botón \"Adaptar por inteligencia\" te genera las 8 sobre este mismo tema.",
    "Dar actividades distintas no es hacer diferencias: es darle a cada quien una puerta de entrada al mismo tema.",
    "Antes de compartir el material puedes editar la trivia — corregir, quitar o agregar preguntas propias.",
    "Repasar el mismo tema tres veces en días distintos fija mucho más que una sesión larga.",
    "Pedirles que expliquen el tema entre ellos es de las formas más rápidas de detectar quién no lo entendió.",
    "Releer apuntes se siente productivo pero engaña. Cerrar el cuaderno e intentar recordar es lo que funciona.",
    "El imprimible en PDF trae hoja de respuestas por separado, para que puedas repartir solo la parte del alumno.",
  ];

  const tipsIntervalos = {};
  // Espera viva por grupo. Se guarda aqui (y no solo en el DOM) porque
  // renderGrupos() reconstruye TODO #contenido: si la pantalla de espera
  // viviera solo en una referencia a un nodo, al re-dibujar quedaria
  // huerfana y la generacion terminaria en el vacio — cupo gastado y
  // material perdido. Ver restaurarEstadoDeGrupos().
  const esperasActivas = {};

  /**
   * Pinta la pantalla de espera dentro de #resultado-generar-<grupoId>.
   * Dos decisiones que importan:
   *  - el contenedor se resuelve por id en cada tick, nunca por una
   *    referencia capturada, para que sobreviva a un re-dibujo;
   *  - se pinta UNA vez y despues solo se actualiza textContent — repintar
   *    el innerHTML cada 6s se comia los clics en "Seguir navegando"
   *    (el mismo problema que ya se corrigio en tema.html).
   */
  function iniciarTips(grupoId, encabezado, accion) {
    detenerTips(grupoId);
    let i = 0;

    const pintarBase = () => {
      const cont = document.getElementById(`resultado-generar-${grupoId}`);
      if (!cont) return null;
      cont.innerHTML = `
        <div class="zona-espera">
          <div class="espera-barra"><span></span></div>
          <p class="espera-titulo"></p>
          <div class="tip-caja">
            <span class="tip-icono">💡</span>
            <p class="tip-texto"></p>
          </div>
          <div class="tip-puntos">${TIPS_GRUPO.slice(0, 6).map(() => `<span></span>`).join("")}</div>
          ${accion ? `<button type="button" class="btn-seguir-navegando">${escapeHtml(accion.texto)}</button>` : ""}
        </div>`;
      const zona = cont.querySelector(".zona-espera");
      if (accion) zona.querySelector(".btn-seguir-navegando").addEventListener("click", accion.onClick);
      return zona;
    };

    const actualizar = () => {
      if (esperasActivas[grupoId] && esperasActivas[grupoId].minimizada) return;
      const cont = document.getElementById(`resultado-generar-${grupoId}`);
      if (!cont) return;
      const zona = cont.querySelector(".zona-espera") || pintarBase();
      if (!zona) return;
      zona.querySelector(".espera-titulo").textContent = encabezado;
      zona.querySelector(".tip-texto").textContent = TIPS_GRUPO[i % TIPS_GRUPO.length];
      [...zona.querySelectorAll(".tip-puntos span")].forEach((s, k) => s.classList.toggle("activo", k === i % 6));
    };

    esperasActivas[grupoId] = { minimizada: false, actualizar };
    actualizar();
    tipsIntervalos[grupoId] = setInterval(() => { i++; actualizar(); }, 6000);
  }

  function detenerTips(grupoId) {
    if (tipsIntervalos[grupoId]) { clearInterval(tipsIntervalos[grupoId]); delete tipsIntervalos[grupoId]; }
    delete esperasActivas[grupoId];
  }

  // ── Generacion en segundo plano ────────────────────────────────
  // Generar material de grupo tarda ~1 min. Antes, si en ese rato la maestra
  // creaba otro grupo o agregaba un tema (ambos llaman a cargarGrupos →
  // renderGrupos), se re-dibujaba todo #contenido y la generacion terminaba
  // escribiendo en un nodo ya desconectado: el cupo se gastaba y el material
  // no aparecia por ningun lado. Ahora hay una sola generacion a la vez, la
  // espera se restaura tras cualquier re-dibujo, y este aviso flotante avisa
  // cuando el material esta listo.
  let generacionEnCurso = null;

  function quitarAvisoGeneracion() {
    document.getElementById("aviso-generacion")?.remove();
  }

  function mostrarAvisoGeneracion({ estado, texto, accionTexto, onAccion }) {
    quitarAvisoGeneracion();
    const div = document.createElement("div");
    div.className = `aviso-generacion${estado === "listo" ? " listo" : estado === "falla" ? " falla" : ""}`;
    div.id = "aviso-generacion";
    div.innerHTML = `
      <span class="texto">${escapeHtml(texto)}</span>
      ${accionTexto ? `<button type="button" id="btn-aviso-generacion">${escapeHtml(accionTexto)}</button>` : ""}
      <button type="button" class="cerrar" id="btn-cerrar-aviso" title="Cerrar">✕</button>
    `;
    document.body.appendChild(div);
    if (accionTexto && onAccion) {
      document.getElementById("btn-aviso-generacion").addEventListener("click", () => {
        quitarAvisoGeneracion();
        onAccion();
      });
    }
    document.getElementById("btn-cerrar-aviso")?.addEventListener("click", quitarAvisoGeneracion);
  }

  // Si aun asi cierra la pestana, el backend termina; pero el material se
  // queda sin agregar a la liga, asi que conviene avisar antes.
  window.addEventListener("beforeunload", (ev) => {
    if (!generacionEnCurso) return;
    ev.preventDefault();
    ev.returnValue = "";
  });

  /** Deja la generacion corriendo y libera la pantalla. */
  function minimizarGeneracion() {
    if (!generacionEnCurso) return;
    const { grupoId, titulo } = generacionEnCurso;
    generacionEnCurso.minimizada = true;
    if (esperasActivas[grupoId]) esperasActivas[grupoId].minimizada = true;
    const zona = document.getElementById(`resultado-generar-${grupoId}`);
    if (zona) zona.innerHTML = "";
    mostrarAvisoGeneracion({ estado: "generando", texto: `⏳ Generando "${titulo}"…` });
  }

  /** true si hay que abortar porque ya hay una generacion corriendo. */
  function hayGeneracionEnCurso() {
    if (!generacionEnCurso) return false;
    mostrarAvisoGeneracion({
      estado: "generando",
      texto: `⏳ Espera — "${generacionEnCurso.titulo}" todavia se esta generando`,
    });
    return true;
  }

  function comprimirImagen(file) {
    return new Promise((resolve, reject) => {
      const lector = new FileReader();
      lector.onerror = () => reject(new Error("No se pudo leer la imagen."));
      lector.onload = () => {
        const img = new Image();
        img.onerror = () => reject(new Error("Ese archivo no parece ser una imagen válida."));
        img.onload = () => {
          const escala = Math.min(1, LADO_MAX / Math.max(img.width, img.height));
          const canvas = document.createElement("canvas");
          canvas.width = Math.round(img.width * escala);
          canvas.height = Math.round(img.height * escala);
          canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL("image/jpeg", 0.82));
        };
        img.src = lector.result;
      };
      lector.readAsDataURL(file);
    });
  }

  function pintarMiniaturas(grupoId) {
    const cont = document.getElementById(`miniaturas-fotos-${grupoId}`);
    if (!cont) return;
    const fotos = fotosPorGrupo[grupoId] || [];
    cont.innerHTML = fotos
      .map(
        (src, i) => `
        <div class="miniatura">
          <img src="${src}" alt="Foto ${i + 1}">
          <button type="button" onclick="quitarFoto('${grupoId}', ${i})" title="Quitar">✕</button>
        </div>`
      )
      .join("");
  }

  function quitarFoto(grupoId, indice) {
    (fotosPorGrupo[grupoId] || []).splice(indice, 1);
    pintarMiniaturas(grupoId);
  }

  async function alElegirFotos(grupoId, ev) {
    const resultado = document.getElementById(`resultado-generar-${grupoId}`);
    const archivos = [...ev.target.files].filter((f) => f.type.startsWith("image/"));
    ev.target.value = ""; // permite volver a elegir el mismo archivo
    if (!fotosPorGrupo[grupoId]) fotosPorGrupo[grupoId] = [];

    for (const archivo of archivos) {
      if (fotosPorGrupo[grupoId].length >= MAX_FOTOS) {
        if (resultado) resultado.innerHTML = `<div class="error">Puedes subir hasta ${MAX_FOTOS} fotos.</div>`;
        break;
      }
      try {
        fotosPorGrupo[grupoId].push(await comprimirImagen(archivo));
      } catch (err) {
        if (resultado) resultado.innerHTML = `<div class="error">${escapeHtml(mensajeErrorAmigable(err))}</div>`;
      }
    }
    pintarMiniaturas(grupoId);
  }

  // ── Trabajo de generacion en segundo plano ─────────────────────────────
  // Antes esto era UN fetch abierto ~1 minuto. En celular, bloquear la
  // pantalla o cambiarse de app suspende la pestana y mata esa conexion:
  // el material se generaba del otro lado pero aqui llegaba un error
  // (reporte sep-2026). Ahora el POST solo encola y el resultado se recoge
  // preguntando cada pocos segundos, asi que perder la red no cancela nada.
  const LS_TRABAJO_GRUPO = "ensenai:trabajo-grupo";
  const MS_ENTRE_SONDEOS = 3000;
  const MS_MAX_ESPERA = 8 * 60 * 1000;
  const MS_VIDA_TRABAJO_RECORDADO = 30 * 60 * 1000;

  let sondeo = null; // { trabajoId, grupoId, titulo, ctx, inicio, timer, activo }

  function nuevaClaveCliente() {
    try {
      if (crypto?.randomUUID) return crypto.randomUUID();
    } catch (err) {
      /* navegadores viejos: el fallback alcanza */
    }
    return `c-${Date.now()}-${Math.random().toString(16).slice(2)}`;
  }

  function recordarTrabajo(datos) {
    try {
      localStorage.setItem(LS_TRABAJO_GRUPO, JSON.stringify({ ...datos, ts: Date.now() }));
    } catch (err) {
      /* modo privado o storage lleno: solo se pierde la reanudacion */
    }
  }

  function olvidarTrabajo() {
    try {
      localStorage.removeItem(LS_TRABAJO_GRUPO);
    } catch (err) {
      /* sin consecuencias */
    }
  }

  function trabajoRecordado() {
    try {
      const g = JSON.parse(localStorage.getItem(LS_TRABAJO_GRUPO) || "null");
      if (!g?.trabajoId) return null;
      if (Date.now() - (g.ts || 0) > MS_VIDA_TRABAJO_RECORDADO) {
        olvidarTrabajo();
        return null;
      }
      return g;
    } catch (err) {
      return null;
    }
  }

  function detenerSondeo() {
    if (sondeo?.timer) clearTimeout(sondeo.timer);
    sondeo = null;
  }

  /**
   * Empieza (o retoma) el seguimiento de un trabajo ya encolado.
   * `mostrarEspera` en false = se retomo al volver a abrir la app: no se le
   * secuestra la pantalla, solo se le avisa con el globito flotante.
   */
  function seguirTrabajo(trabajoId, grupoId, titulo, ctx, { mostrarEspera = true, conFotos = false } = {}) {
    detenerSondeo();
    sondeo = { trabajoId, grupoId, titulo, ctx, inicio: Date.now(), timer: null, activo: true };
    generacionEnCurso = { grupoId, titulo, trabajoId, minimizada: !mostrarEspera };
    recordarTrabajo({ trabajoId, grupoId, titulo, ctx });

    if (mostrarEspera) {
      iniciarTips(
        grupoId,
        conFotos ? "Leyendo tus fotos y preparando el material…" : "Preparando el material del grupo…",
        { texto: "Seguir navegando mientras se genera →", onClick: minimizarGeneracion }
      );
    } else {
      mostrarAvisoGeneracion({ estado: "generando", texto: `⏳ Generando "${titulo}"…` });
    }

    sondearTrabajo();
  }

  async function sondearTrabajo() {
    if (!sondeo?.activo) return;
    const actual = sondeo;
    try {
      // fetch pelon a proposito: aqui un error de red es lo ESPERADO
      // (pantalla bloqueada, elevador, cambio de wifi) y no es un fallo —
      // se vuelve a preguntar en el siguiente ciclo.
      const res = await fetch(`${API_BASE}/api/temas/trabajos/${actual.trabajoId}`, {
        headers: { Authorization: `Bearer ${sesionActual.access_token}` },
      });
      if (res.status === 404) {
        return terminarTrabajoConFallo("No encontramos esa generacion. Vuelve a intentarlo.");
      }
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "No pudimos consultar tu generacion.");
      if (!sondeo || sondeo !== actual) return; // se cancelo mientras respondia
      if (data.estado === "listo") return terminarTrabajoConExito(data.resultado);
      if (data.estado === "fallido") return terminarTrabajoConFallo(data.error || "No se pudo generar el material.");
    } catch (err) {
      /* sin red: se reintenta en el siguiente ciclo, sin molestar */
    }

    if (!sondeo || sondeo !== actual) return;
    if (Date.now() - actual.inicio > MS_MAX_ESPERA) {
      return terminarTrabajoConFallo("Esto esta tardando mas de lo normal. Vuelve a intentarlo en un momento.");
    }
    actual.timer = setTimeout(sondearTrabajo, MS_ENTRE_SONDEOS);
  }

  function terminarTrabajoConExito(data) {
    const { grupoId, titulo, ctx } = sondeo;
    const minimizada = !!generacionEnCurso?.minimizada;
    detenerSondeo();
    olvidarTrabajo();
    generacionEnCurso = null;
    detenerTips(grupoId);

    // Se anexan al contenido porque la tabla grupo_temas no guarda nivel ni
    // enfoque, y luego hacen falta: "Adaptar por inteligencia" escribía las
    // 8 actividades a 6-8 años y la guía de examen salía siempre a primaria
    // alta, sin importar el nivel real del grupo (31-ago-2026).
    contenidoEnEdicion[grupoId] = { ...data.contenido, nivel: ctx.nivel, enfoque: ctx.enfoque };
    // El PDF cacheado es del tema ANTERIOR de este grupo: si no se invalida,
    // "Agregar a mi liga" publica el imprimible equivocado.
    delete pdfCache[grupoId];
    delete pdfCacheSinRespuestas[grupoId];
    metaGenerado[grupoId] = {
      encabezado: "Material generado",
      titulo: data.contenido?.tema || titulo,
      esPrimerTemaGratis: ctx.esPrimerTemaGratis,
    };
    avisarMaterialListo(grupoId, minimizada);
  }

  function terminarTrabajoConFallo(msg) {
    const { grupoId, titulo } = sondeo;
    const minimizada = !!generacionEnCurso?.minimizada;
    detenerSondeo();
    olvidarTrabajo();
    generacionEnCurso = null;
    detenerTips(grupoId);
    avisarFalloGeneracion(grupoId, minimizada, titulo, msg);
  }

  // Volver a primer plano (desbloquear el celular, regresar a la pestana)
  // dispara una consulta inmediata, en vez de esperar el siguiente ciclo.
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState !== "visible" || !sondeo?.activo) return;
    clearTimeout(sondeo.timer);
    sondearTrabajo();
  });
  window.addEventListener("online", () => {
    if (!sondeo?.activo) return;
    clearTimeout(sondeo.timer);
    sondearTrabajo();
  });

  /** Al abrir la pagina: si quedo un trabajo a medias, se retoma en silencio. */
  function reanudarTrabajoPendiente() {
    if (sondeo) return;
    const g = trabajoRecordado();
    if (!g) return;
    seguirTrabajo(g.trabajoId, g.grupoId, g.titulo, g.ctx || {}, { mostrarEspera: false });
  }

  async function generarTema(grupoId, esPrimerTemaGratis) {
    // Una sola generacion a la vez: con dos corriendo, la segunda pisaria la
    // pantalla de espera de la primera y se gastaria cupo doble.
    if (hayGeneracionEnCurso()) return;

    const zona = document.getElementById(`resultado-generar-${grupoId}`);
    if (!zona) return;
    const campoTema = document.getElementById(`tema-input-${grupoId}`);
    const tema = campoTema.value.trim();
    const nivel = document.getElementById(`nivel-input-${grupoId}`).value;
    const detalles = document.getElementById(`detalles-input-${grupoId}`).value.trim();
    const imagenes = fotosPorGrupo[grupoId] || [];
    const enfoque = document.getElementById(`enfoque-psico-input-${grupoId}`)?.checked ? "psicoeducativo" : "escolar";
    zona.innerHTML = "";

    // El mensaje solo vivia al pie del formulario, a media pantalla del
    // campo vacio: en celular no se veia cual campo faltaba y la gente
    // acababa escribiendo el tema en Etiquetas (reporte sep-2026).
    if (!tema) {
      marcarCampoFaltante(campoTema, "Escribe sobre qué tema quieres generar material.");
      return;
    }
    limpiarCampoFaltante(campoTema);

    // El material anterior de este grupo (si no se agrego a la liga) ya no
    // aplica: si no se olvida, restaurarEstadoDeGrupos lo resucitaria encima
    // de la pantalla de espera.
    olvidarGenerado(grupoId);

    iniciarTips(
      grupoId,
      imagenes.length ? "Leyendo tus fotos y preparando el material…" : "Preparando el material del grupo…",
      { texto: "Seguir navegando mientras se genera →", onClick: minimizarGeneracion }
    );
    // Candado inmediato: entre el POST y la respuesta hay una ventana en
    // la que un segundo toque pasaria hayGeneracionEnCurso(). El servidor
    // tambien lo rechaza (409), pero mejor ni llegar ahi.
    generacionEnCurso = { grupoId, titulo: tema, minimizada: false };

    try {
      const res = await fetch(`${API_BASE}/api/temas/generar-async`, {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: `Bearer ${sesionActual.access_token}` },
        body: JSON.stringify({
          tema,
          nivel,
          modo: "grupo",
          detalles,
          imagenes,
          enfoque,
          // Idempotencia: un reintento de la misma peticion no encola —ni
          // cobra— una segunda generacion.
          claveCliente: nuevaClaveCliente(),
        }),
      });
      const data = await res.json().catch(() => ({}));

      // 409 = ya hay una generacion de esta cuenta corriendo (por ejemplo
      // desde otro dispositivo): se engancha a esa en vez de pelearse.
      if (res.status === 409 && data.trabajo_id) {
        seguirTrabajo(data.trabajo_id, grupoId, tema, { nivel, enfoque, esPrimerTemaGratis }, { conFotos: imagenes.length > 0 });
        return;
      }
      if (!res.ok || !data.trabajo_id) throw new Error(data.error || "No se pudo generar el material.");

      fotosPorGrupo[grupoId] = []; // ya viajan en el cuerpo
      pintarMiniaturas(grupoId);
      seguirTrabajo(data.trabajo_id, grupoId, tema, { nivel, enfoque, esPrimerTemaGratis }, { conFotos: imagenes.length > 0 });
    } catch (err) {
      generacionEnCurso = null;
      detenerTips(grupoId);
      avisarFalloGeneracion(grupoId, false, tema, mensajeErrorAmigable(err));
    }
  }

  /** Cierre comun de generarTema y combinarTemasGrupo: si la persona sigue
   *  viendo la zona del grupo, el panel se pinta ahi; si se fue a otro lado
   *  (o se re-dibujo la pagina), no se la saca de donde este — solo se le
   *  avisa con el globito flotante, y el material queda guardado. */
  function avisarMaterialListo(grupoId, minimizada) {
    const hayZona = !!document.getElementById(`resultado-generar-${grupoId}`);
    if (!minimizada && hayZona) {
      quitarAvisoGeneracion();
      pintarResultadoGenerado(grupoId);
      return;
    }
    mostrarAvisoGeneracion({
      estado: "listo",
      texto: `✨ "${metaGenerado[grupoId].titulo}" ya está listo`,
      accionTexto: "Verlo",
      onAccion: () => {
        pintarResultadoGenerado(grupoId);
        document.getElementById(`resultado-generar-${grupoId}`)?.scrollIntoView({ behavior: "smooth", block: "center" });
      },
    });
  }

  function avisarFalloGeneracion(grupoId, minimizada, titulo, msg) {
    const zona = document.getElementById(`resultado-generar-${grupoId}`);
    if (!minimizada && zona) {
      quitarAvisoGeneracion();
      zona.innerHTML = `<div class="error">${escapeHtml(msg)}</div>`;
      return;
    }
    mostrarAvisoGeneracion({ estado: "falla", texto: `"${titulo}": ${msg}` });
  }

  /**
   * Dibuja las preguntas de trivia de `contenidoEnEdicion[grupoId]` como un
   * formulario editable: texto de la pregunta, opciones (si las tiene) con
   * un radio para marcar cuál es la correcta, o un campo de respuesta
   * sugerida si es de tipo abierta/caso. La maestra/profesional puede
   * ajustar el texto, corregir la respuesta correcta, borrar preguntas que
   * no le sirvan, o agregar preguntas propias antes de compartir el tema
   * con su grupo — no requiere volver a generar con IA.
   */
  function renderEditorTrivia(grupoId) {
    const cont = document.getElementById(`editor-trivia-${grupoId}`);
    if (!cont) return;
    const trivia = contenidoEnEdicion[grupoId].trivia || [];

    cont.innerHTML =
      `<p class="ayuda" style="margin:0 0 8px; font-size:0.85rem;">✏️ Trivia (editable)</p>` +
      trivia
        .map(
          (p, i) => `
      <div class="pregunta-editable">
        <div class="fila-top">
          <textarea id="pregunta-texto-${grupoId}-${i}" placeholder="Texto de la pregunta">${escapeHtml(p.pregunta || "")}</textarea>
          <button type="button" class="secundario chico" id="btn-borrar-pregunta-${grupoId}-${i}" title="Borrar esta pregunta">🗑️</button>
        </div>
        ${
          p.opciones && p.opciones.length
            ? p.opciones
                .map(
                  (op, j) => `
          <div class="fila-opcion${op === p.respuesta_correcta ? " correcta" : ""}">
            <input type="radio" name="correcta-${grupoId}-${i}" id="correcta-${grupoId}-${i}-${j}" ${op === p.respuesta_correcta ? "checked" : ""} title="Marcar como correcta">
            <input type="text" id="opcion-${grupoId}-${i}-${j}" value="${escapeHtml(op)}" placeholder="Opción ${j + 1}">
          </div>
        `
                )
                .join("")
            : `
          <label style="margin:8px 0 4px; font-size:0.82rem;">Respuesta sugerida</label>
          <input type="text" id="respuesta-abierta-${grupoId}-${i}" value="${escapeHtml(p.respuesta_correcta || "")}" placeholder="Respuesta sugerida">
        `
        }
      </div>
    `
        )
        .join("") +
      `<button type="button" class="secundario" style="width:100%; margin-top:4px;" id="btn-agregar-pregunta-${grupoId}">+ Agregar pregunta</button>`;

    trivia.forEach((p, i) => {
      document.getElementById(`pregunta-texto-${grupoId}-${i}`).addEventListener("input", (ev) => {
        contenidoEnEdicion[grupoId].trivia[i].pregunta = ev.target.value;
        delete pdfCache[grupoId];
        delete pdfCacheSinRespuestas[grupoId]; // el PDF ya descargado quedaría desactualizado
      });
      document.getElementById(`btn-borrar-pregunta-${grupoId}-${i}`).addEventListener("click", () => {
        contenidoEnEdicion[grupoId].trivia.splice(i, 1);
        delete pdfCache[grupoId];
        delete pdfCacheSinRespuestas[grupoId];
        renderEditorTrivia(grupoId);
      });
      if (p.opciones && p.opciones.length) {
        p.opciones.forEach((op, j) => {
          document.getElementById(`opcion-${grupoId}-${i}-${j}`).addEventListener("input", (ev) => {
            const t = contenidoEnEdicion[grupoId].trivia[i];
            const eraCorrecta = t.opciones[j] === t.respuesta_correcta;
            t.opciones[j] = ev.target.value;
            if (eraCorrecta) t.respuesta_correcta = ev.target.value; // sigue siendo la marcada como correcta
            delete pdfCache[grupoId];
        delete pdfCacheSinRespuestas[grupoId];
          });
          document.getElementById(`correcta-${grupoId}-${i}-${j}`).addEventListener("change", () => {
            contenidoEnEdicion[grupoId].trivia[i].respuesta_correcta = contenidoEnEdicion[grupoId].trivia[i].opciones[j];
            delete pdfCache[grupoId];
        delete pdfCacheSinRespuestas[grupoId];
          });
        });
      } else {
        document.getElementById(`respuesta-abierta-${grupoId}-${i}`).addEventListener("input", (ev) => {
          contenidoEnEdicion[grupoId].trivia[i].respuesta_correcta = ev.target.value;
          delete pdfCache[grupoId];
        delete pdfCacheSinRespuestas[grupoId];
        });
      }
    });

    document.getElementById(`btn-agregar-pregunta-${grupoId}`).addEventListener("click", () => {
      contenidoEnEdicion[grupoId].trivia.push({
        pregunta: "",
        tipo: "opcion",
        opciones: ["", "", "", ""],
        respuesta_correcta: "",
      });
      delete pdfCache[grupoId];
        delete pdfCacheSinRespuestas[grupoId];
      renderEditorTrivia(grupoId);
    });
  }

  // Cachea la URL del PDF ya generado por grupo, para no volver a generarlo
  // (llamada a IA de por medio) si el profesional ya lo descargó antes de
  // agregar el tema a su liga. Se invalida (ver renderEditorTrivia) cada
  // vez que se edita la trivia, para no compartir un PDF desactualizado.
  // Son dos cachés separados porque "con respuestas" y "sin respuestas" son
  // dos PDFs distintos (URLs distintas) — ver incluirRespuestas más abajo.
  const pdfCache = {};
  const pdfCacheSinRespuestas = {};

  async function generarPdfEnServidor(contenido, incluirRespuestas = true) {
    const res = await fetchConReintento(`${API_BASE}/api/temas/pdf`, {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: `Bearer ${sesionActual.access_token}` },
      body: JSON.stringify({ contenido, modo: "grupo", incluirRespuestas }),
    });
    const data = await res.json();
    if (!data.pdf_url) throw new Error(data.error || "No se pudo generar el PDF.");
    return data.pdf_url;
  }

  // `incluirRespuestas=false` arma el imprimible "en blanco" pensado para
  // repartir directo al grupo (mismo contenido, sin la hoja de respuestas
  // final) — el profesional sigue teniendo la versión con respuestas para
  // su propio uso con el otro botón.
  async function descargarPdf(grupoId, contenido, btn, incluirRespuestas = true) {
    const cache = incluirRespuestas ? pdfCache : pdfCacheSinRespuestas;
    const textoOriginal = btn.textContent;
    btn.disabled = true;
    btn.textContent = "Preparando PDF…";
    try {
      const pdfUrl = cache[grupoId] || (await generarPdfEnServidor(contenido, incluirRespuestas));
      cache[grupoId] = pdfUrl;
      window.open(pdfUrl, "_blank");
    } catch (err) {
      alert("Error: " + mensajeErrorAmigable(err));
    } finally {
      btn.disabled = false;
      btn.textContent = textoOriginal;
    }
  }

  /** La zona de resultado de un grupo SIEMPRE se resuelve por id en el
   *  momento de usarla: renderGrupos() reconstruye #contenido entero, asi
   *  que una referencia guardada de antes puede estar ya desconectada del
   *  documento (escribirle no rompe nada, pero no se ve). */
  const zonaGenerar = (grupoId) => document.getElementById(`resultado-generar-${grupoId}`);

  // Todo lo que hace falta para volver a pintar el panel de "material
  // generado" despues de un re-dibujo, sin volver a llamar a la IA. El
  // contenido en si vive en contenidoEnEdicion[grupoId]; aqui solo va lo
  // que el panel necesita para armarse (titulo, encabezado, si es gratis).
  const metaGenerado = {};

  /* ── Editor completo del material del grupo (2-sep-2026) ────────────────
     Reporte de la usuaria: "en el portal de maestros no se ve la explicación
     del tema para que el maestro la revise", "que los maestros puedan
     visualizar la información completa que se va a compartir — actividad,
     resumen, actividades de repaso — y todo es editable", "en el caso de los
     maestros no se muestra la información, únicamente se ven los títulos".

     Hasta ahora el panel de "material generado" solo mostraba la trivia. Todo
     lo demás (la explicación, el diagrama, la actividad, los ejercicios y el
     material de repaso) se compartía con el grupo sin que el maestro lo
     hubiera visto siquiera.

     Cómo funciona el editor: cada campo lleva `data-ruta` con la ruta dentro
     del contenido (por ejemplo "resumen.secciones.0.texto"). Un solo listener
     delegado escribe en contenidoEnEdicion[grupoId] y NO vuelve a pintar —
     así no se pierde el cursor mientras se escribe. Solo los botones de
     agregar/quitar vuelven a dibujar la sección. */

  function leerRuta(obj, ruta) {
    return ruta.split(".").reduce((o, k) => (o == null ? undefined : o[k]), obj);
  }

  function escribirRuta(obj, ruta, valor) {
    const partes = ruta.split(".");
    const ultima = partes.pop();
    let ref = obj;
    for (const k of partes) {
      if (ref[k] == null) ref[k] = /^\d+$/.test(k) ? [] : {};
      ref = ref[k];
    }
    ref[ultima] = valor;
  }

  function borrarRuta(obj, ruta) {
    const partes = ruta.split(".");
    const ultima = partes.pop();
    const ref = partes.reduce((o, k) => (o == null ? undefined : o[k]), obj);
    if (!ref) return;
    if (Array.isArray(ref)) ref.splice(parseInt(ultima, 10), 1);
    else delete ref[ultima];
  }

  /** Los temas de antes del rediseño traen `resumen` como un solo string. */
  function normalizarResumenGrupo(resumen) {
    const vacio = { que_es: "", secciones: [], pasos: [], ideas_clave: [], ojo_aqui: "", truco: "" };
    if (!resumen) return { ...vacio };
    if (typeof resumen === "string") return { ...vacio, que_es: resumen };
    return {
      que_es: resumen.que_es || "",
      secciones: Array.isArray(resumen.secciones) ? resumen.secciones : [],
      pasos: Array.isArray(resumen.pasos) ? resumen.pasos : [],
      ideas_clave: Array.isArray(resumen.ideas_clave) ? resumen.ideas_clave : [],
      ojo_aqui: resumen.ojo_aqui || "",
      truco: resumen.truco || "",
    };
  }

  /** Deja el contenido en la forma que espera el editor, sin perder nada. */
  function prepararContenidoEditable(c) {
    c.resumen = normalizarResumenGrupo(c.resumen);
    if (!Array.isArray(c.ejercicios)) c.ejercicios = [];
    if (!Array.isArray(c.trivia)) c.trivia = [];
    if (!Array.isArray(c.material_extra)) c.material_extra = [];
    if (!Array.isArray(c.ilustraciones)) c.ilustraciones = [];
    c.material_extra.forEach((m) => {
      if (!Array.isArray(m.tarjetas)) m.tarjetas = [];
    });
    // Modo grupo trabaja con `actividades` (una genérica + las 8 de Gardner
    // si se pidieron). Un material combinado viejo puede traer `actividad`.
    if (!Array.isArray(c.actividades)) {
      c.actividades =
        c.actividad && (c.actividad.titulo || c.actividad.instrucciones)
          ? [{ inteligencia: "todas", titulo: c.actividad.titulo || "", instrucciones: c.actividad.instrucciones || "" }]
          : [];
    }
    return c;
  }

  function areaEditable(ruta, valor, etiqueta, filas) {
    return `
      <label class="et">${escapeHtml(etiqueta)}</label>
      <textarea data-ruta="${ruta}" rows="${filas || 3}">${escapeHtml(valor || "")}</textarea>`;
  }

  function textoEditable(ruta, valor, etiqueta) {
    return `
      <label class="et">${escapeHtml(etiqueta)}</label>
      <input type="text" data-ruta="${ruta}" value="${escapeHtml(valor || "")}">`;
  }

  function botonQuitar(ruta, titulo) {
    return `<button type="button" class="secundario chico btn-mini" data-accion="quitar" data-ruta="${ruta}" title="${escapeHtml(
      titulo
    )}">🗑️</button>`;
  }

  function botonAgregar(que, etiqueta) {
    return `<button type="button" class="secundario agregar" data-accion="agregar" data-que="${que}">${escapeHtml(
      etiqueta
    )}</button>`;
  }

  function seccionExplicacion(c) {
    const r = c.resumen;
    return `
      <details class="bloque-editor" open>
        <summary>📖 Explicación del tema</summary>
        <p class="nota">Esto es lo que tu grupo va a leer en la pestaña "Estudiar". Puedes cambiar cualquier texto.</p>
        <div class="campo">${areaEditable("resumen.que_es", r.que_es, "De qué se trata", 3)}</div>
        ${r.secciones
          .map(
            (sec, i) => `
          <div class="campo">
            <div class="fila-borrable">
              <div>${textoEditable(`resumen.secciones.${i}.titulo`, sec.titulo, `Sección ${i + 1} — título`)}</div>
              ${botonQuitar(`resumen.secciones.${i}`, "Quitar esta sección")}
            </div>
            ${areaEditable(`resumen.secciones.${i}.texto`, sec.texto, "Texto", 4)}
          </div>`
          )
          .join("")}
        ${botonAgregar("seccion", "+ Agregar sección")}
        ${
          r.pasos.length
            ? `<div class="campo"><label class="et">🧭 Paso a paso</label>
                ${r.pasos
                  .map(
                    (paso, i) => `<div class="fila-borrable" style="margin-bottom:6px;">
                      <input type="text" data-ruta="resumen.pasos.${i}" value="${escapeHtml(paso)}">
                      ${botonQuitar(`resumen.pasos.${i}`, "Quitar este paso")}
                    </div>`
                  )
                  .join("")}
               </div>`
            : ""
        }
        ${botonAgregar("paso", "+ Agregar paso")}
        ${
          r.ideas_clave.length
            ? `<div class="campo"><label class="et">⭐ Lo que no se les puede olvidar</label>
                ${r.ideas_clave
                  .map(
                    (idea, i) => `<div class="fila-borrable" style="margin-bottom:6px;">
                      <input type="text" data-ruta="resumen.ideas_clave.${i}" value="${escapeHtml(idea)}">
                      ${botonQuitar(`resumen.ideas_clave.${i}`, "Quitar esta idea")}
                    </div>`
                  )
                  .join("")}
               </div>`
            : ""
        }
        ${botonAgregar("idea", "+ Agregar idea clave")}
        <div class="campo">${areaEditable("resumen.ojo_aqui", r.ojo_aqui, "⚠️ Ojo aquí", 2)}</div>
        <div class="campo">${areaEditable("resumen.truco", r.truco, "🎯 Truco para recordarlo", 2)}</div>
      </details>`;
  }

  function seccionIlustraciones(c) {
    const lista = Array.isArray(c.ilustraciones) ? c.ilustraciones : [];
    if (!lista.length) return "";
    const html = window.EnsenaiDiagrama ? window.EnsenaiDiagrama.ilustraciones(lista) : "";
    if (!html) return "";
    return `
      <details class="bloque-editor">
        <summary>🖼️ Ilustraciones (${lista.length})</summary>
        <p class="nota">Salieron solas de la biblioteca porque el tema las pedía. Quita las que no te sirvan.</p>
        <div class="vista-diagrama">${html}</div>
        ${lista
          .map(
            (i, idx) => `<div class="fila-borrable" style="margin-top:8px;">
              <div style="font-size:0.88rem; font-weight:700; align-self:center;">${escapeHtml(i.nombre || "Sin nombre")}</div>
              ${botonQuitar(`ilustraciones.${idx}`, "Quitar esta ilustración")}
            </div>`
          )
          .join("")}
      </details>`;
  }

  function seccionDiagrama(c) {
    const html = window.EnsenaiDiagrama ? window.EnsenaiDiagrama.dibujar(c.diagrama) : "";
    if (!html) return "";
    return `
      <details class="bloque-editor">
        <summary>🗺️ Diagrama</summary>
        <p class="nota">Así lo va a ver tu grupo. El diagrama se arma solo a partir del tema; si no te sirve, quítalo.</p>
        <div class="vista-diagrama">${html}</div>
        <button type="button" class="secundario agregar" data-accion="quitar-diagrama">🗑️ Quitar el diagrama</button>
      </details>`;
  }

  function seccionActividades(c) {
    const acts = c.actividades;
    return `
      <details class="bloque-editor">
        <summary>✏️ Actividad${acts.length === 1 ? "" : "es"} (${acts.length})</summary>
        <p class="nota">La actividad que van a hacer en clase o en consulta. Es la parte que más se cambia — ajústala a tu grupo.</p>
        ${
          acts.length
            ? acts
                .map(
                  (a, i) => `
          <div class="campo">
            <div class="fila-borrable">
              <div>
                <label class="et">${
                  a.inteligencia && a.inteligencia !== "todas"
                    ? escapeHtml(ETIQUETAS_INTELIGENCIA[a.inteligencia] || a.inteligencia)
                    : "Para todo el grupo"
                }</label>
                <input type="text" data-ruta="actividades.${i}.titulo" value="${escapeHtml(
                    a.titulo || ""
                  )}" placeholder="Título de la actividad">
              </div>
              ${botonQuitar(`actividades.${i}`, "Quitar esta actividad")}
            </div>
            ${areaEditable(`actividades.${i}.instrucciones`, a.instrucciones, "Instrucciones", 5)}
          </div>`
                )
                .join("")
            : `<p class="nota" style="margin:0;">Este material no trae actividad.</p>`
        }
        ${botonAgregar("actividad", "+ Agregar actividad")}
      </details>`;
  }
